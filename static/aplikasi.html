async function muatDrafBahan(){
  let b = null, t = null;
  try{ b = await dbAmbil("draf", "bahan"); }catch(e){ }
  try{ t = await dbAmbil("draf", "tr"); }catch(e){ }
  if (!b) return 0;
  /* Draf lama hanya berisi `audio`; draf baru juga berisi `teks`. Keduanya
     dimuat, dan urutannya dikembalikan: audio dulu lalu teks, sama seperti
     urutan penyimpanan — jadi bahan tidak "melompat" setelah reload. */
  const tr = {};
  ((t && t.isi) || []).forEach(z=>{ if (z && z.kunci) tr[z.kunci] = z.tr; });
  for (const x of (Array.isArray(b.audio) ? b.audio : [])){
    if (!x || !x.blob) continue;
    const item = {jenis:x.jenis || "audio", nama:x.nama, blob:x.blob,
                  ukuran:x.ukuran || x.blob.size, durasi:x.durasi || 0,
                  kunci:x.kunci || idBaru("bahan"), urut:x.urut || 0,
                  asal:x.asal || null};
    /* Rekaman bersesi: seluruh bagian ikut dipulihkan, bukan hanya bagian
       pertama. Tanpa ini, memuat ulang halaman memotong rekaman 100 menit
       menjadi 10 menit pertama. */
    if (Array.isArray(x.bagian) && x.bagian.length > 1)
      item.bagianBlob = x.bagian.filter(z=>z && z.blob)
        .map(z=>({bagian:z.bagian, blob:z.blob, durasi:z.durasi || 0}));
    if (x.sesiId) item.sesiId = x.sesiId;
    const p = tr[x.kunci];
    if (p && p.total){
      item.tr = Object.assign(trBaru(), {bagian:p.bagian || [], total:p.total,
        selesai:p.selesai || 0, mentah:p.mentah || "", ragu:p.ragu || [],
        terpakai:!!p.terpakai,
        pesan: (p.selesai || 0) >= p.total
          ? "Selesai — periksa hasilnya sebelum dipakai."
          : "Terhenti di bagian " + ((p.selesai || 0) + 1) + " dari " + p.total +
            ". Tekan Lanjutkan — bagian yang sudah selesai tidak diulang."});
    }
    audioDraf.push(item);
  }
  for (const x of (Array.isArray(b.teks) ? b.teks : [])){
    if (!x || typeof x.teks !== "string") continue;
    bahanTeks.push({jenis:"teks", nama:x.nama || "Teks", teks:x.teks,
                    kunci:x.kunci || idBaru("bahan"), asalTr:x.asalTr || null,
                    induk:x.induk || null, revisi:x.revisi || 0,
                    dibuat:x.dibuat || null, urut:x.urut || 0});
  }
  for (const x of (Array.isArray(b.foto) ? b.foto : [])){
    if (!x || !x.blob) continue;
    bahanFoto.push({jenis:"foto", nama:x.nama || "Foto", blob:x.blob,
      blobProses:x.blobProses || x.blob, lebar:x.lebar || 0, tinggi:x.tinggi || 0,
      mimeAsli:x.mimeAsli || "image/jpeg", ukuran:x.ukuran || x.blob.size,
      ukuranProses:x.ukuranProses || 0, teks:x.teks || "",
      teksAsli:x.teksAsli || "", unsur:x.unsur || "", terbaca:x.terbaca || "",
      /* Status "membaca" tidak pernah dipulihkan: proses itu tidak berjalan
         lagi setelah muat ulang, jadi ditampilkan sebagai "menunggu". */
      status:(x.status === "membaca" ? "menunggu" : (x.status || "menunggu")),
      diperiksa:!!x.diperiksa, revisi:x.revisi || 0, galat:"",
      kunci:x.kunci || idBaru("foto"), asal:x.asal || "berkas",
      urut:x.urut || 0, dibuat:x.dibuat || null});
  }
  for (const x of (Array.isArray(b.video) ? b.video : [])){
    if (!x || !x.blob) continue;
    bahanVideo.push({jenis:"video", nama:x.nama || "Video", blob:x.blob,
      ukuran:x.ukuran || x.blob.size, durasi:x.durasi || 0,
      lebar:x.lebar || 0, tinggi:x.tinggi || 0, suara:x.suara || "",
      status:x.status || "baru", galat:"",
      cuplikan:(Array.isArray(x.cuplikan) ? x.cuplikan : [])
        .filter(c=>c && c.blob).map(c=>({waktu:c.waktu || 0, blob:c.blob, url:""})),
      kunci:x.kunci || idBaru("video"), asal:x.asal || "berkas",
      urut:x.urut || 0});
  }
  /* Draf lama belum punya nomor urut sama sekali: beri berurutan supaya daftar
     tidak acak. Nomor urut berikutnya HARUS melanjutkan yang tertinggi, kalau
     tidak bahan baru akan menyelip di tengah setelah halaman dimuat ulang. */
  if (!urutMaksimal()){
    let n = 0;
    audioDraf.forEach(x => { x.urut = ++n; });
    bahanTeks.forEach(x => { x.urut = ++n; });
  }
  urutBahan = urutMaksimal();
  /* Hitungan HARUS memuat SEMUA jenis bahan. Dulu hanya audio + teks, sehingga
     draf yang isinya cuma foto/video mengembalikan 0 → pemanggil berhenti
     sebelum menggambar ulang, dan foto yang sudah masuk ke memori tidak pernah
     muncul di layar. Terukur 4 Nov 2026: unggah satu .webp → muat ulang → daftar
     bahan 0 padahal IndexedDB berisi 1 foto. */
  return audioDraf.length + bahanTeks.length + bahanFoto.length + bahanVideo.length;
}

const pcmSementara = new WeakMap();   // bahan -> PCM 16 kHz (hanya untuk rekaman pendek)

/* ============================================================
   REKAM SUARA — satu keadaan, satu aksi utama (Direktif #13 §1–§3)

   Sebelumnya panel ini hanya punya satu tombol yang berubah label, dan
   sesudah Berhenti yang tampak hanyalah teks status. Terukur di 390x844:
   daftar bahan berakhir di y=790, bilah menempel mulai di y=786, dan tombol
   "Ubah rekaman menjadi tulisan" (satu-satunya jalan ke catatan) tertutup
   separuh — sementara tombol paling besar di layar berbunyi "Simpan Rekaman
   sebagai Draf", yang TIDAK membuat catatan.

   Sekarang tiap tahap digambar sendiri, dan tahap "tersimpan"/"tulisan-siap"
   membawa tombol utama yang meneruskan sampai catatan terbuka.
   ============================================================ */
let rekamKeadaan = "siap";      // siap|merekam|menyimpan|tersimpan|mengubah|tulisan-siap|gagal
let rekamJamMulai = 0, rekamJamTimer = null;
let rekamPesanGagal = "";
let rekamJenisGagal = "transkrip";   // izin|transkrip|catatan
let rekamSibuk = null;          // penanda sibuk yang sedang berjalan (bila ada)
let rantaiJalan = false;        // kunci ketukan berulang untuk seluruh rantai

function rekamItemTerakhir(){
  const sesi = audioDraf.filter(a=>a.asal === "rekam");
  return sesi.length ? sesi[sesi.length - 1] : null;
}
function rekamAdaTulisan(x){
  return !!(x && ((x.tr && (x.tr.mentah || "").trim())
    || bahanTeks.some(b=>b.asalTr === x.kunci)));
}
function rekamDurasi(x){
  const d = (x && x.durasi) || 0;
  return d >= 1 ? Math.round(d) + " detik" : "kurang dari 1 detik";
}
function rekamJamTeks(){
  /* Jam dinding tidak dipakai: yang ditampilkan adalah PANJANG AUDIO yang
     benar-benar terekam. Sesudah "Lanjutkan Rekaman", jeda 27 menit tidak
     boleh membuat stopwatch melompat seolah ada 27 menit suara. */
  return jamPanjang(sesiAktif ? durasiSesiSekarang() : 0);
}
/* Angka yang berubah tiap 500 ms selama merekam. Dipisah dari renderRekam():
   menggambar ulang seluruh panel tiap setengah detik akan melepas fokus dan
   membuat tombol Berhenti berkedip. */
function perbaruiLayarRekam(){
  if (!sesiAktif) return;
  /* Track yang berakhir TIDAK selalu memicu event "ended": Chrome tidak
     memicunya untuk track.stop(), dan sebagian perangkat memutus mikrofon
     tanpa memberi kabar. Diperiksa langsung — layar yang tetap berkata
     "Merekam" saat mikrofon sudah mati adalah kebohongan yang membuat
     pengguna kehilangan sisa rapatnya. */
  const trek = rekAktif && rekAktif.getAudioTracks ? rekAktif.getAudioTracks()[0] : null;
  if (trek && trek.readyState === "ended" && !berhentiSendiri){
    berhentiSendiri = "Mikrofon berhenti — rekaman dihentikan di " +
      jamPanjang(sesiAktif.tersimpanMs) + ". Yang sudah tertulis tetap ada.";
    hentikanRekam({gagal:true, alasan:berhentiSendiri});
    return;
  }
  const s = sesiAktif;
  const jam = $("#a-rekam-waktu");
  if (jam) jam.textContent = jamPanjang(durasiSesiSekarang());
  const ts = $("#a-rekam-tersimpan");
  if (ts) ts.textContent = "Tersimpan sampai " + jamPanjang(s.tersimpanMs);
  const vf = $("#a-rekam-verifikasi");
  if (vf) vf.textContent = teksVerifikasi(s);
  const bg = $("#a-rekam-bagian");
  if (bg){
    const info = (s.bagianInfo || []).find(b=>b.bagian === bagianAktif) || {};
    const awal = info.mulaiMs || 0;
    const akhir = awal + (bagianAktif && bagianWallMs.has(bagianAktif)
      ? Math.max(0, Date.now() - bagianWallMs.get(bagianAktif)) : 0);
    bg.textContent = "Bagian " + bagianAktif + " · " + jamPanjang(awal) +
      "–" + jamPanjang(akhir);
  }
  const lb = $("#a-rekam-lambat");
  if (lb){
    const telat = Date.now() - (s.denyutMs || 0);
    lb.hidden = telat < REKAM_DENYUT_LAMBAT_MS;
    if (!lb.hidden) lb.textContent = "Penyimpanan melambat — rekaman sampai " +
      jamPanjang(s.tersimpanMs) + " aman.";
  }
  const jd = $("#a-rekam-jeda");
  if (jd){
    /* Satu pembaca jeda untuk seluruh aplikasi (§6B). Jeda yang belum pasti
       diberi label, bukan diklaim sebagai jeda yang terbukti. */
    const teks = teksJeda(s);
    jd.hidden = !teks;
    if (teks) jd.textContent = teks;
  }
}

/* Satu penangan untuk semua tombol panel rekam. */
function rekamKlik(ev){
  const b = ev.target.closest("[data-langkah]");
  if (!b || !$("#rekam-isi") || !$("#rekam-isi").contains(b)) return;
  const x = rekamItemTerakhir();
  const langkah = b.dataset.langkah;
  if (langkah === "mulai" || langkah === "rekam-lagi"){
    if (mediaRekam) return;
    mulaiRekam();
  } else if (langkah === "berhenti"){
    hentikanRekam();
  } else if (langkah === "buat-terputus"){
    buatCatatanDariSesiTerputus();
  } else if (langkah === "lanjut"){
    lanjutkanRekaman();
  } else if (langkah === "putar-terputus"){
    putarSesiTerputus();
  } else if (langkah === "unduh-semua"){
    unduhSesiTerputus();
  } else if (langkah === "buang"){
    buangSesiTerputus();
  } else if (langkah === "buat" || langkah === "coba"){
    buatCatatanDariRekaman();
  } else if (langkah === "periksa"){
    periksaTranskripRekaman(x);
  } else if (langkah === "putar"){
    putarRekaman(x);
  } else if (langkah === "pilih-berkas"){
    const f = $("#a-berkas");
    if (f) f.click();
  } else if (langkah === "tempel"){
    sumberAktif = "tulis";
    perbaruiSumber();
    const ta = $("#teks");
    if (ta){ ta.scrollIntoView({block:"center"}); ta.focus(); }
  } else if (langkah === "unduh"){
    if (x && x.blob) unduhBerkas(x.nama || "rekaman.webm", x.blob, x.blob.type || "audio/webm");
  }
}
function putarRekaman(x){
  if (!x) return;
  /* Memutar lewat pemutar yang TERLIHAT di kartu bahan. Tidak ada new Audio()
     tersembunyi: bunyi tanpa kontrol membuat pengguna tidak bisa menjeda atau
     tahu apa yang sedang berbunyi (tertangkap uji_putar C3). */
  const cari = ()=>{
    const r = liPerBahan.get(x);
    return r && r.li ? r.li.querySelector(".pemutar-main") : null;
  };
  let t = cari();
  if (!t){ renderAudioDraf(); t = cari(); }
  if (t){
    t.scrollIntoView({block:"center"});
    t.click();
    umumkan("Memutar rekaman.");
    return;
  }
  umumkan("Buka daftar bahan untuk memutar rekaman ini.");
}
function periksaTranskripRekaman(x){
  if (!x) return;
  const r = liPerBahan.get(x);
  const ta = r && r.li && r.li.querySelector(".tr-periksa textarea");
  if (ta && ta.offsetParent !== null){
    ta.scrollIntoView({block:"center"});
    try{ ta.focus({preventScroll:true}); }catch(e){ ta.focus(); }
    return;
  }
  umumkan("Buka bagian transkrip pada kartu rekaman di daftar bahan.");
}
/* Menyiapkan penanda sibuk di dalam panel rekam untuk tahap "mengubah". */
function rekamTahap(teks, sub){
  const t = $("#rekam-tahap-teks"), s = $("#rekam-tahap-sub");
  if (t && teks) t.textContent = teks;
  if (s) s.textContent = sub || "";
}

/* ---------- merekam: satu tombol, satu keadaan ---------- */
/* Sebab dari lapisan lain sering sudah berakhir titik; jangan sampai
   kalimatnya berbunyi "…(HTTP 503)..". */
function rapikanSebab(s){
  const v = String(s || "").trim().replace(/[.\s]+$/, "");
  return v || "tidak diketahui";
}

function alasanMikrofon(e){
  const n = (e && e.name) || "";
  const arti = {
    NotAllowedError:"izin mikrofon ditolak atau diblokir pengaturan peramban",
    PermissionDeniedError:"izin mikrofon ditolak",
    NotFoundError:"tidak ada mikrofon yang terpasang di perangkat ini",
    DevicesNotFoundError:"tidak ada mikrofon yang terpasang di perangkat ini",
    NotReadableError:"mikrofon sedang dipakai aplikasi lain",
    TrackStartError:"mikrofon sedang dipakai aplikasi lain",
    SecurityError:"halaman ini tidak diizinkan memakai mikrofon",
    NotSupportedError:"peramban ini tidak menyediakan perekaman di dalam halaman",
    AbortError:"perekaman gagal dimulai"
  }[n];
  if (arti) return arti + " (" + n + ")";
  return "mikrofon tidak bisa dipakai (" + (n || (e && e.message) || String(e)) + ")";
}

/* ============================================================
   PEREKAM AUTOPILOT (Direktif #15 §3)

   Sebab yang terbukti di kode SEBELUM perubahan ini: potongan MediaRecorder
   hanya ditumpuk di array memori (`blokBlok`) dan `mediaRekam.start(1000)`
   dipanggil tanpa satu pun penulisan ke IndexedDB. `simpanDrafBahan()` hanya
   menulis `audioDraf`, dan `audioDraf` baru terisi SESUDAH Berhenti ditekan.
   Karena itu halaman yang termuat ulang — atau tab yang dibuang sistem —
   membuang SELURUH rekaman. Rapat 1 jam 40 menit hilang tanpa satu berkas
   pun tersisa.

   Sekarang tiap potongan 5 detik ditulis ke toko "potongan" dalam SATU
   transaksi bersama denyut sesinya. Yang tinggal di memori hanya potongan
   yang sedang ditulis.
   ============================================================ */
const REKAM_POTONG_MS = 5000;                 // satu potongan 5 detik
const REKAM_BAGIAN_MS = 10 * 60 * 1000;       // ganti perekam tiap 10 menit
const REKAM_TUMPANG_MS = 500;                 // tumpang-tindih antar bagian
const REKAM_DENYUT_LAMBAT_MS = 15000;         // tanda bahaya bila tertinggal

let sesiAktif = null;        // cermin baris "sesi" yang sedang berjalan
let rekAktif = null;         // MediaStream mikrofon (dipakai ulang antar bagian)
let bagianAktif = 0;
const urutBagian = new Map();
const bagianMulaiMs = new Map();   // bagian -> offset waktu-audio saat mulai
const bagianWallMs = new Map();    // bagian -> jam dinding saat mulai
let timerRotasi = null;
let antreTulis = Promise.resolve();
let antreJumlah = 0;
let kunciLayar = null;       // Wake Lock layar
let sesiTerputus = null;     // sesi lama yang ditemukan saat halaman dimuat
let berhentiSendiri = "";    // alasan perekaman berhenti tanpa ditekan pengguna
let sedangBerhenti = false;  // kunci ketukan berulang pada Berhenti
/* Kanal antar-tab: dipakai untuk membedakan "sesi yatim" (halaman dimuat
   ulang) dari "sesi yang masih direkam tab lain". Tanpa ini, membuka tab
   kedua bisa memulihkan rekaman yang sedang berjalan. */
let kanalSesi = null;
try{ kanalSesi = new BroadcastChannel("catatan-sesi"); }catch(e){ kanalSesi = null; }
if (kanalSesi){
  kanalSesi.onmessage = (ev)=>{
    const d = ev.data || {};
    if (d.tanya && sesiAktif && d.id === sesiAktif.id){
      try{ kanalSesi.postMessage({jawab:true, id:d.id}); }catch(e){}
    }
  };
}

function jamPanjang(ms){
  const d = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
  const j = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60), s = d % 60;
  return (j ? j + ":" + String(m).padStart(2, "0") : String(m)) + ":" +
    String(s).padStart(2, "0");
}
/* Batas atas yang tidak bisa dilanggar: rekaman tidak mungkin lebih panjang
   dari waktu yang sudah berjalan sejak Mulai. Dipakai untuk menahan angka
   "Tersimpan sampai" — terukur 5 Nov 2026 pada rekaman 100 menit: sesudah
   Berhenti aplikasi melaporkan 1:40:45 padahal rekaman berjalan 1:40:08 dan
   audio yang benar-benar ada di disk 1:40:08,8. Selisih 37 dtk itu berasal
   dari ujung tiap bagian yang dihitung pada saat potongan DITULIS, bukan
   pada saat suaranya berhenti. Angka yang lebih besar dari rekaman adalah
   angka yang menyesatkan. */
/* ============================================================
   JEDA — SATU struktur, definisi ditetapkan lebih dulu (Direktif #16 §6B)

   Cacat terukur: `lanjutkanRekaman()` MENULIS {dariMs, sampaiMs}, sementara
   `batasJamSesi()` MEMBACA {selesai, mulai}. Akibatnya jumlah jeda selalu 0
   dan angka tersimpan boleh melampaui waktu rekaman yang sebenarnya.
   `perbaruiLayarRekam()` kebetulan membaca {dariMs, sampaiMs} — jadi layar
   dan penghitung memakai dua bahasa yang berbeda untuk data yang sama.

   Definisi yang dipakai sekarang:
     dariMs   : waktu dinding (Date.now) saat rekaman berhenti menulis.
     sampaiMs : waktu dinding saat rekaman dilanjutkan.
     pasti    : true bila batas kedua ujungnya terbukti dari catatan;
                false bila hanya diketahui dari denyut terakhir (perkiraan).
   Satuan SELALU milidetik. Bentuk lama {mulai, selesai} tetap dibaca.
   Jeda yang bertumpuk DIGABUNG (union), tidak dijumlahkan dua kali.
   ============================================================ */
function jedaNormal(j){
  const dari = Number((j && (j.dariMs ?? j.mulai)) ?? 0) || 0;
  const sampai = Number((j && (j.sampaiMs ?? j.selesai)) ?? 0) || 0;
  return {dariMs:dari, sampaiMs:Math.max(dari, sampai),
          pasti: !!(j && j.pasti === true)};
}
function rentangJeda(s){
  const semua = ((s && s.jeda) || []).map(jedaNormal)
    .filter(j=>j.sampaiMs > j.dariMs)
    .sort((a,b)=>a.dariMs - b.dariMs);
  const gabung = [];
  for (const j of semua){
    const ujung = gabung[gabung.length - 1];
    if (ujung && j.dariMs <= ujung.sampaiMs){
      ujung.sampaiMs = Math.max(ujung.sampaiMs, j.sampaiMs);
      /* Bila ada bagian yang belum pasti, seluruh gabungan belum pasti. */
      ujung.pasti = ujung.pasti && j.pasti;
    } else gabung.push({...j});
  }
  return gabung;
}
function jedaTerukur(s){
  let pasti = 0, perkiraan = 0;
  for (const j of rentangJeda(s)){
    const lama = j.sampaiMs - j.dariMs;
    if (j.pasti) pasti += lama; else perkiraan += lama;
  }
  return {pasti, perkiraan, total:pasti + perkiraan};
}
function jumlahJedaMs(s){ return jedaTerukur(s).total; }
function teksJeda(s){
  const u = jedaTerukur(s);
  const bagian = [];
  if (u.pasti) bagian.push("Ada jeda tidak terekam " + jamPanjang(u.pasti) + ".");
  if (u.perkiraan) bagian.push("Sekitar " + jamPanjang(u.perkiraan) +
    " belum dapat dipastikan terekam.");
  return bagian.join(" ");
}
function batasJamSesi(s){
  if (!s) return 0;
  return Math.max(0, Date.now() - (s.mulaiMs || 0) - jumlahJedaMs(s));
}
function tersimpanJujur(bagianInfo, s){
  const jumlah = (bagianInfo || []).reduce(
    (t,b)=>t + Math.max(0, b.akhirMs - b.mulaiMs), 0);
  return Math.min(jumlah, batasJamSesi(s));
}

/* Durasi audio yang SUDAH terekam (bukan jam dinding): jeda antar bagian tidak
   dihitung, supaya angka "Tersimpan sampai" tidak pernah lebih besar dari
   rekaman yang benar-benar ada. */
function durasiSesiSekarang(){
  const s = sesiAktif;
  if (!s) return 0;
  let total = 0;
  for (const b of (s.bagianInfo || [])){
    const akhir = (b.bagian === bagianAktif && bagianWallMs.has(b.bagian))
      ? b.mulaiMs + Math.max(0, Date.now() - bagianWallMs.get(b.bagian))
      : b.akhirMs;
    total += Math.max(0, akhir - b.mulaiMs);
  }
  return Math.min(total, batasJamSesi(s));
}
function ringkasSesi(s){
  return {id:s.id, mulaiMs:s.mulaiMs, selesaiMs:s.selesaiMs, denyutMs:s.denyutMs,
    status:s.status, mime:s.mime, jumlahPotongan:s.jumlahPotongan,
    totalByte:s.totalByte, tersimpanMs:s.tersimpanMs, durasiMs:s.durasiMs || 0,
    jeda:s.jeda || [], bagianInfo:s.bagianInfo || [], alasan:s.alasan || "",
    /* §7: ikatan hasil pengukuran ke media yang diukur. */
    diterimaPotongan:s.diterimaPotongan || 0, diterimaByte:s.diterimaByte || 0,
    audioTerverifikasiMs:s.audioTerverifikasiMs || 0,
    verifikasiPadaMs:s.verifikasiPadaMs || 0,
    verifikasiPotongan:s.verifikasiPotongan || 0,
    verifikasiByte:s.verifikasiByte || 0,
    verifikasiGalat:s.verifikasiGalat || "",
    verifikasiCara:s.verifikasiCara || "",
    petaWaktu:s.petaWaktu || []};
}

/* ============================================================
   DURASI TERVERIFIKASI DAN PEMETAAN WAKTU (Direktif #16 §7)

   DEFINISI FIELD — diputuskan lebih dulu supaya tidak ada dua nama yang
   artinya tumpang-tindih. Satuan waktu SELALU milidetik.

     diterimaPotongan / diterimaByte
         Potongan yang DIKELUARKAN MediaRecorder. Belum tentu tersimpan:
         bisa masih mengantre, bisa gagal ditulis. TIDAK pernah dipakai
         sebagai bukti durasi.
     jumlahPotongan / totalByte
         Potongan yang transaksi IndexedDB-nya SUDAH SELESAI (committed).
         Sudah ada sejak Direktif #15; dipertahankan artinya.
     audioTerverifikasiMs
         Durasi audio hasil DEKODE PCM dari potongan committed, dikurangi
         tumpang-tindih REKAM_TUMPANG_MS × (jumlahBagian − 1). Bukan jam
         dinding, bukan jumlah potongan × 5 detik.
     verifikasiPadaMs
         Jam dinding saat pengukuran selesai. Dipakai untuk menyebut
         "diperiksa sampai kapan" bila verifikasi tertinggal.
     verifikasiPotongan / verifikasiByte
         Identitas SNAPSHOT committed yang diukur. Kalau ada potongan baru
         masuk saat dekode berjalan, hasil ini tetap mengikat ke snapshot
         lama — tidak boleh diklaim sebagai keadaan terbaru.
     verifikasiGalat
         "" bila dekode berhasil; berisi alasan bila gagal. Bila berisi,
         layar wajib berkata durasi belum dapat dipastikan.
     verifikasiCara
         "dekode-pcm-inkremental" atau "gagal".
     petaWaktu
         [{bagian, sesiMulaiMs, sesiAkhirMs, playbackMulaiMs,
           playbackAkhirMs, potongan, pasti}].
         sesi* = rentang jam dinding saat suara ditangkap.
         playback* = rentang pada linimasa audio yang bisa diputar.
         pasti:false bila rentang itu berasal dari perkiraan.

   Mengapa inkremental: probe 5 Nov 2026
   (evidence/RUN-20261105-2251-.../KESIMPULAN.md) mengukur bahwa dekode
   seluruh bagian tiap 20 detik memakan ≈40.200 ms CPU per bagian 10 menit
   dan berulang kali mengalokasikan AudioBuffer ≈110 MB. Dekode
   [potongan-0 + potongan-baru] lalu mengurangi durasi potongan-0
   terbukti ADITIF TEPAT (selisih 0,000 dtk). Tiap siklus karena itu hanya
   mendekode potongan BARU, bukan seluruh sesi.
   ============================================================ */
const VERIFIKASI_JEDA_MS = 20000;   // jaring pengaman berkala (tab aktif)
const VERIFIKASI_MIN_MS = 4000;     // jarak minimum antar pengukuran
let potonganCommitted = [];         // HANYA potongan yang sudah committed
let verCache = new Map();           // bagian -> {jumlah, durasiMs, d0, galat}
let verRantai = Promise.resolve();  // SATU proses dekode pada satu waktu
let verTerakhirMs = 0;
let timerVerifikasi = null;

function kosongkanVerifikasi(){
  potonganCommitted = [];
  verCache = new Map();
  verRantai = Promise.resolve();
  verTerakhirMs = 0;
  if (timerVerifikasi){ clearInterval(timerVerifikasi); timerVerifikasi = null; }
}

/* Ukur durasi dari kumpulan potongan yang SUDAH committed. `kumpulan`
   adalah snapshot: pemanggil yang menentukan batasnya. */
async function ukurDurasiCommitted(s, kumpulan){
  const per = new Map();
  for (const p of kumpulan){
    if (!per.has(p.bagian)) per.set(p.bagian, []);
    per.get(p.bagian).push(p);
  }
  const urutBag = [...per.keys()].sort((a,b)=>a-b);
  const hasilBagian = [];
  let total = 0, galat = "";
  for (const b of urutBag){
    const daftar = per.get(b).slice().sort((a,c)=>a.urut - c.urut);
    const n = daftar.length;
    let c = verCache.get(b) || {jumlah:0, durasiMs:0, d0:null, galat:""};
    try{
      if (n > c.jumlah){
        const tipe = s.mime || "audio/webm";
        if (c.jumlah === 0){
          /* Potongan pertama memuat header WebM. Tanpa ikut disertakan,
             potongan berikutnya gagal didekode (EncodingError, terukur). */
          const d0 = await dekodeAudio(daftar[0].blob);
          const penuh = n > 1
            ? await dekodeAudio(new Blob(
                [daftar[0].blob, ...daftar.slice(1).map(p=>p.blob)], {type:tipe}))
            : d0;
          c = {jumlah:n, durasiMs:Math.round(penuh * 1000), d0, galat:""};
        } else {
          const ekor = await dekodeAudio(new Blob(
            [daftar[0].blob, ...daftar.slice(c.jumlah).map(p=>p.blob)], {type:tipe}));
          const tambah = Math.max(0, ekor - (c.d0 || 0)) * 1000;
          c = {jumlah:n, durasiMs:c.durasiMs + Math.round(tambah),
               d0:c.d0, galat:""};
        }
      }
    }catch(e){
      c = Object.assign({}, c, {galat:String((e && e.message) || e)});
    }
    verCache.set(b, c);
    if (c.galat && !galat) galat = "Bagian " + b + ": " + c.galat;
    hasilBagian.push({bagian:b, potongan:n, durasiMs:c.durasiMs,
                      galat:c.galat, pasti:!c.galat});
    total += c.durasiMs;
  }
  /* Rotasi menyalakan perekam baru 500 ms SEBELUM yang lama dihentikan,
     jadi 500 ms yang sama terekam dua kali. Terukur pada probe: 3 bagian
     ≈72,9 dtk dekode vs ≈71 dtk waktu dinding. */
  const tumpang = Math.max(0, hasilBagian.length - 1) * REKAM_TUMPANG_MS;
  return {durasiMs:Math.max(0, total - tumpang), perBagian:hasilBagian,
          tumpangMs:tumpang, galat};
}

function susunPetaWaktu(kumpulan, ukur){
  let offset = 0;
  return ukur.perBagian.map((h, i)=>{
    const pot = kumpulan.filter(p=>p.bagian === h.bagian);
    const dinding = pot.map(p=>p.wallMulaiMs || 0).filter(Boolean);
    const akhir = pot.map(p=>p.wallAkhirMs || 0).filter(Boolean);
    const entri = {
      bagian:h.bagian,
      sesiMulaiMs: dinding.length ? Math.min(...dinding) : null,
      sesiAkhirMs: akhir.length ? Math.max(...akhir) : null,
      playbackMulaiMs: offset,
      playbackAkhirMs: offset + h.durasiMs,
      potongan:h.potongan,
      pasti: h.pasti && dinding.length > 0 && akhir.length > 0
    };
    /* Bagian berikutnya mulai 500 ms SEBELUM bagian ini berakhir. */
    offset = entri.playbackAkhirMs -
      (i < ukur.perBagian.length - 1 ? REKAM_TUMPANG_MS : 0);
    return entri;
  });
}

/* SATU proses dekode pada satu waktu. Hasil diikat ke snapshot committed
   yang diukur, bukan ke keadaan sesi yang keburu berubah. Periodik TIDAK
   menulis baris sesi ke toko: potonganTulis() sudah menulisnya di dalam
   transaksi yang sama, dan tulisan terpisah bisa menimpa angka terbaru. */
function verifikasiDurasiSesi(s, opsi){
  opsi = opsi || {};
  verRantai = verRantai.catch(()=>{}).then(async ()=>{
    if (!s) return null;
    const kumpulan = opsi.kumpulan || potonganCommitted.slice();
    const snapshot = {
      potongan:kumpulan.length,
      byte:kumpulan.reduce((t,p)=>t + (p.byte || (p.blob && p.blob.size) || 0), 0)
    };
    const u = await ukurDurasiCommitted(s, kumpulan);
    /* Dekode gagal: angka lama TIDAK dinaikkan dan tidak diklaim pasti. */
    if (!u.galat) s.audioTerverifikasiMs = u.durasiMs;
    s.verifikasiPadaMs = Date.now();
    s.verifikasiPotongan = snapshot.potongan;
    s.verifikasiByte = snapshot.byte;
    s.verifikasiGalat = u.galat;
    s.verifikasiCara = u.galat ? "gagal" : "dekode-pcm-inkremental";
    s.petaWaktu = susunPetaWaktu(kumpulan, u);
    verTerakhirMs = Date.now();
    perbaruiLayarRekam();
    return {durasiMs:u.durasiMs, galat:u.galat, snapshot,
            petaWaktu:s.petaWaktu};
  });
  return verRantai;
}

function mintaVerifikasi(s){
  if (!s || Date.now() - verTerakhirMs < VERIFIKASI_MIN_MS) return;
  verTerakhirMs = Date.now();     // cegah tumpukan permintaan saat antrean panjang
  verifikasiDurasiSesi(s);
}
function jadwalkanVerifikasi(){
  if (timerVerifikasi) clearInterval(timerVerifikasi);
  timerVerifikasi = setInterval(()=>{
    if (sesiAktif) verifikasiDurasiSesi(sesiAktif);
  }, VERIFIKASI_JEDA_MS);
}
/* Tab latar bisa menghentikan timer. Saat halaman kembali aktif, sinkronkan
   dari keadaan yang benar-benar ada — bukan mengklaim timer tetap berjalan. */
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible" && sesiAktif){
    verifikasiDurasiSesi(sesiAktif);
    perbaruiLayarRekam();
  }
});

/* §8 J2/J3 — bedakan KETERLAMBATAN verifikasi dari AUDIO YANG HILANG.
   Bukti kehilangan bukan jam dinding, melainkan selisih antara batas linimasa
   potongan yang sudah committed dengan durasi PCM hasil dekode. Satu potongan
   yang belum sempat diverifikasi itu wajar, bukan kehilangan. Bila verifikasi
   masih mengejar, selisihnya diberi label ketidakpastian; bila verifikasi
   sudah sejajar dengan committed tetapi selisihnya tetap besar, itu jeda yang
   terbukti dari media. */
function teksSelisihAudio(s){
  if (!s || s.verifikasiGalat || !s.verifikasiPadaMs) return "";
  const batas = Math.min(s.tersimpanMs || 0, batasJamSesi(s));
  const kurang = batas - (s.audioTerverifikasiMs || 0);
  if (kurang <= REKAM_POTONG_MS + 500) return "";
  if ((s.verifikasiPotongan || 0) < (s.jumlahPotongan || 0))
    return " Sekitar " + jamPanjang(kurang) +
      " belum dapat dipastikan terekam — verifikasi masih mengejar antrean.";
  return " Ada jeda tidak terekam " + jamPanjang(kurang) +
    " — audio itu tidak tersedia dari perekam.";
}

/* Teks jujur untuk durasi yang sudah diverifikasi. */
function teksVerifikasi(s){
  if (!s) return "";
  if (s.verifikasiGalat)
    return "Durasi audio belum dapat dipastikan (" + s.verifikasiGalat + ").";
  if (!s.verifikasiPadaMs) return "Audio belum sempat diperiksa.";
  const dasar = "Audio tersimpan " + jamPanjang(s.audioTerverifikasiMs || 0) + ".";
  const tertinggal = (s.verifikasiPotongan || 0) < (s.jumlahPotongan || 0);
  return dasar + (tertinggal
    ? " Diperiksa sampai potongan " + (s.verifikasiPotongan || 0) +
      " dari " + (s.jumlahPotongan || 0) + "; sisanya sedang diverifikasi."
    : "") + teksSelisihAudio(s);
}

/* --- satu potongan = satu transaksi (potongan + denyut sesi) --- */
function tulisPotongan(blob, bagian){
  if (!blob || !blob.size || !sesiAktif) return;
  const s = sesiAktif;
  const urut = (urutBagian.get(bagian) || 0) + 1;
  urutBagian.set(bagian, urut);
  const awalPart = bagianMulaiMs.get(bagian) || 0;
  const wallPart = bagianWallMs.get(bagian) || Date.now();
  const akhir = Math.round(awalPart + Math.max(0, Date.now() - wallPart));
  /* §7: DITERIMA dicatat di sini, saat MediaRecorder menyerahkan byte.
     Angka ini sengaja TIDAK dipakai untuk klaim durasi tersimpan. */
  s.diterimaPotongan = (s.diterimaPotongan || 0) + 1;
  s.diterimaByte = (s.diterimaByte || 0) + blob.size;
  const p = {
    kunci: s.id + ":" + String(bagian).padStart(2, "0") + ":" +
      String(urut).padStart(4, "0"),
    sesi: s.id, bagian, urut,
    mulaiMs: Math.max(awalPart, akhir - REKAM_POTONG_MS),
    akhirMs: akhir, byte: blob.size, blob,
    /* Rentang jam dinding saat suara ini benar-benar ditangkap. Dipakai
       petaWaktu untuk menjelaskan jeda; data lama tanpa field ini dibaca
       sebagai "tidak diketahui", bukan diisi tebakan. */
    wallMulaiMs: Math.max(0, wallPart + Math.max(awalPart, akhir - REKAM_POTONG_MS) - awalPart),
    wallAkhirMs: wallPart + Math.max(0, akhir - awalPart)
  };
  /* Angka "Tersimpan sampai…" TIDAK boleh bergerak di sini. Terukur 5 Nov
     2026: saat penulisan ditahan 25 detik, layar tetap menaikkan angka sampai
     0:40 padahal tidak satu potongan pun masuk ke disk — persis kebohongan
     yang dilarang §5. Keadaan baru karena itu dihitung DI DALAM antrean, dari
     keadaan yang benar-benar sudah tersimpan; s baru diubah SESUDAH transaksi
     berhasil. Menghitungnya di luar antrean juga salah: dua potongan yang
     mengantre bersamaan akan sama-sama berangkat dari angka lama, sehingga
     jumlahPotongan dan totalByte kurang catat saat penulisan lambat. */
  antreJumlah++;
  antreTulis = antreTulis
    .then(()=>{
      const info = (s.bagianInfo || []).find(b=>b.bagian === bagian);
      const infoBaru = {
        bagian, mulaiMs: info ? info.mulaiMs : awalPart, akhirMs: akhir,
        byte: (info ? info.byte : 0) + blob.size, jumlah: urut
      };
      const bagianBaru = (s.bagianInfo || []).filter(b=>b.bagian !== bagian)
        .concat([infoBaru]).sort((a,b)=>a.bagian - b.bagian);
      const calon = Object.assign({}, s, {
        bagianInfo: bagianBaru,
        jumlahPotongan: (s.jumlahPotongan || 0) + 1,
        totalByte: (s.totalByte || 0) + blob.size,
        tersimpanMs: tersimpanJujur(bagianBaru, s),
        denyutMs: Date.now(),
        durasiMs: durasiSesiSekarang()
      });
      return potonganTulis(p, ringkasSesi(calon)).then(()=>calon);
    })
    .then(calon=>{
      antreJumlah--;
      if (!calon || !sesiAktif || sesiAktif.id !== s.id) return;
      /* Baru SEKARANG byte ini boleh masuk ukuran committed: transaksi
         potonganTulis sudah selesai. Sebelum titik ini, verifikasi tidak
         boleh mengklaim audio sebagai tersimpan (§7 butir 2 dan 3). */
      potonganCommitted.push({bagian, urut, blob, byte:blob.size,
        wallMulaiMs:p.wallMulaiMs, wallAkhirMs:p.wallAkhirMs});
      s.bagianInfo = calon.bagianInfo;
      s.jumlahPotongan = calon.jumlahPotongan;
      s.totalByte = calon.totalByte;
      s.tersimpanMs = calon.tersimpanMs;
      s.denyutMs = Date.now();
      s.durasiMs = durasiSesiSekarang();
      perbaruiLayarRekam();
      /* Terukur 5 Nov 2026 (RUN-20261105-2327-...): sembilan potongan yang
         tertahan lalu membanjir keluar membuat verifikasi berhenti di potongan
         4 dari 9 — penahan 4 detik melewatkan semua komit terakhir dan tidak
         ada komit lagi yang memicunya. §7 butir 5 menuntut hasil mendekati
         durasi media SESEUDAH antrean selesai. Karena itu saat antrean habis,
         verifikasi dijalankan TANPA penahan; verRantai tetap menjamin satu
         proses dekode pada satu waktu. */
      if (antreJumlah === 0) verifikasiDurasiSesi(s);
      else mintaVerifikasi(s);
    })
    .catch(err=>{ antreJumlah--; gagalSimpan(err); });
}

async function gagalSimpan(err){
  if (!sesiAktif || berhentiSendiri) return;
  const teks = String((err && (err.name || err.code)) || "") + " " +
    String((err && err.message) || "");
  const penuh = /quota/i.test(teks);
  berhentiSendiri = (penuh ? "Penyimpanan penuh" : "Penyimpanan gagal") +
    " — rekaman berhenti di " + jamPanjang(sesiAktif.tersimpanMs) +
    ". Potongan yang sudah tertulis tetap ada dan bisa diunduh.";
  /* Berhenti SEKARANG: melanjutkan berarti menambah data yang pasti hilang. */
  await hentikanRekam({gagal:true, alasan:berhentiSendiri});
}

function pasangPerekam(rek, bagian){
  const mr = new MediaRecorder(rek);
  if (!sesiAktif.mime) sesiAktif.mime = mr.mimeType || "audio/webm";
  urutBagian.set(bagian, 0);
  const mulai = Math.round(durasiSesiSekarang());
  bagianMulaiMs.set(bagian, mulai);
  bagianWallMs.set(bagian, Date.now());
  if (!sesiAktif.bagianInfo.some(b=>b.bagian === bagian))
    sesiAktif.bagianInfo.push({bagian, mulaiMs:mulai, akhirMs:mulai, byte:0, jumlah:0});
  mr.ondataavailable = e=>{ if (e.data && e.data.size) tulisPotongan(e.data, bagian); };
  mr.onerror = (e)=>{ gagalSimpan((e && e.error) || new Error("perekam gagal")); };
  mr.start(REKAM_POTONG_MS);
  return mr;
}
function hentikanPerekam(mr){
  return new Promise((selesai)=>{
    if (!mr || mr.state === "inactive") return selesai();
    mr.addEventListener("stop", ()=>selesai(), {once:true});
    try{ mr.stop(); }catch(e){ selesai(); }
  });
}
function jadwalkanRotasi(){
  if (timerRotasi) clearTimeout(timerRotasi);

}
/* Ganti perekam tiap 10 menit TANPA menghentikan track mikrofon.
   Alasan terukur: satu potongan 10 menit ≈ 115 MB saat didekode pada 48 kHz
   (30 menit ≈ 345 MB — terlalu berat di HP), dan batas dekode satu berkas
   ± 90 menit. Perekam baru dimulai 500 ms SEBELUM yang lama dihentikan:
   tanpa tumpang-tindih, jeda antar bagian bisa memotong suku kata terakhir. */
async function rotasiBagian(){
  if (!sesiAktif || !rekAktif) return;
  const lama = mediaRekam;
  const bagianBaru = bagianAktif + 1;
  let baru = null;
  try{ baru = pasangPerekam(rekAktif, bagianBaru); }
  catch(e){ jadwalkanRotasi(); return; }
  mediaRekam = baru;
  bagianAktif = bagianBaru;
  await new Promise(r=>setTimeout(r, REKAM_TUMPANG_MS));
  try{ lama.stop(); }catch(e){}
  jadwalkanRotasi();
  perbaruiLayarRekam();
}

async function mintaTetapAktif(){

     ruang menipis. Gagal bukan alasan menghentikan perekaman. */

  catch(e){ }

    if ("wakeLock" in navigator) kunciLayar = await navigator.wakeLock.request("screen");
  }catch(e){ kunciLayar = null; }
}
function lepasTetapAktif(){

}
function hentikanJalur(){

  rekAktif = null;

  rekamHentikanJam();
}

/* ============================================================
   OPSI: BERHENTI OTOMATIS 5 MENIT TANPA SUARA (Direktif #15 §7)

   BAWAAN MATI, dan sengaja TIDAK diaktifkan. Detektornya ada di sini supaya
   bisa DIUKUR — bukan supaya bisa dipakai sebelum terbukti. Yang diukur:
   energi pita ucapan 300–3400 Hz dengan ambang adaptif terhadap derau
   ruangan 30 detik pertama (bukan "volume rendah" saja).
   ============================================================ */
const HENING_PITA = [300, 3400];
const HENING_DETIK_DERAU = 30;
const HENING_DETIK_BERHENTI = 5 * 60;

/* deret: energi pita ucapan per 100 ms (0..1). Mengembalikan ambang dan
   keputusan hening per jendela — fungsi murni supaya bisa diuji tanpa mikrofon. */
function nilaiHening(deret, detikDerau){
  const n = Math.max(1, Math.round((detikDerau || HENING_DETIK_DERAU) * 10));
  const awal = deret.slice(0, Math.min(n, deret.length));
  const dasar = awal.length ? awal.reduce((a,b)=>a+b, 0) / awal.length : 0;
  const ambang = Math.max(dasar * 2.5, 0.004);
  return {ambang, dasar, hening: deret.map(v=>v < ambang)};
}
function sambungHening(ac, sumber){
  const an = ac.createAnalyser();
  an.fftSize = 2048;
  const hp = ac.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = HENING_PITA[0];
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = HENING_PITA[1];
  sumber.connect(hp); hp.connect(lp); lp.connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  const baca = ()=>{
    an.getByteFrequencyData(buf);
    const per = ac.sampleRate / an.fftSize;
    const a = Math.max(0, Math.floor(HENING_PITA[0] / per));
    const b = Math.min(buf.length - 1, Math.ceil(HENING_PITA[1] / per));
    let t = 0;
    for (let i = a; i <= b; i++) t += buf[i];
    return (t / Math.max(1, (b - a + 1))) / 255;
  };
  return {an, baca};
}

async function mulaiRekam(){
  if (mediaRekam || sesiAktif || rantaiJalan) return;
  rekTranskrip = "";
  berhentiSendiri = "";
  let rek = null;
  try{
    rek = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    /* Izin ditolak BUKAN jalan buntu: sebabnya disebut dengan nama galat, dan
       dua jalan lain (Pilih File / Tempel Tulisan) ada di tempat yang sama. */
    rekamJenisGagal = "izin";
    rekamPesanGagal = alasanMikrofon(e) + ". Rekaman tidak dimulai, dan tidak ada " +
      "yang disimpan. Anda tetap bisa menambahkan bahan lewat Pilih File atau " +
      "Tempel Tulisan.";
    rekamKeadaanBaru("gagal");
    umumkan("Mikrofon belum diizinkan.");
    return;
  }
  rekAktif = rek;
  /* Mikrofon yang berakhir (dilepas sistem, headset dicabut) tidak boleh
     membuat layar tetap berkata "Merekam" — itu kebohongan yang membuat
     pengguna kehilangan seluruh rapat tanpa sadar. */
  rek.getAudioTracks().forEach(t=>{
    t.addEventListener("ended", ()=>{
      if (!sesiAktif || berhentiSendiri) return;
      berhentiSendiri = "Mikrofon berhenti — rekaman dihentikan di " +
        jamPanjang(sesiAktif.tersimpanMs) + ". Yang sudah tertulis tetap ada.";
      hentikanRekam({gagal:true, alasan:berhentiSendiri});
    });
  });
  const sekarang = Date.now();
  kosongkanVerifikasi();
  sesiAktif = {id:idBaru("sesi"), mulaiMs:sekarang, selesaiMs:null,
    denyutMs:sekarang, status:"merekam", mime:"", jumlahPotongan:0, totalByte:0,
    tersimpanMs:0, durasiMs:0, jeda:[], bagianInfo:[], alasan:"",
    diterimaPotongan:0, diterimaByte:0, audioTerverifikasiMs:0,
    verifikasiPadaMs:0, verifikasiPotongan:0, verifikasiByte:0,
    verifikasiGalat:"", verifikasiCara:"", petaWaktu:[]};
  bagianAktif = 0;
  urutBagian.clear(); bagianMulaiMs.clear(); bagianWallMs.clear();
  try{ await sesiSimpan(ringkasSesi(sesiAktif)); }
  catch(e){ /* penyimpanan terkunci: perekaman tetap jalan, draf cadangan menyusul */ }
  mintaTetapAktif();
  rekamKeadaanBaru("merekam");
  rekamMulaiJam();
  try{
    bagianAktif = 1;
    mediaRekam = pasangPerekam(rek, 1);
  }catch(e){
    hentikanJalur();
    sesiAktif = null;
    rekamJenisGagal = "izin";
    rekamPesanGagal = "Perekaman tidak didukung peramban ini (" +
      ((e && e.message) || e) + "). Gunakan Pilih File atau Tempel Tulisan.";
    rekamKeadaanBaru("gagal");
    return;
  }
  jadwalkanRotasi();
  jadwalkanVerifikasi();
  perbaruiLayarRekam();
}

async function hentikanRekam(opsi){
  opsi = opsi || {};
  /* Ketukan berulang pada Berhenti tidak boleh merakit sesi dua kali. */
  if (!sesiAktif || sedangBerhenti) return;
  sedangBerhenti = true;
  const s = sesiAktif;
  if (timerRotasi){ clearTimeout(timerRotasi); timerRotasi = null; }
  s.status = "menyimpan";
  if (!opsi.gagal) rekamKeadaanBaru("menyimpan");
  await hentikanPerekam(mediaRekam);
  mediaRekam = null;
  await antreTulis;                 // semua potongan selesai ditulis
  if (timerVerifikasi){ clearInterval(timerVerifikasi); timerVerifikasi = null; }
  /* §7 butir 7: ukur dan SIMPAN hasil pengukuran berikut ikatan medianya
     SEBELUM potongan dipindahkan ke penyimpanan final. Status "terputus"
     pun tetap menyimpan hasil ini supaya pemulihan tidak kehilangan bukti. */
  try{
    await verifikasiDurasiSesi(s, {kumpulan:potonganCommitted.slice()});
    await sesiSimpan(ringkasSesi(s));
  }catch(e){
    s.verifikasiGalat = "verifikasi akhir gagal: " +
      String((e && e.message) || e);
  }
  hentikanJalur();
  if (opsi.gagal){
    s.status = "terputus";
    s.selesaiMs = Date.now();
    s.alasan = opsi.alasan || berhentiSendiri || "Perekaman berhenti sendiri.";
    try{ await sesiSimpan(ringkasSesi(s)); }catch(e){ }
    sesiTerputus = s;
    sesiAktif = null;
    rekamJenisGagal = "simpan";
    rekamPesanGagal = s.alasan;
    rekamKeadaanBaru("terputus");
    umumkan(s.alasan);
    sedangBerhenti = false;
    return;
  }
  await selesaikanSesi();
  sedangBerhenti = false;
}

/* Potongan → bahan catatan. Dipakai berhenti normal, pemulihan sesi terputus,
   dan tombol Putar pada panel pemulihan — satu jalur, bukan tiga salinan. */
async function rakitBahanSesi(s, opsi){
  opsi = opsi || {};
  const ada = audioDraf.find(x=>x.sesiId === s.id);
  if (ada) return ada;
  const potongan = await potonganSesi(s.id);
  if (!potongan.length) return null;
  const perBagian = new Map();
  for (const p of potongan){
    if (!perBagian.has(p.bagian)) perBagian.set(p.bagian, []);
    perBagian.get(p.bagian).push(p);
  }
  const infoBagian = new Map((s.bagianInfo || []).map(b=>[b.bagian, b]));
  const bagianBlob = [...perBagian.keys()].sort((a,b)=>a-b).map(b=>{
    const isi = perBagian.get(b).sort((a,c)=>a.urut - c.urut);
    const akhir = isi.reduce((m,p)=>Math.max(m, p.akhirMs), 0);
    const awal = (infoBagian.get(b) || {}).mulaiMs || isi[0].mulaiMs;
    return {bagian:b, durasi:Math.max(0, (akhir - awal) / 1000),
      blob:new Blob(isi.map(p=>p.blob), {type:s.mime || "audio/webm"})};
  });
  /* Panjang audio tidak boleh melebihi angka "tersimpan" yang sudah dijaga
     jujur di tulisPotongan(); kalau melebihi, yang dipakai angka tersimpan. */
  let durasi = bagianBlob.reduce((t,b)=>t + b.durasi, 0) || ((s.tersimpanMs || 0)/1000);
  if (s.tersimpanMs) durasi = Math.min(durasi, s.tersimpanMs / 1000);
  /* §7: bila durasi hasil DEKODE media tersedia, itu yang dipakai. Angka
     dari rentang jam dinding hanya boleh MENGECILKAN, tidak boleh menaikkan
     klaim yang tidak didukung audio. */
  if (s.audioTerverifikasiMs > 0 && !s.verifikasiGalat)
    durasi = Math.min(durasi, s.audioTerverifikasiMs / 1000);
  const x = {jenis:"audio", nama:"rekaman-" + capWaktu() + ".webm",
    blob:bagianBlob[0].blob, ukuran:s.totalByte || 0, durasi,
    kunci:idBaru("bahan"), urut:urutBaru(), asal:"rekam", sesiId:s.id};
  if (bagianBlob.length > 1) x.bagianBlob = bagianBlob;
  audioDraf.push(x);
  renderAudioDraf(); perbaruiRingkas();
  await simpanDrafBahanKeras();      // HARUS berhasil sebelum potongan dibuang
  /* §7 butir 8: "berhasil ditulis" belum cukup. Baca kembali dari toko dan
     pastikan blob serta SELURUH bagian benar-benar dapat dipulihkan. Kalau
     tidak, potongan sementara jangan dihapus — biarkan sesi masuk ke jalur
     terputus yang masih menawarkan Unduh. */
  if (opsi.hapusPotongan || opsi.buktikan !== false)
    await buktikanDrafTersimpan(x);
  if (opsi.hapusPotongan){
    try{ await potonganHapusSesi(s.id); }catch(e){}
  }
  return x;
}

/* Buktikan media tujuan dapat dipulihkan, bukan sekadar "tulis selesai". */
async function buktikanDrafTersimpan(x){
  const b = await dbAmbil("draf", "bahan");
  const entri = ((b && b.audio) || []).find(z=>z && z.kunci === x.kunci);
  if (!entri || !entri.blob || !entri.blob.size)
    throw galatJujur("Rekaman belum dapat dibaca kembali dari penyimpanan.", "draf");
  const harapan = (x.bagianBlob && x.bagianBlob.length) || 1;
  const ada = (Array.isArray(entri.bagian) && entri.bagian.length)
    ? entri.bagian.filter(z=>z && z.blob && z.blob.size).length : 1;
  if (ada < harapan)
    throw galatJujur("Baru " + ada + " dari " + harapan +
      " bagian rekaman yang dapat dibaca kembali.", "draf");
  return true;
}

/* Berhenti normal: potongan dirakit menjadi bahan catatan, lalu potongan
   dipindahkan (bukan disalin) — supaya rekaman 100 menit tidak memakan dua
   kali ruang. Potongan baru dihapus SESUDAH draf benar-benar tersimpan. */
async function selesaikanSesi(){
  const s = sesiAktif;
  try{
    const x = await rakitBahanSesi(s, {hapusPotongan:false});
    if (!x){
      s.status = "dibatalkan"; s.selesaiMs = Date.now();
      try{ await sesiSimpan(ringkasSesi(s)); }catch(e){}
      sesiAktif = null;
      rekamJenisGagal = "transkrip";
      rekamPesanGagal = "Rekaman kosong — tidak ada data yang tersimpan. " +
        "Periksa mikrofon, lalu tekan Coba Rekam Lagi.";
      rekamKeadaanBaru("gagal");
      return;
    }
    s.status = "selesai"; s.selesaiMs = Date.now();
    s.durasiMs = Math.round((x.durasi || 0) * 1000);
    try{ await sesiSimpan(ringkasSesi(s)); }catch(e){}
    try{ await potonganHapusSesi(s.id); }catch(e){}
    sesiAktif = null;
    rekamKeadaanBaru("tersimpan");
    umumkan("Rekaman tersimpan. Tekan Buat Catatan dari Rekaman Ini untuk melanjutkan.");
  }catch(e){
    /* Draf gagal disimpan (mis. ruang penuh): potongan TIDAK dibuang, sesi
       ditandai terputus supaya panel pemulihan menawarkan unduhan. */
    s.status = "terputus";
    s.selesaiMs = Date.now();
    s.alasan = "Rekaman belum bisa disimpan sebagai bahan catatan (" +
      ((e && e.name) || (e && e.message) || e) + "). Potongan rekaman tetap " +
      "tersimpan di perangkat ini.";
    try{ await sesiSimpan(ringkasSesi(s)); }catch(_){}
    sesiTerputus = s;
    sesiAktif = null;
    rekamJenisGagal = "simpan";
    rekamPesanGagal = s.alasan;
    rekamKeadaanBaru("terputus");
    umumkan(s.alasan);
  }
}

/* ============================================================
   PEMULIHAN SESI YANG TERPUTUS (Direktif #15 §5)

   Sesi berstatus "merekam" yang denyutnya lebih tua dari 15 detik berarti
   tidak ada yang menulis lagi: halaman dimuat ulang, tab dibuang sistem,
   atau HP mengunci. Sesi itu TIDAK dihapus — ia diubah menjadi "terputus"
   supaya potongan yang sudah tertulis bisa diputar, diunduh, dan dijadikan
   catatan.
   ============================================================ */
async function periksaSesiTerputus(){
  try{
    const semua = await sesiSemua();
    for (const s of semua){
      if (s.status !== "merekam") continue;
      /* Tab ini sendiri sedang merekam sesi itu: jangan pernah menandainya
         terputus hanya karena denyutnya belum bergerak. */
      if (sesiAktif && sesiAktif.id === s.id) continue;
      const basi = Date.now() - (s.denyutMs || 0) > REKAM_DENYUT_LAMBAT_MS;
      /* Denyut masih segar TIDAK selalu berarti masih merekam: halaman yang
         baru dimuat ulang meninggalkan denyut berumur beberapa detik. Karena
         itu ditanya dulu ke tab lain — kalau tidak ada yang menjawab, sesi
         ini yatim dan boleh dipulihkan tanpa menunggu 15 detik. */
      if (!basi && await adaPerekamLain(s.id)) continue;
      s.status = "terputus";
      s.selesaiMs = s.denyutMs || Date.now();
      s.alasan = s.alasan || ("Halaman tertutup atau perangkat berhenti menulis " +
        "sebelum rekaman dihentikan. Potongan yang sudah tersimpan tetap ada.");
      try{ await sesiSimpan(ringkasSesi(s)); }catch(e){}
    }
    const sisa = (await sesiSemua()).filter(s=>s.status === "terputus")
      .sort((a,b)=>(b.denyutMs || 0) - (a.denyutMs || 0));
    sesiTerputus = sisa[0] || null;
  }catch(e){ sesiTerputus = null; }
  return sesiTerputus;
}
/* Penjaga lintas-tab: tanpa ini, tab kedua yang dibuka akan "memulihkan" sesi
   yang sedang direkam tab pertama, dan pengguna bisa menyambung rekaman yang
   masih berjalan. */
function adaPerekamLain(id){
  if (!kanalSesi) return Promise.resolve(false);
  return new Promise((selesai)=>{
    let dapat = false;
    const dengar = (ev)=>{
      const d = ev.data || {};
      if (d.jawab && d.id === id) dapat = true;
    };
    kanalSesi.addEventListener("message", dengar);
    try{ kanalSesi.postMessage({tanya:true, id}); }catch(e){}
    setTimeout(()=>{
      kanalSesi.removeEventListener("message", dengar);
      selesai(dapat);
    }, 400);
  });
}
function bannerPulihHtml(){
  const s = sesiTerputus;

      '<p class="kcil" style="margin:0 0 8px">Terselamatkan ' +
      jamPanjang(s.tersimpanMs || 0) + ' · ' + bagian + ' bagian. Rekaman ini ' +
      'masih ada di perangkat Anda dan belum dibuatkan catatan.' +
      (teksJeda(s) ? ' ' + teksJeda(s) : '') + '</p>' +
    '<button class="tombol kecil" id="t-pulih-buka" type="button">' +
      'Buka Rekaman</button></div>';
}
function namaBagian(s, b){
  const info = (s.bagianInfo || []).find(z=>z.bagian === b) || {};
  const mulai = Math.round((info.mulaiMs || 0) / 1000);
  const m = Math.floor(mulai / 60), d = mulai % 60;
  return "Bagian-" + String(b).padStart(2, "0") + "-" +
    m + "m" + String(d).padStart(2, "0") + "s.webm";
}
async function bagianSesi(s){
  const potongan = await potonganSesi(s.id);
  const per = new Map();
  for (const p of potongan){
    if (!per.has(p.bagian)) per.set(p.bagian, []);
    per.get(p.bagian).push(p);
  }
  return [...per.keys()].sort((a,b)=>a-b).map(b=>({
    bagian:b, nama:namaBagian(s, b),
    blob:new Blob(per.get(b).sort((x,y)=>x.urut - y.urut).map(p=>p.blob),
      {type:s.mime || "audio/webm"})
  }));
}
async function unduhSesiTerputus(){
  const s = sesiTerputus;
  if (!s){ umumkan("Tidak ada sesi yang perlu diunduh."); return; }
  const bagian = await bagianSesi(s);
  if (!bagian.length){ umumkan("Tidak ada potongan rekaman untuk diunduh."); return; }
  umumkan("Mengunduh " + bagian.length + " bagian rekaman.");
  for (const b of bagian){
    unduhBerkas(b.nama, b.blob, s.mime || "audio/webm");
    /* Beri jeda: peramban memblokir unduhan beruntun tanpa jeda. */
    await new Promise(r=>setTimeout(r, 400));
  }
}
async function putarSesiTerputus(){
  const s = sesiTerputus;

  if (!x){ umumkan("Potongan rekaman tidak ditemukan di perangkat ini."); return; }
  setTimeout(()=>putarRekaman(x), 80);
}
async function buangSesiTerputus(){

      [{label:"Batal", ndua:true, aksi:()=>resolve(false)},
       {label:"Ya, buang", aksi:()=>resolve(true)}]);
  });
  if (!pilihan) return;

  sesiTerputus = null;
  rekamPesanGagal = "";
  rekamKeadaanBaru("siap");
