/* ---------- laporan pemeriksaan klaim (mode web) ---------- */
function kartuPeriksa(a, k){
  const l = (a.laporan || {})[k];
  if (!l)
    return `<div class="periksa belum"><span>Hasil ini belum diperiksa klaimnya.</span></div>`;
  if (l.galat)
    return `<div class="periksa belum"><span>Pemeriksaan klaim gagal (${esc(l.galat)}). ` +
      `Hasil ini tidak dilabeli terverifikasi.</span></div>`;
  if (l.catatan)
    return `<div class="periksa belum"><span>Periksa: belum bisa dilakukan — ${esc(l.catatan)}.</span></div>`;
  const n = l.bermasalah || 0;
  const teks = n
    ? `Periksa: ${n} klaim belum didukung`
    : `Periksa: ${l.diperiksa || 0} klaim diperiksa, tidak ada yang bermasalah`;
  return `<div class="periksa ${n ? "ada" : "bersih"}">
    <span>${esc(teks)}</span>
    <button class="kecil ndua" type="button" data-periksa="${esc(k)}">Lihat rincian</button>
    <span class="kcil">${esc(l.label || "")}</span></div>`;
}
function bukaPeriksa(a, k){
  const l = (a.laporan || {})[k];
  if (!l) return;
  const daftar = bagianSumber(a);
  const baris = (l.klaim || []).map(c=>{
    /* cariBagian(), bukan find() persis: laporan yang dibuat SEBELUM id
       ber-scope (§3.2) menyimpan "b01", sedangkan bagiannya kini "a1-b01".
       Dengan find() persis, tombol rujukan hilang sama sekali — dan pengguna
       kehilangan satu-satunya jalan ke bukti. */
    const b = cariBagian(a, c.bagian_id);
    const jam = b ? rentangBagian(b) : "";
    const label = c.status === "didukung" ? "didukung"
      : c.status === "belum" ? "belum dipastikan" : "tidak didukung";
    const nomor = b ? nomorBagian(b, daftar) : "";
    return `<li class="klaim ${esc(c.status)}"><b>${esc(label)}</b> — ${esc(c.teks)}
      ${b ? `<button class="rujuk" type="button" data-rujuk="${esc(b.id)}">bagian ${esc(String(nomor))}${jam ? " · " + esc(jam) : ""}</button>` : ""}
      <span class="kcil">${esc(c.alasan || "")}</span></li>`;
  }).join("");
  dialogTampil(`<h3>Pemeriksaan klaim — ${esc((OUTPUT_DEFS[k] || {}).nama || k)}</h3>
    <p class="kcil">${esc(l.label || "")}. ${esc(l.metode || "")}</p>
    <ul class="daftar-klaim">${baris || "<li>Tidak ada klaim yang bisa diperiksa.</li>"}</ul>`,
    [{label:"Tutup", ndua:true}]);
}
/* Rujukan [[bNN]] pada hasil. DUA mode (Direktif #10 §2):
   · bawaan "bersih": penanda DIBUANG sama sekali — tidak ada chip, tidak ada
     kode mentah yang terlihat;
   · "Tampilkan sumber": penanda menjadi NOMOR KECIL (sup) di akhir kalimat,
     digabung per paragraf, bisa dibuka dan bisa dijangkau keyboard/ketuk.
   Teks rujukan untuk cetak/salin selalu disiapkan terpisah (.rujuk-cetak) dan
   hanya muncul bila opsi "sertakan rujukan" dipilih. */
const POLA_RUJUK_HASIL = /\[\[((?:a\d{1,3}-)?[bp]\d{2,3})\]\]/g;
const POLA_RUJUK_CHAT = /⟦((?:a\d{1,3}-)?[bp]\d{2,3})⟧/g;

function nomorBagian(b, daftar){
  /* "a3-b07" → 7. Angka bagian ada SETELAH tanda hubung; mengambil angka
     pertama akan membaca nomor berkas (3) dan menamai bagian dengan salah. */
  const ekor = String(b.id || "").split("-").pop();
  const dariId = parseInt(ekor.replace(/\D+/g, ""), 10);
  if (Number.isFinite(dariId) && dariId > 0) return dariId;
  const i = (daftar || []).indexOf(b);
  return i >= 0 ? i + 1 : 1;
}
/* Rujukan lama (b07) dan rujukan baru (a3-b07) sama-sama harus terbaca.
   Bila dua berkas punya bagian bernomor sama dan penandanya tidak menyebut
   berkas, yang dipakai adalah yang PERTAMA — sama seperti perilaku sebelum
   ID berawalan berkas. Dialog menyebut nama berkasnya supaya tidak menipu. */
function cariBagian(a, id){
  const daftar = bagianSumber(a);
  const tepat = daftar.find(x => x.id === id);
  if (tepat) return tepat;
  const ekor = String(id).split("-").pop();
  const kandidat = daftar.filter(x => String(x.id).split("-").pop() === ekor);
  return kandidat.length ? kandidat[0] : null;
}
function blokDari(simpul){
  let el = simpul.parentElement;
  while (el && !/^(P|LI|H2|H3|H4|TD|BLOCKQUOTE)$/.test(el.tagName)) el = el.parentElement;
  return el || simpul.parentElement;
}
function sisipkanRujukan(wadah, a, pola){
  pola = pola || POLA_RUJUK_HASIL;
  const daftar = bagianSumber(a);
  const nomor = new Map();
  const jalan = document.createTreeWalker(wadah, NodeFilter.SHOW_TEXT, null);
  const target = [];
  let n;
  while ((n = jalan.nextNode())){
    pola.lastIndex = 0;
    if (pola.test(n.nodeValue)) target.push(n);
  }
  for (const simpul of target){
    const blok = blokDari(simpul);
    const diBlok = new Set();
    const frag = document.createDocumentFragment();
    let sisa = simpul.nodeValue, m;
    pola.lastIndex = 0;
    while ((m = pola.exec(sisa))){
      if (m.index > 0){
        let potongan = sisa.slice(0, m.index);
        /* Dalam mode bersih, penanda dibuang — spasi sebelum tanda baca ikut
           dibuang supaya kalimat tidak berakhir "amal ." */
        if (!PREF_SUMBER.tampil && /^[.,;:!?]/.test(sisa.slice(m.index + m[0].length)))
          potongan = potongan.replace(/[ \t]+$/, "");
        frag.appendChild(document.createTextNode(potongan));
      }
      const b = cariBagian(a, m[1]);
      if (b){
        if (!nomor.has(b.id)) nomor.set(b.id, nomor.size + 1);
        const num = nomor.get(b.id);
        const jam = rentangBagian(b);
        const teksCetak = " (Bagian " + nomorBagian(b, daftar) + (jam ? ", " + jam : "") + ")";
        /* Rujukan yang sama di paragraf yang sama cukup satu nomor. */
        if (!diBlok.has(b.id)){
          diBlok.add(b.id);
          const cetak = document.createElement("span");
          cetak.className = "rujuk-cetak";
          cetak.textContent = teksCetak;
          frag.appendChild(cetak);
          if (PREF_SUMBER.tampil){
            const sup = document.createElement("sup");
            sup.className = "rujuk-sup";
            sup.dataset.rujuk = b.id;
            sup.setAttribute("role", "button");
            sup.tabIndex = 0;
            sup.setAttribute("aria-label",
              "Bagian " + nomorBagian(b, daftar) + (jam ? " · " + jam : "") + " — buka isi sumber");
            sup.textContent = String(num);
            frag.appendChild(sup);
          }
        }
      }
      /* Penanda tak dikenal (mis. bagian sudah dihapus) TIDAK ditampilkan
         sebagai kode mentah — dibuang, dan ketidakpastiannya tetap tampil
         lewat peringatan klaim di atas hasil. */
      sisa = sisa.slice(m.index + m[0].length);
      pola.lastIndex = 0;
    }
    if (sisa) frag.appendChild(document.createTextNode(sisa));
    if (simpul.parentNode) simpul.parentNode.replaceChild(frag, simpul);
  }
}
/* Teks hasil untuk SALIN/UNDUH: bawaan tanpa penanda; bila "sertakan rujukan"
   dipilih, penanda menjadi "(Bagian 1, 00:00–01:30)" — bukan tombol/kode. */
function teksHasil(a, k, sertakan){
  const h = (a.hasil || {})[k];
  if (!h || !h.teks) return "";
  const daftar = bagianSumber(a);
  const isi = buangJudulGanda(h.teks, a.judul);
  return isi.replace(POLA_RUJUK_HASIL, (m, id)=>{
    if (!sertakan) return "";
    const b = cariBagian(a, id);
    if (!b) return "";
    const jam = rentangBagian(b);
    return " (Bagian " + nomorBagian(b, daftar) + (jam ? ", " + jam : "") + ")";
  }).replace(/[ \t]+([.,;:])/g, "$1").replace(/[ \t]{2,}/g, " ");
}

/* Proses yang sedang berjalan disimpan di LUAR objek catatan. Objek catatan
   disimpan ke IndexedDB, dan komponen sibuk memegang elemen DOM — menyimpannya
   di `a` membuat seluruh penyimpanan gagal ("HTMLDivElement could not be
   cloned"). Keadaan proses juga tidak boleh ikut tersimpan: setelah halaman
   dimuat ulang tidak ada proses yang benar-benar berjalan. */
const PROSES_HASIL = new Map();     // "id|tab" → {nama, mulai}
const SIBUK_HASIL = new Map();      // "id|tab" → komponen sibuk
/* Satu pertanyaan pada satu waktu, disimpan PER ID CATATAN — bukan sebagai
   properti objek catatan. Cacat yang diperbaiki: penanda `a.__tanyaJalan`
   ikut tersimpan oleh simpanAcara() saat jawaban tidak mengubah data, lalu
   terbaca lagi dari IndexedDB. Akibatnya setelah koreksi (atau setelah halaman
   dimuat ulang) formulir Tanya menolak setiap pertanyaan tanpa pesan apa pun —
   "Teman Paham" diam. Kunci di luar objek tidak bisa ikut tersimpan. */
const TANYA_JALAN = new Set();      // id catatan → pertanyaan sedang berjalan
function kunciProses(a, k){ return String(a && a.id) + "|" + k; }
function prosesJalan(a, k){ return PROSES_HASIL.get(kunciProses(a, k)) || null; }
function tampilHasil(a){
  const w = $("#wadah-hasil"); if (!w) return;
  const h = a.hasil[tabAktif];
  const nama = OUTPUT_DEFS[tabAktif]?.nama || ("Hasil " + tabAktif);
  const adaHasil = Object.keys(a.hasil||{}).length > 0;
  const adaAudio = (a.sumber||[]).some(s=>s.jenis==="audio" && s.blob);
  const adaTeksSumber = (a.sumber||[]).some(s=>s.jenis==="teks" && (s.teks||"").trim().length > 40);
  /* Proses berjalan diperiksa LEBIH DULU. Sebelumnya panel proses hanya
     digambar bila catatan sudah punya hasil lain — jadi pada catatan yang
     benar-benar kosong, menekan "Buat hasil ini sekarang" tidak mengubah
     apa pun sampai jawaban datang (layar diam, lalu hasil muncul tiba-tiba). */
  const prosesKini = prosesJalan(a, tabAktif);
  if (prosesKini){
    const nm = prosesKini.nama || (OUTPUT_DEFS[tabAktif]||{}).nama || ("Hasil " + tabAktif);
    w.innerHTML = `<div class="kartu" id="panel-proses" aria-busy="true">
      <div class="sibuk-slot"></div>
      <p class="kcil" style="margin:10px 0 0">Bahan Anda tetap tersimpan. Boleh pindah tab —
      prosesnya berjalan terus dan hasilnya muncul saat siap.</p></div>`;
    const kk = kunciProses(a, tabAktif);
    const lamaSibuk = SIBUK_HASIL.get(kk);
    if (lamaSibuk) { try{ lamaSibuk.hapus(); }catch(e){} }
    SIBUK_HASIL.set(kk, sibuk(w.querySelector(".sibuk-slot"), {
      label: "Sedang menyusun " + nm,
      sub: "Mohon tunggu, AI sedang mengolah bahan Anda…"}));
    siapkanDaftarIsi(null);
    return;
  }
  if (!adaHasil){
    /* Halaman tanpa hasil tidak boleh terlihat seperti keberhasilan: satu
       tindakan yang benar-benar berguna, bukan "coba lagi" yang kosong.
       Tanpa hasil TIDAK ADA tab, jadi tab aktif disamakan dengan satu-satunya
       hasil yang bisa dibuat (A). Tanpa ini, panel proses mencari proses pada
       tab yang tidak pernah dijalankan dan tidak muncul sama sekali. */
    tabAktif = "A";
    w.innerHTML = `<div class="kartu" id="hasil-kosong">
      <h2>Catatan ini belum punya hasil tulisan</h2>
      <p>${adaAudio
        ? "Rekaman sudah tersimpan di perangkat ini, tetapi belum diubah menjadi tulisan — jadi belum ada bahan untuk membuat catatan."
        : adaTeksSumber
          ? "Bahan tulisan sudah tersimpan, tetapi hasil catatan belum dibuat."
          : "Belum ada bahan tulisan pada catatan ini."}</p>
      <p class="kcil">Rekaman dan bahan aslinya tidak diubah oleh keadaan ini.</p>
      <p style="margin:0">${adaAudio
        ? '<button id="t-ubah-audio" type="button" class="kecil">Ubah rekaman menjadi tulisan</button>'
        : adaTeksSumber
          ? '<button id="t-buat-satu" type="button" class="kecil">Buat catatan dari bahan yang ada</button>'
          : '<a class="tombol kecil" href="/aplikasi#/buat">Tambahkan bahan</a>'}</p>
    </div>`;
    const bA = $("#t-ubah-audio");
    if (bA) bA.onclick = ()=>{
      const d = $("#sumber-rujukan");
      if (d){ d.open = true; d.scrollIntoView({block:"start"}); }
      const t = $("#sumber-rujukan [data-aksi=\"tr-mulai\"]");
      if (t) t.focus();
    };
    const bB = $("#t-buat-satu");
    if (bB) bB.onclick = ()=>buatSatuHasil(a, "A", bB);
    siapkanDaftarIsi(null);
    return;
  }
  if (!h || (!h.teks && !h.gagal)){
    /* Proses berjalan sudah ditangani di atas — jangan menggambar panel yang
       bertentangan dengan keadaan sebenarnya. */
    w.innerHTML = `<div class="kartu"><p>${esc(nama)} belum dibuat untuk catatan ini.</p>
      <button id="t-buat-satu" type="button" class="kecil">Buat hasil ini sekarang</button></div>`;
    const b = $("#t-buat-satu");
    if (b) b.onclick = ()=>buatSatuHasil(a, tabAktif, b);
    siapkanDaftarIsi(null);
    return;
  }
  if (h.gagal){
    w.innerHTML = `<div class="catatan-status gagal"><strong>${esc(nama)} gagal dibuat — status jujur, bukan hasil contoh.</strong><br>${esc(h.pesan_gagal||"")}
      <br><button class="kecil" id="t-coba-lagi" type="button" style="margin-top:8px">Coba lagi untuk hasil ini</button></div>`;
    const b = $("#t-coba-lagi");
    if (b) b.onclick = ()=>buatSatuHasil(a, tabAktif, b);
    siapkanDaftarIsi(null);
    return;
  }
  const isi = buangJudulGanda(h.teks, a.judul);
  /* Gambar sumber disiapkan SEBELUM markdown dirender: penanda [[gambar:…]]
     harus sudah punya URL saat paragrafnya digambar. */
  siapkanGambarHasil(a);
  w.innerHTML = kartuPeriksa(a, tabAktif) +
    `<article class="hasil-baca" data-ukuran="${PREF.ukuran}">${markdownKeHtml(isi)}</article>`;
  const artikel = w.querySelector(".hasil-baca");
  if (artikel){
    tempatkanGambar(a, artikel);
    /* Tidak satu pun gambar tertempel di tulisan → tampilkan sebagai lampiran. */
    if (!artikel.querySelector("figure.gambar-hasil")){
      const lamp = lampiranGambar(a);
      if (lamp) artikel.appendChild(lamp);
    }
    sisipkanRujukan(artikel, a);
  }
  const bPeriksa = w.querySelector("[data-periksa]");
  if (bPeriksa) bPeriksa.onclick = ()=>bukaPeriksa(a, bPeriksa.dataset.periksa);
  siapkanDaftarIsi(artikel, a.judul);
  terapkanUkuran();
}
async function buatSatuHasil(a, k, tombol){
  const nama = (OUTPUT_DEFS[k] || {}).nama || ("Hasil " + k);
  /* Satu permintaan per (catatan + jenis hasil). Klik kedua saat proses masih
     berjalan TIDAK mengirim permintaan berbayar kedua. */
  const kunci = kunciProses(a, k);
  if (PROSES_HASIL.has(kunci)) return;
  PROSES_HASIL.set(kunci, {nama, mulai: Date.now()});
  if (tombol) tombol.disabled = true;
  tampilHasil(a);                       // panel proses menggantikan panel lama DI TEMPAT
  try{
    rekamKiriman(a, "hasil", {pilihan:k});
    const bagianKirim = bagianSumber(a);
    const jr = await panggilAIRaw({tugas:"hasil", pilihan:k, judul:a.judul, jenis:a.jenis,
      pemateri:a.pemateri, sumber_teks:teksSumberUntukKirim(a, bagianKirim),
      bagian:bagianKirim, konteks_d:a.konteks_d||""});
    a.hasil[k] = {teks:jr.jawaban || "", dibuat:new Date().toISOString(), versi:1};
    if (jr.laporan) a.laporan = Object.assign(a.laporan || {}, {[k]:jr.laporan});
    PROSES_HASIL.delete(kunci);
    await simpanAcara(a);
    /* Ikat hasil ke catatannya: respons yang datang setelah pengguna pindah
       catatan TIDAK boleh menimpa tampilan catatan lain. */
    if (acaraAktif && acaraAktif.id === a.id) halAcara($("#isi"), a.id);
    else umumkan(`Hasil ${nama} untuk “${a.judul}” sudah selesai dan tersimpan.`);
  }catch(e){
    PROSES_HASIL.delete(kunci);
    a.hasil[k] = Object.assign({}, a.hasil[k] || {}, {gagal:true,
      pesan_gagal: pesanGagalProses(e)});
    try{ await simpanAcara(a); }catch(_){ /* penyimpanan penuh: tampilkan saja */ }
    if (acaraAktif && acaraAktif.id === a.id) tampilHasil(a);
    else umumkan(`Gagal membuat ${nama} untuk “${a.judul}”.`);
  }
}
/* Sebab kegagalan dibedakan supaya tindakan berikutnya jelas — bukan "Memproses…"
   yang menggantung atau pesan teknis tanpa jalan keluar. */
function pesanGagalProses(e){
  const t = String((e && e.message) || e || "");
  if (/429|terlalu banyak|dibatasi/i.test(t))
    return "Layanan sedang membatasi permintaan (429). Tunggu beberapa menit, lalu tekan Coba lagi. Tidak ada yang hilang.";
  if (/anggaran|kuota|habis/i.test(t))
    return "Kuota layanan AI untuk hari ini habis. Catatan tetap bisa dibaca dan dicadangkan; coba lagi besok.";
  if (/terpotong|tidak lengkap|selesai tiba-tiba|max_tokens/i.test(t))
    return "Jawaban layanan terpotong sebelum selesai. Tekan Coba lagi — bahan Anda tidak berubah.";
  if (/putus|jaringan|network|timeout|waktu habis|ECONN|fetch/i.test(t))
    return "Koneksi terputus saat menunggu jawaban. Status permintaan TIDAK diketahui — periksa dulu hasilnya; " +
           "bila masih kosong, tekan Coba lagi. Sistem tidak mengulang otomatis supaya tidak menggandakan permintaan berbayar.";
  return t || "Layanan tidak menjawab. Tekan Coba lagi; bahan Anda tetap tersimpan.";
}
async function tampilVersi(a){
  const w = $("#daftar-versi"); if (!w) return;
  const vs = (await dbSemuaIndeks("versi","acara_id",a.id)).sort((x,y)=>(y.waktu||"").localeCompare(x.waktu||""));
  a.versi_count = vs.length;
  w.innerHTML = vs.length ? vs.map(v=>`<div style="margin:6px 0">${esc((v.waktu||"").slice(0,16).replace("T"," "))} · ${esc(v.catatan||v.jenis)}
    ${v.bisa_undo?`<button class="kecil ndua undo-v" data-id="${v.id}" type="button">Urungkan ke versi ini</button>`:""}</div>`).join("")
    : "Belum ada revisi — tidak ada versi palsu untuk nol perubahan.";
  w.querySelectorAll(".undo-v").forEach(b=>b.onclick=async()=>{
    const v = await dbAmbil("versi", b.dataset.id); if (!v) return;
    dialogTampil("<h3>Urungkan?</h3><p>Kandungan hasil akan dikembalikan ke sebelum revisi ini. "+
      "Keadaan sekarang disimpan sebagai versi baru dulu, jadi urungan ini sendiri bisa diurungkan.</p>",
      [{label:"Batal", ndua:true},
       {label:"Urungkan", aksi:async()=>{
          const a2 = await dbAmbil("acara", v.acara_id); if (!a2) return;
          const sekarang = JSON.parse(JSON.stringify(v.sebelum));
          await simpanVersi(a2, "sebelum urungkan: "+(v.catatan||v.jenis), keadaanSebelum(a2));
          if (sekarang.hasil) a2.hasil = sekarang.hasil;
          if (sekarang.koreksi != null) a2.koreksi = sekarang.koreksi;
          if (sekarang.sumber){
            for (const s of a2.sumber||[]){
              const lamanya = sekarang.sumber.find(x=>x.id===s.id);
              if (lamanya && lamanya.teks != null) s.teks = lamanya.teks;
            }
          }
          await simpanAcara(a2); halAcara($("#isi"), a2.id);
       }}]);
  });
}
async function simpanVersi(a, catatan, keadaanSebelum){
  await dbSimpan("versi", {id:idBaru("versi"), acara_id:a.id, waktu:new Date().toISOString(),
    jenis:"revisi", catatan,
    sebelum:JSON.parse(JSON.stringify(keadaanSebelum||{})), bisa_undo:true});
}
function keadaanSebelum(a){ return {hasil:a.hasil||{}, sumber:(a.sumber||[]).map(s=>({id:s.id, teks:s.teks})),
  koreksi:JSON.parse(JSON.stringify(a.koreksi||[]))}; }
/* Sumber mentah TIDAK PERNAH ditimpa koreksi (arahan Owner 2 Nov 2026 §3):
   koreksi tersimpan sebagai lapisan tersendiri; pemakaian AI memakai
   tampilan efektif = sumber mentah + seluruh koreksi terkonfirmasi. */
function teksSumberMentah(a){
  /* SEMUA bahan tulisan dipakai, bukan hanya yang pertama — lima jalur input
     tidak berguna bila yang terbaca hanya satu. Transkrip MENTAH tidak ikut
     otomatis: ia harus diperiksa dan dipakai dulu oleh pengguna. */
  const teks = (a.sumber||[]).filter(s=>s.jenis==="teks" && s.teks)
    .map(s=>(s.turunan
      ? "[bahan turunan dari hasil AI lama — bukan sumber primer] " + s.teks
      : s.teks));
  if (teks.length) return teks.join("\n\n");
  return ((a.sumber||[]).find(s=>s.teks)||{}).teks || "";
}
function terapkanKoreksi(teks, koreksi){
  let t = teks;
  for (const k of (koreksi||[])) if (k.lama) t = t.split(k.lama).join(k.baru);
  return t;
}
function teksSumberEfektif(a){ return terapkanKoreksi(teksSumberMentah(a), a.koreksi); }

/* ---------- sunting sumber ---------- */
function dialogSuntingSumber(a, isi){
  const s = a.sumber.find(x=>x.teks!=null) || a.sumber[0];

/* Panel dibuka HANYA oleh pengguna (tombol pendamping). Di layar sempit panel
   adalah bottom sheet yang menutupi formulir — jadi tidak boleh terbuka sendiri.
   Isi panel tetap disiapkan mengikuti catatan aktif walau panel tertutup. */
/* Satu pintu untuk buka/tutup panel: atribut hidden + kelas body (jaring
   pengaman bila :has() tidak didukung). Isi formulir, posisi gulir, dan draf
   pesan TIDAK disentuh di sini. */
let fokusSebelumPanel = null;
function fokusPanel(ev){
  const panel = $("#panel-agen");
  if (!panel || panel.hidden || ev.key !== "Tab") return;
  const fokus = [...panel.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.offsetParent !== null);
  if (!fokus.length) return;
  const pertama = fokus[0], terakhir = fokus[fokus.length-1];
  if (ev.shiftKey && document.activeElement === pertama){ ev.preventDefault(); terakhir.focus(); }
  else if (!ev.shiftKey && document.activeElement === terakhir){ ev.preventDefault(); pertama.focus(); }
}
function terapkanPanel(buka){
  const panel = $("#panel-agen"); if (!panel) return;
  if (buka && panel.hidden) fokusSebelumPanel = document.activeElement;
  panel.hidden = !buka;
  const tombol = $("#t-agen-terapung");
  if (tombol) tombol.hidden = buka;
  const kepala = $("#t-agen-kepala");
  if (kepala) kepala.hidden = buka;
  document.body.classList.toggle("panel-tertutup", !buka);
  document.body.classList.toggle("panel-terbuka", buka);
  /* Lebar panel NYATA dipakai bilah buat agar berhenti di tepi kolom panel
     (lihat .bilah-buat di layar >=1024), bukan menutupi kotak pesan. */
  if (buka){
    const lebar = Math.round(panel.getBoundingClientRect().width);
    if (lebar > 0) document.body.style.setProperty("--lebar-panel", lebar + "px");
  } else {
    document.body.style.removeProperty("--lebar-panel");
  }
  if (buka) document.addEventListener("keydown", fokusPanel);
  else {
    document.removeEventListener("keydown", fokusPanel);
    if (fokusSebelumPanel && fokusSebelumPanel.focus){
      /* preventScroll: menutup panel TIDAK boleh menggeser posisi baca. */
      try{ fokusSebelumPanel.focus({preventScroll:true}); }catch(e){}
    }
    fokusSebelumPanel = null;
  }
}
document.addEventListener("keydown", ev=>{

/* Papan ketik ponsel TIDAK mengecilkan `vh`. Tanpa pengukuran visualViewport,
   kolom pesan dan tombol Kirim tertutup papan ketik dan panel terpotong.
   Nilai yang diukur dipakai CSS (--vv-tinggi, --vv-bawah). */
function aturPanelVv(){
  const vv = window.visualViewport;
  if (!vv) return;
  const akar = document.documentElement;
  akar.style.setProperty("--vv-tinggi", Math.round(vv.height) + "px");
  /* Sisa ruang di bawah viewport visual = tinggi papan ketik (0 bila tertutup). */
  const bawah = Math.max(0, Math.round(window.innerHeight - (vv.height + vv.offsetTop)));
  akar.style.setProperty("--vv-bawah", bawah + "px");
  akar.style.setProperty("--vv-atas", Math.max(0, Math.round(vv.offsetTop)) + "px");
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", aturPanelVv);
  window.visualViewport.addEventListener("scroll", aturPanelVv);
  aturPanelVv();
}
/* Klik di luar panel menutupnya (sama seperti Esc) — HANYA di layar sempit,
   tempat panel adalah bottom sheet yang MENUTUPI isi. Di layar lebar panel
   adalah kolom sendiri di samping bacaan; menutupnya saat pengguna mengklik
   isi halaman akan menghapus panel yang sengaja dibiarkan terbuka (dan
   mematahkan alur "buka panel → pindah tab → panel tetap terbuka"). */
document.addEventListener("pointerdown", ev=>{
  if (window.innerWidth >= 1024) return;
  const panel = $("#panel-agen");
  if (!panel || panel.hidden) return;
  if (panel.contains(ev.target)) return;
  if (ev.target.closest && ev.target.closest("#t-agen-kepala,#t-agen-terapung")) return;
  terapkanPanel(false);
}, true);

/* Pemutar yang mewakili sebuah bagian: bagian tahu sumber asalnya (sumber_id).
   Bila catatan hanya punya satu rekaman, itu yang dipakai. */
function pemutarUntukBagian(a, b){
  if (!b) return null;
  const cari = (sid)=>(sid && pemutarSumber.has(sid)) ? pemutarSumber.get(sid) : null;
  let p = cari(b.sumber_id);
  if (p) return p;
  /* Transkrip biasanya sumber tersendiri yang menunjuk rekaman asalnya (induk). */
  const s = (a && a.sumber || []).find(x => x.id === b.sumber_id);
  if (s && s.induk) p = cari(s.induk);
  if (p) return p;
  if (pemutarSumber.size === 1) return [...pemutarSumber.values()][0];
  return null;
}

/* ============================================================
   BANTUAN APLIKASI (kemampuan A) — maksud dulu, kata utuh
   Cacat yang diperbaiki (Direktif #9 S1): aturan lama
   /hasil|output|a\b|b\b|c\b|d\b|pilih/ — `a\b` cocok dengan kata APA PUN
   berakhiran "a" ("Apa", "bisa", "Bagaimana", "mana"), jadi hampir semua
   pertanyaan Bahasa Indonesia dijawab daftar pilihan hasil. Sekarang kata
   dicocokkan UTUH, aturan diurut dari paling spesifik, dan fallback menjawab
   pertanyaan alih-alih mengulang brosur.
   ============================================================ */
function kataUtuh(t){
  return " " + String(t || "").toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim() + " ";
}
/* Kata pendek/ambigu dicocokkan UTUH; kata isi dicocokkan sebagai batang kata
   supaya "cadang" menemukan "cadangan", "mencadangkan", "dicadangkan". */
function adaKata(t, ...daftar){ return daftar.some(k => t.includes(" " + k + " ")); }
function adaIsi(t, ...daftar){ return daftar.some(k => k.length >= 4 && t.includes(k)); }

function jawabBantuan(tanya, konteks){
  const t = kataUtuh(tanya);
  const k = konteks || {};

  /* 1. Pilihan hasil — hanya bila pertanyaannya memang soal pilihan. */
  if (adaKata(t, "pilihan", "output") ||
      (adaKata(t, "hasil") && adaKata(t, "jenis", "macam", "beda", "perbedaan", "a", "b", "c", "d")))
    return "Ada empat pilihan hasil, dan boleh pilih lebih dari satu:\n" +
      "• Catatan Lengkap — narasi utuh mengikuti alur pembahasan, bukan ringkasan.\n" +

      "• Extreme Execution — saran penerapan, selalu ditandai sebagai usulan.\n" +
      "Pilihannya ada di langkah 2 halaman Buat Catatan.";

  /* 2. Beda jenis hasil. */
  if (adaKata(t, "beda", "perbedaan", "bedanya") ||
      (adaKata(t, "lengkap") && adaKata(t, "rangkuman")) ||
      adaKata(t, "rangkuman", "komitmen", "penerapan", "execution"))
    return "Bedanya di tujuan pemakaian:\n" +
      "• Catatan Lengkap menulis ulang seluruh pembahasan sebagai narasi — untuk mengingat kelasnya.\n" +
      "• Rangkuman mengambil inti dan pelajaran penting — untuk dibaca cepat.\n" +
      "• PR & Komitmen memisahkan tugas, komitmen, laporan, contoh, dan usulan.\n" +

  /* 3a. Risiko kehilangan data. */
  if (adaIsi(t, "hilang", "terhapus", "risiko", "rusak"))
    return "Catatan disimpan di penyimpanan peramban (IndexedDB) di perangkat ini, bukan di server. " +
      "Yang bisa menghapusnya: membersihkan data situs/peramban, mode privat yang ditutup, " +
      "atau perangkat yang hilang. Karena itu buat cadangan berkala di Pengaturan & Cadangan.";

  /* 3b-1. Memulihkan dari cadangan (bukan pertanyaan yang sama dengan membuat cadangan). */
  /* "memulihkan" TIDAK memuat "pulih" (meN- + pulih → memulih); jadi
     kedua bentuk batang dicocokkan. */
  if (adaIsi(t, "pulih", "mulih", "restore", "impor"))
    return "Memulihkan: buka Pengaturan & Cadangan → \"Pulihkan dari cadangan\", pilih berkas .json, " +

      "catatan yang sudah ada tidak ditimpa tanpa pilihan Anda. Bila cadangan memuat audio, aplikasi " +
      "meminta berkas audionya juga.";

  /* 3b-2. Membuat cadangan. */

      "yang bukan peramban ini, mis. folder atau drive pribadi.";

  /* 3c. Di mana data berada. */
  if (adaIsi(t, "disimpan", "tersimpan", "simpan", "server", "lokal", "perangkat", "privasi"))
    return "Catatan Anda tersimpan di perangkat ini (IndexedDB peramban), bukan di server, dan tidak " +
      "dikirim ke mana pun kecuali saat Anda menekan proses AI. Konsekuensinya: catatan hanya ada di " +
      "peramban ini — ganti perangkat atau bersihkan data peramban berarti catatan hilang bila belum dicadangkan.";

  /* 4. Membuat catatan. */
  if (adaIsi(t, "membuat", "buat", "mulai", "langkah", "cara"))
    return "Tiga langkah, semuanya di halaman Buat Catatan:\n" +
      "1. Masukkan bahan — tempel tulisan, pilih rekaman, rekam suara, atau ambil dari Google Drive.\n" +
      "2. Isi judul, lalu centang hasil yang diinginkan (boleh lebih dari satu).\n" +
      "3. Tekan Buat Catatan. Proses berjalan dengan penanda kemajuan, dan hasilnya tersimpan di perangkat ini.";

  /* 4b. Berapa lama — jangan menebak angka. */
  if ((adaKata(t, "berapa") && adaKata(t, "lama", "menit", "waktu", "durasi")) ||
      adaIsi(t, "durasi"))
    return "Tidak ada angka tetap: waktu bergantung pada panjang rekaman, kecepatan sambungan, " +

  /* 5a. Rekaman tidak otomatis menjadi tulisan. */

      "\"Gunakan Transkrip\". Transkrip mentah tetap utuh.";

  /* 5b. Google Drive. */
  if (adaIsi(t, "drive"))

  /* 5c. Bahan pada umumnya. */
  if (adaIsi(t, "bahan", "rekam", "audio", "transkrip", "unggah", "mikrofon", "suara"))

      "jadi isinya tidak terkirim dua kali.";

  /* 6. Koreksi. */
  if (adaIsi(t, "koreksi", "ganti", "salah", "undo", "urungkan", "perbaiki"))
    return "Dua cara: (1) di halaman catatan, tulis \"Ganti X menjadi Y\" — perubahan dicatat sebagai versi " +
      "baru yang bisa diurungkan; (2) sunting transkrip per bagian sebelum dipakai, sehingga catatan lahir " +
      "dari teks yang sudah Anda setujui. Sumber mentah tidak pernah ditimpa.";

  /* 7. Cetak. */
  if (adaIsi(t, "cetak", "pdf", "print"))
    return "Buka catatan, pilih hasil yang ingin dicetak, lalu \"Cetak / PDF\" di toolbar hasil. " +
      "Tata letaknya A4: menu, panel pendamping, dan tombol aplikasi tidak ikut tercetak.";

  /* 8. Akun dan sandi. */
  if (adaIsi(t, "akun", "sandi", "login", "password", "masuk"))

      "Sandi pengelola hanya untuk administrasi server oleh pemilik aplikasi.";

  /* 9. Kemampuan umum aplikasi. */
  if (adaKata(t, "bisa", "kemampuan", "fitur", "kegunaan", "aplikasi") || adaKata(t, "ini"))
    return "Aplikasi ini mengubah bahan menjadi catatan yang bisa dibaca dan ditanyai:\n" +
      "• Buat catatan dari teks, rekaman, rekaman langsung, atau Google Drive.\n" +
      "• Pilih empat jenis hasil (lengkap, rangkuman, komitmen, penerapan).\n" +
      "• Baca, tanyai isinya, dan periksa klaim sampai ke bagian sumbernya.\n" +
      "• Cetak/PDF dan cadangkan ke berkas.\n" +
      "Mulai dari tombol Buat Catatan di beranda.";

  /* 10. Fallback deterministik: menjawab pertanyaan, bukan mengulang brosur. */
  const topik = String(tanya || "").trim().replace(/[?.!]+$/, "");
  const diSini = k.diBuat
    ? "Di halaman ini Anda sedang menyiapkan catatan baru."
    : k.diDaftar
      ? "Di halaman ini Anda memilih catatan untuk dibuka."
      : k.diAtur
        ? "Di halaman ini Anda mengatur tema, ukuran huruf, dan cadangan."
        : "Di beranda, langkah pertama adalah menekan Buat Catatan.";
  return `Saya belum punya jawaban pasti untuk "${topik}". ${diSini} ` +
    "Yang bisa saya pastikan: bahan (teks, rekaman, Drive) → pilih hasil → catatan; " +
    "lalu baca, tanyai, cetak, dan cadangkan. Kalau pertanyaannya soal isi catatan, buka catatannya dulu — " +
    "di sana saya menjawab dari sumbernya dan menyebut bagian yang dirujuk.";
}

/* ---------- rujukan bagian: satu sumber kebenaran ---------- */
function bagianSumber(a){
  const out = [];
  const rapat = s => String(s || "").replace(/\s+/g, " ").trim();
  for (const s of (a.sumber || [])){
    /* Hanya sumber yang MEMANG dipakai AI (jenis "teks"); transkrip mentah
       tidak ikut, supaya bagiannya tidak terhitung dua kali. */
    if (s.jenis !== "teks" || !Array.isArray(s.bagian) || !s.bagian.length) continue;
    const awalan = awalanSumber(a, s);
    const teksKini = terapkanKoreksi(s.teks || "", a.koreksi);
    const gabung = s.bagian.map(b => b.teks || "").join("\n\n");
    if (rapat(gabung) !== rapat(teksKini)){
      /* Sumber sudah disunting tangan (atau dikoreksi): bagian lama tidak lagi
         mewakili isinya. Pakai teks terbaru, pecah per paragraf — lebih baik
         kehilangan detik daripada model membaca dua versi teks sekaligus. */
      teksKini.split(/\n{2,}/).map(x => x.trim()).filter(Boolean)
        .forEach((teks, i)=>out.push({id:idBagianBerkas(awalan,
            "p" + String(i + 1).padStart(2, "0")),
          mulai:null, selesai:null, teks, nama:s.nama || "", sumber_id:s.id}));
      continue;
    }
    for (const b of s.bagian){
      if ((b.teks || "").trim())
        out.push({id:idBagianBerkas(awalan, b.id || "b??"), mulai:b.mulai, selesai:b.selesai,
          teks:(s.turunan ? "[bahan turunan dari hasil AI lama — bukan sumber primer] " : "") +
            terapkanKoreksi(b.teks.trim(), a.koreksi), nama:s.nama || "",
          sumber_id:s.id});
    }
  }
  if (out.length) return out;
  const par = teksSumberEfektif(a).split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  return par.map((teks, i)=>({id:"a1-p" + String(i + 1).padStart(2, "0"),
    mulai:null, selesai:null, teks}));}
/* Isi sumber dikirim sebagai `sumber_teks` HANYA bila tidak bisa disusun ulang
   dari bagian (mis. sumber sudah disunting tangan). Bila sama, cukup bagian
   saja — transkrip tidak terkirim dua kali, dan model tidak mungkin melihat
   dua versi teks yang berbeda. */
function teksSumberUntukKirim(a, bagian){
  const rapat = s => String(s || "").replace(/\s+/g, " ").trim();
  const efektif = teksSumberEfektif(a);
  if (!bagian || !bagian.length) return efektif;
  const gabung = bagian.map(b => b.teks || "").join("\n\n");
  return rapat(gabung) === rapat(efektif) ? "" : efektif;
}
const KATA_STOP = new Set(("yang dan atau untuk dengan pada dari ini itu saya anda kita kami dia " +
  "mereka tidak juga akan sudah telah adalah bila kalau agar supaya karena tetapi namun serta " +
  "dalam antara sebagai oleh bahwa para secara lebih sangat").split(" "));
function kataKunciTeks(teks){
  return new Set((String(teks || "").toLowerCase().match(/[\p{L}\p{N}]{4,}/gu) || [])
    .filter(w => !KATA_STOP.has(w)));
}
function bagianPalingRelevan(klaim, bagian, n){
  const kk = [...kataKunciTeks(klaim)];
  if (!kk.length) return [];
  const skor = bagian.map(b=>{
    const isi = (b.teks || "").toLowerCase();
    let s = 0;
    for (const w of kk) if (isi.includes(w)) s++;
    return {b, s};
  }).filter(x => x.s >= 2 || (kk.length === 1 && x.s >= 1));
  skor.sort((x, y) => y.s - x.s);
  return skor.slice(0, n).map(x => x.b);
}
/* Kalimat yang dimaksud pengguna: kutipan eksplisit, kalimat yang persis ada
   di salah satu hasil, atau teks yang sedang ia pilih di halaman. */
let pilihanTeksHalaman = "";
function klaimDimaksud(tanya, a){
  const m = String(tanya || "").match(/[“"«']([^”"»']{12,300})[”"»']/);
  if (m) return m[1].trim();
  const hasil = Object.values(a.hasil || {}).map(h => (h && h.teks) || "").join("\n");
  /* Kandidat: tiap kalimat, dan bagian SETELAH titik dua — "Dari mana klaim
     ini: <kalimat>" tidak akan cocok bila hanya kalimat utuhnya yang diuji. */
  const kandidat = [];
  for (const s of String(tanya || "").split(/[?!\n]/)){
    const t = s.trim();
    if (!t) continue;
    kandidat.push(t);
    const i = t.indexOf(":");
    if (i > 0) kandidat.push(t.slice(i + 1).trim());
  }
  for (const k of kandidat){
    if (k.length < 25) continue;
    if (hasil.includes(k)) return k;
    const tanpaTitik = k.replace(/[.…]+$/, "").trim();
    if (tanpaTitik.length >= 25 && hasil.includes(tanpaTitik)) return tanpaTitik;
  }
  if (/bagian ini|kalimat ini|klaim ini/i.test(tanya) && pilihanTeksHalaman.length >= 12)
    return pilihanTeksHalaman;
  return "";
}
function hasilYangMemuat(a, klaim){
  for (const [k, h] of Object.entries(a.hasil || {})){
    if (h && h.teks && h.teks.includes(klaim)){
      const i = Math.max(0, h.teks.indexOf(klaim) - 600);
      return {kunci:k, teks:h.teks.slice(i, i + 2400)};
    }
  }
  return {kunci:"", teks:""};
}
document.addEventListener("selectionchange", ()=>{
  try{
    const s = String(window.getSelection() || "").trim();
    if (s.length >= 12 && s.length <= 400) pilihanTeksHalaman = s;
  }catch(e){}
});

/* Verifikasi klaim (kemampuan C): hasil + sumber primer + id bagian dikirim
   BERSAMA. Enam keadaan dibedakan; "tidak ditemukan" saja dilarang. */
function teksRujukan(b){
  /* JANGAN menambahkan rentang waktu di sini. sisipkanRujukan() sudah
     mencetak "(Bagian N, jam)" untuk bentuk teks/salin/cetak; menambahkannya
     lagi membuat jawaban menulis rentang DUA KALI —
     "(Bagian 1, 00:00–01:30) (00:00–01:30) memuat: …" (Direktif #10 §1.3).
     Isi jawaban model tidak diubah; hanya penyusunan kalimat bingkainya. */
  return `⟦${b.id}⟧`;
}
function formatVerifikasi(v, calon){
  const b = calon.find(x => x.id === v.bagian_id) || calon[0];
  const rujuk = b ? teksRujukan(b) : "";
  const kutip = (v.kutipan || "").trim();
  switch (v.status){
    case "didukung":
      return "Didukung sumber. " + rujuk + " memuat: “" + kutip + "”" +
        (v.alasan ? "\n" + v.alasan : "");
    case "bertentangan":
      return "Sumber justru menyatakan sebaliknya di " + rujuk + ": “" + kutip + "” " +
        "Kalimat di catatan hasil perlu diperbaiki.";
    case "tidak_didukung":
      return "Kalimat itu ada di catatan hasil AI, tetapi saya belum menemukan dukungnya di transkrip. " +
        rujuk + " membahas topik yang sama, tetapi tidak memuat unsur itu" +
        (kutip ? " (isi terdekat: “" + kutip + "”)" : "") + ". Bagian ini perlu diperiksa.";
    case "tidak_ada_bagian":
      return "Tidak ada bagian sumber yang membahas kalimat itu — bukan berarti salah, hanya belum ada " +
        "bagian yang cocok. Sumber yang tersedia: " + (calon.length ? calon.length + " bagian terdekat" : "belum ada") + ".";
    case "sumber_belum_ada":
      return "Sumber catatan ini belum tersedia — belum ada transkrip atau teks yang bisa saya periksa. " +
        "Kalau rekamannya ada, ubah dulu menjadi tulisan; kalau tidak, klaim ini belum bisa diverifikasi.";
    case "gagal":
      return "Layanan gagal menjawab (" + (v.alasan || "tanpa keterangan") + "). Klaim belum bisa " +
        "diverifikasi — ini BUKAN berarti klaim itu salah.";
    default:
      return "Bukti belum cukup untuk memutuskan. Bagian terdekat: " + rujuk + ".";
  }
}
async function verifikasiKlaim(a, klaim, tanya){
  const bagian = bagianSumber(a);
  if (!bagian.length || !teksSumberEfektif(a).trim())
    return {teks:formatVerifikasi({status:"sumber_belum_ada"}, []), berubah:false};
  const calon = bagianPalingRelevan(klaim, bagian, 4);
  if (!calon.length)
    return {teks:formatVerifikasi({status:"tidak_ada_bagian"}, bagian.slice(0, 3)), berubah:false};
  const asal = hasilYangMemuat(a, klaim);
  if (!statusAI.aktif){
    /* Tanpa AI: jangan berpura-pura menghakimi. Sebut bagian terdekat apa adanya. */
    return {teks:"AI online belum aktif, jadi saya tidak bisa menilai dukungan klaim. " +
      "Bagian sumber terdekat: " + calon.map(teksRujukan).join(", ") + ". " +
      "Buka bagian itu dan bandingkan sendiri — saya tidak mengarang penilaian.", berubah:false};
  }
  try{
    rekamKiriman(a, "verifikasi", {klaim});
    const j = await panggilAIRaw({tugas:"verifikasi", klaim, pertanyaan:tanya, judul:a.judul,
      hasil_teks:asal.teks, sumber_teks:teksSumberEfektif(a), bagian:calon});
    return {teks:formatVerifikasi(j.verifikasi || {status:"gagal"}, calon), berubah:false};
  }catch(e){
    return {teks:formatVerifikasi({status:"gagal", alasan:(e.message || String(e)).slice(0, 160)}, calon),
      berubah:false};
  }
}

async function prosesAgen(a, tanya){
  const teksSumber = teksSumberEfektif(a);
  // koreksi eksplisit: "Ganti X menjadi Y" — diterapkan pada hasil dan pada
  // LAPISAN koreksi; sumber mentah TIDAK pernah ditimpa (§3). Generasi dan
  // tanya berikutnya memakai tampilan efektif yang sudah memuat koreksi ini.
  const gm = tanya.match(/^ganti\s+(.+?)\s+menjadi\s+(.+)$/is);
  if (gm){
    const lama = gm[1].trim().replace(/^["']|["']$/g,"");
    const baru = gm[2].trim().replace(/^["']|["']$/g,"");
    if (!lama || lama === baru) return {teks:"Kata yang diganti dan penggantinya harus berbeda dan tidak kosong.", berubah:false};
    const a2 = await dbAmbil("acara", a.id);
    let jumlah = 0;
    await simpanVersi(a2, `koreksi "${lama}" → "${baru}"`, keadaanSebelum(a2));
    for (const k of Object.keys(a2.hasil||{})){
      const h = a2.hasil[k];
      if (h && h.teks && h.teks.includes(lama)){
        jumlah += h.teks.split(lama).length-1;
        h.teks = h.teks.split(lama).join(baru);
        h.versi = (h.versi||1)+1;
      }
    }
    // hitung juga kemunculan pada tampilan efektif sumber (bukan menimpanya)
    jumlah += teksSumberEfektif(a2).split(lama).length-1;
    a2.koreksi = a2.koreksi || [];
    a2.koreksi.push({id:idBaru("kor"), lama, baru, waktu:new Date().toISOString()});
    await simpanAcara(a2);
    return jumlah
      ? {teks:`Selesai: "${lama}" diganti "${baru}" di ${jumlah} tempat (hasil dan tampilan sumber yang dipakai AI). Sumber mentah tetap utuh — koreksi tersimpan sebagai lapisan terpisah. Versi sebelumnya bisa diurungkan dari daftar Versi.`, berubah:true}
      : {teks:`Tidak ditemukan "${lama}" di hasil maupun sumber — tidak ada perubahan, tidak ada versi palsu dibuat.`, berubah:false};
  }
  /* Verifikasi klaim (kemampuan C): kalimat yang ditanyakan dikirim BERSAMA
     hasil + sumber primer + id bagian. Inilah yang tidak pernah terjadi
     sebelum Direktif #9 S2 — dulu hanya transkrip yang dikirim. */
  const klaim = klaimDimaksud(tanya, a);
  if (klaim) return await verifikasiKlaim(a, klaim, tanya);

  // pertanyaan materi (kemampuan B): dari sumber efektif + rujukan bagian
  if (statusAI.aktif){
    try{
      rekamKiriman(a, "tanya");
      const jawaban = await panggilAI({tugas:"tanya", pertanyaan:tanya, judul:a.judul,
        sumber_teks:teksSumber, bagian:bagianSumber(a).slice(0, 40)});
      return {teks: jawaban, berubah:false};
    }catch(e){
      /* Ditandai gagal supaya pemanggil tidak menyebutnya "jawaban siap".
         Pesannya tetap disimpan di riwayat — pengguna berhak melihat sebabnya. */
      return {teks:"AI gagal dijawab: "+(e.message||e)+"\n(Catatan tidak berubah.)",
              berubah:false, gagal:true};
    }
  }
  // fallback lokal: cari bagian sumber yang mengandung kata kunci
  const kata = tanya.toLowerCase().split(/\s+/).filter(k=>k.length>3).slice(0,6);
  const potongan = [];
  if (teksSumber){
    for (const paragraf of teksSumber.split(/\n{2,}/)){
      const p = paragraf.toLowerCase();
      if (kata.length && kata.some(k=>p.includes(k))) potongan.push(paragraf.trim());
      if (potongan.length >= 3) break;
    }
  }
  return {teks: potongan.length
      ? "AI online belum aktif — ini potongan sumber yang paling cocok (bukan jawaban model):\n\n—\n" +
        potongan.join("\n\n—\n")
      : "AI online belum aktif, dan saya tidak menemukan bagian sumber yang cocok dengan pertanyaan ini. Saya tidak mengarang jawaban.",
    berubah:false};
}

   EKSPOR / IMPOR
   ============================================================ */
async function susunCadangan(denganSumber, ids=null, denganAudio=false){
  const acara = (await dbSemua("acara")).filter(a=>!ids || ids.includes(a.id));
  const keluar = {manifest:"catatan-murojaah-cadangan", skema:SKEMA,
    dibuat:new Date().toISOString(), jumlah:acara.length, audio_ikut:denganAudio,
    catatan:[], versi:[], chat:[]};
  const idSet = new Set(acara.map(a=>a.id));
  for (const a of acara){
    // Salinan dibuat manual: JSON.stringify mengubah Blob menjadi {} sehingga
    // audio rusak ("arrayBuffer is not a function"). Blob ditangani eksplisit
    // di bawah — sumber lama tetap dipakai sebagai rujukan.
    const salinan = JSON.parse(JSON.stringify({...a, sumber: []}));
    salinan.sumber = [];
    for (const s of (a.sumber||[])){
      const sisa = {};
      for (const [k, v] of Object.entries(s)) if (k !== "blob") sisa[k] = v;
      if (!denganSumber && sisa.teks != null) delete sisa.teks;
      if (s.blob){
        if (denganAudio){
          const buf = new Uint8Array(await s.blob.arrayBuffer());
          let bin = "";
          for (let i = 0; i < buf.length; i += 8192)
            bin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
          /* Nama bidang mengikuti JENISNYA. Dulu semua blob ditulis sebagai
             audio_b64, sehingga foto ikut tercadang dengan label "audio" —
             isinya benar, namanya menyesatkan siapa pun yang membuka berkas
             cadangan. `audio_b64` dipertahankan untuk audio supaya cadangan
             lama dan uji lama tetap terbaca. */
          const dasar = (s.jenis === "audio" || !s.jenis) ? "audio" : "media";
          sisa[dasar + "_b64"] = btoa(bin);
          sisa[dasar + "_mime"] = s.blob.type ||
            (dasar === "audio" ? "audio/mpeg" : "application/octet-stream");
        } else {
          sisa.media_tidak_ikut = true;
          if (s.jenis === "audio" || !s.jenis) sisa.audio_tidak_ikut = true;
        }
      }
      salinan.sumber.push(sisa);
    }
    keluar.catatan.push(salinan);
    keluar.versi.push(...(await dbSemuaIndeks("versi","acara_id",a.id)));
    keluar.chat.push(...(await dbSemuaIndeks("chat","acara_id",a.id)));
  }
  keluar.chat = keluar.chat.filter(c=>idSet.has(c.acara_id));
  return keluar;
}
/* ---------- diagnostik satu catatan (Direktif #9 §1.2) ----------
   Isinya harus cukup untuk menjawab "dari mana klaim ini": sumber + hash,
   transkrip mentah, koreksi, tampilan efektif, hasil A–D, dan payload yang
   BENAR-BENAR dikirim ke layanan AI. Tanpa kunci/token/sandi. */
function rekamKiriman(a, tugas, extra){
  try{
    a.diagnostik = a.diagnostik || [];
    const teks = teksSumberEfektif(a);
    a.diagnostik.push(Object.assign({
      waktu:new Date().toISOString(), tugas,
      panjang_sumber:teks.length,
      teks_sumber_dikirim:teks,
      bagian:bagianSumber(a).map(b=>({id:b.id, mulai:b.mulai, selesai:b.selesai}))
    }, extra || {}));
    if (a.diagnostik.length > 40) a.diagnostik = a.diagnostik.slice(-40);
  }catch(e){ /* diagnostik tidak boleh menggagalkan pemrosesan */ }
}
async function hashTeks(teks){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(teks));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return ""; }
}
async function eksporDiagnostik(a){
  const sumber = [];
  for (const s of (a.sumber || [])){
    const isi = s.teks != null ? String(s.teks) : "";
    sumber.push({
      nama:s.nama, jenis:s.jenis, ukuran:s.ukuran ?? null,
      durasi:s.durasi ?? null,
      bagian:Array.isArray(s.bagian)
        ? s.bagian.map(b=>({id:b.id, mulai:b.mulai, selesai:b.selesai, teks:b.teks})) : null,
      sha256: isi ? await hashTeks(isi) : "(audio — dihash hanya bila teks tersedia)",
      teks: isi || null
    });
  }
  const data = {
    manifest:"catatan-murojaah-diagnostik", versi:1,
    dibuat:new Date().toISOString(),
    catatan:{id:a.id, judul:a.judul, jenis:a.jenis, tanggal:a.tanggal, pemateri:a.pemateri,
             diubah:a.diubah, jumlah_bahan:(a.sumber||[]).length},
    sumber,
    transkrip_mentah:(a.sumber||[]).filter(s=>s.jenis==="transkrip-mentah")
      .map(s=>({nama:s.nama, teks:s.teks, bagian:s.bagian || null})),
    koreksi:a.koreksi || [],
    tampilan_efektif:teksSumberEfektif(a),
    hasil:Object.fromEntries(Object.entries(a.hasil||{}).map(([k,h])=>[k,{
      teks:h.teks || "", dibuat:h.dibuat || "", versi:h.versi || 0, gagal:!!h.gagal}])),
    laporan_klaim:a.laporan || null,
    kiriman_ai:a.diagnostik || [],
    peringatan:"Berkas ini memuat MATERI PRIBADI (sumber, transkrip, hasil). " +
      "Tidak memuat kunci, token, atau sandi. Jangan dibagikan tanpa perlu."
  };
  const teks = JSON.stringify(data, null, 2);
  const nama = "diagnostik-" + (String(a.judul||"catatan").replace(/[^\w\s-]/g,"").trim()
    .replace(/\s+/g,"-").toLowerCase() || "catatan") + ".json";
  dialogTampil(`<h3>Ekspor diagnostik catatan ini</h3>
    <p class="kcil">Berkas ini memuat <b>materi pribadi</b>: sumber, transkrip mentah, hasil,
    dan payload yang benar-benar dikirim ke layanan AI. Tidak memuat kunci/token/sandi.
    Periksa pratinjau di bawah sebelum mengunduh.</p>
    <pre class="pratinjau-diag">${esc(teks.slice(0, 3000))}${
      teks.length > 3000 ? "\n… (" + teks.length.toLocaleString("id") + " karakter total)" : ""}</pre>
    <p class="kcil">${sumber.length} sumber · ${(a.koreksi||[]).length} koreksi ·
    ${Object.keys(a.hasil||{}).length} hasil · ${(a.diagnostik||[]).length} kiriman AI tercatat.</p>`,
    [{label:"Batal", ndua:true},
     {label:"Unduh diagnostik", aksi:()=>unduhBerkas(nama, teks, "application/json")}]);
}

          for (const asli of data.catatan){
            const idLama = asli.id;
            const a = JSON.parse(JSON.stringify(asli));
            // audio dari cadangan penuh: bangun ulang Blob dari base64
            for (const s of a.sumber||[]){
              /* Cadangan lama memakai audio_b64 untuk SEMUA media; cadangan
                 baru memakai media_b64 untuk foto/video. Keduanya dibaca. */
              const kb = s.audio_b64 ? "audio_b64" : (s.media_b64 ? "media_b64" : "");
              if (kb){
                const km = kb === "audio_b64" ? "audio_mime" : "media_mime";
                const bin = atob(s[kb]);
                const buf = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
                s.blob = new Blob([buf], {type: s[km] || "audio/mpeg"});
                delete s[kb]; delete s[km];
              }
            }
            if (adaId.has(a.id)){
              if (modeSah === "lewati") continue;

       }}]);

}

/* ============================================================
   HALAMAN: Diagnosa penyimpanan (Direktif #15 §1.2)

   HANYA MEMBACA. Tidak ada satu pun penulisan, penghapusan, atau pemadatan
   di halaman ini — tujuannya memeriksa, bukan memperbaiki. Dipakai untuk
   menjawab "apakah rekaman rapat saya masih ada?" tanpa menyalakan proses
   apa pun yang bisa merusaknya.
   ============================================================ */
function jamTanggal(ms){
  if (!ms) return "—";
  try{
    const d = new Date(ms);
    const p = n=>String(n).padStart(2, "0");
    return p(d.getDate()) + "/" + p(d.getMonth()+1) + "/" + d.getFullYear() + " " +
      p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }catch(e){ return "—"; }
}
async function laporanDiagnosa(){
  const keluar = {sesi:[], potongan:[], draf:null, galat:[]};
  try{
    const s = await sesiSemua();
    keluar.sesi = s.sort((a,b)=>(b.mulaiMs || 0) - (a.mulaiMs || 0)).map(z=>({
      id:z.id, status:z.status, mulaiMs:z.mulaiMs, selesaiMs:z.selesaiMs,
      denyutMs:z.denyutMs, jumlahPotongan:z.jumlahPotongan || 0,
      totalByte:z.totalByte || 0, tersimpanMs:z.tersimpanMs || 0,
      bagian:(z.bagianInfo || []).length, jeda:z.jeda || [], alasan:z.alasan || ""}));
  }catch(e){ keluar.galat.push("sesi: " + (e.message || e)); }
  try{
    const p = await potonganSemua();
    const per = new Map();
    for (const x of p){
      if (!per.has(x.sesi)) per.set(x.sesi, {sesi:x.sesi, jumlah:0, byte:0,
        bagian:new Set(), awal:Infinity, akhir:0});
      const t = per.get(x.sesi);
      t.jumlah++; t.byte += (x.byte || 0); t.bagian.add(x.bagian);
      t.awal = Math.min(t.awal, x.mulaiMs || 0);
      t.akhir = Math.max(t.akhir, x.akhirMs || 0);
    }
    keluar.potongan = [...per.values()].map(t=>({sesi:t.sesi, jumlah:t.jumlah,
      byte:t.byte, bagian:t.bagian.size,
      awal:t.awal === Infinity ? 0 : t.awal, akhir:t.akhir}));
  }catch(e){ keluar.galat.push("potongan: " + (e.message || e)); }
  try{
    const b = await dbAmbil("draf","bahan");
    if (b) keluar.draf = {audio:(b.audio || []).length, teks:(b.teks || []).length,
      foto:(b.foto || []).length, video:(b.video || []).length,
      audioByte:(b.audio || []).reduce((t,x)=>t + ((x.ukuran || 0)), 0)};
  }catch(e){ keluar.galat.push("draf: " + (e.message || e)); }
  return keluar;
}
function teksLaporanDiagnosa(l){
  const baris = [];
  baris.push("CATATAN MUROJAAH — LAPORAN PENYIMPANAN (hanya baca)");
  baris.push("Dibuat: " + new Date().toISOString());
  baris.push("");
  baris.push("SESI (" + l.sesi.length + "):");
  for (const s of l.sesi){
    baris.push("- " + s.id + " · " + s.status + " · mulai " + jamTanggal(s.mulaiMs) +
      " · denyut " + jamTanggal(s.denyutMs) + " · potongan " + s.jumlahPotongan +
      " · " + Math.round(s.totalByte/1024) + " KB · tersimpan " +
      jamPanjang(s.tersimpanMs) + " · bagian " + s.bagian +
      (s.alasan ? " · " + s.alasan : ""));
  }
  if (!l.sesi.length) baris.push("- (tidak ada)");
  baris.push("");
  baris.push("POTONGAN PER SESI:");
  for (const p of l.potongan){
    baris.push("- " + p.sesi + " · " + p.jumlah + " potongan · " +
      p.bagian + " bagian · " + Math.round(p.byte/1024) + " KB · rentang " +
      jamPanjang(p.awal) + "–" + jamPanjang(p.akhir));
  }
  if (!l.potongan.length) baris.push("- (tidak ada)");
  baris.push("");
  baris.push("DRAF BAHAN: " + (l.draf
    ? l.draf.audio + " audio, " + l.draf.teks + " teks, " + l.draf.foto +
      " foto, " + l.draf.video + " video (" + Math.round(l.draf.audioByte/1024) + " KB audio)"
    : "(tidak ada)"));
  if (l.galat.length){ baris.push(""); baris.push("CATATAN GALAT: " + l.galat.join(" | ")); }
  return baris.join("\n");
}

          ' · denyut terakhir ' + jamTanggal(s.denyutMs) +
          ' · ' + s.jumlahPotongan + ' potongan (' + (p ? p.bagian : s.bagian) +
          ' bagian) · ' + Math.round((s.totalByte || 0)/1024) + ' KB' +
          ' · tersimpan ' + jamPanjang(s.tersimpanMs) + '</span>' +
          (s.alasan ? '<br><span class="kcil">' + esc(s.alasan) + '</span>' : '') +
          '</li>';
      }).join("") + '</ul>';
    }
    html += '<h2 style="font-size:1rem">Draf bahan</h2>' +
      (l.draf ? '<p class="kcil">' + l.draf.audio + ' audio · ' + l.draf.teks +
        ' teks · ' + l.draf.foto + ' foto · ' + l.draf.video + ' video</p>'
        : '<p class="kcil">Tidak ada draf.</p>');
    if (l.galat.length)
      html += '<p class="kcil">Catatan: ' + esc(l.galat.join(" | ")) + '</p>';
    w.innerHTML = html;
    window.__diagTeks = teksLaporanDiagnosa(l);
  };
  $("#diag-muat").onclick = gambar;
  $("#diag-salin").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(window.__diagTeks || "");
      umumkan("Laporan disalin.");
    }catch(e){ dialogTampil("<h3>Laporan</h3><textarea readonly style='min-height:260px'>" +
      esc(window.__diagTeks || "") + "</textarea>", [{label:"Tutup", ndua:true}]); }
  };
  /* Unduh, bukan Console: pemilik tidak boleh diminta mengetik perintah di
     alat pengembang untuk mengetahui keadaan penyimpanannya sendiri. */
  $("#diag-unduh").onclick = ()=>{
    const isi = new Blob([window.__diagTeks || ""], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(isi);
    a.download = "diagnosa-penyimpanan-" +
      new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    umumkan("Laporan diagnosa diunduh.");
  };
  await gambar();
}

/* ---------- mulai ---------- */
(async function mulai(){
  // Bersihkan sekali, diam-diam: versi lama menyimpan kunci API pribadi di
  // peramban. Fitur itu sudah dihapus — pengguna umum tidak memakai kunci.
  try{ localStorage.removeItem("catatan-kunci-ai"); }catch(e){ /* mode privat */ }
  // Tema & ukuran huruf dibaca sebelum halaman pertama digambar (tanpa kedip).
  bacaPref();
  bacaPrefSumber();
  pasangIdentitas();
  terapkanTema();
  /* Panduan diperbarui dari event nyata (input/klik) — tanpa model, tanpa biaya. */
  ["input", "change", "click", "keyup"].forEach(ev=>
    document.addEventListener(ev, ()=>requestAnimationFrame(gambarPanduan), true));
  const pilihTema = $("#tema-pilih");
  if (pilihTema) pilihTema.onchange = ()=>simpanTema(pilihTema.value);
  try{
    const mq = matchMedia("(prefers-color-scheme: light)");
    const ikut = ()=>{ if (PREF.tema === "sistem") terapkanTema(); };
    if (mq.addEventListener) mq.addEventListener("change", ikut);
    else if (mq.addListener) mq.addListener(ikut);
  }catch(e){}
  // Panel mulai tertutup → satu kolom penuh (tanpa kolom kanan kosong).
  document.body.classList.add("panel-tertutup");
  try{
    db = await bukaDB();
  }catch(e){
    $("#isi").innerHTML = `<div class="catatan-status gagal"><strong>Penyimpanan peramban tidak tersedia.</strong><br>
      ${esc(e.message||e)}<br>Bila Anda memakai mode privat/incognito, keluar dari mode itu atau izinkan penyimpanan.
      Tanpa penyimpanan, catatan tidak bisa disimpan — Anda masih bisa membaca contoh publik.</div>`;
    return;
  }
  /* Sesi yang berhenti menulis (halaman dimuat ulang, tab dibuang, HP
     mengunci) ditandai "terputus" SEBELUM halaman digambar — supaya panel
     pemulihan dan banner Beranda sudah berisi, bukan muncul belakangan. */
  try{ await periksaSesiTerputus(); }catch(e){ sesiTerputus = null; }
  await rute();
  /* Pemulihan tidak boleh bergantung pada satu pemeriksaan saat halaman
     dibuka: sesi yang berhenti menulis 10 detik sesudahnya tetap harus
     ditemukan, tanpa memuat ulang halaman lagi. */
  setInterval(async ()=>{
    if (sesiAktif || sedangBerhenti) return;
    const sebelum = sesiTerputus && sesiTerputus.id;
    await periksaSesiTerputus();
    const kini = sesiTerputus && sesiTerputus.id;
    if (!kini || kini === sebelum) return;
    const h = hashKini();
    if (h.startsWith("#/buat")) renderRekam();
    else if (h.startsWith("#/beranda") || h === "#/" || h === "") rute();
  }, 5000);
  cekAI();
})();
</script>
