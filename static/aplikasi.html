}
async function lanjutkanRekaman(){
  const s = sesiTerputus;
  if (!s || sesiAktif) return;
  let rek = null;
  try{ rek = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){
    rekamJenisGagal = "izin";
    rekamPesanGagal = alasanMikrofon(e) + ". Rekaman yang lama tetap tersimpan " +
      "dan tetap bisa dibuatkan catatan tanpa melanjutkan.";
    rekamKeadaanBaru("terputus");
    umumkan("Mikrofon belum diizinkan.");
    return;
  }
  rekAktif = rek;
  rek.getAudioTracks().forEach(t=>{
    t.addEventListener("ended", ()=>{
      if (!sesiAktif || berhentiSendiri) return;
      berhentiSendiri = "Mikrofon berhenti — rekaman dihentikan di " +
        jamPanjang(sesiAktif.tersimpanMs) + ". Yang sudah tertulis tetap ada.";
      hentikanRekam({gagal:true, alasan:berhentiSendiri});
    });
  });
  const sekarang = Date.now();
  /* Jeda dicatat dari DENYUT TERAKHIR ke Mulai berikutnya — bukan dari jam
     dinding sesi, supaya "Jeda tidak terekam" menyebut angka yang benar.
     `pasti:false`: denyut terakhir adalah saat penulisan TERAKHIR yang
     terbukti, bukan bukti bahwa mikrofon berhenti tepat pada milidetik itu.
     Karena itu batasnya diberi label perkiraan, sesuai §7. */
  s.jeda = s.jeda || [];
  s.jeda.push({dariMs: s.denyutMs || sekarang, sampaiMs: sekarang,
               pasti:false, sebab:"denyut terakhir → lanjut rekam"});
  s.status = "merekam";
  s.denyutMs = sekarang;
  s.alasan = "";
  /* §9 K3: bagian lama harus ikut terukur, bukan hilang dari perhitungan
     saat rekaman disambung. Semuanya sudah committed di toko. */
  kosongkanVerifikasi();
  try{
    const lama = await potonganSesi(s.id);
    potonganCommitted = lama.map(p=>({bagian:p.bagian, urut:p.urut,
      blob:p.blob, byte:p.byte || (p.blob && p.blob.size) || 0,
      wallMulaiMs:p.wallMulaiMs || 0, wallAkhirMs:p.wallAkhirMs || 0}));
  }catch(e){ potonganCommitted = []; }
  s.diterimaPotongan = s.diterimaPotongan || s.jumlahPotongan || 0;
  s.diterimaByte = s.diterimaByte || s.totalByte || 0;
  sesiAktif = s;
  const maks = Math.max(0, ...(s.bagianInfo || []).map(b=>b.bagian));
  try{ await sesiSimpan(ringkasSesi(s)); }catch(e){}
  sesiTerputus = null;
  rekamPesanGagal = "";
  rekamKeadaanBaru("merekam");
  rekamMulaiJam();
  try{
    bagianAktif = maks + 1;
    mediaRekam = pasangPerekam(rek, bagianAktif);
  }catch(e){
    hentikanJalur();
    sesiAktif = null;
    sesiTerputus = s;
    rekamJenisGagal = "izin";
    rekamPesanGagal = "Perekaman tidak bisa dilanjutkan di peramban ini (" +
      ((e && e.message) || e) + ").";
    rekamKeadaanBaru("terputus");
    return;
  }
  jadwalkanRotasi();
  jadwalkanVerifikasi();
  perbaruiLayarRekam();
}
async function buatCatatanDariSesiTerputus(){
  const s = sesiTerputus;
  if (!s) return;
  const x = await rakitBahanSesi(s, {});
  if (!x){ umumkan("Potongan rekaman tidak ditemukan di perangkat ini."); return; }
  s.status = "selesai"; s.selesaiMs = Date.now();
  s.durasiMs = Math.round((x.durasi || 0) * 1000);
  try{ await sesiSimpan(ringkasSesi(s)); }catch(e){}
  try{ await potonganHapusSesi(s.id); }catch(e){}
  sesiTerputus = null;
  rekamPesanGagal = "";
  rekamKeadaanBaru("tersimpan");
  await buatCatatanDariRekaman();
}

/* Memakai transkrip yang SUDAH ADA sebagai bahan, tanpa memerlukan panel
   transkrip terbuka. Idempoten: klik berulang tidak menggandakan bahan. */
function pakaiTranskripOtomatis(x){
  if (!x || !x.tr) return false;
  const teks = ((x.tr.revisi != null ? x.tr.revisi : x.tr.mentah) || "").trim();
  if (!teks) return false;
  const id = x.kunci || (x.kunci = idBaru("bahan"));
  const bagian = bagianBertanda(x.tr);
  let b = bahanTranskrip(x);
  if (b){
    b.teks = teks;
    b.bagian = bagian;
    b.revisi = (x.tr.koreksi || []).length;
  } else {
    b = {jenis:"teks", nama:namaTranskrip(x), teks, asalTr:id, induk:id, bagian,
         kunci:idBaru("bahan"), urut:urutBaru(),
         revisi:(x.tr.koreksi || []).length, dibuat:new Date().toISOString()};
    bahanTeks.push(b);
  }
  x.tr.terpakai = true;
  renderAudioDraf(); perbaruiRingkas(); simpanDrafBahan();
  return true;
}

/* Menjalankan transkripsi SATU rekaman dan menunggu sampai selesai.
   Mengembalikan {ok, sebab, parsial} — bukan melempar, supaya pemanggil bisa
   menampilkan jalan keluar yang benar. */
async function transkripSatu(x, kabar){
  if (!x) return {ok:false, sebab:"Tidak ada rekaman."};
  if (rekamAdaTulisan(x)) return {ok:true, parsial:false};
  if (!x.blob) return {ok:false, sebab:"Berkas rekaman tidak tersedia."};
  if (!x.tr) x.tr = trBaru();
  x.tr.batal = false;
  x.tr.versi++;
  const lapor = (m)=>{
    if (!x.tr) return;
    x.tr.pesan = m;
    x.tr.versi++;
    perbaruiTr(x, (liPerBahan.get(x) || {}).li?.querySelector(".tr-slot") || null);
    if (typeof kabar === "function") kabar(m);
  };
  let pcm = pcmSementara.get(x);
  let ambil = null, lepas = null, durasi = 0;
  if (!pcm && Array.isArray(x.bagianBlob) && x.bagianBlob.length > 1){
    const sumber = pcmBertahap(x.bagianBlob, {kabar:lapor});
    ambil = sumber.ambil; lepas = sumber.lepas;
    durasi = x.bagianBlob.reduce((t,b)=>t + (b.durasi || 0), 0) || (x.durasi || 0);
  }
  return new Promise((resolve)=>{
    jalankanTranskrip(x.blob, x.tr, {
      kabar: lapor,
      simpan: simpanDrafTr,
      pcm, ambil, lepas, durasi,
      selesai: ()=>{
        const total = x.tr.total || 0;
        const selesai = x.tr.selesai || 0;
        if (x.tr.galat){
          resolve({ok:false, sebab:x.tr.galat, kode:x.tr.kode || "",
                   parsial: selesai > 0 && selesai < total});
        } else if (total && selesai < total){
          resolve({ok:false, sebab:"Baru " + selesai + " dari " + total +
            " bagian selesai.", parsial:true});
        } else {
          resolve({ok:true, parsial:false});
        }
      }
    });
  });
}

/* Rantai SATU KETUK: rekaman → tulisan → bahan → catatan → hasil.
   Direktif #13 §1/§2: pengguna tidak boleh dipaksa menyalin teks lalu
   menempelnya lagi di halaman lain. */
async function buatCatatanDariRekaman(){
  if (rantaiJalan) return;
  const x = rekamItemTerakhir();
  if (!x){
    umumkan("Belum ada rekaman. Tekan Mulai Rekam dulu.");
    return;
  }
  rantaiJalan = true;
  const btn = $("#a-rekam-buat");
  if (btn) btn.disabled = true;
  try{
    if (!rekamAdaTulisan(x)){
      rekamKeadaanBaru("mengubah");
      rekamTahap("Mengubah suara menjadi tulisan", "Menyiapkan rekaman…");
      umumkan("Mengubah suara menjadi tulisan.");
      const hasil = await transkripSatu(x, (m)=>{
        const t = /bagian\s+(\d+)\s+dari\s+(\d+)/i.exec(m || "");
        rekamTahap("Mengubah suara menjadi tulisan",
          t ? "Bagian " + t[1] + " dari " + t[2] : (m || ""));
      });
      if (!hasil.ok){
        /* §5: transkrip SEBAGIAN bukan transkrip lengkap. Label tindakannya
           "Lanjutkan Transkripsi" supaya jelas proses melanjutkan dari bagian
           terakhir yang tersimpan, bukan mengulang dari awal. */
        const parsial = !!hasil.parsial;
        const sebab = rapikanSebab(hasil.sebab);
        rekamJenisGagal = parsial ? "transkrip-parsial" : "transkrip";
        rekamPesanGagal = parsial
          ? "Transkripsi baru selesai sebagian: " + sebab + " Rekaman Anda masih " +
            "tersimpan. Tekan " + labelTindakanGagal() + " — bagian yang sudah " +
            "selesai tidak diulang, dan catatan tidak disusun dari tulisan yang " +
            "belum lengkap."
          : "Tulisan belum selesai dibuat: " + sebab +
            ". Rekaman kelas Anda masih tersimpan dan bisa diputar atau diunduh. " +
            "Tekan " + labelTindakanGagal() + " untuk mencoba lagi.";
        rekamKeadaanBaru("gagal");
        umumkan(parsial ? "Tulisan baru selesai sebagian. Rekaman masih tersimpan."
                        : "Tulisan belum selesai dibuat. Rekaman masih tersimpan.");
        return;
      }
    }
    if (!pakaiTranskripOtomatis(x)){
      rekamJenisGagal = "transkrip";
      rekamPesanGagal = "Tulisan tidak terbaca dari rekaman ini. Rekaman tetap " +
        "tersimpan. Tekan Periksa Transkrip untuk melihat hasilnya.";
      rekamKeadaanBaru("gagal");
      return;
    }
    rekamKeadaanBaru("tulisan-siap");
    umumkan("Tulisan sudah siap. Catatan sedang disusun.");
    await buatCatatan();
  } finally {
    rantaiJalan = false;
    const b2 = $("#a-rekam-buat");
    if (b2) b2.disabled = false;
  }
}

async function tambahAudioDraf(blob, nama, jenis, wadah){
  const st = $("#a-status");
  /* Penantian HARUS terlihat: dekode 30 menit dulu membekukan layar tanpa
     satu pun pembaruan. Sekarang ada cakra berputar + persentase nyata. */
  const s = sibuk(wadah || st, {label:"Menyiapkan rekaman.",
    sub:"Berkas besar bisa lebih lama."});
  try{
    const d = await dekodeKeMono16(blob, {kabar:(p, t)=>
      s.perbarui({label:"Menyiapkan rekaman.", sub:t, persen:p})});
    const durasi = d.durasi;
    const x = {jenis:"audio", nama, blob, ukuran:blob.size, durasi,
               kunci:idBaru("bahan"), urut:urutBaru()};
    /* Rekaman pendek menyimpan PCM-nya supaya transkripsi tidak mendekode dua
       kali; rekaman panjang tidak, agar memori perangkat tidak penuh. */
    if (durasi <= 600) pcmSementara.set(x, d.pcm);
    audioDraf.push(x);
    renderAudioDraf();
    /* Tanpa ini tombol utama tetap berbunyi "Buat Catatan" padahal bahannya
       hanya rekaman — pengguna berakhir di halaman hasil kosong. */
    perbaruiRingkas();
    await simpanDrafBahan();      // tersimpan SEBELUM ada pemrosesan apa pun
    st.textContent = "";
    s.selesai("Rekaman siap diputar.");
    setTimeout(()=>s.hapus(), 1200);
    return true;
  }catch(e){
    st.textContent = "Berkas tidak disimpan: peramban ini tidak bisa membuka " +
      nama + " (" + (e.message||e) + "). Periksa berkas tidak rusak atau kosong.";
    s.gagal("Berkas tidak bisa dibuka.", "Coba berkas lain, atau unduh ulang berkasnya.");
    setTimeout(()=>s.hapus(), 1600);
    return false;
  }
}

/* ---------- banyak berkas: kenali dari ISI, bukan ekstensi (§D2) ---------- */
const MAKS_BERKAS_SEKALI = 12;
const MAKS_AUDIO_BYTE = 40 * 1024 * 1024;
const MAKS_TEKS_BYTE = 5 * 1024 * 1024;

function awalByte(buf, teks){
  for (let i = 0; i < teks.length; i++) if (buf[i] !== teks.charCodeAt(i)) return false;
  return true;
}

/* Tipe ditentukan dari beberapa byte pertama + hasil percobaan baca teks.
   Nama berkas TIDAK dipakai: "rekaman.mp3" yang isinya PDF tetap dikenali PDF. */
async function kenaliBerkas(berkas){
  const buf = new Uint8Array(await berkas.slice(0, 512).arrayBuffer());
  if (buf.length >= 4){
    /* Gambar dikenali dari byte pertama: JPEG, PNG, WebP. GIF dikenali agar
       bisa DITOLAK dengan alasan, bukan diam-diam gagal. */
    const g = jenisGambarDariByte(buf);
    if (g) return {jenis:"foto", mime:g};
    if (awalByte(buf, "%PDF")) return {jenis:"pdf"};
    if (buf[0] === 0x50 && buf[1] === 0x4B && buf[2] === 0x03 && buf[3] === 0x04)
      return {jenis:"zip"};
    const id3 = buf[0] === 0x49 && buf[1] === 0x44 && buf[2] === 0x33;
    const mp3 = buf[0] === 0xFF && (buf[1] & 0xE0) === 0xE0;
    const mp4 = buf[4] === 0x66 && buf[5] === 0x74 && buf[6] === 0x79 && buf[7] === 0x70;
    const wav = awalByte(buf, "RIFF");
    const ogg = awalByte(buf, "OggS");
    const webm = buf[0] === 0x1A && buf[1] === 0x45 && buf[2] === 0xDF && buf[3] === 0xA3;
    const flac = awalByte(buf, "fLaC");
    if (id3 || mp3 || wav || ogg || flac) return {jenis:"audio"};
    /* MP4 dan WebM bisa berisi AUDIO saja (rekaman m4a/webm) atau VIDEO.
       Wadahnya sama, jadi tidak bisa ditebak dari byte pertama — diperiksa
       dengan elemen <video>: kalau ada lebar gambar, itu video. */
    if (mp4 || webm) return {jenis:"media"};
  }
  if (berkas.size > MAKS_TEKS_BYTE) return {jenis:"besar"};
  let t = null;
  try{ t = await berkas.text(); }catch(e){ return {jenis:"biner"}; }
  if (t.indexOf("\u0000") >= 0) return {jenis:"biner"};
  const rusak = (t.match(/\uFFFD/g) || []).length;
  if (rusak > Math.max(2, t.length * 0.01)) return {jenis:"biner"};
  return {jenis:"teks", teks:t};
}

function catatGagalBerkas(nama, alasan){
  const w = $("#a-berkas-galat");
  if (!w) return;
  const p = document.createElement("p");
  p.className = "kcil galat-berkas";
  p.setAttribute("role", "alert");
  p.textContent = "Tidak masuk: " + nama + " — " + alasan;
  w.appendChild(p);
}

/* Status berkas yang SEDANG TERLIHAT: setiap panel sumber punya barisnya
   sendiri, dan pesan kemajuan tidak boleh menulis ke panel yang tertutup. */
function statusBerkas(){
  const kandidat = [$("#f-status"), $("#v-status"), $("#a-berkas-status")];
  for (const el of kandidat) if (el && el.offsetParent !== null) return el;
  return $("#a-berkas-status");
}
/* Satu berkas gagal TIDAK membatalkan kelompok (§D3). */
async function tambahBanyakBerkas(daftar){
  const st = statusBerkas();
  const wadah = $("#a-berkas-sibuk");
  const galat = $("#a-berkas-galat");
  if (galat) galat.innerHTML = "";
  const pakai = daftar.slice(0, MAKS_BERKAS_SEKALI);
  const sisa = daftar.length - pakai.length;
  let nAudio = 0, nTeks = 0, nFoto = 0, nVideo = 0;

  for (let i = 0; i < pakai.length; i++){
    const berkas = pakai[i];
    if (st) st.textContent = "Berkas " + (i + 1) + " dari " + pakai.length +
      ": " + berkas.name + "…";
    try{
      const k = await kenaliBerkas(berkas);
      if (k.jenis === "foto"){
        if (await tambahFoto(berkas, "berkas")) nFoto++;
        continue;
      }
      if (k.jenis === "media"){
        /* Wadah yang sama bisa audio atau video: diputuskan dari ada/tidaknya
           gambar, bukan dari namanya. */
        const m = await ukurVideo(berkas);
        if (m.lebar && m.tinggi){
          if (await tambahVideo(berkas, "berkas")) nVideo++;
          continue;
        }
      }
      if (k.jenis === "audio" || k.jenis === "media"){
        if (berkas.size > MAKS_AUDIO_BYTE){
          catatGagalBerkas(berkas.name, "lebih dari 40 MB");
          continue;
        }
        /* indikator per berkas: bersihkan sisa berkas sebelumnya dulu */
        if (wadah) wadah.innerHTML = "";
        const ok = await tambahAudioDraf(berkas, berkas.name, "audio", wadah);
        if (ok) nAudio++; else catatGagalBerkas(berkas.name, "audio tidak bisa dibuka");
      } else if (k.jenis === "teks"){
        if (!k.teks.trim()){ catatGagalBerkas(berkas.name, "berkas teks kosong"); continue; }
        bahanTeks.push({jenis:"teks", nama:berkas.name, teks:k.teks,
                        kunci:idBaru("bahan"), urut:urutBaru(),
                        dibuat:new Date().toISOString()});
        nTeks++;
      } else if (k.jenis === "pdf"){
        catatGagalBerkas(berkas.name, "PDF belum bisa dibaca di peramban ini — " +
          "pembaca PDF belum disertakan, jadi teksnya tidak diklaim terbaca");
      } else if (k.jenis === "zip"){
        catatGagalBerkas(berkas.name, "DOCX/ZIP belum bisa dibaca di peramban ini — " +
          "pembaca DOCX belum disertakan");
      } else if (k.jenis === "besar"){
        catatGagalBerkas(berkas.name, "lebih dari 5 MB untuk berkas teks");
      } else {
        catatGagalBerkas(berkas.name, "isi berkas tidak dikenali sebagai audio atau teks");
      }
    }catch(e){
      catatGagalBerkas(berkas.name, (e && e.message) || "gagal dibaca");
    }
  }

  renderAudioDraf(); perbaruiRingkas();
  if (audioDraf.length || bahanTeks.length) await simpanDrafBahan();
  if (st){
    const bagian = [];
    if (nAudio) bagian.push(nAudio + " audio");
    if (nTeks) bagian.push(nTeks + " teks");
    if (nFoto) bagian.push(nFoto + " foto");
    if (nVideo) bagian.push(nVideo + " video");
    st.textContent = bagian.length
      ? "Masuk: " + bagian.join(" + ") + "." +
        (sisa ? " " + sisa + " berkas lain tidak diproses (batas " +
          MAKS_BERKAS_SEKALI + " per pemilihan)." : "")
      : "Tidak ada berkas yang bisa dipakai.";
  }
  return nAudio + nTeks + nFoto + nVideo;
}

/* ============================================================
   FOTO / SLIDE (§3) DAN VIDEO (§4)
   Tiga hal DIPISAH tegas di data dan di layar:
     (1) gambar ASLI  — tidak pernah diubah, bisa dibuka kapan saja,
     (2) teks yang TERBACA dari gambar — boleh diperbaiki pengguna,
     (3) keterangan unsur visual — hanya bila benar-benar terbaca.
   Salinan terkompresi dipakai untuk pemrosesan dan tampilan kecil; yang asli
   tetap utuh. Kemampuan provider sudah DIBUKTIKAN lebih dulu lewat
   tools/probe_gambar_provider.py (6/6 penanda terbaca, bukan dugaan).
   ============================================================ */
const bahanFoto = [];
const bahanVideo = [];
const MAKS_FOTO_SEKALI = 6;
const MAKS_FOTO_BYTE = 25 * 1024 * 1024;
const FOTO_SISI = 1000;          // px sisi terpanjang salinan proses
const FOTO_MUTU = 0.72;
const MAKS_VIDEO_BYTE = 300 * 1024 * 1024;
const MAKS_CUPLIKAN = 6;
const GAMBAR_HASIL_MAKS = 4;     // gambar yang ikut dikirim saat membuat hasil

/* Jenis gambar ditentukan dari BYTE PERTAMA, bukan nama berkas. */
function jenisGambarDariByte(buf){
  if (buf.length >= 3 && buf[0] === 0xFF && buf[1] === 0xD8 && buf[2] === 0xFF)
    return "image/jpeg";
  if (buf.length >= 8 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4E
      && buf[3] === 0x47) return "image/png";
  if (buf.length >= 12 && awalByte(buf, "RIFF") && buf[8] === 0x57
      && buf[9] === 0x45 && buf[10] === 0x42 && buf[11] === 0x50) return "image/webp";
  if (buf.length >= 4 && buf[0] === 0x47 && buf[1] === 0x49 && buf[2] === 0x46)
    return "image/gif";
  return "";
}
function urlAman(x, kunci){
  /* URL objek dibuat SEKALI per bahan; menggambar ulang daftar tidak boleh
     membuat URL baru (bocor) dan tidak boleh mencabut yang sedang dipakai. */
  if (!x[kunci]){
    try{ x[kunci] = URL.createObjectURL(x.blob); }catch(e){ x[kunci] = ""; }
  }
  return x[kunci];
}
function urlProses(x){
  if (!x._urlProses && x.blobProses){
    try{ x._urlProses = URL.createObjectURL(x.blobProses); }catch(e){ x._urlProses = ""; }
  }
  return x._urlProses || urlAman(x, "_url");
}
/* createImageBitmap(imageOrientation:"from-image") MENGHORMATI EXIF, jadi foto
   potret dari ponsel tidak lagi tampil (dan diproses) dalam keadaan miring. */
async function dekodeGambar(berkas){
  if (!window.createImageBitmap)
    throw new Error("peramban ini tidak mendukung pembacaan gambar");
  try{ return await createImageBitmap(berkas, {imageOrientation:"from-image"}); }
  catch(e){ return await createImageBitmap(berkas); }
}
async function kompresGambar(bitmap){
  const sisi = Math.max(bitmap.width, bitmap.height) || 1;
  const skala = Math.min(1, FOTO_SISI / sisi);
  const w = Math.max(1, Math.round(bitmap.width * skala));
  const h = Math.max(1, Math.round(bitmap.height * skala));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bitmap, 0, 0, w, h);
  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", FOTO_MUTU));
  if (!blob) throw new Error("gambar tidak bisa dikompres");
  return {blob, w, h};
}

async function tambahFoto(berkas, asal){
  if (!berkas || !berkas.size){
    catatGagalBerkas((berkas && berkas.name) || "foto", "berkas kosong");
    return false;
  }
  if (berkas.size > MAKS_FOTO_BYTE){
    catatGagalBerkas(berkas.name, "lebih dari 25 MB — perkecil dulu");
    return false;
  }
  const buf = new Uint8Array(await berkas.slice(0, 16).arrayBuffer());
  const mime = jenisGambarDariByte(buf);
  if (mime === "image/gif"){
    catatGagalBerkas(berkas.name, "GIF belum didukung — ubah dulu ke JPG atau PNG");
    return false;
  }
  if (!mime){
    catatGagalBerkas(berkas.name, "bukan JPEG/PNG/WebP — ubah dulu ke JPG atau PNG");
    return false;
  }
  let bmp;
  try{ bmp = await dekodeGambar(berkas); }
  catch(e){
    catatGagalBerkas(berkas.name, "gambar tidak bisa dibuka (" + ((e && e.message) || e) + ")");
    return false;
  }
  let kecil;
  try{ kecil = await kompresGambar(bmp); }
  catch(e){
    try{ bmp.close && bmp.close(); }catch(e2){}
    catatGagalBerkas(berkas.name, "gambar gagal disiapkan (" + ((e && e.message) || e) + ")");
    return false;
  }
  const x = {jenis:"foto", nama:berkas.name, blob:berkas, blobProses:kecil.blob,
    lebar:bmp.width, tinggi:bmp.height, mimeAsli:mime,
    ukuran:berkas.size, ukuranProses:kecil.blob.size,
    teks:"", teksAsli:"", unsur:"", terbaca:"", status:"menunggu",
    diperiksa:false, revisi:0, galat:"", kunci:idBaru("foto"),
    urut:urutBaru(), asal:asal || "berkas", dibuat:new Date().toISOString()};
  try{ bmp.close && bmp.close(); }catch(e){}
  bahanFoto.push(x);
  renderAudioDraf(); perbaruiRingkas();
  await simpanDrafBahan();
  bacaFoto(x);                  // umpan balik sejak klik pertama (§8)
  return true;
}

/* Baca SATU foto. Status per foto, bisa dicoba ulang tanpa mengulang yang lain. */
async function bacaFoto(x){
  if (!x || x.status === "membaca") return;
  x.status = "membaca"; x.galat = "";
  renderAudioDraf();
  try{
    const b64 = await blobKeBase64(x.blobProses);
    const j = await panggilAIRaw({tugas:"baca-gambar",
      gambar:[{id:x.kunci, mime:"image/jpeg", b64, ket:x.nama}]});
    const b = j.baca || {};
    x.teksAsli = String(b.teks || "").trim();
    x.teks = x.teksAsli;
    x.unsur = String(b.unsur || "").trim();
    x.terbaca = String(b.terbaca || "").trim() || (x.teks ? "sebagian" : "tidak");
    x.mentah = String(b.mentah || "");
    x.status = x.teks ? "siap" : "kosong";
  }catch(e){
    x.status = "gagal";
    x.galat = (e && e.message) || String(e);
  }
  renderAudioDraf(); perbaruiRingkas(); simpanDrafBahan();
}

/* Video: simpan ASLI, pisahkan jalur SUARA dan jalur GAMBAR. */
async function ukurVideo(blob){
  return new Promise((selesai)=>{
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true; v.src = url;
    let beres = false;
    const akhiri = (nilai)=>{ if (beres) return; beres = true;
      try{ v.removeAttribute("src"); v.load(); }catch(e){}
      URL.revokeObjectURL(url); selesai(nilai); };
    v.onloadedmetadata = ()=> akhiri({durasi:v.duration || 0,
      lebar:v.videoWidth || 0, tinggi:v.videoHeight || 0});
    v.onerror = ()=> akhiri({durasi:0, lebar:0, tinggi:0});
    setTimeout(()=>akhiri({durasi:0, lebar:0, tinggi:0}), 8000);
  });
}

async function tambahVideo(berkas, asal){
  if (!berkas || !berkas.size){
    catatGagalBerkas((berkas && berkas.name) || "video", "berkas kosong");
    return false;
  }
  if (berkas.size > MAKS_VIDEO_BYTE){
    catatGagalBerkas(berkas.name, "lebih dari 300 MB — potong dulu videonya");
    return false;
  }
  const m = await ukurVideo(berkas);
  if (!m.lebar || !m.tinggi){
    catatGagalBerkas(berkas.name, "bukan video yang bisa dibuka peramban ini");
    return false;
  }
  const x = {jenis:"video", nama:berkas.name, blob:berkas, ukuran:berkas.size,
    durasi:m.durasi, lebar:m.lebar, tinggi:m.tinggi,
    suara:"", cuplikan:[], status:"baru", galat:"",
    kunci:idBaru("video"), urut:urutBaru(), asal:asal || "berkas",
    dibuat:new Date().toISOString()};
  bahanVideo.push(x);
  renderAudioDraf(); perbaruiRingkas();
  await simpanDrafBahan();
  return true;
}

/* Jalur SUARA: dekode di peramban → WAV 16 kHz mono → jalur transkripsi yang
   sudah terbukti. Tidak ada ffmpeg dan tidak ada dependensi baru (§4.2). */
async function ambilSuaraVideo(x){
  const wadah = $("#a-berkas-sibuk");
  const s = sibuk(wadah, {label:"Mengambil suara dari video…",
    sub:"Dekode dilakukan di peramban ini, bukan di server."});
  try{
    const d = await dekodeKeMono16(x.blob, {kabar:(p, t)=>s.perbarui({sub:t, persen:p})});
    const wav = wavDariPCM(d.pcm, 0, d.pcm.length);
    s.hapus();
    const nama = x.nama.replace(/\.[^.]+$/, "") + " (suara video).wav";
    const ok = await tambahAudioDraf(wav, nama, "audio", wadah);
    if (ok){
      const baru = audioDraf[audioDraf.length - 1];
      if (baru) x.suara = baru.kunci;
      x.status = "suara-siap";
      umumkan("Suara video diambil. Ubah menjadi tulisan dari kartu audio itu.");
    }
  }catch(e){
    x.galat = (e && e.message) || String(e);
    s.gagal("Suara video tidak bisa diambil.", x.galat.slice(0, 140));
    setTimeout(()=>s.hapus(), 2600);
  }
  renderAudioDraf(); perbaruiRingkas(); simpanDrafBahan();
}

/* Jalur GAMBAR: <video> + <canvas>, pengguna MEMILIH waktunya sendiri. */
function dialogCuplikan(x){
  const id = "cu-video";
  dialogTampil(
    "<h3>Pilih gambar dari video — " + esc(x.nama) + "</h3>" +
    "<p class='kcil'>Langkah ini <strong>opsional</strong>: suara video sudah bisa " +
    "diubah menjadi tulisan tanpa memilih gambar. Geser ke bagian yang ingin " +
    "disertakan, lalu tekan Ambil gambar. Yang disimpan hanya bingkai pada detik " +
    "itu, bukan seluruh video. Batas <strong>" + MAKS_CUPLIKAN + " gambar dari " +
    "video</strong> untuk satu video.</p>" +
    "<video id='" + id + "' controls preload='metadata' style='width:100%;border-radius:10px;" +
    "background:#000' src='" + urlAman(x, "_url") + "'></video>" +
    "<p class='kcil' id='cu-waktu' style='margin:8px 0 0'>0:00 / " +
      waktuPemutar(x.durasi) + "</p>" +
    "<div class='baris-ambil' style='margin-top:8px'>" +
      "<button class='kecil' id='cu-ambil' type='button'>Ambil gambar</button>" +
      "<span class='kcil' id='cu-status'>" +
      x.cuplikan.length + " dari " + MAKS_CUPLIKAN + " gambar tersimpan.</span></div>" +
    "<div id='cu-daftar' class='cu-daftar'></div>",
    [{label:"Tutup", ndua:true}]);
  const v = document.getElementById(id);
  const st = document.getElementById("cu-status");
  const wt = document.getElementById("cu-waktu");
  const daftar = document.getElementById("cu-daftar");
  const gambarDaftar = ()=>{
    daftar.innerHTML = "";
    x.cuplikan.forEach((c, i)=>{
      const f = document.createElement("figure");
      f.className = "cu-item";
      const img = document.createElement("img");
      img.src = c.url || (c.url = URL.createObjectURL(c.blob));
      img.alt = "Gambar dari video pada " + waktuPemutar(c.waktu);
      const cap = document.createElement("figcaption");
      cap.className = "kcil";
      cap.textContent = waktuPemutar(c.waktu);
      const buang = document.createElement("button");
      buang.type = "button"; buang.className = "kecil ndua";
      buang.textContent = "Lepas";
      buang.onclick = ()=>{
        x.cuplikan.splice(i, 1);
        gambarDaftar(); perbaruiRingkas(); simpanDrafBahan(); renderAudioDraf();
        if (st) st.textContent = x.cuplikan.length + " dari " + MAKS_CUPLIKAN +
          " gambar tersimpan.";
      };
      f.appendChild(img); f.appendChild(cap); f.appendChild(buang);
      daftar.appendChild(f);
    });
  };
  gambarDaftar();
  if (v){
    v.ontimeupdate = ()=>{ if (wt) wt.textContent = waktuPemutar(v.currentTime) +
      " / " + waktuPemutar(x.durasi || v.duration); };
    v.addEventListener("loadedmetadata", ()=>{
      if (!x.durasi && isFinite(v.duration)) x.durasi = v.duration;
      if (wt) wt.textContent = waktuPemutar(v.currentTime || 0) + " / " +
        waktuPemutar(x.durasi || v.duration);
    }, {once:true});
  }
  const tombol = document.getElementById("cu-ambil");
  if (tombol) tombol.onclick = async ()=>{
    if (!v) return;
    if (x.cuplikan.length >= MAKS_CUPLIKAN){
      if (st) st.textContent = "Batas " + MAKS_CUPLIKAN + " gambar dari video " +
        "tercapai. Lepas salah satu dulu.";
      return;
    }
    const waktu = v.currentTime || 0;
    if (!v.videoWidth){
      if (st) st.textContent = "Bingkai belum siap — tunggu video tampil dulu.";
      return;
    }
    const c = document.createElement("canvas");
    const skala = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * skala);
    c.height = Math.round(v.videoHeight * skala);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.78));
    if (!blob){ if (st) st.textContent = "Bingkai gagal disimpan."; return; }
    x.cuplikan.push({waktu, blob, url:""});
    gambarDaftar(); perbaruiRingkas(); simpanDrafBahan(); renderAudioDraf();
    if (st) st.textContent = x.cuplikan.length + " dari " + MAKS_CUPLIKAN +
      " gambar tersimpan.";
  };
}

/* ============================================================
   KAMERA DI DALAM HALAMAN (Direktif #12 §B)
   Kenapa ada: tombol "Rekam Video" dan "Ambil Foto" dulu hanya menekan
   `<input type="file" capture="environment">`. Di peramban desktop atribut
   `capture` DIABAIKAN, jadi yang terbuka File Explorer — bukan kamera.
   Terukur 4 Nov 2026: seluruh berkas hanya punya SATU getUserMedia, yaitu
   untuk mikrofon; tidak ada getUserMedia({video}) sama sekali.

   Sekarang: pratinjau kamera di dalam halaman. Hasil masuk lewat jalur bahan
   yang SUDAH ada (tambahBanyakBerkas → tambahVideo / tambahFoto), jadi nama,
   jenis, urutan, dan status tidak dibuat ulang.

   Tiga janji yang diukur, bukan diklaim:
     · foto TIDAK meminta mikrofon (constraints tanpa audio);
     · setiap jalan keluar (Pakai / Batal / tutup panel / pindah hash /
       pagehide) menghentikan SEMUA track → readyState "ended";
     · izin ditolak / kamera tidak ada → alasan terbaca + tombol berkas di
       tempat yang sama, bukan pratinjau kosong tanpa keterangan.
   ============================================================ */
const kamera = { mode:"", aliran:null, perekam:null, blok:[], berkas:null,
                 hasilUrl:"", merekam:false, mulaiMs:0, buang:false, bersih:null };
/* Jejak ukur: dipakai uji untuk membuktikan track benar-benar berhenti.
   Hanya-baca; tidak mengubah perilaku aplikasi. */
const kameraJejak = [];
function kameraTrek(){
  const t = kamera.aliran ? kamera.aliran.getTracks() : [];
  return t.map(x=>({jenis:x.kind, nyala:x.readyState}));
}
function kameraCatat(aksi, ekstra){
  const baris = {aksi:aksi, waktu:new Date().toISOString(), mode:kamera.mode};
  if (ekstra) for (const k in ekstra) baris[k] = ekstra[k];
  kameraJejak.push(baris);
  if (kameraJejak.length > 40) kameraJejak.shift();
}
window.__kamera = {
  status: ()=>({mode:kamera.mode, aktif:!!kamera.aliran, merekam:!!kamera.merekam,
                trek:kameraTrek()}),
  jejak: ()=>kameraJejak.slice()
};

/* Menghentikan SEMUA track. Dipanggil di setiap jalan keluar, bukan hanya
   saat pengguna menekan Batal — kamera yang menyala setelah panel ditutup
   adalah privasi yang bocor. */
function kameraHentikan(aksi){
  const t = kamera.aliran ? kamera.aliran.getTracks() : [];
  t.forEach(x=>{ try{ x.stop(); }catch(e){} });
  const sesudah = t.map(x=>({jenis:x.kind, nyala:x.readyState}));
  kamera.aliran = null;
  kameraCatat(aksi || "hentikan", {jumlahTrek:t.length, sesudah:sesudah});
  return sesudah;
}
function kameraTutup(aksi){
  kamera.buang = true;
  if (kamera.perekam){
    try{ if (kamera.perekam.state !== "inactive") kamera.perekam.stop(); }catch(e){}
  }
  kamera.perekam = null; kamera.blok = []; kamera.merekam = false; kamera.berkas = null;
  const trek = kameraHentikan(aksi);
  if (kamera.hasilUrl){ try{ URL.revokeObjectURL(kamera.hasilUrl); }catch(e){} }
  kamera.hasilUrl = "";
  kamera.mode = "";
  kamera.bersih = null;
  return trek;
}
dlg.addEventListener("close", ()=>{
  const f = kamera.bersih;
  kamera.bersih = null;
  if (f) try{ f(); }catch(e){}
});
/* Pindah halaman dan halaman ditinggalkan: dua jalan keluar yang TIDAK lewat
   tombol mana pun, jadi harus ditangani sendiri. Panelnya ikut ditutup supaya
   tidak ada pratinjau yang tertinggal di halaman lain. */
function kameraTutupPindah(aksi){
  if (!kamera.mode && !kamera.aliran && !kamera.perekam) return;
  kameraTutup(aksi);
  try{ if (dlg.open) dlg.close(); }catch(e){}
}
window.addEventListener("hashchange", ()=>kameraTutupPindah("pindah-halaman"));
window.addEventListener("pagehide", ()=>kameraTutupPindah("pagehide"));

function alasanKamera(e){
  const n = (e && e.name) || "";
  const arti = {
    NotAllowedError:"izin kamera ditolak atau diblokir pengaturan peramban",
    PermissionDeniedError:"izin kamera ditolak",
    NotFoundError:"tidak ada kamera yang terpasang di perangkat ini",
    DevicesNotFoundError:"tidak ada kamera yang terpasang di perangkat ini",
    NotReadableError:"kamera sedang dipakai aplikasi lain",
    TrackStartError:"kamera sedang dipakai aplikasi lain",
    OverconstrainedError:"kamera tidak mendukung mode yang diminta",
    ConstraintNotSatisfiedError:"kamera tidak mendukung mode yang diminta",
    SecurityError:"halaman ini tidak diizinkan memakai kamera",
    NotSupportedError:"peramban ini tidak menyediakan akses kamera di dalam halaman",
    AbortError:"kamera gagal dimulai"
  }[n];
  if (arti) return arti + " (" + n + ")";
  return "kamera tidak bisa dipakai (" + (n || (e && e.message) || String(e)) + ")";
}
function mimeRekamVideo(){
  const calon = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus",
                 "video/webm", "video/mp4"];
  for (const m of calon){
    try{ if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; }
    catch(e){}
  }
  return "";
}
function capWaktu(){
  return new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
}

async function dialogKamera(mode){
  const video = mode !== "foto";
  const namaBerkas = video ? "Pilih Video" : "Pilih Foto";
  kamera.mode = mode; kamera.berkas = null; kamera.blok = [];
  kamera.merekam = false; kamera.buang = false; kamera.hasilUrl = "";
  const kendali = video
    ? "<button class='kecil' id='kam-mulai' type='button'>Mulai Rekam</button>" +
      "<button class='kecil ndua' id='kam-berhenti' type='button' disabled>Berhenti</button>" +
      "<button class='kecil' id='kam-pakai' type='button' disabled>Pakai Video</button>"
    : "<button class='kecil' id='kam-ambil' type='button'>Ambil Foto</button>" +
      "<button class='kecil ndua' id='kam-ulangi' type='button' disabled>Ulangi</button>" +
      "<button class='kecil' id='kam-pakai' type='button' disabled>Pakai Foto</button>";
  dialogTampil(
    "<h3>" + (video ? "Rekam video" : "Ambil foto") + " — kamera perangkat ini</h3>" +
    "<p class='kcil' id='kam-pesan'>Menyiapkan kamera… Bila peramban bertanya, izinkan " +
      "kamera" + (video ? " dan mikrofon" : " (mikrofon tidak diminta)") + ".</p>" +
    "<video id='kam-pratinjau' playsinline muted autoplay " +
      "style='width:100%;max-height:46vh;border-radius:10px;background:#000;display:block'></video>" +
    "<img id='kam-hasil' alt='Hasil kamera' hidden " +
      "style='width:100%;max-height:46vh;border-radius:10px;display:block'>" +
    "<div class='baris-ambil' id='kam-kendali' style='margin-top:8px'>" + kendali + "</div>" +
    "<p class='kcil' id='kam-status' role='status'></p>" +
    "<p class='kcil' id='kam-cadangan'>Kamera tidak bisa dipakai? " +
      "<button class='kecil ndua' id='kam-berkas' type='button'>" + namaBerkas +
      "</button> — berkas yang sudah ada di perangkat tidak perlu izin kamera.</p>" +
    (video ? "<p class='kcil' id='kam-batas'>Batas 300 MB per video. Rekaman dari kamera " +
      "masuk sebagai satu video; gambar dari video dipilih setelahnya (opsional, " +
      "maksimal " + MAKS_CUPLIKAN + ").</p>" : ""),
    [{label:"Batal", ndua:true}]);
  kamera.bersih = ()=>kameraTutup("panel-ditutup");

  const pv = $("#kam-pratinjau"), hs = $("#kam-hasil");
  const pesan = $("#kam-pesan"), st = $("#kam-status");
  const bMulai = $("#kam-mulai"), bStop = $("#kam-berhenti"), bAmbil = $("#kam-ambil");
  const bUlang = $("#kam-ulangi"), bPakai = $("#kam-pakai"), bBerkas = $("#kam-berkas");
  const berkasMasuk = video ? $("#v-berkas") : $("#f-berkas");
  if (bBerkas) bBerkas.onclick = ()=>{ kameraTutup("pilih-berkas"); dlg.close();
    if (berkasMasuk) berkasMasuk.click(); };

  let aliran = null;
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      const e = new Error("navigator.mediaDevices tidak tersedia");
      e.name = "NotSupportedError";
      throw e;
    }
    /* FOTO: hanya video — mikrofon TIDAK diminta. Dua izin berbeda; meminta
       mikrofon untuk memotret membuat pengguna menolak keduanya. */
    aliran = await navigator.mediaDevices.getUserMedia(
      video ? {video:{facingMode:"environment"}, audio:true}
            : {video:{facingMode:"environment"}});
  }catch(e){
    const alasan = alasanKamera(e);
    if (pv) pv.hidden = true;
    if (pesan) pesan.innerHTML = "<strong>Kamera tidak terbuka.</strong> " + esc(alasan) + ".";
    if (st) st.textContent = "Tidak ada pratinjau karena kamera tidak terbuka. " +
      "Pilih berkas lewat tombol " + namaBerkas + " di bawah — berkas tidak perlu izin kamera.";
    [bMulai,bStop,bAmbil,bUlang,bPakai].forEach(b=>{ if (b) b.disabled = true; });
    if (bBerkas) bBerkas.className = "kecil";
    kameraCatat("izin-gagal", {nama:(e && e.name) || "", alasan:alasan});
    return;
  }
  kamera.aliran = aliran;
  const trekAudio = aliran.getAudioTracks().length;
  kameraCatat("izin-diberi", {trek:kameraTrek(), audio:trekAudio});
  if (pv){ pv.srcObject = aliran; try{ await pv.play(); }catch(e){} }
  if (pesan) pesan.textContent = video
    ? "Pratinjau kamera. Tekan Mulai Rekam; suara ikut direkam."
    : "Pratinjau kamera. Arahkan ke slide atau halaman buku, lalu tekan Ambil Foto.";

  if (video && bMulai){
    bMulai.onclick = ()=>{
      const mime = mimeRekamVideo();
      let rec;
      try{ rec = mime ? new MediaRecorder(aliran, {mimeType:mime}) : new MediaRecorder(aliran); }
      catch(e){
        if (st) st.textContent = "Perekaman video tidak didukung peramban ini (" +
          ((e && e.message) || e) + "). Gunakan " + namaBerkas + ".";
        return;
      }
      kamera.perekam = rec; kamera.blok = []; kamera.berkas = null;
      kamera.buang = false; kamera.mulaiMs = Date.now();
      rec.ondataavailable = e=>{ if (e.data && e.data.size) kamera.blok.push(e.data); };
      rec.onstop = ()=>{
        const potongan = kamera.blok.slice(); kamera.blok = [];
        kamera.merekam = false;
        if (bStop) bStop.disabled = true;
        if (bMulai) bMulai.disabled = false;
        if (kamera.buang) return;
        const tipe = String(rec.mimeType || "video/webm").split(";")[0];
        const blob = new Blob(potongan, {type:tipe});
        if (!blob.size){
          if (st) st.textContent = "Rekaman kosong — tidak ada yang disimpan.";
          return;
        }
        const detik = Math.max(0, Math.round((Date.now() - kamera.mulaiMs) / 1000));
        const ext = tipe.indexOf("mp4") >= 0 ? ".mp4" : ".webm";
        kamera.berkas = new File([blob], "video-kamera-" + capWaktu() + ext,
          {type:tipe, lastModified:Date.now()});
        if (bPakai) bPakai.disabled = false;
        if (st) st.textContent = "Rekaman siap: " + detik + " detik, " +
          (blob.size / 1048576).toFixed(1) + " MB. Tekan Pakai Video untuk memasukkan " +
          "ke daftar bahan, atau Mulai Rekam untuk merekam ulang.";
        kameraCatat("rekaman-siap", {detik:detik, byte:blob.size, tipe:tipe});
      };
      try{ rec.start(1000); }
      catch(e){
        if (st) st.textContent = "Perekaman tidak bisa dimulai (" + ((e && e.message) || e) + ").";
        return;
      }
      kamera.merekam = true;
      bMulai.disabled = true;
      if (bStop) bStop.disabled = false;
      if (bPakai) bPakai.disabled = true;
      if (st) st.textContent = "Merekam… tekan Berhenti bila sudah cukup.";
      kameraCatat("rekam-mulai", {mime:mime || "(bawaan peramban)"});
    };
  }
  if (video && bStop){
    bStop.onclick = ()=>{
      if (!kamera.perekam) return;
      try{ kamera.perekam.stop(); }catch(e){}
      if (st) st.textContent = "Menyelesaikan rekaman…";
      kameraCatat("rekam-berhenti");
    };
  }
  if (!video && bAmbil){
    bAmbil.onclick = async ()=>{
      if (!pv || !pv.videoWidth){
        if (st) st.textContent = "Gambar belum siap — tunggu pratinjau tampil.";
        return;
      }
      const c = document.createElement("canvas");
      const skala = Math.min(1, 2000 / Math.max(pv.videoWidth, pv.videoHeight));
      c.width = Math.round(pv.videoWidth * skala);
      c.height = Math.round(pv.videoHeight * skala);
      c.getContext("2d").drawImage(pv, 0, 0, c.width, c.height);
      const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.9));
      if (!blob){ if (st) st.textContent = "Gambar gagal disimpan."; return; }
      kamera.berkas = new File([blob], "foto-kamera-" + capWaktu() + ".jpg",
        {type:"image/jpeg", lastModified:Date.now()});
      if (kamera.hasilUrl){ try{ URL.revokeObjectURL(kamera.hasilUrl); }catch(e){} }
      kamera.hasilUrl = URL.createObjectURL(blob);
      if (hs){ hs.src = kamera.hasilUrl; hs.hidden = false; }
      if (pv) pv.hidden = true;
      bAmbil.disabled = true;
      if (bUlang) bUlang.disabled = false;
      if (bPakai) bPakai.disabled = false;
      if (st) st.textContent = "Foto diambil (" + c.width + "×" + c.height +
        " piksel). Tekan Pakai Foto bila sudah pas, atau Ulangi.";
      kameraCatat("foto-diambil", {lebar:c.width, tinggi:c.height, byte:blob.size});
    };
  }
  if (!video && bUlang){
    bUlang.onclick = ()=>{
      if (hs) hs.hidden = true;
      if (pv) pv.hidden = false;
      bAmbil.disabled = false; bUlang.disabled = true;
      if (bPakai) bPakai.disabled = true;
      kamera.berkas = null;
      if (st) st.textContent = "Pratinjau kamera. Tekan Ambil Foto bila sudah pas.";
    };
  }
  if (bPakai){
    bPakai.onclick = async ()=>{
      const f = kamera.berkas;
      if (!f){
        if (st) st.textContent = "Belum ada " + (video ? "rekaman" : "foto") +
          " yang bisa dipakai.";
        return;
      }
      kamera.berkas = null;
      bPakai.disabled = true;
      /* Track dihentikan SEBELUM bahan masuk: kamera tidak perlu menyala
         selama berkas diproses, dan pengguna melihat lampu kamera padam
         begitu menekan Pakai. */
      kameraTutup("pakai");
      dlg.close();
      await tambahBanyakBerkas([f]);
    };
  }
}

    };
    r = {li}; liPerBahan.set(x, r);

  r.li.querySelector('[data-isi="info"]').textContent =
    [ukuranManusia(x.ukuran), durasiManusia(x.durasi),
     x.lebar + "×" + x.tinggi].filter(Boolean).join(" · ");
  const v = r.li.querySelector(".video-mini");
  const u = urlAman(x, "_url");
  if (v && u && v.getAttribute("src") !== u){
    v.src = u;
    /* WebM hasil rekaman peramban sering TIDAK membawa durasi di metadata
       (durasi = Infinity/NaN), sehingga info menampilkan "--:--". Begitu
       elemen video benar-benar tahu durasinya, nilainya dipakai. */
    v.addEventListener("loadedmetadata", ()=>{
      const d = v.duration;
      if (isFinite(d) && d > 0 && Math.abs((x.durasi || 0) - d) > 0.5){
        x.durasi = d;
        const info = r.li.querySelector('[data-isi="info"]');
        if (info) info.textContent = [ukuranManusia(x.ukuran), durasiManusia(d),
          x.lebar + "×" + x.tinggi].filter(Boolean).join(" · ");
      }
    }, {once:true});
  }
  /* Dua jalur DIPISAH dan disebut apa adanya (§4.2, §4.4). */
  const trAda = audioDraf.some(a=>a.kunci === x.suara &&
    a.tr && (a.tr.mentah || "").trim());
  const adaGambar = x.cuplikan.length > 0;
  const st = r.li.querySelector('[data-isi="status"]');
  let pesan;
  if (trAda && !adaGambar)
    pesan = "Suara sudah ditranskripsikan. Gambar video belum diperiksa.";
  else if (trAda && adaGambar)
    pesan = "Suara sudah ditranskripsikan. " + x.cuplikan.length +
      " gambar dari video dipilih dan akan ikut bila Anda memilih Sertakan gambar sumber.";
  else if (!trAda && adaGambar)
    pesan = x.cuplikan.length + " gambar dari video dipilih. Suaranya belum " +
      "ditranskripsikan — tekan Ambil suara.";
  else
    pesan = "Belum diproses. Ambil suaranya (transkripsi) dan/atau pilih " +
      "gambar dari video (opsional).";
  st.textContent = pesan + (x.galat ? " (" + x.galat + ")" : "");
  st.className = "kcil" + (x.galat ? " gagal" : "");
  return r.li;
}

/* ============================================================
   BANYAK TAUTAN DRIVE (§6.4)
   Satu tautan per baris, antrean dengan konkurensi TERBATAS, dan status
   per tautan. Satu tautan gagal TIDAK menghapus bahan lain dan tidak
   menghentikan antrean. Batas laju server tetap berlaku (429) dan
   dilaporkan apa adanya, bukan disembunyikan.
   ============================================================ */
const ANTRE_DRIVE_PARALEL = 3;

function tautanDrive(teks){
  const keluar = [];
  for (const b of String(teks || "").split(/[\s,]+/)){
    const t = b.trim();
    if (!/^https?:\/\//i.test(t)) continue;
    if (!keluar.includes(t)) keluar.push(t);
  }
  return keluar;
}
function barisAntre(url){
  const li = document.createElement("li");
  const st = document.createElement("span");
  st.className = "st menunggu"; st.textContent = "menunggu";
  const u = document.createElement("span");
  u.className = "url"; u.textContent = url; u.title = url;
  const ket = document.createElement("span");
  ket.className = "st menunggu"; ket.textContent = "";
  li.appendChild(st); li.appendChild(u); li.appendChild(ket);
  return li;
}
function statusAntre(li, kelas, label, ket){
  const st = li.querySelector(".st");
  if (st){ st.className = "st " + kelas; st.textContent = label; }
  const k = li.querySelectorAll(".st")[1];
  if (k && ket !== undefined) k.textContent = ket;
}

async function ambilDriveBanyak(urls, tombol){
  const stD = $("#d-status");
  const antre = $("#d-antre");
  if (antre) antre.innerHTML = "";
  const baris = urls.map(u=>{
    const li = barisAntre(u);
    if (antre) antre.appendChild(li);
    return li;
  });
  const s = sibuk($("#d-sibuk"), {label:"Mengambil berkas dari Google Drive",
    sub:"0 dari " + urls.length + " selesai", persen:0});
  if (tombol) tombol.disabled = true;
  let i = 0, nOk = 0, nGagal = 0, nSelesai = 0;
  /* Tautan yang BERHASIL dibuang dari kolom, yang GAGAL ditinggal — supaya
     "Ambil Semua" berikutnya hanya mengulang yang belum masuk (tidak
     menggandakan bahan yang sudah tersimpan, dan tidak memaksa mengetik ulang
     tautan yang perlu izin). */
  const berhasil = new Set();
  const kabar = ()=>{
    nSelesai = nOk + nGagal;
    s.perbarui({sub:nSelesai + " dari " + urls.length + " selesai",
      persen: Math.round(100 * nSelesai / urls.length)});
  };
  const kerja = async ()=>{
    while (i < urls.length){
      const k = i++;
      const url = urls[k], li = baris[k];
      statusAntre(li, "jalan", "mengambil", "");
      try{
        const r = await fetch("/api/ambil-drive?url=" + encodeURIComponent(url));
        let j = {};
        try{ j = await r.json(); }catch(e){ j = {}; }
        if (!j.ok){
          nGagal++;
          const izin = j.kode === "perlu-izin";
          statusAntre(li, "gagal", izin ? "perlu izin" : "gagal",
            (j.status_pesan || "gagal diambil").slice(0, 90));
          kabar();
          continue;
        }
        if (j.jenis === "teks"){
          bahanTeks.push({jenis:"teks", nama:j.nama || "Drive", teks:j.teks || "",
            kunci:idBaru("bahan"), urut:urutBaru(), asal:"drive",
            dibuat:new Date().toISOString()});
          nOk++; berhasil.add(url);
          statusAntre(li, "ok", "tersimpan",
            ((j.ukuran || 0).toLocaleString("id")) + " karakter");
          renderAudioDraf(); perbaruiRingkas();
        } else if (j.jenis === "audio"){
          const bin = Uint8Array.from(atob(j.isi_b64 || ""), c=>c.charCodeAt(0));
          const blob = new Blob([bin], {type: j.mime || "audio/mpeg"});
          const ok = await tambahAudioDraf(blob, (j.nama || "Drive") + ".audio",
            "audio", null);
          if (ok){
            nOk++; berhasil.add(url);
            const baru = audioDraf[audioDraf.length - 1];
            if (baru) baru.asal = "drive";
            statusAntre(li, "ok", "tersimpan", ukuranManusia(blob.size));
          } else {
            nGagal++;
            statusAntre(li, "gagal", "gagal", "audio tidak bisa dibuka");
          }
        } else {
          nGagal++;
          statusAntre(li, "gagal", "gagal",
            (j.status_pesan || "jenis berkas tidak didukung").slice(0, 90));
        }
      }catch(e){
        nGagal++;
        statusAntre(li, "gagal", "gagal",
          ("tidak tersambung: " + ((e && e.message) || e)).slice(0, 90));
      }
      kabar();
    }
  };
  await Promise.all(Array.from({length: Math.min(ANTRE_DRIVE_PARALEL, urls.length)},
    ()=>kerja()));
  await simpanDrafBahan();
  renderAudioDraf(); perbaruiRingkas();
  if (tombol) tombol.disabled = false;
  const kolom = $("#d-url");
  if (kolom && berhasil.size){
    const sisaTautan = urls.filter(u => !berhasil.has(u));
    kolom.value = sisaTautan.join("\n");
  }
  const pesan = nOk + " tersimpan" + (nGagal ? ", " + nGagal + " gagal" : "") +
    " dari " + urls.length + " tautan.";
  if (stD) stD.textContent = pesan;
  if (nGagal) s.gagal("Sebagian tautan gagal.", pesan);
  else s.selesai(pesan);
  setTimeout(()=>s.hapus(), 2600);
  umumkan("Drive: " + pesan);
  return {ok:nOk, gagal:nGagal};
}

function initAudio(isi){
  const f = $("#a-berkas");
  if (f) f.onchange = async ()=>{
    const daftar = Array.from(f.files || []);
    f.value = "";                       // supaya berkas yang sama bisa dipilih lagi
    if (!daftar.length) return;
    await tambahBanyakBerkas(daftar);
  };
  const fLagi = $("#a-berkas-lagi");
  if (fLagi) fLagi.onclick = ()=>{ if (f) f.click(); };
  /* --- FOTO: kamera (pratinjau di halaman) + pilih berkas. Izin kamera
         diminta SETELAH pengguna menekan tombolnya (§3.6), bukan saat halaman
         dibuka. Jalur berkas selalu tersedia dan tidak pernah disembunyikan. --- */
  const fFoto = $("#f-berkas");
  if (fFoto) fFoto.onchange = async ()=>{
    const daftar = Array.from(fFoto.files || []);
    fFoto.value = "";
    if (daftar.length) await tambahBanyakBerkas(daftar.slice(0, MAKS_FOTO_SEKALI));
  };
  const fFotoLagi = $("#f-berkas-lagi");
  if (fFotoLagi) fFotoLagi.onclick = ()=>{ if (fFoto) fFoto.click(); };
  /* `#f-kamera-masuk` (input capture) DIPERTAHANKAN hanya sebagai cadangan
     ponsel: peramban lama yang tidak punya getUserMedia masih bisa membuka
     kamera sistem. Tombol kamera TIDAK lagi menekannya — itulah cacat yang
     diperbaiki (di desktop `capture` diabaikan, jadi File Explorer terbuka). */
  const fKam = $("#f-kamera-masuk");
  const bKam = $("#f-kamera");
  if (bKam) bKam.onclick = ()=>dialogKamera("foto");
  if (fKam) fKam.onchange = async ()=>{
    const daftar = Array.from(fKam.files || []);
    fKam.value = "";
    if (daftar.length) await tambahBanyakBerkas(daftar);
  };
  /* --- VIDEO: berkas atau rekaman kamera --- */
  const fVid = $("#v-berkas");
  if (fVid) fVid.onchange = async ()=>{
    const daftar = Array.from(fVid.files || []);
    fVid.value = "";
    if (daftar.length) await tambahBanyakBerkas(daftar);
  };
  const fVidLagi = $("#v-berkas-lagi");
  if (fVidLagi) fVidLagi.onclick = ()=>{ if (fVid) fVid.click(); };
  const vKam = $("#v-kamera-masuk");
  const bVidKam = $("#v-kamera");
  if (bVidKam) bVidKam.onclick = ()=>dialogKamera("video");
  if (vKam) vKam.onchange = async ()=>{
    const daftar = Array.from(vKam.files || []);
    vKam.value = "";
    if (daftar.length) await tambahBanyakBerkas(daftar);
  };
  renderRekam();
  const tDrive = $("#d-ambil");
  if (tDrive) tDrive.onclick = async ()=>{
    const stD = $("#d-status");
    const kolom = $("#d-url");
    const urls = tautanDrive((kolom && kolom.value) || "");
    if (!urls.length){
      stD.textContent = "Tempel minimal satu tautan Google Drive (satu per baris).";
      if (kolom) kolom.focus();
      return;
    }
    await ambilDriveBanyak(urls, tDrive);
  };
}
let lajuTimer = null, lajuT0 = 0;
function tampilkanLaju(baca, susun, siap){
  const el = $("#laju"); if (!el) return;
  el.hidden = false;
  const k = (nama, kelas) => `<span class="tahap ${kelas||""}">` +
    (kelas === "jalan" ? '<span class="cakra" aria-hidden="true"></span>' : "") +
    esc(nama) + `</span>`;
  el.innerHTML = k("Membaca bahan", baca) + k("Menyusun catatan", susun) +
    k("Menyiapkan hasil", siap) + '<span class="kcil laju-waktu"></span>';
  const waktu = el.querySelector(".laju-waktu");
  const jalan = [baca, susun, siap].includes("jalan");
  if (jalan && !lajuTimer){
    lajuT0 = Date.now();
    lajuTimer = setInterval(()=>{
      if (!waktu) return;
      const d = Math.floor((Date.now() - lajuT0) / 1000);
      waktu.textContent = Math.floor(d/60) + ":" + String(d%60).padStart(2,"0") +
        (d >= 20 ? " · jangan tutup halaman ini" : "");
    }, 1000);
    if (waktu) waktu.textContent = "0:00";
  } else if (!jalan && lajuTimer){
    clearInterval(lajuTimer); lajuTimer = null;
    if (waktu && lajuT0){
      const d = Math.floor((Date.now() - lajuT0) / 1000);
      waktu.textContent = "selesai dalam " + Math.floor(d/60) + ":" +
        String(d%60).padStart(2,"0");
    }
  }
}

  dialogTampil(

    "bukan sumber primer.</p>" +
    '<div class="pilih-catatan-daftar">' + baris + "</div>" +
    "<fieldset class='pilih-jenis'><legend class='kcil'>Yang diambil</legend>" +
    "<label><input type='checkbox' name='jenis' value='sumber' checked> Sumber teks asli</label>" +
    "<label><input type='checkbox' name='jenis' value='transkrip'> Transkrip mentah</label>" +
    "<label><input type='checkbox' name='jenis' value='hasil'> Hasil AI lama (ditandai turunan)</label>" +
    "</fieldset>" +
    "<p class='kcil' id='ambil-status'></p>",
    [{label:"Batal", ndua:true},
     {label:"Buat catatan baru", aksi:()=>ambilDariCatatan()}]);

async function ambilDariCatatan(){
  const w = $("#dlg-isi");
  if (!w) return;
  const ids = [...w.querySelectorAll('input[name="acara"]:checked')].map(i=>i.value);
  const jenis = new Set([...w.querySelectorAll('input[name="jenis"]:checked')]
    .map(i=>i.value));
  if (!ids.length){
    umumkan("Belum ada catatan yang dipilih.");
    return;
  }
  if (!jenis.size){
    umumkan("Pilih minimal satu hal yang diambil.");
    return;
  }
  const a = acaraBaru({judul:"Gabungan " + ids.length + " catatan", jenis:"Kelas"});
  a.asalCatatan = ids.slice();
  a.turunan = [];
  const rapat = s => String(s || "").replace(/\s+/g, " ").trim();
  for (const id of ids){
    let lama = null;
    try{ lama = await dbAmbil("acara", id); }catch(e){ lama = null; }
    if (!lama) continue;
    const judul = lama.judul || "Catatan";
    if (jenis.has("sumber")){
      for (const s of (lama.sumber || [])){
        if (s.jenis !== "teks" || !rapat(s.teks)) continue;
        a.sumber.push({id:idBaru("sum"), jenis:"teks",
          nama:judul + " — " + (s.nama || "sumber"), teks:s.teks,
          ukuran:(s.teks || "").length, dibuat:new Date().toISOString(),
          bagian:null, dariCatatan:lama.id, turunan:false});
      }
    }
    if (jenis.has("transkrip")){
      for (const s of (lama.sumber || [])){
        if (s.jenis !== "transkrip-mentah" || !rapat(s.teks)) continue;
        a.sumber.push({id:idBaru("sum"), jenis:"teks",
          nama:judul + " — " + (s.nama || "transkrip"), teks:s.teks,
          ukuran:(s.teks || "").length, dibuat:new Date().toISOString(),
          bagian:Array.isArray(s.bagian) ? s.bagian : null,
          dariCatatan:lama.id, turunan:false});
      }
    }
    if (jenis.has("hasil")){
      for (const k of Object.keys(lama.hasil || {})){
        const h = lama.hasil[k];
        if (!h || !rapat(h.teks)) continue;
        a.sumber.push({id:idBaru("sum"), jenis:"teks", turunan:true,
          nama:judul + " — hasil " + k + " (turunan)",
          teks:h.teks, ukuran:(h.teks || "").length,
          dibuat:new Date().toISOString(), bagian:null, dariCatatan:lama.id});
        a.turunan.push({dari:lama.id, jenis:"hasil", kode:k});
      }
    }
  }
  if (!a.sumber.length){
    umumkan("Tidak ada bahan yang bisa diambil dari pilihan itu.");
    return;
  }
  await simpanAcara(a);
  location.hash = "#/acara/" + a.id;
  umumkan("Catatan baru dibuat dari " + ids.length + " catatan. " +
    a.sumber.length + " bahan masuk, " + a.turunan.length + " di antaranya turunan.");
}

let catatanJalan = false;
/* Judul yang bisa dipakai tanpa memaksa pengguna mengisi apa pun lebih dulu.
   Diambil dari bahan yang benar-benar ada — bukan dikarang. */
function judulOtomatis(){
  const x = rekamItemTerakhir();
  const d = new Date();
  const tgl = d.toLocaleDateString("id-ID", {day:"numeric", month:"short", year:"numeric"});
  if (x) return "Rekaman " + tgl;
  if (bahanVideo.length) return "Video " + tgl;
  if (bahanFoto.length) return "Foto " + tgl;
  if (bahanTeks.length) {
    const awal = (bahanTeks[0].teks || "").replace(/\s+/g, " ").trim().slice(0, 48);
    if (awal) return awal + (bahanTeks[0].teks.length > 48 ? "…" : "");
  }
  return "Catatan " + tgl;
}

/* Mengubah SEMUA rekaman yang belum bertulisan menjadi tulisan, dengan nama
   tahap yang terlihat. Mengembalikan {ok, gagal:[{x, sebab, parsial}]}. */
async function transkripsiSemua(daftar){
  const gagal = [];
  for (let i = 0; i < daftar.length; i++){
    const x = daftar[i];
    const awalan = daftar.length > 1 ? " (" + (i + 1) + " dari " + daftar.length + ")" : "";
    tahap("Mengubah suara menjadi tulisan" + awalan + "…");
    const h = await transkripSatu(x, (m)=>{
      const b = /bagian\s+(\d+)\s+dari\s+(\d+)/i.exec(m || "");
      tahap("Mengubah suara menjadi tulisan" + awalan +
        (b ? " · bagian " + b[1] + " dari " + b[2] : ""));
    });
    if (!h.ok) gagal.push({x, sebab:h.sebab || "", parsial:!!h.parsial});
  }
  return {ok: !gagal.length, gagal};
}

/* Langkah 0 setiap kali catatan dibuat: rekaman yang belum bertulisan diubah
   lebih dulu. Pengguna TIDAK diminta menyalin transkrip lalu menempelnya lagi. */
async function siapkanRekamanUntukCatatan(){
  /* Rekaman yang SUDAH dicoba dan gagal tidak dicoba ulang diam-diam: itu
     memboroskan kuota dan membuat pengguna menunggu tanpa sebab baru. */
  const perlu = audioDraf.filter(a=>a.jenis !== "transkrip-mentah" && a.blob
    && !rekamAdaTulisan(a) && !(a.tr && a.tr.galat));
  if (!perlu.length) return {ok:true};
  const h = await transkripsiSemua(perlu);
  tahap("");
  if (h.ok){
    /* Semua berhasil: langsung jadikan bahan supaya rantai berjalan tanpa
       ketukan tambahan. Idempoten — tidak menggandakan. */
    for (const x of perlu) pakaiTranskripOtomatis(x);
    return {ok:true};
  }
  const g = h.gagal[0];
  const parsial = h.gagal.some(z=>z.parsial);
  const sebab = rapikanSebab(g.sebab);
  const pesan = parsial
    ? "Transkripsi baru selesai sebagian (" + sebab + ")."
    : "Tulisan belum selesai dibuat: " + sebab + ".";
  /* §5: transkrip SEBAGIAN tidak boleh dipakai diam-diam sebagai sumber
     lengkap. Tindakan yang diutamakan adalah melanjutkan dari bagian terakhir
     yang sudah tersimpan — karena itu labelnya "Lanjutkan Transkripsi", bukan
     "Coba Lagi" yang terdengar seperti mengulang dari awal. */
  rekamJenisGagal = parsial ? "transkrip-parsial" : "transkrip";
  rekamPesanGagal = pesan + " Rekaman kelas Anda masih tersimpan dan bisa diputar " +
    "atau diunduh.";
  if ($("#blok-rekam") && !$("#blok-rekam").hidden) rekamKeadaanBaru("gagal");
  const ps = $("#buat-pesan"); if (ps) ps.textContent = rekamPesanGagal;
  umumkan(rekamPesanGagal);
  /* Pengguna tetap boleh MELANJUTKAN tanpa tulisan: rekamannya tidak hilang,
     dan catatan bisa dibuka sebagai draf. Tanpa pilihan ini, kegagalan layanan
     AI mengunci pengguna — padahal sebelumnya draf tetap bisa disimpan. */
  const pilih = await new Promise((resolve)=>{
    dialogTampil("<h3>" + (parsial ? "Tulisan baru selesai sebagian"
                                   : "Tulisan belum selesai dibuat") + "</h3>" +
      "<p>" + esc(pesan) + "</p>" +
      (parsial
        ? "<p class='kcil'>Bagian yang belum tercakup: " + esc(sebab) +
          " Bila dilanjutkan, proses berjalan dari bagian terakhir yang sudah " +
          "tersimpan — bagian yang selesai tidak diulang.</p>"
        : "") +
      "<p class='kcil'>Rekaman Anda tetap tersimpan di perangkat ini dan bisa " +
      "diputar atau diunduh. Bila dilanjutkan sekarang, catatan dibuat tanpa " +
      "tulisan — rekamannya tetap ikut tersimpan.</p>",
      [{label: labelTindakanGagal(),
        aksi:()=>resolve("coba")},
       {label:"Lanjut tanpa tulisan", ndua:true, aksi:()=>resolve("lanjut")}]);
  });
  if (pilih === "coba") return await siapkanRekamanUntukCatatan();
  return {ok:true, tanpaTulisan:true};
}

async function buatCatatan(paksa){
  const btn = $("#t-buat");

    pesan.textContent = pesanTeks;

    if (el){ el.scrollIntoView({block:"center"}); try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }
  };

    if (k){ k.scrollIntoView({block:"center"}); k.focus(); }
    return;
  }
  /* 0. Rekaman yang belum bertulisan diubah OTOMATIS di sini. Inilah yang
     menghapus langkah "salin transkrip → kembali ke Beranda → tempel". */
  if (btn) btn.disabled = true;
  const siap = await siapkanRekamanUntukCatatan();
  if (!siap.ok){
    if (btn) btn.disabled = false;
    return;
  }
  /* Judul tidak lagi menjadi penghalang: bila kosong, diisi dari bahan nyata
     dan tetap bisa diubah pengguna. */
  if (!judul){
    judul = judulOtomatis();
    const i = $("#judul");
    if (i) i.value = judul;
  }
  /* Sebagian bahan belum siap: SEBUTKAN yang mana, lalu biarkan pengguna
     memilih menunggu atau lanjut tanpa itu (§8). Tidak ada yang dibuang. */
  const belum = bahanBelumSiap();
  /* Pengguna yang sudah memilih "Lanjut tanpa tulisan" tidak ditanya lagi:
     dua dialog berurutan untuk keputusan yang sama adalah jebakan. */
  if (belum.length && paksa !== true && !siap.tanpaTulisan){
    dialogTampil("<h3>Sebagian bahan belum siap</h3>" +
      "<p>Yang belum siap: <strong>" + esc(belum.join(", ")) + "</strong>.</p>" +
      "<p>Bila dilanjutkan sekarang, bahan yang belum siap TIDAK ikut diproses — " +
      "bahan itu tetap tersimpan dan bisa dipakai pada hasil berikutnya.</p>",
      [{label:"Tunggu dulu", ndua:true},
       {label:"Lanjut tanpa itu", aksi:()=>buatCatatan(true)}]);
    return;
  }
  const konteksD = ($("#konteks-d").value || "").trim();
  const a = acaraBaru({judul, jenis:$("#jenis").value, tanggal:$("#tanggal").value, pemateri:$("#pemateri").value});
  /* Diambil SEBELUM daftar dikosongkan: satu teks per kelompok (rekaman +
     transkripnya = satu), dan transkrip tidak pernah dikirim dua kali. */
  const kelompokAI = pilihTeksUntukAI();
  for (const x of bahanTeks){
    a.sumber.push({id:idBaru("sum"), jenis:"teks", nama:x.nama, teks:x.teks,
      ukuran:x.teks.length, dibuat:new Date().toISOString(),
      /* Rujukan bagian (id + detik) hanya dimiliki transkrip; teks tempel
         tidak punya waktu, jadi dibiarkan null — bukan dikarang. */
      asalTr:x.asalTr || null, induk:x.induk || null,
      bagian:Array.isArray(x.bagian) ? x.bagian : null,
      revisi:x.revisi || 0});
  }
  bahanTeks.length = 0;
  if (teks){
    // Sebut asal Drive HANYA bila isinya memang masih memuat teks yang diambil;
    // bila pengguna mengganti seluruhnya, jangan beri label yang menyesatkan.
    const rapat = s => (s || "").replace(/\s+/g, " ").trim();
    const dariDrive = namaSumberDrive && teksDrive
      && rapat(teks).startsWith(rapat(teksDrive).slice(0, 80));
    a.sumber.push({id:idBaru("sum"), jenis:"teks",
      nama:(dariDrive ? namaSumberDrive : "teks tempel"), teks,
      ukuran:teks.length, dibuat:new Date().toISOString()});
  }
  // bahan audio/transkrip mentah ikut tersimpan SEKARANG — sebelum pemrosesan
  for (const x of audioDraf){
    a.sumber.push(x.jenis === "transkrip-mentah"
      ? {id:idBaru("sum"), jenis:"transkrip-mentah", nama:x.nama, teks:x.teks,
         ukuran:x.ukuran, dibuat:new Date().toISOString()}
      : {id:idBaru("sum"), jenis:"audio", nama:x.nama, blob:x.blob,
         ukuran:x.ukuran, durasi:x.durasi, dibuat:new Date().toISOString()});
    /* Hasil transkripsi yang sudah dikerjakan jangan hilang saat draf disimpan.
       Tetap ditandai MENTAH dan tidak otomatis menjadi sumber AI. */
    if (x.tr && (x.tr.mentah || "").trim()){
      a.sumber.push({id:idBaru("sum"), jenis:"transkrip-mentah",
        nama:"transkrip mentah — " + x.nama, teks:x.tr.mentah,
        ukuran:x.tr.mentah.length, dibuat:new Date().toISOString(),
        bagian:bagianBertanda(x.tr)});
    }
  }
  /* Foto dan video disimpan sebagai SUMBER UTUH di catatan: gambar asli,
     salinan proses, teks bacaan, dan cuplikan. Tanpa ini hasil bergambar
     kehilangan rujukannya begitu halaman dimuat ulang (§7). */
  const sumberGambar = [];
  for (const f of bahanFoto){
    const sid = idBaru("sum");
    /* DUA entri untuk satu foto, dan itu memang perlu:
       (1) entri MEDIA — membawa gambar asli untuk ditampilkan/dicetak,
       (2) entri TEKS — membawa tulisan yang terbaca sebagai SUMBER teks,

    a.sumber.push({id:sid, jenis:"foto", nama:f.nama, blob:f.blob,
      blobProses:f.blobProses, lebar:f.lebar, tinggi:f.tinggi,
      mimeAsli:f.mimeAsli, ukuran:f.ukuran, teks:f.teks, teksAsli:f.teksAsli,
      unsur:f.unsur, terbaca:f.terbaca, revisi:f.revisi || 0,
      dibuat:new Date().toISOString()});

    if (par.length){
      sidTeks = idBaru("sum");
      const bagian = par.map((t, i)=>({
        id:"b" + String(i + 1).padStart(2, "0"), mulai:null, selesai:null, teks:t}));
      a.sumber.push({id:sidTeks, jenis:"teks", nama:f.nama + " (teks dari gambar)",
        teks:par.join("\n\n"), ukuran:par.join("\n\n").length,
        dibuat:new Date().toISOString(), bagian, dariFoto:sid,
        terbaca:f.terbaca || "", unsur:f.unsur || ""});
    }
    sumberGambar.push({id:"g" + (sumberGambar.length + 1), sumberId:sid,
      sumberTeksId:sidTeks,
      ket:f.nama + (f.lebar ? " (" + f.lebar + "×" + f.tinggi + ")" : ""),
      waktu:null, blob:f.blobProses, mime:"image/jpeg"});
  }
  for (const v of bahanVideo){
    const sid = idBaru("sum");
    a.sumber.push({id:sid, jenis:"video", nama:v.nama, blob:v.blob,
      ukuran:v.ukuran, durasi:v.durasi, lebar:v.lebar, tinggi:v.tinggi,
      cuplikan:(v.cuplikan || []).map(c=>({waktu:c.waktu, blob:c.blob})),
      dibuat:new Date().toISOString()});
    (v.cuplikan || []).forEach((c, i)=>{
      sumberGambar.push({id:"g" + (sumberGambar.length + 1), sumberId:sid,
        ket:v.nama + " — cuplikan " + waktuPemutar(c.waktu), waktu:c.waktu,
        blob:c.blob, mime:"image/jpeg"});
    });
  }
  audioDraf.length = 0;
  bahanFoto.length = 0;
  bahanVideo.length = 0;
  hapusDrafBahan();          // bahan sudah pindah ke catatan: draf tidak diperlukan
  namaSumberDrive = ""; teksDrive = "";   // asal Drive hanya untuk catatan ini
  a.pilihan = pilihan;
  /* Satu teks per kelompok. Teks di kotak ikut dipakai HANYA bila bukan salinan
     bahan yang sudah ada — supaya isi yang sama tidak terkirim dua kali. */
  const daftarTeks = kelompokAI.map(b=>b.teks);
  const rapat2 = s => (s || "").replace(/\s+/g, " ").trim();
  const teksSudahAda = teks && daftarTeks.some(t => rapat2(t) === rapat2(teks));
  if (teks && !teksSudahAda) daftarTeks.push(teks);
  const teksBahan = daftarTeks.filter(t=>t && t.trim()).join("\n\n");
  /* "Sertakan gambar sumber" (§7). Hanya bila dicentang pengguna, dan hanya
     gambar yang benar-benar ada. Maksimum 4 per permintaan (batas server 6)
     supaya badan permintaan tetap wajar dan biaya tidak membengkak. */
  const sertakan = !!($("#sertakan-gambar") && $("#sertakan-gambar").checked);
  let gambarKirim = [];
  if (sertakan && sumberGambar.length){
    gambarKirim = sumberGambar.slice(0, GAMBAR_HASIL_MAKS);
    for (const g of gambarKirim) g.b64 = await blobKeBase64(g.blob);
    a.gambar = gambarKirim.map(g=>({id:g.id, ket:g.ket, sumberId:g.sumberId,
      sumberTeksId:g.sumberTeksId || null, waktu:g.waktu}));
  } else {
    a.gambar = [];
  }
  if (btn) btn.disabled = true;
  tampilkanLaju("jalan", "", "");
  const sBuat = sibuk($("#buat-sibuk"), {label:"Sedang menyusun catatan…",
    sub:"Membaca bahan, lalu menulis hasilnya."});
  try{
    sBuat.perbarui({label:"Menyimpan di perangkat…"});
    await simpanAcara(a);
    sBuat.perbarui({label:"Sedang menyusun catatan…", sub:"Bahan tersimpan di perangkat."});
    if (teksBahan){
      for (const k of pilihan){
        tampilkanLaju("jalan", "", "");
        sBuat.perbarui({label:"Sedang menyusun " +
          ((OUTPUT_DEFS[k] && OUTPUT_DEFS[k].nama) || k) + "…",
          sub:"Layanan AI menulis hasilnya dari bahan yang Anda berikan."});
        try{
          rekamKiriman(a, "hasil", {pilihan:k, model:"(diminta)"});
          const bagianKirim = bagianSumber(a);
          const jr = await panggilAIRaw({tugas:"hasil", pilihan:k, judul:a.judul,
            jenis:a.jenis, pemateri:a.pemateri,
            sumber_teks:teksSumberUntukKirim(a, bagianKirim),
            bagian:bagianKirim, konteks_d:konteksD,
            gambar:gambarKirim.map(g=>({id:g.id, mime:g.mime, b64:g.b64,
              ket:g.ket}))});
          const teksHasil = jr.jawaban || "";
          // bahan sudah dibaca model; sekarang menyusun & menyimpan
          tampilkanLaju("selesai", "jalan", "");
          a.hasil[k] = {teks:teksHasil, dibuat:new Date().toISOString(), versi:1};
          if (jr.laporan) a.laporan = Object.assign(a.laporan || {}, {[k]:jr.laporan});
          sBuat.perbarui({label:"Menyimpan hasil di perangkat…"});
          await simpanAcara(a);
          tampilkanLaju("selesai", "selesai", "jalan");
        }catch(e){
          // kegagalan TIDAK menimpa hasil baik sebelumnya; dilaporkan jujur
          const lama = a.hasil[k];
          if (!(lama && lama.teks)){
            a.hasil[k] = {teks:"", dibuat:new Date().toISOString(), versi:0,
              gagal:true, pesan_gagal:String(e.message||e)};
          }
          await simpanAcara(a);
          tampilkanLaju("gagal", "", "");
        }
      }
      tampilkanLaju("selesai", "selesai", "selesai");
    } else {
      // Hanya audio tanpa tulisan: hasil A–D TIDAK dipaksakan. Catatan disimpan
      // sebagai draf jujur, dan halaman catatan menawarkan satu tindakan:
      // mengubah rekaman menjadi tulisan.
      a.catatan_bahan = "Rekaman tersimpan — belum diubah menjadi tulisan. " +
        "Buka bagian Sumber & rujukan, lalu tekan Ubah rekaman menjadi tulisan. " +
        "Setelah teksnya ada, hasil catatan bisa dibuat.";
      await simpanAcara(a);
      tampilkanLaju("selesai", "", "");
    }
    location.hash = "#/acara/" + a.id;
    sBuat.selesai("Catatan sudah siap.");
    setTimeout(()=>sBuat.hapus(), 1400);
  }catch(e){
    pesan.textContent = "Gagal menyimpan: " + (e.message||e);
    sBuat.gagal("Catatan belum tersimpan.", (e.message||String(e)).slice(0, 160) +
      " Bahan Anda tetap ada di perangkat ini.");
    setTimeout(()=>sBuat.hapus(), 2600);
  }finally{ if (btn) btn.disabled = false; }
  }finally{
    /* Kunci dilepas di SATU tempat: ketukan berulang tidak pernah
       menghasilkan dua catatan, termasuk saat rantai berhenti di tengah. */
    catatanJalan = false;
    if (btn) btn.disabled = false;
    if (tahapAktif){ tahap(""); perbaruiRingkas(); }
  }
}
/* ============================================================
   HALAMAN: Detail acara + hasil + agen
   ============================================================ */
let tabAktif = "A";
let daftarIsi = [];
let pengamatTab = null;

/* Tab aktif WAJIB terbaca utuh. Terukur di 1366 px dengan panel pendamping
   terbuka (bawaan): #isi 976 px → bilah 944 px, tab butuh 604 px, tindakan
   464 px, jadi 132 px tab terpotong dan tab aktif "Langkah Penerapan" hanya
   terbaca "Lar" (35 dari 168 px terlihat). Strip memang dirancang menggeser
   dalam ruangnya sendiri (satu baris, tidak membungkus), tetapi pilihan yang
   sedang aktif tidak boleh tersembunyi — jadi strip digeser SECUKUPNYA
   sampai tab aktif masuk, tanpa menyentuh gulir halaman. */
function tampilkanTabAktif(){
  const strip = document.getElementById("tabs");
  if (!strip) return;
  const b = strip.querySelector("button.aktif");
  if (!b) return;
  const sisa = strip.scrollWidth - strip.clientWidth;
  if (sisa <= 0){ strip.scrollLeft = 0; return; }
  const rs = strip.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const kiri = rb.left - rs.left + strip.scrollLeft;   // posisi tombol di isi strip
  const kanan = kiri + rb.width;
  let target = strip.scrollLeft;
  if (kiri < strip.scrollLeft) target = kiri;
  else if (kanan > strip.scrollLeft + strip.clientWidth) target = kanan - strip.clientWidth;
  strip.scrollLeft = Math.max(0, Math.min(target, sisa));
}
/* Lebar bilah berubah tanpa render ulang: panel pendamping dibuka/ditutup,
   jendela diubah ukurannya. Pengamat dipasang ulang tiap render tab. */
function pasangPengamatTab(){
  const strip = document.getElementById("tabs");
  if (pengamatTab){ pengamatTab.disconnect(); pengamatTab = null; }
  if (!strip || typeof ResizeObserver !== "function") return;
  pengamatTab = new ResizeObserver(()=>tampilkanTabAktif());
  pengamatTab.observe(strip);
}

function metaCetak(a, k){
  return `${a.jenis||""}${a.tanggal?" · "+a.tanggal:""}${a.pemateri?" · Pembicara: "+a.pemateri:""}`
    + ` · ${OUTPUT_DEFS[k]?.nama || ""}`;
}
function tutupDaftarIsi(){
  const p = $("#daftar-isi-panel"), t = $("#t-daftar-isi");
  if (p) p.hidden = true;
  if (t) t.setAttribute("aria-expanded", "false");
}
function rapatTeks(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9\u00c0-\u024f ]/g," ")
    .replace(/\s+/g," ").trim();
}
function buangJudulGanda(md, judul){
  // Hasil A sering dibuka dengan judul catatan sendiri. Judul itu sudah tampil
  // di kepala halaman & kepala cetak — membiarkannya membuat judul ganda.
  const baris = String(md||"").split("\n");
  let i = 0; while (i < baris.length && !baris[i].trim()) i++;
  const m = (baris[i]||"").match(/^#\s+(.*)/);
  const target = rapatTeks(judul);
  if (m && target && rapatTeks(m[1]).startsWith(target.slice(0, 24))) baris.splice(i,1);
  return baris.join("\n");
}
function siapkanDaftarIsi(artikel, judulCatatan){
  const panel = $("#daftar-isi-panel"); if (!panel) return;
  daftarIsi = [];
  if (artikel){
    artikel.querySelectorAll("h2,h3").forEach((el,i)=>{
      const id = "bagian-" + (i+1);
      el.id = id;
      const teks = el.textContent.trim();
      if (i === 0 && judulCatatan && rapatTeks(teks).startsWith(rapatTeks(judulCatatan).slice(0, 24))) return;
      daftarIsi.push({id, judul:teks, tingkat:el.tagName === "H2" ? 2 : 3});
    });
  }
  panel.innerHTML = daftarIsi.length
    ? daftarIsi.map(x=>`<button type="button" data-target="${x.id}" class="${x.tingkat===3?"sub":""}">${esc(x.judul)}</button>`).join("")
    : `<p class="kosong">Hasil ini belum punya bagian berjudul.</p>`;
  panel.querySelectorAll("button[data-target]").forEach(b=>{
    b.onclick = ()=>{
      const el = document.getElementById(b.dataset.target);
      if (el) el.scrollIntoView({behavior: gerakDikurangi() ? "auto" : "smooth", block:"start"});
      tutupDaftarIsi();
    };
  });
}
function gantiTab(a, k){
  tabAktif = k;
  document.querySelectorAll("#tabs button").forEach(b=>{
    const aktif = b.dataset.k === k;
    b.classList.toggle("aktif", aktif);
    b.setAttribute("aria-selected", aktif ? "true" : "false");
    b.tabIndex = aktif ? 0 : -1;
  });
  tampilkanTabAktif();
  const meta = $(".cetak-kepala .meta");
  if (meta) meta.textContent = metaCetak(a, k);
  tutupDaftarIsi();
  tampilHasil(a);          // hanya wadah hasil yang diganti — gulir & panel tetap
  terapkanUkuran();
}
