/* ============================================================
   sibuk(wadah, {label, sub, persen, batal})
   Satu komponen untuk SEMUA penantian. Muncul seketika di dekat tindakan,
   menghitung detik, dan berhenti saat selesai ATAU gagal (gagal membawa
   sebab + jalan keluar — bukan tombol yang meredup tanpa keterangan).
   ============================================================ */
function sibuk(wadah, opsi){
  opsi = opsi || {};
  const el = document.createElement("div");
  el.className = "sibuk";
  el.setAttribute("data-sibuk", "");
  el.setAttribute("role", "status");
  el.setAttribute("aria-live", "polite");
  el.innerHTML =
    '<span class="cakra" aria-hidden="true"></span>' +
    '<span class="teks"><strong></strong><span class="kcil"></span></span>' +
    '<span class="bar" hidden><i></i></span>' +
    '<button class="kecil ndua" data-batal type="button" hidden>Batalkan</button>';
  const kuat = el.querySelector("strong");
  const kecil = el.querySelector(".kcil");
  const bar = el.querySelector(".bar");
  const isiBar = bar.querySelector("i");
  const tbatal = el.querySelector("[data-batal]");

  const t0 = Date.now();
  let label = opsi.label || "Sedang bekerja…";
  let sub = opsi.sub || "";
  let detik = 0;
  let hidup = true;

  const jam = ()=> {
    const d = Math.max(0, Math.floor((Date.now() - t0) / 1000));
    detik = d;
    return Math.floor(d/60) + ":" + String(d%60).padStart(2,"0");
  };
  const gambar = ()=>{
    kuat.textContent = label;
    const s = [sub, jam()].filter(Boolean).join(" · ");
    kecil.textContent = s;
  };
  gambar();
  const jamTimer = setInterval(()=>{ if (hidup) gambar(); }, 1000);

  if (typeof opsi.persen === "number"){
    bar.hidden = false;
    isiBar.style.width = Math.max(0, Math.min(100, opsi.persen)) + "%";
  }
  if (typeof opsi.batal === "function"){
    tbatal.hidden = false;
    tbatal.onclick = ()=>{ try{ opsi.batal(); }catch(e){} };
  }
  if (wadah){
    if (typeof wadah === "string") wadah = document.querySelector(wadah);
    if (wadah){
      wadah.appendChild(el);
      /* aria-busy pada wadah: pembaca layar tahu bagian ini sedang berubah. */
      try{ wadah.setAttribute("aria-busy", "true"); }catch(e){}
    }
  }

  const henti = ()=>{
    hidup = false;
    clearInterval(jamTimer);
    try{
      const induk = el.parentElement;
      if (induk) induk.removeAttribute("aria-busy");
    }catch(e){}
  };
  return {
    el,
    perbarui(p){
      p = p || {};
      if (p.label != null) label = p.label;
      if (p.sub != null) sub = p.sub;
      if (typeof p.persen === "number"){
        bar.hidden = false;
        isiBar.style.width = Math.max(0, Math.min(100, p.persen)) + "%";
      }
      gambar();
    },
    /* selesai: berhenti berputar, tetap terlihat sebentar supaya pengguna
       melihat "Catatan sudah siap." — bukan menghilang tanpa penutup. */
    selesai(teks){
      henti();
      el.dataset.jenis = "selesai";
      label = teks || "Selesai.";
      sub = "selesai dalam " + Math.floor((Date.now() - t0)/1000) + " dtk";
      gambar();
      tbatal.hidden = true;
      bar.hidden = true;
      return el;
    },
    gagal(teks, jalan){
      henti();
      el.dataset.jenis = "gagal";
      label = teks || "Gagal.";
      sub = jalan || "";
      gambar();
      tbatal.hidden = true;
      bar.hidden = true;
      return el;
    },
    dibatalkan(teks){
      henti();
      el.dataset.jenis = "batal";
      label = teks || "Dibatalkan.";
      sub = "tidak ada yang berubah";
      gambar();
      tbatal.hidden = true;
      bar.hidden = true;
      return el;
    },
    hapus(){ henti(); try{ el.remove(); }catch(e){} },
    get detik(){ return detik; }
  };
}

/* Penantian singkat tidak perlu indikator; yang > 400 ms perlu. */
async function denganSibuk(wadah, label, kerja, pesanSelesai){
  let s = null;
  const jam = setTimeout(()=>{ s = sibuk(wadah, {label}); }, 400);
  try{
    const r = await kerja();
    clearTimeout(jam);
    if (s){ s.selesai(pesanSelesai || "Selesai."); setTimeout(()=>s.hapus(), 900); }
    return r;
  }catch(e){
    clearTimeout(jam);
    if (s){ s.gagal("Gagal menyimpan.", (e && e.message) || String(e));
      setTimeout(()=>s.hapus(), 2200); }
    throw e;
  }
}

async function dekodeAudio(blob){
  /* Validasi NYATA: peramban harus benar-benar bisa mendekode berkas.
     Durasi dari jumlah frame PCM hasil dekode ÷ laju sampel (bukan dari
     metadata berkas — metadata AAC/VBR sering meleset). Konteks audio dipakai
     bersama (lihat konteksDekode): membuat konteks baru tiap berkas membuat
     peramban menolak sesudah ±6 berkas. */
  const buf = await blob.arrayBuffer();
  const ac = konteksDekode();
  const audio = await ac.decodeAudioData(buf);
  if (!audio.length) throw new Error("berkas berisi data suara kosong");
  return audio.length / audio.sampleRate;
}

/* ============================================================
   SATU pemutar untuk SEMUA audio (rekam mikrofon, unggah, Drive)
   Kontrol terlihat: Putar/Jeda · posisi · durasi · Unduh.
   Tidak ada new Audio() tersembunyi: setiap kegagalan punya kalimat
   manusia + jalan keluar (Unduh), dan berkas asli TIDAK PERNAH dihapus
   hanya karena pemutaran gagal.
   ============================================================ */
const pemutarPerBahan = new Map();   // bahan (objek) -> {akar, pemutar}
const liPerBahan = new Map();        // bahan (objek) -> <li> yang dipakai ulang
let pemutarHalaman = [];             // pemutar di halaman bacaan (dibersihkan saat pindah)
const pemutarSumber = new Map();     // id sumber -> pemutar (untuk "Dengarkan bagian ini")

function ukuranManusia(b){
  if (!b || !isFinite(b)) return "";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1).replace(".", ",") + " KB";
  return (b/1048576).toFixed(1).replace(".", ",") + " MB";
}
function durasiManusia(d){
  if (!isFinite(d) || d <= 0) return "";
  const t = Math.round(d), j = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  if (j) return j + " jam " + m + " menit";
  if (m) return m + " menit " + s + " detik";
  return s + " detik";
}
function waktuPemutar(d){
  if (!isFinite(d) || d < 0) return "--:--";
  const m = Math.floor(d/60), s = Math.floor(d%60);
  return m + ":" + String(s).padStart(2,"0");
}
function infoBahan(x){
  if (x.jenis === "transkrip-mentah")
    return "transkrip mentah · " + ((x.teks||"").length).toLocaleString("id") + " karakter";
  return [ukuranManusia(x.ukuran), durasiManusia(x.durasi)].filter(Boolean).join(" · ");
}

/* ============================================================
   TRANSKRIPSI: SATU jalur untuk unggahan, rekaman mikrofon, dan audio Drive.
   Audio dipecah menjadi potongan ≈90 detik, dikirim berurutan, dan hasil tiap
   potongan DISIMPAN begitu diterima — kegagalan di bagian 12 tidak mengulang
   bagian 1–11. Sejak §10 Direktif #16 batas potongan dicari DI JEDA, bukan
   angka kaku 90 detik. Hasilnya MENTAH: masuk kotak periksa, bukan langsung
   menjadi bahan dan bukan pemicu pembuatan catatan.
   ============================================================ */
const TRANSKRIP_POTONG = 90;      // detik NOMINAL per potongan (jangkar)
const TRANSKRIP_LAJU = 16000;     // Hz, mono, 16-bit — kecil dan diterima penyedia
/* [§10] Terukur 6 Nov 2026 pada fixture 100 menit: kalimat b3/b6/b9 sengaja
   melintasi tepat detik 1800/3600/5400 (= 20×/40×/60× 90 dtk). Potongan kaku
   membelah kalimat itu di tengah kata; transkrip menjadi "...melintasi batas
   bagian nomor" lalu loncat ke "Sesudah pergantian...". T6 hanya 5/9.
   Batas sekarang digeser ke run hening terdekat di jendela terbatas. Jangkar
   tetap (i+1)×90 detik ABSOLUT supaya pergeseran tidak menumpuk. */
const POTONG_CARI_MUNDUR = 18;    // detik ke belakang dari batas nominal
const POTONG_CARI_MAJU = 6;       // detik ke depan dari batas nominal
const POTONG_MAKS = 108;          // detik; masih di bawah batas server 120 dtk
const POTONG_MIN = 45;            // detik; cegah potongan terlalu pendek
/* [§10][PINDAH] 240 → 700 ms. Terukur 6 Nov 2026 pada run 0032: dari 17
   potongan tersimpan, EMPAT dipotong pada jeda 320/340 ms (b13, b33, b53,
   b60). Itu bukan jeda antar-kalimat melainkan jeda sesudah koma di dalam
   kalimat "Sebelum pergantian bagian nomor 5, saya menyebut…", sehingga
   kalimat terbelah dua potongan. Jeda antar-kalimat pada bahan yang sama
   berdurasi 2.180–2.280 ms atau 18,5 dtk. Ambang 700 ms menolak jeda
   intra-kalimat dan tetap menerima jeda nyata; bila tidak ada, pemanggil
   menandai "paksa" dan tidak mengklaim sambungan aman. */
const JEDA_MIN_MS = 700;          // run hening minimum untuk dijadikan batas
const BINGKAI_KIRIM_MS = 400;     // kelonggaran di ujung rentang bersuara

function galatJujur(pesan, kode){ const e = new Error(pesan); e.kode = kode || ""; return e; }

/* SATU AudioContext untuk semua dekode. Terukur 5 Nov 2026 pada rekaman
   100 menit: tiap bagian dulu membuat AudioContext baru lalu menutupnya tanpa
   menunggu. Chrome membatasi jumlah AudioContext per halaman (≈6); bagian ke-7
   (menit ke-60) tidak pernah selesai didekode, rantai transkripsi menggantung
   TANPA pesan, dan catatan tidak pernah terbuka — persis keluhan "rekaman
   1 jam 40 menit tidak menjadi catatan". Konteks sekarang dipakai bersama dan
   tidak ditutup. */
let acDekode = null;
function konteksDekode(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw galatJujur("Peramban ini tidak mendukung pemrosesan audio.", "peramban");
  if (!acDekode || acDekode.state === "closed") acDekode = new AC();
  return acDekode;
}

async function dekodeKeMono16(blob, opsi){
  /* Dekode sekali, turunkan ke 16 kHz mono, lalu lepaskan buffer asli.
     Durasi dihitung dari jumlah frame PCM ÷ laju sampel (bukan metadata).

     Penurunan sampel TIDAK lagi satu lingkaran raksasa: rekaman 30 menit
     stereo 44,1 kHz berarti 635 juta angka, dan satu lingkaran tanpa jeda
     membekukan layar (keluhan "laptop seperti hang"). Sekarang dikerjakan
     per potongan 60 detik keluaran, dengan jeda ke peramban di antaranya,
     sehingga cakra berputar dan persentase benar-benar naik. */
  opsi = opsi || {};
  const kabar = typeof opsi.kabar === "function" ? opsi.kabar : ()=>{};
  kabar(2, "Membaca berkas…");
  const buf = await blob.arrayBuffer();
  const ac = konteksDekode();
  let audio;
  try{
    kabar(6, "Membuka isi rekaman…");
    /* Batas waktu: dekode yang menggantung harus MENYEBUT keadaannya, bukan
       membuat layar diam selamanya. */
    audio = await Promise.race([
      ac.decodeAudioData(buf),
      new Promise((_, tolak)=>setTimeout(()=>tolak(new Error("batas waktu dekode")), 120000))
    ]);
  }
  catch(e){ throw galatJujur("Peramban ini tidak bisa membaca isi berkas audio ini " +
    "(mungkin rusak atau formatnya tidak didukung).", "dekode"); }
  const srAsal = audio.sampleRate, n = audio.length, lama = n / srAsal;
  if (!lama) throw galatJujur("Berkas berisi data suara kosong.", "kosong");
  const n16 = Math.max(1, Math.round(lama * TRANSKRIP_LAJU));
  const hasil = new Float32Array(n16);
  const kanal = Math.max(1, audio.numberOfChannels);
  const data = [];
  for (let c = 0; c < kanal; c++) data.push(audio.getChannelData(c));
  const rasio = srAsal / TRANSKRIP_LAJU;
  const potong = TRANSKRIP_LAJU * 60;          // 60 detik keluaran per potongan
  for (let awal = 0; awal < n16; awal += potong){
    const akhir = Math.min(awal + potong, n16);
    for (let i = awal; i < akhir; i++){
      const x = i * rasio, i0 = Math.floor(x);
      const i1 = Math.min(i0 + 1, n - 1), f = x - i0;
      let v = 0;
      for (let c = 0; c < kanal; c++) v += data[c][i0] * (1 - f) + data[c][i1] * f;
      hasil[i] = v / kanal;
    }
    kabar(6 + Math.round((akhir / n16) * 92), "Menyiapkan rekaman… " +
      Math.round((akhir / n16) * 100) + "%");
    /* Jeda satu giliran ke peramban: tanpa ini requestAnimationFrame berhenti
       berdetak dan cakra ikut membeku — spinner beku bukan penjelasan. */
    await new Promise(r=>setTimeout(r, 0));
  }
  kabar(100, "Rekaman siap.");
  return {pcm: hasil, durasi: lama};
}

/* ---------- PCM dari rekaman bersesi, dibaca bagian demi bagian ----------
   Menggabungkan 100 menit menjadi satu larik Float32 berarti 384 MB; di HP
   itu bukan "berat", itu tab yang mati. Jadi bagian dibaca berurutan dan
   bagian yang sudah lewat dilepas. Tumpang-tindih 500 ms di awal tiap bagian
   dibuang supaya kata di batas bagian tidak muncul dua kali. */
function pcmBertahap(bagian, opsi){
  opsi = opsi || {};
  const kabar = typeof opsi.kabar === "function" ? opsi.kabar : ()=>{};
  let buf = new Float32Array(0);
  let bufAwal = 0;      // indeks sampel global awal buf
  let iPart = 0;
  let sudah = 0;
  let habis = false;

  async function tambahSatu(){
    if (iPart >= bagian.length){ habis = true; return false; }
    const i = iPart++;
    kabar("Membaca bagian " + (i + 1) + " dari " + bagian.length + "…");
    const d = await dekodeKeMono16(bagian[i].blob, {kabar:(p, t)=>
      kabar(t || ("Membaca bagian " + (i + 1) + " dari " + bagian.length + "…"))});
    let pcm = d.pcm;
    if (i > 0){
      const buang = Math.min(pcm.length,
        Math.round(REKAM_TUMPANG_MS / 1000 * TRANSKRIP_LAJU));
      if (buang > 0) pcm = pcm.subarray(buang);
    }
    bagian[i].durasi = d.durasi;
    const gabung = new Float32Array(buf.length + pcm.length);
    gabung.set(buf, 0); gabung.set(pcm, buf.length);
    buf = gabung;
    sudah += pcm.length;
    await new Promise(r=>setTimeout(r, 0));
    return true;
  }
  return {
    get durasi(){ return sudah / TRANSKRIP_LAJU; },
    async ambil(mulai, akhir){
      while (bufAwal + buf.length < akhir && !habis){
        if (!await tambahSatu()) break;
      }
      const a = Math.max(0, mulai - bufAwal);
      const b = Math.min(buf.length, akhir - bufAwal);
      if (b <= a) return new Float32Array(0);
      return buf.subarray(a, b);
    },
    lepas(sampai){
      const n = Math.min(buf.length, Math.max(0, sampai - bufAwal));
      if (n > 0){ buf = buf.slice(n); bufAwal += n; }
    }
  };
}

function wavDariPCM(pcm, mulai, akhir){
  const n = Math.max(0, akhir - mulai);
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const tulis = (o, s)=>{ for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  tulis(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); tulis(8, "WAVE");
  tulis(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, TRANSKRIP_LAJU, true);
  v.setUint32(28, TRANSKRIP_LAJU * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);
  tulis(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++){
    let s = Math.max(-1, Math.min(1, pcm[mulai + i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], {type:"audio/wav"});
}

function gabungBagian(bagian){
  /* Urutan asli dipertahankan; potongan disambung dengan satu spasi. */
  return bagian.filter(t=>t && t.trim()).map(t=>t.trim()).join(" ")
    .replace(/\s+([,.;:!?])/g, "$1");
}

/* Berapa detik RENTANG bersuara di dalam satu potongan (dari frame bersuara
   pertama sampai terakhir).
   Terukur 5 Nov 2026 pada rekaman 100 menit (audio 48 kHz → 16 kHz mono):
   frame 20 ms yang sunyi benar-benar sunyi (RMS 0,0001), sedangkan frame
   berisi ucapan 0,12–0,28. Jaraknya tiga ribu kali, jadi ambang 0,02 bukan
   tebakan. Dipakai untuk menolak "hening" yang keliru dari layanan: dari 54
   potongan yang dijawab hening, 51 memang sunyi (0,0 dtk suara) dan 3 berisi
   suara (5,7 / 1,5 / 2,5 dtk) — persis di situlah kata hilang. */
const UCAPAN_AMBANG = 0.02;       // RMS per frame 20 ms
const UCAPAN_FRAME = 320;         // 20 ms pada 16 kHz
function ukurUcapan(pcm){
  /* Satu lintasan untuk tiga keperluan: rentang bersuara, puncak RMS, dan
     (di cariBatasJeda) run hening. Puncak RMS dicatat supaya klasifikasi
     "hening" tidak pernah diklaim lebih yakin daripada buktinya: uji_hening.py
     membuktikan suara pelan dari kejauhan pernah dinilai sunyi oleh ambang
     energi saja. */
  if (!pcm || !pcm.length) return {awal:-1, akhir:-1, puncak:0};
  let awal = -1, akhir = -1, puncak = 0;
  for (let o = 0; o + UCAPAN_FRAME <= pcm.length; o += UCAPAN_FRAME){
    let t = 0;
    for (let i = 0; i < UCAPAN_FRAME; i++){ const v = pcm[o + i]; t += v * v; }
    const rms = Math.sqrt(t / UCAPAN_FRAME);
    if (rms > puncak) puncak = rms;
    if (rms > UCAPAN_AMBANG){
      if (awal < 0) awal = o;
      akhir = o + UCAPAN_FRAME;
    }
  }
  return {awal, akhir, puncak};
}
function rentangUcapan(pcm){
  /* [indeks awal, indeks akhir] bagian yang bersuara, atau null.
     Dipakai untuk mengirim ULANG hanya bagian bersuara ketika layanan
     menjawab "hening": terukur 5 Nov 2026, potongan 90 detik yang hanya
     berisi 5,7 detik suara ditolak, dan potongan yang sama diterima ketika
     dikirim ulang. Membuang keheningan panjang membuat jawabannya tidak
     bergantung pada tebakan ambang di sisi layanan. */
  const u = ukurUcapan(pcm);
  return u.awal < 0 ? null : [u.awal, u.akhir];
}
function detikUcapan(pcm){
  const r = rentangUcapan(pcm);
  return r ? (r[1] - r[0]) / TRANSKRIP_LAJU : 0;
}

/* [§10] Cari titik potong DI DALAM run hening terdekat dengan batas nominal.
   Mengembalikan {potong (indeks sampel relatif), panjang (detik hening)} atau
   null bila tidak ada jeda sama sekali — pemanggil WAJIB menandai "paksa"
   dan tidak boleh mengklaim sambungan aman. Tidak ada jawaban fixture di
   sini: yang dipakai hanyalah energi audio itu sendiri. */
function cariBatasJeda(pcm, nominalRel){
  const n = pcm.length;
  const cariA = Math.max(0,
    Math.floor(nominalRel - POTONG_CARI_MUNDUR * TRANSKRIP_LAJU));
  const cariB = Math.min(n,
    Math.floor(nominalRel + POTONG_CARI_MAJU * TRANSKRIP_LAJU));
  const minFrame = Math.max(1,
    Math.ceil(JEDA_MIN_MS / 1000 * TRANSKRIP_LAJU / UCAPAN_FRAME));
  if (cariB - cariA < UCAPAN_FRAME * minFrame) return null;
  let runAwal = -1, terbaik = null;
  const pertimbangkan = (a, b)=>{
    if (b - a < UCAPAN_FRAME * minFrame) return;
    const tengah = Math.floor((a + b) / 2);
    const skor = Math.abs(tengah - nominalRel) / TRANSKRIP_LAJU;
    if (!terbaik || skor < terbaik.skor)
      terbaik = {potong:tengah, skor, panjang:(b - a) / TRANSKRIP_LAJU};
  };
  for (let o = cariA; o + UCAPAN_FRAME <= cariB; o += UCAPAN_FRAME){
    let t = 0;
    for (let i = 0; i < UCAPAN_FRAME; i++){ const v = pcm[o + i]; t += v * v; }
    const sunyi = Math.sqrt(t / UCAPAN_FRAME) <= UCAPAN_AMBANG;
    if (sunyi){ if (runAwal < 0) runAwal = o; }
    else if (runAwal >= 0){ pertimbangkan(runAwal, o); runAwal = -1; }
  }
  if (runAwal >= 0) pertimbangkan(runAwal, cariB);
  return terbaik;
}

function blobKeBase64(blob){
  return new Promise((selesai, gagal)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const s = String(fr.result || ""); selesai(s.slice(s.indexOf(",") + 1)); };
    fr.onerror = ()=>gagal(galatJujur("Berkas tidak bisa dibaca peramban.", "baca"));
    fr.readAsDataURL(blob);
  });
}

/* Menunggu yang bisa dihentikan dan menyebut sisa waktu. Tanpa ini, batas laju
   layanan (429) tampak seperti kegagalan, padahal rekaman masih utuh.

   PENTING (terukur 5 Nov 2026): yang MENYELESAIKAN tunggu adalah SATU timer,
   bukan hitungan detik. Peramban menahan timer halaman latar — Chrome menahan
   sampai satu detik per menit sesudah halaman lima menit di latar. Dulu tunggu
   600 detik dihitung dengan setInterval 1000 ms, sehingga sesudah ±5 menit
   hitungannya berhenti dan rantai transkripsi menggantung SELAMANYA tanpa
   pesan: rekaman 100 menit berhenti tepat di potongan ke-40 (menit ke-60).
   Sekarang hitungan detik hanya menghias layar; tunggunya tetap selesai. */
function tungguBisaBatal(ms, opsi){
  opsi = opsi || {};
  return new Promise((selesai)=>{
    const akhir = Date.now() + ms;
    let t = null, beres = false;
    const akhiri = ()=>{
      if (beres) return;
      beres = true;
      if (t) clearInterval(t);
      selesai();
    };
    setTimeout(akhiri, Math.max(0, ms));
    const detak = ()=>{
      const sisa = Math.max(0, Math.ceil((akhir - Date.now()) / 1000));
      if (opsi.kabar) opsi.kabar("Menunggu layanan · sisa " + jamPanjang(sisa * 1000));
      if (sisa <= 0 || (opsi.batal && opsi.batal())) akhiri();
    };
    detak();
    t = setInterval(detak, 1000);
  });
}

async function kirimPotongan(blob, durasi, opsi){
  opsi = opsi || {};
  const b64 = await blobKeBase64(blob);
  let percobaan = 0;
  for (;;){
    let r;
    try{
      r = await fetch("/api/transkrip", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({data_b64:b64, format:"wav", durasi})});
    }catch(e){
      throw galatJujur("Tidak tersambung ke layanan transkripsi. Periksa sambungan " +
        "internet lalu lanjutkan — bagian yang sudah selesai tidak diulang.", "jaringan");
    }
    let j = {};
    try{ j = await r.json(); }catch(e){ j = {}; }
    /* 429/503 BUKAN kegagalan rekaman: tunggu sesuai Retry-After lalu lanjut.
       Bagian yang sudah selesai tersimpan, jadi menunggu tidak mengulang apa pun. */
    if (r.status === 429 || r.status === 503){
      percobaan++;
      if (percobaan > 8)
        throw galatBatasLaju(j.status_pesan);
      const tunggu = Math.min(3600, Math.max(5,
        Number(r.headers.get("Retry-After")) || Number(j.tunggu_detik) ||
        (r.status === 429 ? 600 : 30)));
      await tungguBisaBatal(tunggu * 1000, opsi);
      if (opsi.batal && opsi.batal()) throw galatJujur(
        "Dihentikan saat menunggu layanan. Bagian yang sudah selesai tetap tersimpan.",
        "dihentikan");
      continue;
    }
    if (!r.ok || !j.ok){
      throw galatJujur(j.status_pesan || ("Layanan menolak permintaan (HTTP " + r.status + ")."),
        j.kode || String(r.status));
    }
    return j;
  }
}
function galatBatasLaju(pesan){
  return galatJujur(pesan || "Layanan masih membatasi permintaan. Coba lagi nanti — " +
    "rekaman dan bagian yang sudah selesai tetap tersimpan.", "dibatasi");
}

/* ID bagian harus STABIL dan bisa dirujuk: tanpa ini klaim pada hasil tidak
   bisa ditautkan ke titik audio (Direktif #9 S5). */
function idBagian(i){ return "b" + String(i + 1).padStart(2, "0"); }
/* Direktif #10 §3: ID harus membedakan BERKAS dan BAGIAN. Dua rekaman yang
   sama-sama punya "b01" tidak boleh saling meminjam pemutar atau rujukan.
   Bentuknya "a3-b07": a3 = berkas ketiga pada catatan, b07 = bagian ketujuh.
   ID lama ("b07") tetap dibaca — lihat cariBagian(). */
function awalanSumber(a, s){
  const i = (a && a.sumber ? a.sumber : []).indexOf(s);
  if (i >= 0) return "a" + (i + 1);
  /* Sumber lepas (mis. dari draf yang belum masuk catatan): pakai ekor id-nya
     supaya tetap unik tanpa mengarang urutan. */
  const ekor = String((s && s.id) || "").replace(/[^a-z0-9]/gi, "").slice(-3);
  return "a" + (ekor || "0");
}
function idBagianBerkas(awalan, id){
  const teks = String(id || "");
  if (teks.includes("-")) return teks;      // sudah berawalan berkas
  return (awalan ? awalan + "-" : "") + (teks || "b??");
}
function jamBagian(d){
  if (d == null || !isFinite(d) || d < 0) return "";
  const m = Math.floor(d / 60), s = Math.floor(d % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function rentangBagian(m){
  if (!m) return "";
  const a = jamBagian(m.mulai), b = jamBagian(m.selesai);
  return a && b ? a + "–" + b : "";
}
function trBaru(){ return {bagian:[], total:0, selesai:0, jalan:false, galat:"", kode:"",
                            mentah:"", durasi:0, pcm:null, pesan:"", versi:0, ragu:[],
                            kodeBagian:{}, meta:[], revisi:null, koreksi:[]}; }
/* Bagian bertanda: {id, mulai, selesai, teks}. Satu sumber kebenaran untuk
   rujukan hasil, verifikasi klaim, dan ekspor diagnostik. */
function bagianBertanda(st){
  const out = [];
  (st.bagian || []).forEach((teks, i)=>{
    const t = (teks || "").trim();
    if (!t) return;
    const m = (st.meta || [])[i] || {};
    out.push({id:m.id || idBagian(i),
      mulai: m.mulai != null ? m.mulai : null,
      selesai: m.selesai != null ? m.selesai : null, teks:t,
      /* §10: alamat audio yang BENAR-BENAR dikirim, cara batas dipilih,
         dan bukti energi. Ikut tersimpan di ekspor diagnostik. */
      kirimMulai: m.kirimMulai != null ? m.kirimMulai : null,
      kirimSelesai: m.kirimSelesai != null ? m.kirimSelesai : null,
      cara: m.cara || "", jedaMs: m.jedaMs || 0,
      bersuaraMs: m.bersuaraMs || 0, puncakRms: m.puncakRms || 0});
  });
  return out;
}

async function jalankanTranskrip(blob, st, opsi){
  /* st dipakai ulang supaya bisa dilanjutkan; opsi.simpan dipanggil tiap bagian. */
  opsi = opsi || {};
  const kabar = opsi.kabar || (()=>{});
  if (st.jalan) return;
  st.jalan = true; st.galat = ""; st.kode = "";
  try{
    if (!st.pcm && opsi.pcm){
      st.pcm = opsi.pcm;
      st.durasi = st.durasi || (st.pcm.length / TRANSKRIP_LAJU);
      let total = Math.max(1, Math.ceil(st.durasi / TRANSKRIP_POTONG));
      const sisa = st.durasi - (total - 1) * TRANSKRIP_POTONG;
      if (total > 1 && sisa < 5) total -= 1;
      st.total = total;
    }
    if (!st.pcm && opsi.ambil){
      /* Rekaman bersesi (100 menit = 10 bagian): PCM TIDAK digabung menjadi
         satu larik raksasa. 100 menit pada 16 kHz Float32 = 384 MB — cukup
         untuk mematikan tab di HP. Yang disediakan adalah pengambil potongan
         yang membaca bagian demi bagian dan melepas yang sudah lewat. */
      st.durasi = opsi.durasi || st.durasi || 0;
      st.__ambil = opsi.ambil;
      st.__lepas = opsi.lepas || null;
      /* Total sengaja DILEBIHKAN: kalau perkiraan durasi meleset ke bawah,
         ekor rekaman tidak boleh hilang. Kelebihan dipangkas di dalam loop
         begitu audio benar-benar habis. */
      st.total = Math.max(1, Math.ceil((st.durasi * 1.05 + 30) / TRANSKRIP_POTONG));
    }
    if (!st.pcm && !st.__ambil){
      kabar("Menyiapkan audio…", 0);
      const d = await dekodeKeMono16(blob, {kabar:(p, t)=>kabar(t || "Menyiapkan audio…", p)});
      if (d.durasi < 2)
        throw galatJujur("Rekaman ini kurang dari 2 detik — terlalu pendek untuk diubah " +
          "menjadi tulisan. Rekaman tetap tersimpan.", "terlalu_pendek");
      st.pcm = d.pcm; st.durasi = d.durasi;
      let total = Math.max(1, Math.ceil(d.durasi / TRANSKRIP_POTONG));
      const sisa = d.durasi - (total - 1) * TRANSKRIP_POTONG;
      /* Ekor yang terlalu pendek digabung ke potongan terakhir — kalau tidak,
         potongan 0,03 detik akan ditolak dan hasilnya berhenti di tengah. */
      if (total > 1 && sisa < 5) total -= 1;
      st.total = total;
    }
    for (let i = st.selesai; i < st.total; i++){
      if (st.batal){ kabar("Dihentikan. Bagian yang sudah selesai tetap tersimpan."); break; }
      kabar(`Mengubah bagian ${i + 1} dari ${st.total}…`,
            Math.round(100 * i / Math.max(1, st.total)));
      /* [§10] Awal potongan mengikuti batas NYATA potongan sebelumnya, yang
         tersimpan di st.meta. Kalau draf lama belum punya selesaiS, jatuh ke
         i×90 dtk — draf lama tetap bisa dilanjutkan tanpa migrasi. */
      const metaSebelum = (st.meta || [])[i - 1];
      const mulai = (i > 0 && metaSebelum && Number.isFinite(metaSebelum.selesaiS))
        ? metaSebelum.selesaiS : i * TRANSKRIP_POTONG * TRANSKRIP_LAJU;
      const nominal = Math.max(mulai + POTONG_MIN * TRANSKRIP_LAJU,
        (i + 1) * TRANSKRIP_POTONG * TRANSKRIP_LAJU);
      const cariAkhir = Math.max(mulai + POTONG_MIN * TRANSKRIP_LAJU,
        Math.min(mulai + POTONG_MAKS * TRANSKRIP_LAJU,
                 nominal + POTONG_CARI_MAJU * TRANSKRIP_LAJU));
      /* Baca sedikit MELEBIHI batas nominal supaya run hening di seberang
         batas ikut terlihat. Untuk rekaman bersesi, __ambil membaca bagian
         demi bagian dan __lepas hanya membuang sampai batas yang dipilih,
         jadi sisa bacaan ini dipakai lagi oleh potongan berikutnya. */
      let penuh;
      if (st.pcm) penuh = st.pcm.subarray(mulai, Math.min(st.pcm.length, cariAkhir));
      else penuh = await st.__ambil(mulai, cariAkhir);
      if (penuh.length < 2 * TRANSKRIP_LAJU){
        /* Audio benar-benar habis: perkiraan total tadi memang kelebihan. */
        st.total = i;
        break;
      }
      const audioHabis = st.pcm
        ? (mulai + penuh.length >= st.pcm.length)
        : (penuh.length < cariAkhir - mulai);
      const jeda = audioHabis ? null : cariBatasJeda(penuh, nominal - mulai);
      const relatif = audioHabis ? penuh.length : (jeda
        ? jeda.potong
        : Math.max(POTONG_MIN * TRANSKRIP_LAJU,
            Math.min(penuh.length, nominal - mulai, POTONG_MAKS * TRANSKRIP_LAJU)));
      const akhir = mulai + relatif;
      const pcmPotongan = penuh.subarray(0, relatif);
      if (!st.pcm && st.__lepas) st.__lepas(akhir);
      /* Kirim rentang bersuara + bingkai, bukan 90 dtk yang sebagian besarnya
         sunyi. Bila TIDAK ada suara terdeteksi, kirim potongan UTUH: detektor
         energi pernah salah menilai suara pelan sebagai sunyi (uji_hening.py),
         jadi membuangnya diam-diam berisiko menghilangkan ucapan. */
      const ukur = ukurUcapan(pcmPotongan);
      let pcmPotong = pcmPotongan, kirimAwalS = mulai, kirimAkhirS = akhir;
      if (ukur.awal >= 0){
        const bingkai = Math.round(BINGKAI_KIRIM_MS / 1000 * TRANSKRIP_LAJU);
        const a0 = Math.max(0, ukur.awal - bingkai);
        const a1 = Math.min(pcmPotongan.length, ukur.akhir + bingkai);
        if (a1 - a0 >= 2 * TRANSKRIP_LAJU && a1 - a0 < pcmPotongan.length){
          pcmPotong = pcmPotongan.subarray(a0, a1);
          kirimAwalS = mulai + a0;
          kirimAkhirS = mulai + a1;
        }
      }
      const potong = wavDariPCM(pcmPotong, 0, pcmPotong.length);
      /* Rentang waktu dicatat SEBELUM panggilan: bagian yang gagal pun tetap
         punya alamat. §10 meminta "audio yang BENAR-BENAR dikirim", jadi
         kirimMulai/kirimSelesai dicatat terpisah dari rentang potongan. */
      st.meta = st.meta || [];
      st.meta[i] = {id:idBagian(i),
        mulai:+(mulai / TRANSKRIP_LAJU).toFixed(2),
        selesai:+(akhir / TRANSKRIP_LAJU).toFixed(2),
        mulaiS:mulai, selesaiS:akhir,
        cara: audioHabis ? "ekor" : (jeda ? "jeda" : "paksa"),
        jedaMs: jeda ? Math.round(jeda.panjang * 1000) : 0,
        kirimMulai:+(kirimAwalS / TRANSKRIP_LAJU).toFixed(2),
        kirimSelesai:+(kirimAkhirS / TRANSKRIP_LAJU).toFixed(2),
        bersuaraMs: ukur.awal >= 0
          ? Math.round((ukur.akhir - ukur.awal) / TRANSKRIP_LAJU * 1000) : 0,
        puncakRms:+ukur.puncak.toFixed(4)};
      let j, isiUlang = "";
      try{
        j = await kirimPotongan(potong, pcmPotong.length / TRANSKRIP_LAJU,
          {kabar:(m)=>kabar(m), batal:()=>!!st.batal});
      }catch(e){
        /* Empat hal berbeda, empat perlakuan berbeda:
           - hening: bagian ini memang tidak bersuara → lewati, jangan gagalkan semua;
           - terpotong: sudah ditangani percobaan ulang di bawah;
           - galat penyedia / jaringan: hentikan di sini supaya bisa DILANJUTKAN
             tanpa mengulang bagian yang sudah selesai.
           Galat penyedia TIDAK PERNAH dilabeli "tidak ada ucapan". */
        if ((e.kode || "") === "tanpa_suara"){
          /* "Hening" dari layanan TIDAK langsung dipercaya: kalau potongan ini
             sendiri berisi suara, satu percobaan ulang dulu. Terukur 5 Nov
             2026: 3 potongan berisi suara (5,7 / 1,5 / 2,5 dtk) dijawab hening,
             dan kalimat yang ada di dalamnya hilang dari catatan. Percobaan
             ulang dibatasi SEKALI per potongan supaya tidak memutar biaya. */
          const rentang = rentangUcapan(pcmPotong);
          const bersuara = rentang ? (rentang[1] - rentang[0]) / TRANSKRIP_LAJU : 0;
          if (bersuara >= 0.5){
            st.ulangHening = st.ulangHening || {};
            if (!st.ulangHening[i]){
              st.ulangHening[i] = 1;
              kabar(`Bagian ${i + 1} berisi suara (${bersuara.toFixed(1)} dtk) tetapi ` +
                "layanan menjawab hening — mencoba sekali lagi…");
              /* Kirim hanya bagian yang bersuara (kelonggaran 0,4 dtk di kedua
                 ujung). Kalau potongan sudah hampir penuh suara, kirim apa
                 adanya — memotong tidak menambah apa pun. */
              let kirimUlang = potong;
              let durUlang = pcmPotong.length / TRANSKRIP_LAJU;
              const bingkai = Math.round(0.4 * TRANSKRIP_LAJU);
              const a0 = Math.max(0, rentang[0] - bingkai);
              const a1 = Math.min(pcmPotong.length, rentang[1] + bingkai);
              if (a1 - a0 >= 2 * TRANSKRIP_LAJU && a1 - a0 < 0.9 * pcmPotong.length){
                kirimUlang = wavDariPCM(pcmPotong, a0, a1);
                durUlang = (a1 - a0) / TRANSKRIP_LAJU;
              }
              try{
                const j2 = await kirimPotongan(kirimUlang, durUlang,
                  {kabar:(m)=>kabar(m), batal:()=>!!st.batal});
                isiUlang = (j2.teks || "").trim();
              }catch(e2){ /* tetap hening: dilaporkan apa adanya di bawah */ }
            }
          }
          if (!isiUlang){
            st.bagian[i] = "";
            st.kodeBagian = st.kodeBagian || {};
            st.kodeBagian[i] = bersuara >= 0.5 ? "hening_ragu" : "hening";
            st.selesai = i + 1;
            st.versi++;
            if (opsi.simpan) await opsi.simpan();
            kabar(bersuara >= 0.5
              ? `Bagian ${i + 1} bersuara tetapi layanan tidak mengenalinya — dilewati.`
              : `Bagian ${i + 1} tidak bersuara — dilewati.`);
            continue;
          }
        }
        /* Percobaan ulang yang BERHASIL tidak boleh melempar galat aslinya:
           terukur 5 Nov 2026 — potongan 20 berhasil ditranskripsi ulang, lalu
           rantai berhenti karena galat "hening" yang pertama dilempar juga.
           Catatan tidak pernah terbuka dan pengguna melihat galat. */
        if (!isiUlang) throw e;
      }
      /* Percobaan ulang "hening" bisa menghasilkan teks tanpa lewat j. */
      let isiBagian = isiUlang || (j && j.teks ? String(j.teks).trim() : "");
      /* Jawaban penyedia bisa terpotong sesaat — terbukti pada uji 30 menit:
         potongan yang sama memberi 108 karakter sekali dan ~895 karakter saat
         diulang. Satu percobaan ulang, lalu bagian itu DITANDAI. Isi yang
         mencurigakan tidak pernah lolos diam-diam. */
      const sudah = st.bagian.filter(t => typeof t === "string" && t.trim());
      const rata = sudah.length >= 2
        ? sudah.map(t => t.length).sort((a, b) => a - b)[Math.floor(sudah.length / 2)] : 0;
      if (rata > 300 && isiBagian.length < rata * 0.45){
        kabar(`Bagian ${i + 1} terlihat terpotong — mencoba sekali lagi…`);
        try{
          const j2 = await kirimPotongan(potong, pcmPotong.length / TRANSKRIP_LAJU,
            {kabar:(m)=>kabar(m), batal:()=>!!st.batal});
          if (((j2.teks || "").trim()).length > isiBagian.length) isiBagian = (j2.teks || "").trim();
        }catch(e){ /* percobaan ulang gagal: hasil pertama tetap dipakai */ }
        if (isiBagian.length < rata * 0.45 && !st.ragu.includes(i + 1)) st.ragu.push(i + 1);
      }
      st.bagian[i] = isiBagian;
      st.selesai = i + 1;
      st.mentah = gabungBagian(st.bagian);
      st.versi++;
      if (opsi.simpan) await opsi.simpan();
      kabar(`Bagian ${i + 1} dari ${st.total} selesai.`);
      /* Jeda kecil antar-potongan: mengurangi penolakan laju dari penyedia
         tanpa membuat proses terasa berhenti. */
      await new Promise(r=>setTimeout(r, 250));
    }
    /* Semua bagian hening: JANGAN pernah menulis "Selesai". Tidak ada satu kata
       pun yang bisa dipakai, jadi ini bukan keberhasilan — dan bukan pula galat
       penyedia. Kode "tanpa_suara" dipakai supaya pesannya tepat. */
    const adaTeks = st.bagian.some(t => typeof t === "string" && t.trim());
    if (!adaTeks){
      /* Bedakan dua hal yang sangat berbeda: rekaman memang sunyi, atau ada
         suara tetapi layanan menolaknya. Menyebut yang kedua "tidak berisi
         ucapan" adalah kebohongan yang membuat pemilik rapat mengira
         rekamannya kosong. */
      const ragu = Object.values(st.kodeBagian || {}).filter(k => k === "hening_ragu").length;
      st.galat = ragu
        ? `${ragu} bagian rekaman ini jelas bersuara, tetapi layanan tidak mengenali `
          + "ucapannya — tidak ada tulisan yang dibuat (tidak dikarang). Rekaman tetap "
          + "tersimpan dan bisa diputar; bagian itu bisa diulang satu per satu."
        : "Rekaman ini tidak berisi ucapan yang bisa dikenali — tidak ada "
          + "tulisan yang dibuat (tidak dikarang). Rekaman tetap tersimpan dan bisa diputar.";
      st.kode = "tanpa_suara";
    }
    st.pcm = null;                       // bebas memori setelah selesai
  }catch(e){
    st.galat = (e && e.message) || "Transkripsi gagal.";
    st.kode = (e && e.kode) || "";
    st.versi++;
  }finally{
    st.jalan = false;
    st.versi++;
    /* Pemberitahuan TERAKHIR wajib setelah jalan=false: tanpa ini kotak
       periksa tidak pernah terbuka karena keadaan terakhir yang digambar
       masih "sedang berjalan". */
    if (st.galat) kabar(st.galat);
    else if (st.total && st.selesai >= st.total)
      kabar(`Selesai — ${st.total} bagian. Periksa hasilnya sebelum dipakai.`);
    else kabar(st.pesan || "");
    if (opsi.selesai) opsi.selesai();
  }
}

function renderTr(x, slot){
  /* Panel transkrip dibuat SEKALI per bahan, lalu hanya diperbarui — supaya
     kotak periksa tidak kehilangan isi saat daftar bahan digambar ulang. */
  if (!slot) return null;
  let r = slot.__tr;
  if (!r){
    const p = document.createElement("div");
    p.className = "tr-panel";
    p.innerHTML =
      '<p class="tr-status kcil" role="status"></p>' +
      '<div class="tr-sibuk"></div>' +
      '<div class="tr-jalur" hidden><span></span></div>' +
      '<div class="tr-aksi">' +
        '<button class="kecil" type="button" data-aksi="tr-mulai">Ubah rekaman menjadi tulisan</button>' +
        '<button class="kecil" type="button" data-aksi="tr-lanjut" hidden>Lanjutkan</button>' +
        '<button class="kecil ndua" type="button" data-aksi="tr-henti" hidden>Hentikan</button>' +
      '</div>' +
      '<div class="tr-siap" hidden>' +
        '<p class="tr-siap-teks" id="tr-siap-' + (x.__id || (x.__id = idBaru("bahan"))) + '">' +
          'Tulisan dari rekaman Anda sudah siap dipakai.</p>' +
        '<button class="tr-siap-buat" type="button" data-aksi="tr-buat">Buat Catatan</button>' +
        '<p class="kcil" style="margin:6px 0 0">Transkrip ini sudah tersimpan sebagai bahan ' +
          'catatan. Anda tidak perlu menyalin atau menempel apa pun.</p>' +
      '</div>' +
      '<div class="tr-periksa" hidden>' +
        '<label for="tr-teks-' + (x.__id || (x.__id = idBaru("bahan"))) + '">' +
          'Hasil transkripsi otomatis — periksa dulu sebelum dipakai</label>' +
        '<textarea id="tr-teks-' + x.__id + '"></textarea>' +
        '<p class="kcil">Teks ini MENTAH: bisa salah dengar, dan bagian yang tidak jelas ' +
          'ditandai [tidak jelas]. Transkrip mentah aslinya disimpan terpisah dan tidak ' +
          'ditimpa. Tidak ada nama pembicara yang ditambahkan.</p>' +
        '<p class="kcil tr-ragu" hidden></p>' +
        '<div class="tr-bagian"></div>' +
        '<p class="tr-aksi">' +
          '<button class="kecil" type="button" data-aksi="tr-pakai">Gunakan Transkrip</button>' +
          '<button class="kecil ndua" type="button" data-aksi="tr-buang">Buang hasil</button>' +
        '</p>' +
      '</div>';
    slot.appendChild(p);
    r = {panel:p, status:p.querySelector(".tr-status"),
         sibukWadah:p.querySelector(".tr-sibuk"),
         bagianWadah:p.querySelector(".tr-bagian"),
         jalur:p.querySelector(".tr-jalur"),
         isi:p.querySelector(".tr-jalur span"), mulai:p.querySelector('[data-aksi="tr-mulai"]'),
         lanjut:p.querySelector('[data-aksi="tr-lanjut"]'), henti:p.querySelector('[data-aksi="tr-henti"]'),
         periksa:p.querySelector(".tr-periksa"), teks:p.querySelector("textarea"),
         siap:p.querySelector(".tr-siap"), siapBuat:p.querySelector('[data-aksi="tr-buat"]'),
         pakai:p.querySelector('[data-aksi="tr-pakai"]'), buang:p.querySelector('[data-aksi="tr-buang"]'),
         ragu:p.querySelector(".tr-ragu"),
         versi:-1};
    slot.__tr = r;
    const jalan = ()=>{
      if (!x.tr) x.tr = trBaru();
      x.tr.batal = false;
      x.tr.versi++;
      const kabar = (m, persen)=>{ if (x.tr){ x.tr.pesan = m; x.tr.versi++; }
        if (persen != null) x.tr.__persen = persen;
        perbaruiTr(x, slot); };
      jalankanTranskrip(x.blob, x.tr, {kabar, simpan:simpanDrafTr,
        pcm: pcmSementara.get(x)});
      perbaruiTr(x, slot);
    };
    r.mulai.onclick = jalan;
    r.lanjut.onclick = ()=>{ if (x.tr) jalan(); };
    r.henti.onclick = ()=>{ if (x.tr) x.tr.batal = true; };
    r.pakai.onclick = ()=>gunakanTranskrip(x, r);
    /* Satu ketukan dari layar transkrip: transkrip yang SUDAH ADA langsung
       dipakai sebagai bahan, lalu catatan disusun. Tidak ada salin-tempel. */
    r.siapBuat.onclick = async ()=>{
      if (r.siapBuat.disabled) return;
      r.siapBuat.disabled = true;
      try{
        if (!pakaiTranskripOtomatis(x)){
          umumkan("Tulisan belum bisa dipakai. Periksa hasil transkripnya.");
          return;
        }
        await buatCatatan();
      } finally { r.siapBuat.disabled = false; }
    };
    r.buang.onclick = ()=>{
      if (!x.tr) return;
      dialogTampil("<h3>Buang hasil transkripsi?</h3><p>Rekaman aslinya TIDAK dihapus. " +
        "Hanya hasil transkripsi yang dibuang, dan bisa dibuat ulang.</p>",
        [{label:"Batal", ndua:true},
         {label:"Buang hasil", aksi:()=>{ x.tr = null; renderAudioDraf(); }}]);
    };
    /* Suntingan pengguna = REVISI. Transkrip mentah tidak pernah ditimpa. */
    r.teks.oninput = ()=>{
      if (!x.tr) return;
      x.tr.revisi = r.teks.value;
      if (!Array.isArray(x.tr.koreksi)) x.tr.koreksi = [];
      const akhir = x.tr.koreksi[x.tr.koreksi.length - 1];
      const sekarang = r.teks.value;
      if (!akhir || akhir.teks !== sekarang){
        x.tr.koreksi.push({kapan:new Date().toISOString(), teks:sekarang});
        if (x.tr.koreksi.length > 5) x.tr.koreksi.shift();
      }
      if (x.tr.terpakai) x.tr.terpakai = false;
      perbaruiTombolPakai(x, r);
    };
  }
  if (x.tr && r.versi !== x.tr.versi) { r.versi = x.tr.versi; r.__perlu = true; }
  return r;
}

/* ============================================================
   "Gunakan Transkrip" — SATU klik, tanpa pindah kolom.
   Dulu tombol "Pakai sebagai bahan" hanya menyalin teks ke kotak paling atas,
   lalu pengguna harus menekan "Tambahkan sebagai bahan" lagi — dan kartunya
   lahir di luar layar dengan nama "Teks tempel N".
   ============================================================ */
function namaTranskrip(x){
  const dasar = String(x.nama || "rekaman").replace(/\.[a-z0-9]{1,5}$/i, "");
  return "Transkrip dari " + dasar;
}
function bahanTranskrip(x){
  const id = x.kunci || (x.kunci = idBaru("bahan"));
  return bahanTeks.find(b => b.asalTr === id) || null;
}
function perbaruiTombolPakai(x, r){
  if (!r || !r.pakai) return;
  if (bahanTranskrip(x)){
    r.pakai.textContent = "Sudah ditambahkan";
    r.pakai.disabled = true;
  } else {
    r.pakai.textContent = "Gunakan Transkrip";
    r.pakai.disabled = !((r.teks.value || "").trim());
  }
}
function gunakanTranskrip(x, r){
  if (!x.tr || !r) return;
  const teks = (r.teks.value || "").trim();
  if (!teks){ r.status.textContent = "Tidak ada teks untuk dipakai."; return; }
  const id = x.kunci || (x.kunci = idBaru("bahan"));
  const bagian = bagianBertanda(x.tr);   // {id, mulai, selesai, teks} — ikut tersimpan
  let b = bahanTranskrip(x);
  if (b){
    /* Klik berulang TIDAK menggandakan: relasi diperbarui, isi diganti. */
    b.teks = teks;
    b.bagian = bagian;
    b.revisi = (x.tr.koreksi || []).length;
    r.status.textContent = "Transkrip ini sudah ada di daftar bahan — isinya " +
      "diperbarui, tidak digandakan.";
  } else {
    b = {jenis:"teks", nama:namaTranskrip(x), teks, asalTr:id, induk:id, bagian,
         kunci:idBaru("bahan"), urut:urutBaru(),
         revisi:(x.tr.koreksi || []).length, dibuat:new Date().toISOString()};
    bahanTeks.push(b);
    r.status.textContent = "Transkrip masuk sebagai bahan — siap dipakai.";
  }
  x.tr.terpakai = true;
  renderAudioDraf();
  perbaruiRingkas();
  perbaruiTombolPakai(x, r);
  const li = (liPerBahan.get(b) || {}).li;
  if (li){
    try{ li.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){ li.scrollIntoView(); }
    li.classList.add("sorot");
    setTimeout(()=>li.classList.remove("sorot"), 1300);
  }
  umumkan("Bahan ditambahkan: " + b.nama);
  simpanDrafBahan();
}

/* Bagian per bagian: dengarkan, transkripsi ulang, sunting. Tanpa memaksa
   mendengar seluruh rekaman hanya untuk memeriksa satu bagian. */
function barisBagian(x, r, i){
  const st = x.tr;
  const kode = (st.kodeBagian || {})[i] || "";
  const LABEL_KODE = {hening:"hening — tidak ada ucapan terdeteksi",
    hening_ragu:"bersuara, tetapi layanan menjawab hening",
    terpotong:"jawaban penyedia terpotong", galat:"galat penyedia"};
  const div = document.createElement("div");
  div.className = "tr-baris-bagian";
  div.dataset.i = String(i);
  div.dataset.bagian = (st.meta && st.meta[i] && st.meta[i].id) || idBagian(i);
  const m = (st.meta || [])[i] || {};
  const jam = rentangBagian(m);
  div.innerHTML =
    '<span class="kcil">Bagian ' + (i + 1) + (jam ? ' · ' + jam : "") + ' · ' +
      Math.round(((st.bagian || [])[i] || "").length) + ' kar' +
      (LABEL_KODE[kode] ? ' · <b>' + LABEL_KODE[kode] + '</b>' : "") + '</span>' +
    '<span class="aksi">' +
      '<button class="kecil ndua" type="button" data-aksi="dengar">Dengarkan</button>' +
      '<button class="kecil ndua" type="button" data-aksi="ulang">Transkripsi ulang</button>' +
      '<button class="kecil ndua" type="button" data-aksi="sunting">Sunting</button>' +
    '</span>';
  div.querySelector('[data-aksi="dengar"]').onclick = async ()=>{
    const p = pemutarPerBahan.get(x);
    const mulai = (m.mulai != null) ? m.mulai : i * TRANSKRIP_POTONG;
    if (p && p.lompatKe){
      /* Tunggu lompatan benar-benar terjadi sebelum memutar: currentTime tidak
         bisa disetel sebelum metadata siap, dan tanpa penantian ini pemutaran
         mulai dari 0 (detik bagian jadi tidak bisa dipercaya). */
      try{ await p.lompatKe(mulai); await p.putar(); }
      catch(e){ umumkan("Rekaman belum bisa diputar: " + (e.message || e)); }
    }
    else umumkan("Pemutar rekaman ini belum siap.");
  };
  div.querySelector('[data-aksi="ulang"]').onclick = ()=>ulangBagian(x, r, i);
  div.querySelector('[data-aksi="sunting"]').onclick = ()=>{
    const isi = st.bagian[i] || "";
    const ta = r.teks;
    const pos = ta.value.indexOf(isi);
    ta.focus();
    if (pos >= 0) ta.setSelectionRange(pos, pos + isi.length);
    ta.scrollIntoView({block:"center"});
  };
  return div;
}

async function ulangBagian(x, r, i){
  if (!x.tr) return;
  const s = sibuk(r.sibukWadah, {label:"Mengulang bagian " + (i + 1) + "…",
    sub:"Hanya bagian ini, bukan seluruh rekaman."});
  try{
    if (!x.tr.pcm){
      const d = await dekodeKeMono16(x.blob, {kabar:(p, t)=>s.perbarui({sub:t, persen:p})});
      x.tr.pcm = d.pcm;
      if (!x.tr.durasi) x.tr.durasi = d.durasi;
    }
    /* [§10] "Transkripsi ulang" HARUS memakai rentang yang sama dengan
       potongan aslinya. Kalau batas sudah digeser ke jeda, i×90 dtk akan
       mengirim audio yang berbeda dari yang dulu dinilai — suntingan dan
       rujukan waktunya jadi tidak bisa dipercaya. */
    const m = (x.tr.meta || [])[i] || {};
    const mulai = Number.isFinite(m.mulaiS) ? m.mulaiS
      : (m.mulai != null ? Math.round(m.mulai * TRANSKRIP_LAJU)
         : i * TRANSKRIP_POTONG * TRANSKRIP_LAJU);
    const akhir = Math.min(x.tr.pcm.length,
      Number.isFinite(m.selesaiS) ? m.selesaiS
        : (m.selesai != null ? Math.round(m.selesai * TRANSKRIP_LAJU)
           : (i + 1) * TRANSKRIP_POTONG * TRANSKRIP_LAJU));
    if (akhir - mulai < 2 * TRANSKRIP_LAJU)
      throw galatJujur("Bagian ini terlalu pendek untuk dikirim ulang.", "terlalu_pendek");
    const isi = x.tr.pcm.subarray(mulai, akhir);
    const u = ukurUcapan(isi);
    let kirim = isi;
    if (u.awal >= 0){
      const bingkai = Math.round(BINGKAI_KIRIM_MS / 1000 * TRANSKRIP_LAJU);
      const a0 = Math.max(0, u.awal - bingkai);
      const a1 = Math.min(isi.length, u.akhir + bingkai);
      if (a1 - a0 >= 2 * TRANSKRIP_LAJU && a1 - a0 < isi.length)
        kirim = isi.subarray(a0, a1);
    }
    const potong = wavDariPCM(kirim, 0, kirim.length);
    const j = await kirimPotongan(potong, kirim.length / TRANSKRIP_LAJU);
    x.tr.bagian[i] = (j.teks || "").trim();
    if (!x.tr.kodeBagian) x.tr.kodeBagian = {};
    delete x.tr.kodeBagian[i];
    x.tr.ragu = (x.tr.ragu || []).filter(n => n !== i + 1);
    x.tr.mentah = gabungBagian(x.tr.bagian);
    x.tr.versi++;
    s.selesai("Bagian " + (i + 1) + " sudah diperbarui.");
    setTimeout(()=>s.hapus(), 1400);
  }catch(e){
    s.gagal("Bagian " + (i + 1) + " masih gagal.", (e.message || String(e)).slice(0, 160));
    setTimeout(()=>s.hapus(), 2200);
  }
  if (r.teks) r.teks.value = (x.tr.revisi != null ? x.tr.revisi : x.tr.mentah) || "";
  perbaruiTr(x, r.panel.parentElement);
  if (simpanDrafTr) simpanDrafTr();
}

function perbaruiTr(x, slot){
  const r = renderTr(x, slot); if (!r) return;
  const st = x.tr;
  if (!st){
    r.status.textContent = "";
    r.jalur.hidden = true;
    r.mulai.hidden = false; r.lanjut.hidden = true; r.henti.hidden = true;
    r.periksa.hidden = true;
    return;
  }
  const selesai = st.total > 0 && st.selesai >= st.total;
  r.mulai.hidden = st.jalan || st.total > 0;
  r.lanjut.hidden = !(st.total > 0 && !selesai && !st.jalan);
  r.lanjut.textContent = selesai
    ? "Selesai — semua bagian sudah ada"
    : "Lanjutkan dari bagian " + Math.min(st.selesai + 1, st.total) + " dari " + st.total;
  r.henti.hidden = !st.jalan;
  r.jalur.hidden = !(st.total > 0);
  r.isi.style.width = st.total ? Math.round(100 * st.selesai / st.total) + "%" : "0%";
  if (st.galat){
    r.status.className = "tr-status kcil gagal";
    r.status.textContent = st.galat;
  } else if (st.jalan){
    r.status.className = "tr-status kcil jalan";
    r.status.textContent = st.pesan || "Menyiapkan audio…";
  } else if ((st.pesan || "").trim()){
    r.status.className = "tr-status kcil" + (selesai ? " ok" : "");
    r.status.textContent = st.pesan;
  } else {
    r.status.className = "tr-status kcil";
  }
  /* Kotak periksa hanya terbuka saat proses TIDAK berjalan: hasil setengah
     jalan jangan terlihat seperti hasil jadi. */
  r.periksa.hidden = st.jalan || !(st.mentah || "").trim();
  /* "Tulisan ... sudah siap dipakai" + tombol Buat Catatan muncul TEPAT saat
     transkrip lengkap dan belum dipakai — di layar yang sama, bukan di halaman
     lain. Transkrip sebagian TIDAK menampilkannya (Direktif #13 §4). */
  if (r.siap){
    const lengkap = !st.jalan && selesai && !!(st.mentah || "").trim();
    r.siap.hidden = !lengkap || !!st.terpakai;
    if (r.siapBuat){
      r.siapBuat.disabled = false;
      r.siapBuat.textContent = "Buat Catatan";
    }
  }
  if (!r.periksa.hidden && document.activeElement !== r.teks){
    const tampil = st.revisi != null ? st.revisi : st.mentah;
    if (r.teks.value !== tampil) r.teks.value = tampil;
  }
  /* Penanda SIBUK di dalam panel transkrip: cakra + bagian n dari N + bar
     yang benar-benar diketahui + Batalkan. Bukan teks statis. */
  if (r.sibukWadah){
    if (st.jalan){
      if (!r.__sibuk){
        r.__sibuk = sibuk(r.sibukWadah, {
          label:"Mengubah rekaman menjadi tulisan",
          sub: st.total ? "bagian " + Math.min(st.selesai + 1, st.total) + " dari " + st.total : "menyiapkan rekaman",
          persen: st.total ? Math.round(100 * st.selesai / st.total) : undefined,
          batal: ()=>{ st.batal = true; }});
      } else {
        r.__sibuk.perbarui({
          sub: st.total ? "bagian " + Math.min(st.selesai + 1, st.total) + " dari " + st.total : "menyiapkan rekaman",
          persen: st.total ? Math.round(100 * st.selesai / st.total) : undefined});
      }
    } else if (r.__sibuk){
      r.__sibuk.hapus();
      r.__sibuk = null;
    }
  }
  if (st.terpakai && !st.jalan){
    r.status.className = "tr-status kcil ok";
    r.status.textContent = "Transkrip sudah menjadi bahan.";
  }
  /* Label bilah bawah harus mengikuti KENYATAAN transkripsi. Sesudah
     percobaan gagal tidak ada tulisan yang bisa dipakai, jadi tombol utama
     jujur berbunyi "Simpan Rekaman sebagai Draf" — bukan menjanjikan catatan
     yang tidak bisa disusun. Tanpa panggilan ini label tertinggal "Buat
     Catatan" (terukur 4 Nov 2026: transkrip ditolak "tanpa_suara", tombol
     tetap "Buat Catatan" sampai perbaruiTombolBuat dipaksa). */
  perbaruiTombolBuat();
  const ragu = st.ragu || [];
  if (r.ragu){
    r.ragu.hidden = !ragu.length;
    r.ragu.textContent = ragu.length
      ? "Periksa bagian " + ragu.join(", ") + ": hasilnya jauh lebih pendek dari bagian "
        + "lain. Ini PETUNJUK, bukan bukti ada ucapan yang hilang — panjang teks hanya "
        + "dibandingkan dengan median bagian lain. Dengarkan bagian itu, transkripsi ulang, "
        + "atau sunting teksnya. Rekaman aslinya tetap utuh."
      : "";
  }
  /* Daftar bagian: yang perlu diperiksa tampil lebih dulu, sisanya di balik
     ringkasan supaya tidak memenuhi layar. */
  if (r.bagianWadah && !r.periksa.hidden){
    r.bagianWadah.innerHTML = "";
    const total = st.total || 0;
    if (total){
      const perlu = new Set(ragu.map(n => n - 1));
      Object.keys(st.kodeBagian || {}).forEach(k => perlu.add(Number(k)));
      const judul = document.createElement("p");
      judul.className = "kcil";
      judul.style.margin = "8px 0 4px";
      judul.textContent = perlu.size
        ? perlu.size + " bagian perlu diperiksa"
        : "Semua bagian terlihat wajar";
      r.bagianWadah.appendChild(judul);
      const urut = [...perlu].sort((a,b)=>a-b);
      for (const i of urut) r.bagianWadah.appendChild(barisBagian(x, r, i));
      const det = document.createElement("details");
      det.className = "tr-semua-bagian";
      det.innerHTML = "<summary>Periksa tiap bagian (" + total + ")</summary>";
      for (let i = 0; i < total; i++) det.appendChild(barisBagian(x, r, i));
      r.bagianWadah.appendChild(det);
    }
  }
  perbaruiTombolPakai(x, r);
}


function pasangPemutar(blob, wadah, opsi){
  opsi = opsi || {};
  const akar = document.createElement("div");
  akar.className = "pemutar";
  akar.innerHTML =
    '<button class="pemutar-main" type="button" aria-label="Putar rekaman">' +
      '<span class="pemutar-ikon" aria-hidden="true">▶</span>' +
      '<span class="pemutar-teks">Putar</span></button>' +
    '<div class="pemutar-jalur" role="slider" tabindex="0" aria-label="Posisi pemutaran"' +
      ' aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="pemutar-isi"></span></div>' +
    '<span class="pemutar-waktu">0:00 / --:--</span>' +
    '<button class="pemutar-unduh kecil ndua" type="button">Unduh</button>' +
    '<p class="pemutar-status" role="status"></p>';

  const tombol  = akar.querySelector(".pemutar-main");
  const ikon    = akar.querySelector(".pemutar-ikon");
  const teksBtn = akar.querySelector(".pemutar-teks");
  const jalur   = akar.querySelector(".pemutar-jalur");
  const isiJalur= akar.querySelector(".pemutar-isi");
  const waktu   = akar.querySelector(".pemutar-waktu");
  const status  = akar.querySelector(".pemutar-status");

  const el = document.createElement("audio");
  el.preload = "metadata";
  el.hidden = true;              // suara keluar dari elemen ini; yang terlihat kontrolnya
  if (opsi.sumber_id) akar.dataset.sumberId = opsi.sumber_id;   // untuk uji & rujukan
  akar.appendChild(el);

  const h = {akar, el, durasi:0, perkiraan:false, nama:opsi.nama || "rekaman",
             gagal:false, url:""};
  if (opsi.durasi && isFinite(opsi.durasi)) h.durasi = opsi.durasi;
  /* Rekaman panjang dipecah menjadi beberapa BAGIAN (perekam diganti tiap
     10 menit, lihat REKAM_BAGIAN_MS). Tiap bagian adalah berkas WebM
     tersendiri, jadi pemutar WAJIB berpindah bagian saat yang sekarang
     habis — bukan memutar bagian pertama lalu diam, yang membuat 90 menit
     terasa hilang padahal tersimpan. */
  h.bagian = Array.isArray(opsi.bagian) && opsi.bagian.length ? opsi.bagian : null;
  h.i = 0; h.dasar = 0;

  const pesan = (s, jenis)=>{
    status.textContent = s || "";
    status.className = "pemutar-status" + (jenis ? " " + jenis : "");
  };
  const tulis = ()=>{
    /* SATU sumber angka: durasi hasil dekode (jumlah frame PCM ÷ laju sampel).
       Metadata kontainer AAC/VBR boleh meleset ~58 detik — dulu ia MENIMPA
       hasil dekode (26:42 di pemutar vs 25:44 di kartu). Metadata hanya dipakai
       bila dekode belum ada, dan saat itu ditandai "perkiraan". */
    const d = (isFinite(h.durasi) && h.durasi > 0) ? h.durasi
            : (isFinite(el.duration) && el.duration > 0 ? el.duration : 0);
    const kini = h.dasar + (isFinite(el.currentTime) ? el.currentTime : 0);
    const p = (d > 0) ? Math.min(kini/d, 1) : 0;
    isiJalur.style.width = (p*100).toFixed(2) + "%";
    const kanan = d > 0
      ? waktuPemutar(d) + (h.perkiraan ? " (perkiraan)" : "")
      : "belum diketahui";
    waktu.textContent = waktuPemutar(kini) + " / " + kanan;
    jalur.setAttribute("aria-valuenow", String(Math.round(p*100)));
    jalur.setAttribute("aria-valuetext", waktuPemutar(kini) + " dari " +
      (d > 0 ? waktuPemutar(d) : "durasi yang belum diketahui"));
  };
  const tentukanDurasi = async ()=>{
    if (isFinite(h.durasi) && h.durasi > 0){ tulis(); return; }   // dekode menang
    if (isFinite(el.duration) && el.duration > 0){
      h.durasi = el.duration; h.perkiraan = true; tulis(); return;
    }
    /* MediaRecorder/WebM sering melaporkan duration = Infinity.
       Hitung dari jumlah frame PCM hasil dekode — bukan dari metadata berkas. */
    try{ h.durasi = await dekodeAudio(blob); h.perkiraan = false; tulis(); }
    catch(e){ /* tetap "belum diketahui" — bukan 0:00 yang menyesatkan */ }
  };
  const keTombolPutar = ()=>{
    ikon.textContent = "▶"; teksBtn.textContent = "Putar";
    tombol.setAttribute("aria-label","Putar rekaman");
    akar.classList.remove("sedang-putar");
  };
  /* Melanjutkan ke bagian berikutnya. Sebab kegagalan TIDAK ditelan: kalau
     bagian berikutnya menolak diputar, pengguna harus tahu bagian mana yang
     berhenti — bukan melihat tombol berubah tanpa penjelasan. */
  const lanjutPutar = async ()=>{
    try{ await el.play(); }
    catch(e){
      const nama = (e && e.name) || "Error";
      if (nama === "AbortError") return;
      akar.classList.add("gagal-putar");
      keTombolPutar();
      pesan("Bagian berikutnya tidak bisa diputar otomatis (" + nama + "). " +
        "Tekan Putar untuk melanjutkan — rekaman TETAP tersimpan.", "gagal");
    }
  };

  tombol.onclick = async ()=>{
    if (!el.paused){ el.pause(); return; }
    pesan("Memutar…", "jalan");            // umpan balik SEKETIKA, bukan menunggu
    try{
      await el.play();
    }catch(e){
      const nama = (e && e.name) || "Error";
      if (nama === "AbortError"){ pesan("Pemutaran dibatalkan.", ""); return; }
      if (nama === "NotAllowedError")
        pesan("Peramban memblokir pemutaran otomatis. Tekan Putar sekali lagi — " +
          "rekaman tetap tersimpan.", "gagal");
      else
        pesan("Rekaman tidak bisa diputar di peramban ini (" + nama + "). " +
          "Rekaman TETAP tersimpan — silakan unduh lalu putar di aplikasi lain.", "gagal");
      akar.classList.add("gagal-putar");
      keTombolPutar();
    }
  };
  el.addEventListener("loadedmetadata", ()=>{ tentukanDurasi(); tulis(); });
  el.addEventListener("canplay", ()=>{
    if (h.gagal){ h.gagal = false; akar.classList.remove("gagal-putar"); pesan("", ""); }
  });
  el.addEventListener("playing", ()=>{
    ikon.textContent = "❚❚"; teksBtn.textContent = "Jeda";
    tombol.setAttribute("aria-label","Jeda pemutaran");
    akar.classList.add("sedang-putar"); pesan("", ""); tulis();
  });
  el.addEventListener("pause", ()=>{ keTombolPutar(); });
  el.addEventListener("timeupdate", tulis);
  el.addEventListener("ended", ()=>{
    /* Berpindah ke bagian berikutnya TANPA jeda buatan: rekaman 100 menit
       terdiri atas 10 bagian, dan berhenti di menit ke-10 akan membuat
       sembilan per sepuluh rekaman terasa hilang. */
    if (h.bagian && h.i < h.bagian.length - 1){
      h.muatBagian(h.i + 1, ()=>{ lanjutPutar(); });
      return;
    }
    keTombolPutar();
    try{ el.currentTime = 0; }catch(e){}
    if (h.bagian){ h.i = 0; h.dasar = 0; h.muatBagian(0); }
    tulis();
  });
  el.addEventListener("error", ()=>{
    const kode = (el.error && el.error.code) || 0;
    const arti = {1:"pemutaran dibatalkan peramban",
                  2:"gangguan saat membaca berkas",
                  3:"isi berkas audio tidak bisa dibaca (mungkin rusak)",
                  4:"format audio ini tidak didukung peramban ini"}[kode] || "sebab tidak diketahui";
    h.gagal = true;
    akar.classList.add("gagal-putar");
    keTombolPutar();
    pesan("Rekaman tidak bisa diputar: " + arti + " (kode " + kode + "). " +
      "Rekaman TETAP tersimpan — silakan unduh lalu putar di aplikasi lain.", "gagal");
  });

  const lompat = ev=>{
    const d = (isFinite(h.durasi) && h.durasi > 0) ? h.durasi : el.duration;
    if (!isFinite(d) || d <= 0) return;
    const r = jalur.getBoundingClientRect();
    if (!r.width) return;
    const p = Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1);
    h.__keWaktu(p * d, tulis);
  };
  jalur.onclick = lompat;
  jalur.onkeydown = ev=>{
    const d = h.durasi || el.duration;
    if (!isFinite(d) || d <= 0) return;
    if (ev.key === "ArrowRight"){ try{ el.currentTime = Math.min(el.currentTime + 5, d); }catch(e){} tulis(); ev.preventDefault(); }
    if (ev.key === "ArrowLeft"){ try{ el.currentTime = Math.max(el.currentTime - 5, 0); }catch(e){} tulis(); ev.preventDefault(); }
    if (ev.key === " " || ev.key === "Enter"){ tombol.click(); ev.preventDefault(); }
  };
  akar.querySelector(".pemutar-unduh").onclick = ()=>{
    unduhBerkas(h.nama, blob, blob.type || "audio/webm");
  };

  /* --- perpindahan bagian (hanya untuk rekaman yang dipecah per 10 menit) --- */
  h.muatBagian = (i, sesudah)=>{
    i = Math.max(0, Math.min(i, (h.bagian ? h.bagian.length : 1) - 1));
    const b = h.bagian ? h.bagian[i] : null;
    if (b && (h.i !== i || !h.url)){
      if (h.url){ try{ URL.revokeObjectURL(h.url); }catch(e){} }
      h.url = URL.createObjectURL(b.blob);
      el.src = h.url; el.load();
    }
    h.i = i;
    h.dasar = 0;
    if (h.bagian) for (let k = 0; k < i; k++) h.dasar += (h.bagian[k].durasi || 0);
    if (sesudah){
      if (el.readyState >= 1) sesudah();
      else el.addEventListener("loadedmetadata", sesudah, {once:true});
    }
  };
  /* Detik GLOBAL (dari transkrip) → bagian yang tepat + detik lokal. Tanpa
     pemetaan ini, "Dengarkan bagian ini" pada rekaman 100 menit selalu
     melompat ke bagian pertama — rujukan waktu jadi tidak bisa dipercaya. */
  h.__keWaktu = (detik, lalu)=>{
    const total = (isFinite(h.durasi) && h.durasi > 0) ? h.durasi : detik;
    let t = Math.max(0, Math.min(Number(detik) || 0, total));
    if (!h.bagian){ try{ el.currentTime = t; }catch(e){} if (lalu) lalu(); return; }
    let i = 0;
    while (i < h.bagian.length - 1 && t >= (h.bagian[i].durasi || 0)){
      t -= (h.bagian[i].durasi || 0); i++;
    }
    h.muatBagian(i, ()=>{ try{ el.currentTime = t; }catch(e){} if (lalu) lalu(); });
  };
  try{
    if (h.bagian) h.muatBagian(0);
    else { h.url = URL.createObjectURL(blob); el.src = h.url; el.load(); }
  }catch(e){
    h.gagal = true;
    akar.classList.add("gagal-putar");
    pesan("Rekaman tersimpan tetapi tidak bisa disiapkan untuk diputar (" +
      (e.name || e.message || e) + "). Silakan unduh.", "gagal");
  }
  h.hancurkan = ()=>{
    try{ el.pause(); }catch(e){}
    try{ el.removeAttribute("src"); el.load(); }catch(e){}
    if (h.url){ try{ URL.revokeObjectURL(h.url); }catch(e){} h.url = ""; }
    akar.remove();
  };
  /* Dipakai "Dengarkan bagian ini" pada kotak periksa transkrip dan pada dialog
     sumber: melompat ke detik tertentu dari rekaman yang SAMA, bukan membuat
     pemutar kedua. Mengembalikan Promise karena currentTime TIDAK bisa disetel
     sebelum metadata siap — tanpa penantian itu lompatan gagal diam-diam dan
     pemutaran mulai dari 0 (rujukan detik jadi tidak bisa dipercaya). */
  h.lompatKe = (detik)=> new Promise((resolve)=>{
    if (!isFinite(detik)){ resolve(h.dasar + (el.currentTime || 0)); return; }
    /* Rekaman bersesi: detik GLOBAL harus diterjemahkan ke bagian yang tepat
       lebih dulu, kalau tidak lompatan selalu jatuh di bagian pertama. */
    if (h.bagian){
      h.__keWaktu(detik, ()=>{
        h.__detik = el.currentTime;
        tulis();
        resolve(h.dasar + (el.currentTime || 0));
      });
      return;
    }
    const pasang = ()=>{
      const durasi = isFinite(el.duration) ? el.duration : Infinity;
      const t = Math.max(0, Math.min(Number(detik) || 0, durasi - 0.05));
      try{ el.currentTime = t; }catch(e){}
      h.__detik = t;
      tulis();
      resolve(el.currentTime);
    };
    if (el.readyState >= 1){ pasang(); return; }
    let sudah = false;
    const sekali = ()=>{ if (sudah) return; sudah = true;
      el.removeEventListener("loadedmetadata", sekali); pasang(); };
    el.addEventListener("loadedmetadata", sekali);
    try{ el.load(); }catch(e){}
    /* Jaring pengaman: bila metadata tetap tidak datang (berkas rusak), jangan
       menggantung selamanya — coba sekali lagi lalu selesaikan. */
    setTimeout(sekali, 4000);
  });
  h.putar = async ()=>{
    if (el.ended || (isFinite(el.duration) && el.duration > 0 &&
        el.currentTime >= el.duration - 0.05)){
      /* Elemen berstatus "ended" mengembalikan posisi ke 0 saat play(). Itu
         akan menghapus lompatan yang baru saja dilakukan. */
      try{ el.currentTime = isFinite(h.__detik) ? h.__detik : 0; }catch(e){}
    }
    if (el.paused){
      try{ await el.play(); }catch(e){ tombol.click(); }
    }
  };
  tulis();
  if (wadah) wadah.appendChild(akar);
  return h;
}

function renderAudioDraf(){
  const ul = $("#a-daftar"); if (!ul) return;
  const dipakai = new Set();

  /* --- bahan tulisan: kartu ringkas (kotak teks besar tetap di panelnya) --- */
  const gambarTeks = (x)=>{
    dipakai.add(x);
    let r = liPerBahan.get(x);
    if (!r){
      const li = document.createElement("li");
      li.className = "bahan-item";
      li.dataset.jenis = "teks";
      li.innerHTML =
        '<span class="lencana">' + (x.asalTr ? "transkrip" : "tulisan") + '</span>' +
        '<span class="nama"></span>' +
        '<span class="kcil" data-isi="info"></span>' +
        '<span class="aksi">' + TOMBOL_URUT +
          '<button class="kecil ndua" data-aksi="lihat-teks" type="button">Lihat</button>' +
          (x.asalTr
            ? '<button class="kecil ndua" data-aksi="sunting-teks" type="button">Sunting</button>' +
              '<button class="kecil ndua" data-aksi="hapus" type="button">Lepaskan</button>'
            : '<button class="kecil ndua" data-aksi="hapus" type="button">Hapus</button>') +
        '</span>';
      li.querySelector('[data-aksi="naik"]').onclick = ()=>geserUrut(x, -1);
      li.querySelector('[data-aksi="turun"]').onclick = ()=>geserUrut(x, 1);
      li.querySelector('[data-aksi="lihat-teks"]').onclick = ()=>{
        dialogTampil("<h3>" + esc(x.nama) + "</h3>" +
          "<textarea readonly style='min-height:260px'>" + esc(x.teks) + "</textarea>",
          [{label:"Tutup", ndua:true}]);
      };
      const tSunting = li.querySelector('[data-aksi="sunting-teks"]');
      if (tSunting) tSunting.onclick = ()=>{
        const id = "sunt-" + Math.random().toString(36).slice(2,7);
        dialogTampil("<h3>Sunting " + esc(x.nama) + "</h3>" +
          "<textarea id='" + id + "' style='min-height:260px'>" + esc(x.teks) + "</textarea>" +
          "<p class='kcil'>Yang berubah hanya bahan ini. Transkrip mentah di rekaman tetap utuh.</p>",
          [{label:"Batal", ndua:true},
           {label:"Simpan suntingan", aksi:()=>{
              const v = document.getElementById(id);
              if (!v) return;
              x.teks = v.value;
              x.revisi = (x.revisi || 0) + 1;
              x.diubah = new Date().toISOString();
              renderAudioDraf(); perbaruiRingkas(); simpanDrafBahan();
              umumkan("Bahan diperbarui: " + x.nama);
           }}]);
      };
      li.querySelector('[data-aksi="hapus"]').onclick = ()=>{
        const k = bahanTeks.indexOf(x);
        if (k >= 0) bahanTeks.splice(k, 1);
        renderAudioDraf(); perbaruiRingkas();
      };
      r = {li};
      liPerBahan.set(x, r);
    }
    r.li.querySelector(".nama").textContent = x.nama;
    r.li.querySelector('[data-isi="info"]').textContent = x.asalTr
      ? "Siap digunakan · " + x.teks.length.toLocaleString("id") + " karakter" +
        (x.revisi ? " · " + x.revisi + " suntingan" : "")
      : x.teks.length.toLocaleString("id") + " karakter";
    ul.appendChild(r.li);
  };

  /* --- bahan audio/transkrip: <li> dan pemutarnya DIPAKAI ULANG, supaya
         menggambar ulang daftar tidak menghentikan pemutaran (cacat (e)) --- */
  const gambarAudio = (x,i)=>{
    dipakai.add(x);
    let r = liPerBahan.get(x);
    if (!r){
      const li = document.createElement("li");
      li.className = "bahan-item";
      li.dataset.jenis = x.jenis;
      li.innerHTML =
        '<span class="lencana"></span>' +
        '<span class="nama"></span>' +
        '<span class="kcil" data-isi="info"></span>' +
        '<span class="aksi">' + TOMBOL_URUT +
          '<button class="kecil ndua" data-aksi="hapus" type="button">Hapus</button>' +
        '</span>' +
        '<div class="pemutar-slot"></div>' +
        '<div class="tr-slot"></div>';
      li.querySelector('[data-aksi="naik"]').onclick = ()=>geserUrut(x, -1);
      li.querySelector('[data-aksi="turun"]').onclick = ()=>geserUrut(x, 1);
      li.querySelector('[data-aksi="hapus"]').onclick = ()=>{
        const k = audioDraf.indexOf(x);
        if (k >= 0) audioDraf.splice(k,1);
        renderAudioDraf(); perbaruiRingkas();
        /* Draf di perangkat mengikuti keadaan nyata: bila semua bahan dihapus,
           catatan drafnya ikut dibuang (bukan menyisakan blob yatim). */
        if (audioDraf.length){ simpanDrafBahan(); simpanDrafTr(); } else hapusDrafBahan();
      };
      r = {li};
      liPerBahan.set(x, r);
    }
    r.li.querySelector(".lencana").textContent =
      x.jenis === "transkrip-mentah" ? "transkrip" : "audio";
    r.li.querySelector(".nama").textContent = x.nama;
    r.li.querySelector('[data-isi="info"]').textContent = infoBahan(x);
    r.li.dataset.i = String(i);
    if (x.blob && !r.pemutar){
      r.pemutar = pasangPemutar(x.blob, r.li.querySelector(".pemutar-slot"),
        {nama:x.nama, durasi:x.durasi, bagian:x.bagianBlob || null});
      pemutarPerBahan.set(x, r.pemutar);
    }
    if (x.blob) perbaruiTr(x, r.li.querySelector(".tr-slot"));
    ul.appendChild(r.li);   // memindahkan node: urutan ikut array, pemutaran tetap jalan
  };

  /* URUTAN BAHAN: satu nomor `urut` bersama untuk teks DAN audio.
     Sebelumnya dua perulangan terpisah selalu menaruh semua teks di atas semua
     audio, sehingga "urutan penambahan" tidak pernah benar begitu bahannya
     campuran. Sekarang daftar digambar menurut nomor urut. */
  const semuaBahan = semuaBahanUrut();
  semuaBahan.forEach((x, i)=>{
    if (x.jenis === "teks") gambarTeks(x);
    else if (x.jenis === "foto"){ dipakai.add(x); ul.appendChild(gambarFoto(x)); }
    else if (x.jenis === "video"){ dipakai.add(x); ul.appendChild(gambarVideo(x, i)); }
    else gambarAudio(x, i);
  });
  /* Naik dimatikan di bahan pertama, Turun di bahan terakhir — dengan ALASAN
     yang terbaca, bukan tombol yang hilang tanpa penjelasan. */
  semuaBahan.forEach((x, i) => {
    const r = liPerBahan.get(x);
    if (!r) return;
    const naik = r.li.querySelector('[data-aksi="naik"]');
    const turun = r.li.querySelector('[data-aksi="turun"]');
    if (naik){
      naik.disabled = i === 0;
      naik.title = naik.disabled ? "Sudah paling atas" : "Naikkan urutan";
      naik.setAttribute("aria-label", naik.title);
    }
    if (turun){
      turun.disabled = i === semuaBahan.length - 1;
      turun.title = turun.disabled ? "Sudah paling bawah" : "Turunkan urutan";
      turun.setAttribute("aria-label", turun.title);
    }
  });

  /* --- buang sisa bahan yang sudah dihapus --- */
  for (const x of [...liPerBahan.keys()]){
    if (dipakai.has(x)) continue;
    const r = liPerBahan.get(x);
    if (r.pemutar){ try{ r.pemutar.hancurkan(); }catch(e){} pemutarPerBahan.delete(x); }
    r.li.remove(); liPerBahan.delete(x);
  }
  /* Petunjuk urutan hanya berguna bila ada lebih dari satu bahan. */
  const hint = $("#a-urutan-hint");
  if (hint) hint.hidden = semuaBahan.length < 2;
}
/* ---------- draf bahan: disimpan SEBELUM diproses ---------- */
/* Dua catatan terpisah supaya murah: "bahan" memuat blob (ditulis saat bahan
   berubah), "tr" hanya kemajuan transkrip (ditulis tiap bagian selesai —
   kegagalan di bagian 12 tidak mengulang bagian 1–11, juga setelah muat ulang). */
function objekDrafBahan(){
  return {id:"bahan", dibuat:new Date().toISOString(),
      audio: audioDraf.map(x=>({kunci:x.kunci, jenis:x.jenis, nama:x.nama,
        blob:x.blob, ukuran:x.ukuran, durasi:x.durasi, urut:x.urut || 0,
        asal:x.asal || null, sesiId:x.sesiId || null,
        /* Rekaman panjang dipecah per 10 menit; tiap bagian adalah berkas
           WebM tersendiri, jadi semuanya harus ikut tersimpan — bukan hanya
           bagian pertama. */
        bagian:(x.bagianBlob || []).map(b=>({bagian:b.bagian, blob:b.blob,
          durasi:b.durasi}))})),
      /* Bahan TEKS juga harus ikut. Sebelumnya hanya `audio` yang disimpan,
         sehingga teks yang ditambahkan dari "Pilih File" (atau tempel) hilang
         begitu halaman dimuat ulang — terukur: 4 bahan menjadi 2. */
      teks: bahanTeks.map(x=>({kunci:x.kunci || (x.kunci = idBaru("bahan")),
        nama:x.nama, teks:x.teks, asalTr:x.asalTr || null, induk:x.induk || null,
        revisi:x.revisi || 0, dibuat:x.dibuat || null, urut:x.urut || 0})),
      /* Foto: gambar ASLI dan salinan proses ikut tersimpan, begitu pula teks
         hasil bacaan dan suntingannya. Tanpa ini foto hilang saat halaman
         dimuat ulang — kesalahan yang sama seperti draf teks dulu. */
      foto: bahanFoto.map(x=>({kunci:x.kunci, nama:x.nama, blob:x.blob,
        blobProses:x.blobProses, lebar:x.lebar, tinggi:x.tinggi,
        mimeAsli:x.mimeAsli, ukuran:x.ukuran, ukuranProses:x.ukuranProses,
        teks:x.teks, teksAsli:x.teksAsli, unsur:x.unsur, terbaca:x.terbaca,
        status:x.status, diperiksa:!!x.diperiksa, revisi:x.revisi || 0,
        asal:x.asal || "berkas", urut:x.urut || 0, dibuat:x.dibuat || null})),
      video: bahanVideo.map(x=>({kunci:x.kunci, nama:x.nama, blob:x.blob,
        ukuran:x.ukuran, durasi:x.durasi, lebar:x.lebar, tinggi:x.tinggi,
        suara:x.suara || "", status:x.status || "baru",
        cuplikan:(x.cuplikan || []).map(c=>({waktu:c.waktu, blob:c.blob})),
        asal:x.asal || "berkas", urut:x.urut || 0}))};
}
async function simpanDrafBahan(){
  try{ await dbSimpan("draf", objekDrafBahan()); }
  catch(e){ /* penyimpanan penuh/diblokir: jangan hentikan pemakaian */ }
}
/* Versi yang MELEMPAR bila gagal. Dipakai sebelum potongan rekaman dibuang:

}
