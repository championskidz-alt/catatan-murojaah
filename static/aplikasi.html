<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Catatan Murojaah — Catatan Saya</title>
<style>
:root{
  color-scheme:dark;
  /* ---- warna: gelap (bawaan) ---- */
  --bg:#0b1120; --bg-2:#0e1526;
  --permukaan-1:#141d31; --permukaan-2:#1a2540; --permukaan-3:#22304f;
  --garis:#2a3a5f; --garis-kuat:#3c5180;
  --teks:#e9eefb; --teks-2:#c6d2e8; --redup:#9db0d0;
  --aksen:#4d8df6; --aksen-hover:#6ea3f9; --aksen-lembut:#16243c;
  --toska:#3ad0c0; --toska-lembut:#0d2b2b;
  --ok:#5fd39a; --ok-lembut:#0e2a1f;
  --ingat:#f2c66d; --ingat-lembut:#2b2314;
  --gagal:#f08c8c; --gagal-lembut:#2c1a1a;
  --baca-bg:#101a2e; --baca-teks:#e9eefb; --baca-garis:#2a3a5f;
  --teks-tombol:#08111f;
  /* alias lama — komponen lama tetap memakai nama ini */
  --panel:var(--permukaan-1); --panel2:var(--permukaan-2);
  --aksen2:var(--aksen-hover); --hijau:var(--ok); --merah:var(--gagal); --kuning:var(--ingat);
  /* ---- cahaya terarah (aurora) — statis, bukan animasi terus-menerus ---- */
  --aurora-1:rgba(58,208,192,.17); --aurora-2:rgba(126,94,255,.15);
  --aurora-3:rgba(77,141,246,.13);
  --kepala-bg:rgba(11,17,32,.80); --panel-bg:rgba(20,29,49,.94);
  --kilau:0 0 22px -8px rgba(77,141,246,.75);
  /* ---- tipografi ---- */
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --font-arab:"Noto Naskh Arabic","Traditional Arabic","Segoe UI",serif;
  --f-judul-besar:clamp(1.85rem,3.4vw,2.5rem);
  --f-judul:1.42rem; --f-sub:1.12rem; --f-isi:1rem; --f-kecil:.85rem;
  --baca-ukuran:1.08rem; --baris-baca:1.75;
  /* ---- ruang, radius, bayangan ---- */
  --r-1:8px; --r-2:12px; --r-3:16px; --r-pil:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --bayang-1:0 1px 2px rgba(0,0,0,.20),0 2px 6px rgba(0,0,0,.14);
  --bayang-2:0 10px 30px rgba(0,0,0,.30);
  --lebar:1120px; --transisi:140ms ease;
  /* tinggi kepala aplikasi — dipakai bilah hasil yang menempel */
  --kepala:62px;
  /* ---- gerak: satu bahasa untuk seluruh aplikasi ---- */
  --dur-1:160ms; --dur-2:320ms; --ease:cubic-bezier(.2,.7,.2,1);
  --kepala-nyata:62px;
}
[data-tema="terang"]{
  color-scheme:light;
  --bg:#f6f8fc; --bg-2:#eef2f8;
  --permukaan-1:#ffffff; --permukaan-2:#f2f5fa; --permukaan-3:#e6ecf6;
  --garis:#d6dded; --garis-kuat:#b6c2d8;
  --teks:#111a2b; --teks-2:#2f3d55; --redup:#596a85;
  --aksen:#1b5fd0; --aksen-hover:#154ea9; --aksen-lembut:#e6efff;
  --toska:#0c7f75; --toska-lembut:#dff5f2;
  --ok:#157347; --ok-lembut:#e2f4ea;
  --ingat:#8a5a00; --ingat-lembut:#fdf0d6;
  --gagal:#b3261e; --gagal-lembut:#fbe7e5;
  --baca-bg:#ffffff; --baca-teks:#16202f; --baca-garis:#dde3ee;
  --teks-tombol:#ffffff;
  --bayang-1:0 1px 2px rgba(16,26,43,.06),0 2px 6px rgba(16,26,43,.08);
  --bayang-2:0 12px 32px rgba(16,26,43,.16);
  /* terang dirancang sendiri, bukan pembalikan warna otomatis */
  --aurora-1:rgba(12,127,117,.12); --aurora-2:rgba(104,78,214,.10);
  --aurora-3:rgba(27,95,208,.10);
  --kepala-bg:rgba(246,248,252,.84); --panel-bg:rgba(255,255,255,.96);
  --kilau:0 0 18px -8px rgba(27,95,208,.55);
}
*{box-sizing:border-box}
/* display dari aturan komponen mengalahkan [hidden] bawaan peramban —
   tanpa ini elemen yang seharusnya tersembunyi tetap tampil & menyerap klik. */
[hidden]{display:none !important}
html{scroll-padding-top:76px;scroll-padding-bottom:120px}
html,body{margin:0;padding:0;background:var(--bg);color:var(--teks);
  font-family:var(--font);font-size:var(--f-isi);line-height:1.65;
  -webkit-text-size-adjust:100%}
/* Cahaya terarah: tiga sumber lembut di atas, kanan, dan bawah. Statis —
   tidak ada animasi terus-menerus; teks panjang tetap tenang dibaca. */
body{
  min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(58% 42% at 10% -8%, var(--aurora-1), transparent 70%),
    radial-gradient(46% 38% at 92% -2%, var(--aurora-2), transparent 72%),
    radial-gradient(70% 46% at 50% 108%, var(--aurora-3), transparent 74%);
  background-repeat:no-repeat;
  background-attachment:fixed;
}
h1,h2,h3,h4{line-height:1.28;margin:0 0 var(--s-2)}
h1{font-size:var(--f-judul);font-weight:800;letter-spacing:-.022em}
h2{font-size:var(--f-sub);font-weight:700;letter-spacing:-.012em}
h3{font-size:1.02rem}
p{margin:0 0 var(--s-3)}
a{color:var(--aksen);text-decoration:none}
a:hover{text-decoration:underline}
/* Fokus dan pilihan aktif memakai batas bercahaya tipis — jelas, tidak berisik. */
:focus-visible{outline:2px solid var(--aksen);outline-offset:2px;border-radius:var(--r-1);
  box-shadow:0 0 0 4px var(--aksen-lembut)}
.wrap{max-width:var(--lebar);margin:0 auto;padding:var(--s-4)}

/* ---------- kepala aplikasi ---------- */
header.app{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--garis);
  background:var(--kepala-bg);backdrop-filter:blur(14px) saturate(140%)}
header.app .wrap{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  padding:var(--s-2) var(--s-4);min-height:56px}
/* Merek = TAUTAN ke beranda, bukan hiasan. Karena itu ia punya bentuk tombol
   (latar + garis + glow halus saat hover), cincin fokus yang terlihat, dan
   respons sentuh — tetapi TIDAK berkedip: tidak ada animasi berulang di sini. */
header.app .merek{font-weight:700;font-size:1.06rem;color:var(--teks);text-decoration:none;
  display:inline-flex;align-items:center;gap:var(--s-2);min-height:44px;
  padding:3px 10px 3px 6px;border-radius:var(--r-2);border:1px solid transparent;
  transition:background .18s var(--ease),border-color .18s var(--ease),
    box-shadow .18s var(--ease),color .18s var(--ease),transform .12s var(--ease)}
header.app .merek:hover{color:var(--teks);text-decoration:none;
  background:var(--permukaan-2);border-color:var(--garis);
  box-shadow:0 0 0 3px var(--aksen-lembut)}
header.app .merek:focus-visible{outline:2px solid var(--aksen);outline-offset:2px}
header.app .merek:active{transform:translateY(1px)}
.merek-teks{display:flex;flex-direction:column;line-height:1.16;min-width:0}
.merek-nama{font-size:1.06rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.merek-slogan{font-size:.72rem;font-weight:500;color:var(--teks-2);letter-spacing:.005em;
  white-space:nowrap}
.merek-rumah{opacity:.5;flex:0 0 auto}
header.app .merek:hover .merek-rumah{opacity:.9}
@media(prefers-reduced-motion:reduce){
  header.app .merek{transition:none}
  header.app .merek:active{transform:none}
}
header.app nav{display:flex;gap:var(--s-1);margin-left:auto;flex-wrap:wrap;align-items:center}
header.app nav a{color:var(--teks-2);padding:10px 12px;border-radius:var(--r-1);
  min-height:44px;display:inline-flex;align-items:center;font-size:.94rem}
header.app nav a:hover{background:var(--permukaan-2);color:var(--teks);text-decoration:none}
header.app nav a[aria-current="page"]{background:var(--aksen-lembut);color:var(--aksen);font-weight:600}
/* Label pendek hanya dipakai di layar sempit (lihat @media 430px). */
header.app nav a .pdk{display:none}
.pilih-tema{display:inline-flex;align-items:center;gap:var(--s-1);margin-left:var(--s-2)}
.pilih-tema select{width:auto;min-height:44px;padding:8px 10px;background:var(--permukaan-2);
  color:var(--teks);border:1px solid var(--garis);border-radius:var(--r-1);font:inherit;font-size:.9rem}

/* ---------- tombol ---------- */
button,.tombol{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  background:var(--aksen);color:var(--teks-tombol);border:1px solid transparent;border-radius:var(--r-1);
  padding:11px 18px;min-height:44px;font:inherit;font-weight:600;cursor:pointer;
  text-decoration:none;transition:background var(--transisi),border-color var(--transisi),transform var(--transisi)}
button:hover,.tombol:hover{background:var(--aksen-hover);text-decoration:none}
button:active,.tombol:active{transform:translateY(1px)}
button.ndua,.tombol.ndua{background:var(--permukaan-2);color:var(--teks);border-color:var(--garis)}
button.ndua:hover,.tombol.ndua:hover{background:var(--permukaan-3);border-color:var(--garis-kuat)}
button.kecil{padding:8px 12px;min-height:44px;font-size:.88rem;font-weight:600}
button.polos{background:transparent;color:var(--teks-2);border-color:transparent}
button.polos:hover{background:var(--permukaan-2);color:var(--teks)}
button:disabled,.tombol[aria-disabled="true"]{opacity:.55;cursor:not-allowed;transform:none}
button.ndua,.tombol.ndua,[data-tema="terang"] button.ndua,[data-tema="terang"] .tombol.ndua{color:var(--teks)}

/* ---------- kartu, lencana, status ---------- */
/* INFORMASI lebih tenang daripada KENDALI (§B4). Sebelumnya justru terbalik:
   .kartu memakai --bayang-1 (bayangan seperti tombol) sedangkan .kartu-pilih
   tidak punya bayangan sama sekali, sehingga kartu informasi terbaca lebih
   "bisa ditekan" daripada tombol yang benar-benar bisa ditekan. Sekarang:
   informasi = rata, tanpa bayangan, tanpa hover, kursor biasa. */
.kartu{background:var(--permukaan-1);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-4);margin:var(--s-4) 0;box-shadow:none}
.kartu>h2:first-child,.kartu>h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin:var(--s-3) 0 var(--s-1);color:var(--teks-2)}
input[type=text],input[type=url],input[type=date],input[type=password],textarea,select{
  width:100%;background:var(--bg);color:var(--teks);border:1px solid var(--garis);
  border-radius:var(--r-1);padding:11px 12px;font:inherit;min-height:44px}
textarea{min-height:180px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--aksen)}
.lencana{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;
  padding:3px 10px;border-radius:var(--r-pil);background:var(--permukaan-2);
  border:1px solid var(--garis);color:var(--teks-2)}
.lencana.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-lembut)}
.lencana.gagal{color:var(--gagal);border-color:var(--gagal);background:var(--gagal-lembut)}
.lencana.tunggu{color:var(--ingat);border-color:var(--ingat);background:var(--ingat-lembut)}
.catatan-status{border-left:4px solid var(--ingat);background:var(--ingat-lembut);
  padding:var(--s-3) var(--s-4);border-radius:0 var(--r-1) var(--r-1) 0;
  margin:var(--s-3) 0;font-size:.95rem}
.catatan-status.gagal{border-color:var(--gagal);background:var(--gagal-lembut)}
.catatan-status.ok{border-color:var(--ok);background:var(--ok-lembut)}
.kcil{font-size:var(--f-kecil);color:var(--redup)}
.meta{color:var(--redup);font-size:.88rem}
.tindakan{display:flex;gap:var(--s-2);flex-wrap:wrap;margin:var(--s-3) 0}

/* ---------- beranda ---------- */
.beranda-atas{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:var(--s-6);align-items:center;padding:var(--s-6) 0 var(--s-5)}
@media(max-width:900px){.beranda-atas{grid-template-columns:1fr;gap:var(--s-5);padding-top:var(--s-5)}}
.beranda-atas h1{font-size:var(--f-judul-besar);letter-spacing:-.02em;margin-bottom:var(--s-3)}
.beranda-atas .pimpin{font-size:1.06rem;color:var(--teks-2);max-width:52ch}
.beranda-aksi{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:center;margin-top:var(--s-5)}
.beranda-aksi .tautan-kecil{font-size:.95rem}
.langkah{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3);
  margin:var(--s-5) 0;padding:0;list-style:none}
@media(max-width:760px){.langkah{grid-template-columns:1fr}}
.langkah li{background:var(--permukaan-1);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-4);display:flex;gap:var(--s-3);align-items:flex-start}
.langkah .nomor{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-pil);
  background:var(--aksen-lembut);color:var(--aksen);display:grid;place-items:center;
  font-weight:700;font-size:.9rem}
.langkah strong{display:block;margin-bottom:2px}
.langkah span.kcil{display:block}
.pratinjau{background:linear-gradient(180deg,var(--bg-2),var(--bg));border:1px solid var(--garis);
  border-radius:var(--r-3);padding:var(--s-4);box-shadow:var(--bayang-2)}
.pratinjau .kartu{margin:0 0 var(--s-3);padding:var(--s-3)}
.pratinjau-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--redup);margin:0 0 var(--s-2);font-weight:700}
.pratinjau .kartu:last-child{margin-bottom:0}
.pratinjau .potongan{background:var(--baca-bg);color:var(--baca-teks);border:1px solid var(--baca-garis);
  border-radius:var(--r-2);padding:var(--s-3) var(--s-4);font-size:.95rem;line-height:1.7}
.pratinjau .potongan h4{font-size:1rem;margin:0 0 6px}
.pratinjau .potongan p{margin:0}
.pratinjau .gelembung{margin-bottom:6px}
.gelembung{background:var(--permukaan-2);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-2) var(--s-3);font-size:.9rem;max-width:92%}
.gelembung.aku{background:var(--aksen-lembut);border-color:var(--aksen);margin-left:auto}

/* ---------- kartu pilihan (sumber & hasil) ---------- */
.pilih-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-3);margin:var(--s-3) 0}
@media(max-width:1000px){.pilih-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.pilih-grid{grid-template-columns:1fr}}
.kartu-pilih{position:relative;display:block;background:var(--permukaan-1);border:1px solid var(--garis);
  border-radius:var(--r-2);padding:var(--s-4);cursor:pointer;text-align:left;
  color:var(--teks);font:inherit;min-height:44px;
  transition:border-color var(--transisi),background var(--transisi),
    box-shadow var(--transisi),transform var(--transisi)}
.kartu-pilih:hover{border-color:var(--garis-kuat);background:var(--permukaan-2);
  box-shadow:0 2px 10px rgba(0,0,0,.12);transform:translateY(-1px)}
.kartu-pilih:active{transform:translateY(0);box-shadow:none}
.kartu-pilih:focus-visible{outline:2px solid var(--aksen);outline-offset:2px}
.kartu-pilih .ikon{font-size:1.3rem;line-height:1;margin-bottom:var(--s-2)}
.kartu-pilih strong{display:block;margin-bottom:2px}
.kartu-pilih .ket{display:block;color:var(--redup);font-size:.86rem;line-height:1.5}
.kartu-pilih[aria-pressed="true"],.kartu-pilih[aria-expanded="true"],.kartu-pilih.terpilih{
  border-color:var(--aksen);background:var(--aksen-lembut);
  box-shadow:inset 0 0 0 1px var(--aksen),var(--kilau)}
.kartu-pilih[aria-pressed="true"] .tanda{opacity:1}
.kartu-pilih .tanda{position:absolute;top:10px;right:12px;opacity:0;color:var(--aksen);font-weight:700}
/* Keadaan "sedang dipilih" dibedakan TANPA hanya warna (§B3): ada teks
   "Terbuka" di sudut dan garis bawah tebal. Ini bukan tanda berhasil —
   keberhasilan hanya muncul di daftar bahan yang benar-benar masuk. */
.kartu-pilih .status-pilih{position:absolute;top:9px;right:10px;font-size:.66rem;
  font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--aksen);
  opacity:0;transition:opacity var(--transisi)}
.kartu-pilih[aria-expanded="true"] .status-pilih{opacity:1}
.kartu-pilih[aria-expanded="true"]{box-shadow:inset 0 -3px 0 var(--aksen),inset 0 0 0 1px var(--aksen)}
.kartu-pilih[aria-expanded="true"] strong{font-weight:800}
.bahan-daftar{list-style:none;padding:0;margin:var(--s-3) 0 0}
.bahan-item{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;
  background:var(--permukaan-2);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-3);margin-bottom:var(--s-2)}
.bahan-item .nama{font-weight:600}
/* Bahan yang baru ditambahkan disorot 1,2 dtk — mata pengguna harus bisa
   menemukan kartunya tanpa menebak-nebak. */
.bahan-item.sorot{outline:2px solid var(--aksen);outline-offset:2px;
  animation:sorot-masuk 1.2s var(--ease) 1}
@keyframes sorot-masuk{0%{background:var(--aksen-lembut)}100%{background:var(--permukaan-2)}}
.bahan-item .aksi{margin-left:auto;display:flex;gap:var(--s-2);flex-wrap:wrap}
/* ---------- foto & video sebagai bahan ---------- */
.bahan-item .foto-slot{flex-basis:100%;width:100%;min-width:0}
.foto-mini{display:block;max-width:100%;max-height:132px;width:auto;border-radius:var(--r-2);
  border:1px solid var(--garis);background:var(--permukaan-3)}
.bahan-item .video-slot{flex-basis:100%;width:100%;min-width:0}
.video-mini{display:block;width:100%;max-height:220px;border-radius:var(--r-2);
  background:#000;border:1px solid var(--garis)}
.bahan-item .foto-status{flex-basis:100%;margin:0}
.bahan-item .foto-unsur{flex-basis:100%;margin:0;padding:var(--s-2) var(--s-3);
  background:var(--permukaan-3);border-radius:var(--r-1);border-left:3px solid var(--garis-kuat)}
.cu-daftar{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-3)}
.cu-item{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;
  background:var(--permukaan-2);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:6px;max-width:120px}
.cu-item img{width:104px;height:auto;border-radius:var(--r-1);display:block}
/* Kotak centang "Sertakan gambar sumber": label sebaris dengan kotaknya, bukan
   label tebal yang mengambang di atas. */
.pilih-centang{display:flex;gap:10px;align-items:flex-start;font-weight:500;
  background:var(--permukaan-2);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-3);margin:var(--s-3) 0;cursor:pointer}
.pilih-centang input{width:20px;height:20px;min-height:20px;margin:2px 0 0;flex:0 0 auto;
  accent-color:var(--aksen)}
.pilih-centang .kcil{display:block;font-weight:400;margin-top:2px}
/* Pilih catatan untuk digabung: daftar bergulir, tiap baris satu catatan. */
.pilih-catatan-daftar{max-height:44vh;overflow:auto;display:grid;gap:6px;
  margin:var(--s-3) 0;padding:2px}
.pilih-catatan{display:flex;gap:10px;align-items:flex-start;font-weight:500;
  background:var(--permukaan-2);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:10px var(--s-3);margin:0;cursor:pointer}
.pilih-catatan input{width:20px;height:20px;min-height:20px;margin:1px 0 0;flex:0 0 auto;
  accent-color:var(--aksen)}
.pilih-catatan .kcil{display:block;font-weight:400;margin-top:2px}
.pilih-jenis{border:1px solid var(--garis);border-radius:var(--r-2);padding:var(--s-3);
  margin:0 0 var(--s-3);display:grid;gap:6px}
.pilih-jenis legend{padding:0 6px}
.pilih-jenis label{display:flex;gap:8px;align-items:center;font-weight:400;margin:0}
.pilih-jenis input{width:18px;height:18px;min-height:18px;margin:0;accent-color:var(--aksen)}
/* Antrean tautan Drive: satu baris per tautan, status terbaca per baris. */.antre-drive{list-style:none;padding:0;margin:var(--s-3) 0 0;display:grid;gap:6px}
.antre-drive li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;
  align-items:center;background:var(--permukaan-2);border:1px solid var(--garis);
  border-radius:var(--r-1);padding:7px 10px;font-size:.86rem}
.antre-drive .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--teks-2)}
.antre-drive .st{font-size:.78rem;font-weight:600;white-space:nowrap}
.antre-drive .st.menunggu{color:var(--teks-2)}
.antre-drive .st.jalan{color:var(--aksen)}
.antre-drive .st.ok{color:var(--ok, #2f8f5b)}
.antre-drive .st.gagal{color:var(--bahaya, #b3261e)}
/* Gambar di dalam hasil: menempel pada paragraf yang menjelaskannya. */
.hasil-baca figure.gambar-hasil{margin:var(--s-4) 0;padding:0}
.hasil-baca figure.gambar-hasil img{max-width:100%;height:auto;border-radius:var(--r-2);
  border:1px solid var(--garis);display:block}
.hasil-baca figure.gambar-hasil figcaption{font-size:.82rem;color:var(--teks-2);
  margin-top:6px;line-height:1.5}
.hasil-baca figure.gambar-hasil figcaption a{white-space:nowrap}
.hasil-baca .gambar-hilang{font-size:.82rem;color:var(--teks-2);font-style:italic}
/* ---------- pemilih bahan: kartu = TINDAKAN, bukan kotak centang ---------- */
.panel-bahan{margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--garis)}
.panel-bahan textarea{min-height:130px}
/* ---------- rekam suara: satu keadaan, satu aksi utama ----------
   Setiap tahap punya SATU tombol penuh-lebar (bukan .kecil) supaya mata
   langsung tahu apa yang harus ditekan. Tombol sekunder tetap tersedia tetapi
   tidak pernah bersaing ukuran dengan yang utama. */
.rekam-kepala{margin:0 0 var(--s-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rekam-kepala strong{font-size:1rem}
.rekam-tanda{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.rekam-tanda .titik{width:11px;height:11px;border-radius:50%;background:var(--bahaya,#d33);
  animation:rekamDenyut 1.1s ease-in-out infinite}
@keyframes rekamDenyut{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
.rekam-jam{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.rekam-utama{display:block;width:100%;min-height:50px;margin:var(--s-2) 0 0;font-size:1rem}
.rekam-sekunder{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.rekam-ok{color:var(--ok,#1c7c4a);font-weight:700;margin:0 0 2px}
.rekam-gagal{color:var(--bahaya,#b3261e);font-weight:700;margin:0 0 2px}
/* "Tersimpan sampai 47:05" — angka yang menjawab "apakah rekaman saya aman?"
   tanpa harus membaca paragraf. */
.rekam-simpan{margin:2px 0 0;font-variant-numeric:tabular-nums;font-weight:600;
  color:var(--ok,#1c7c4a)}
/* Panel pemulihan sesi terputus: harus terlihat sebagai PERINGATAN yang bisa
   ditindaklanjuti, bukan kotak informasi biasa. */
.pulih-banner{margin:0 0 var(--s-3);padding:12px 14px;border-radius:12px;
  background:var(--permukaan-2);border:1px solid var(--garis,#d8d8d8);
  border-left:4px solid var(--bahaya,#b3261e)}
.pulih-judul{margin:0 0 2px;font-weight:700}
.pulih-banner .tombol{min-height:44px}
.daftar-diag{list-style:none;padding:0;margin:0 0 var(--s-3);display:grid;gap:8px}
.daftar-diag li{padding:9px 11px;border-radius:10px;background:var(--permukaan-2)}
.rekam-tahap{display:flex;align-items:center;gap:9px;margin:8px 0 0;font-weight:600}
.rekam-tahap .cakra{flex:0 0 auto}
/* Panduan Teman Paham DI DEKAT aksi — bukan hanya di puncak halaman, yang
   terukur 931 px di atas layar saat pengguna selesai merekam. */
.panduan-dekat{margin:10px 0 0;padding:9px 11px;border-radius:10px;
  background:var(--permukaan-2);border-left:3px solid var(--aksen);
  font-size:.88rem;line-height:1.45}
.panduan-dekat .siapa{font-weight:700;color:var(--aksen)}
.panduan-dekat[hidden]{display:none}
.baris-ambil{display:flex;gap:var(--s-2);align-items:stretch;flex-wrap:wrap}
.baris-ambil input{flex:1 1 260px;min-width:0;min-height:44px}
.baris-ambil button{flex:0 0 auto;min-height:44px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.bahan-item audio{max-width:100%;height:36px}
.bahan-item .pemutar-slot{flex-basis:100%;width:100%;min-width:0}
/* ---------- SATU pemutar audio dengan kontrol TERLIHAT ---------- */
.pemutar{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;width:100%;
  margin-top:var(--s-2);padding:var(--s-2);border:1px solid var(--garis);
  border-radius:var(--r-2);background:var(--permukaan-1);min-width:0}
.pemutar-main{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:88px;
  justify-content:center;padding:0 var(--s-3);border-radius:var(--r-pil);
  border:1px solid var(--aksen);background:var(--aksen-lembut);color:var(--aksen);
  font:inherit;font-weight:600;cursor:pointer;
  transition:background var(--transisi),color var(--transisi),border-color var(--transisi)}
.pemutar-main:hover{background:var(--aksen);color:var(--teks-tombol)}
.pemutar-ikon{font-size:.85em;line-height:1}
.pemutar-jalur{flex:1 1 120px;min-width:80px;height:8px;border-radius:var(--r-pil);
  background:var(--permukaan-3);cursor:pointer;position:relative;touch-action:none}
.pemutar-jalur:focus-visible{outline:2px solid var(--aksen);outline-offset:4px}
.pemutar-isi{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--aksen),var(--toska))}
.pemutar-waktu{font-variant-numeric:tabular-nums;font-size:var(--f-kecil);
  color:var(--redup);min-width:104px;text-align:right}
.pemutar-status{flex-basis:100%;margin:0;font-size:var(--f-kecil);line-height:1.5}
.pemutar-status:empty{display:none}
.pemutar-status.gagal{color:var(--gagal)}
.pemutar-status.jalan{color:var(--aksen)}
.pemutar.sedang-putar .pemutar-main{border-color:var(--toska);color:var(--toska);
  background:var(--toska-lembut)}
.pemutar.gagal-putar .pemutar-main{opacity:.55}
@media(max-width:760px){
  /* Tombol Asisten mengambang di kanan bawah: beri ruang agar tindakan
     terakhir halaman tidak pernah tertutup olehnya. */
  .wrap{padding-bottom:92px}
}
@media(max-width:560px){
  .pemutar-waktu{min-width:0;order:3;flex:0 0 auto}
  .pemutar-unduh{order:4;margin-left:auto}
}
/* ---------- panel transkripsi (satu jalur untuk semua audio) ---------- */
.bahan-item .tr-slot{flex-basis:100%;width:100%;min-width:0}
.tr-panel{width:100%;margin-top:var(--s-2);padding:var(--s-2) 0 0;
  border-top:1px dashed var(--garis)}
.tr-panel .tr-status{margin:0 0 var(--s-2)}
.tr-panel .tr-status.jalan{color:var(--aksen)}
.tr-panel .tr-status.gagal{color:var(--gagal)}
.tr-panel .tr-status.ok{color:var(--ok)}
/* Blok "tulisan siap dipakai" — tombol utama selebar panel supaya terjangkau
   ibu jari di HP, bukan tombol kecil di ujung baris. */
.tr-siap{margin:var(--s-2) 0 0;padding:11px 12px;border-radius:12px;
  background:var(--permukaan-2);border:1px solid var(--garis-kuat)}
.tr-siap[hidden]{display:none}
.tr-siap-teks{margin:0 0 8px;font-weight:700;color:var(--ok)}
.tr-siap-buat{display:block;width:100%;min-height:48px;font-size:1rem}
.tr-jalur{height:6px;border-radius:var(--r-pil);background:var(--permukaan-3);
  margin:0 0 var(--s-2);overflow:hidden}
.tr-jalur span{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--aksen),var(--toska));transition:width 200ms ease}
.tr-aksi{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.tr-periksa{margin-top:var(--s-2)}
.tr-periksa label{display:block;font-weight:600;font-size:var(--f-kecil);
  color:var(--aksen);margin-bottom:var(--s-1)}
.tr-periksa textarea{width:100%;min-height:150px;font-family:inherit;
  font-size:var(--f-isi);line-height:1.6}
.tr-baris-bagian{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;
  padding:6px 8px;border-radius:var(--r-1);background:var(--permukaan-2);
  border:1px solid var(--garis);margin:4px 0}
.tr-baris-bagian .aksi{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tr-baris-bagian b{color:var(--ingat)}
.tr-semua-bagian{margin-top:8px}
.tr-semua-bagian summary{cursor:pointer;font-size:var(--f-kecil);color:var(--aksen)}
.tr-sibuk:empty{display:none}
.ringkas-buat{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;
  margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--garis)}

/* ---------- tahap proses ---------- */
.laju{display:flex;gap:var(--s-2);flex-wrap:wrap;margin:var(--s-3) 0;align-items:center}
.laju .tahap{font-size:.85rem;padding:6px 12px;border-radius:var(--r-pil);
  border:1px solid var(--garis);color:var(--redup);background:var(--permukaan-2);
  display:inline-flex;align-items:center;gap:6px}
.laju .tahap.jalan{color:var(--teks);border-color:var(--aksen);background:var(--aksen-lembut)}
.laju .tahap .cakra{width:12px;height:12px;border-width:2px;border-color:var(--garis-kuat);
  border-top-color:var(--aksen)}
.laju .laju-waktu{margin-left:2px}
.laju .tahap.jalan{color:var(--aksen);border-color:var(--aksen);background:var(--aksen-lembut)}
.laju .tahap.selesai{color:var(--ok);border-color:var(--ok);background:var(--ok-lembut)}
.laju .tahap.gagal{color:var(--gagal);border-color:var(--gagal);background:var(--gagal-lembut)}

/* ---------- halaman bacaan ---------- */
.baca-kepala{max-width:75ch}
.baca-kepala h1{margin-bottom:var(--s-2)}
/* Satu baris, tidak membungkus. Alasannya terukur: dengan empat tab + ukuran
   huruf + lima tombol tindakan, bilah ini setinggi 117 px di 1366 dan 216 px di
   1024 — menutupi bacaan yang justru ingin dibaca. Sekarang: tab menggeser ke
   samping di dalam ruangnya sendiri, dan tindakan sekunder masuk ke menu "⋯".
   Karena strip bisa menggeser, tampilkanTabAktif() menggesernya sampai tab
   yang sedang aktif terbaca utuh (1366 + panel terbuka: 132 px terpotong). */
.baca-alat{display:flex;gap:var(--s-2);flex-wrap:nowrap;align-items:center;
  margin:var(--s-4) 0 var(--s-3);padding:5px 0;border-bottom:1px solid var(--garis);
  position:relative;min-height:44px}
/* 44 px sasaran sentuh + 5+5 padding + 1 px garis = 55 px, masih ≤ 56 px. */
/* Di layar lebar bilah hasil menempel di bawah kepala aplikasi: pindah hasil,
   ukuran huruf, daftar isi, dan tindakan tetap terjangkau tanpa menggulir balik. */
@media(min-width:761px){
  .baca-alat{position:sticky;top:var(--kepala);z-index:12;background:var(--bg);
    margin-top:var(--s-3);padding-top:5px}
}
.tab-hasil{display:flex;gap:var(--s-1);flex-wrap:nowrap;min-width:0;flex:1 1 auto;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tab-hasil::-webkit-scrollbar{display:none}
.tab-hasil button{background:transparent;color:var(--teks-2);border:1px solid transparent;
  border-radius:var(--r-1);padding:0 12px;font-weight:600;min-height:44px;flex:0 0 auto}
.tab-hasil button:hover{background:var(--permukaan-2);color:var(--teks)}
.tab-hasil button.aktif{background:var(--aksen-lembut);color:var(--aksen);border-color:var(--aksen)}
.alat-kanan{margin-left:auto;display:flex;gap:var(--s-1);align-items:center;flex-wrap:nowrap;
  flex:0 0 auto}
.alat-kanan .kecil{min-height:44px;padding:0 9px}
/* Garis kelompok dibuat dengan box-shadow, bukan border: border 1 px atas+bawah
   menambah tinggi sehingga tombolnya tinggal 42 px (< 44 px sasaran sentuh). */
.ukuran-huruf{display:inline-flex;border-radius:var(--r-1);overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--garis)}
.ukuran-huruf button{background:var(--permukaan-1);color:var(--teks-2);border:0;border-radius:0;
  padding:0 9px;min-height:44px;font-size:.82rem;font-weight:700}
.ukuran-huruf button[aria-pressed="true"]{background:var(--aksen);color:var(--teks-tombol)}
/* Menu tindakan sekunder: salin, unduh, cetak, tanya. Satu tombol "⋯" supaya
   bilah tetap satu baris tanpa menyembunyikan tindakan dari pembaca layar. */
.alat-lain{position:relative}
.alat-lain>button{font-weight:700;letter-spacing:1px}
.menu-lain{position:absolute;right:0;top:calc(100% + 6px);z-index:16;min-width:200px;
  background:var(--permukaan-1);border:1px solid var(--garis);border-radius:var(--r-2);
  box-shadow:var(--bayang-2);padding:6px;display:flex;flex-direction:column;gap:2px}
.menu-lain[hidden]{display:none}
.menu-lain button{display:block;width:100%;text-align:left;background:transparent;
  color:var(--teks);border:0;border-radius:var(--r-1);padding:10px 12px;min-height:44px;
  font-size:.92rem}
.menu-lain button:hover{background:var(--permukaan-2)}
.daftar-isi{position:relative}
.daftar-isi-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:15;width:min(340px,86vw);
  background:var(--permukaan-1);border:1px solid var(--garis);border-radius:var(--r-2);
  box-shadow:var(--bayang-2);padding:var(--s-2);max-height:60vh;overflow:auto}
.daftar-isi-panel[hidden]{display:none}
.daftar-isi-panel button{display:block;width:100%;text-align:left;background:transparent;
  color:var(--teks);border:0;border-radius:var(--r-1);padding:10px 12px;font-weight:500;font-size:.92rem}
.daftar-isi-panel button:hover{background:var(--permukaan-2)}
.daftar-isi-panel button.sub{padding-left:26px;color:var(--teks-2);font-size:.88rem}
.daftar-isi-panel .kosong{padding:10px 12px;color:var(--redup);font-size:.9rem}

/* Kartu pemeriksaan klaim: angka jujur, tanpa kata "terverifikasi". */
.periksa{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;
  border:1px solid var(--garis);border-radius:var(--r-2);padding:10px 14px;
  margin:0 0 var(--s-3);background:var(--permukaan-1);font-size:.9rem}
.periksa.ada{border-color:var(--ingat);background:var(--ingat-lembut)}
.periksa.belum{border-style:dashed;color:var(--teks-2)}
.periksa .kcil{color:var(--teks-2)}
.daftar-klaim{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-height:52vh;overflow:auto}
.daftar-klaim li{border-left:3px solid var(--garis);padding:6px 10px;background:var(--permukaan-2);
  border-radius:var(--r-1);font-size:.9rem;line-height:1.5}
.daftar-klaim li.didukung{border-left-color:var(--aksen)}
.daftar-klaim li.belum{border-left-color:var(--ingat)}
.daftar-klaim li.tidak_didukung{border-left-color:var(--gagal)}
.daftar-klaim li .kcil{display:block;margin-top:4px}
.hasil-baca .rujuk{display:inline;background:var(--aksen-lembut);color:var(--aksen);
  border:1px solid var(--aksen);border-radius:var(--r-pil);padding:0 7px;margin:0 2px;
  font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;vertical-align:baseline}
@media print{.hasil-baca .rujuk{border:0;background:none;color:#000;padding:0;font-size:9pt}}
/* ---------- rujukan: nomor kecil + teks cetak (Direktif #10 §2) ----------
   Nomor sengaja KECIL dan tidak mengganggu kalimat. Sasaran ketuk tetap ≥44 px
   lewat lapisan tak terlihat (::after) supaya di HP tidak perlu membidik. */
.rujuk-sup{display:inline-block;font:inherit;font-size:.66em;line-height:1;vertical-align:super;
  color:var(--aksen);background:none;border:0;padding:0 2px;margin-left:1px;cursor:pointer;
  font-weight:700;position:relative;text-decoration:none}
.rujuk-sup::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
  transform:translate(-50%,-50%);border-radius:50%}
.rujuk-sup:hover,.rujuk-sup:focus-visible{text-decoration:underline;outline:2px solid var(--aksen);
  outline-offset:2px}
.panel-agen .rujuk-sup{color:var(--aksen-terang, var(--aksen))}
.rujuk-cetak{display:none}
@media print{
  .rujuk-sup{display:none}
  body.cetak-rujukan .rujuk-cetak{display:inline;font-size:9pt;color:#333}
}
.menu-centang{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:.86rem;
  border-top:1px solid var(--garis);cursor:pointer}
.menu-centang input{width:auto;margin:0}
/* Panduan "Langkah berikutnya": kartu tenang di dekat kontrol, bukan pesan chat. */
.panduan{margin:0 0 var(--s-4);border-left:3px solid var(--aksen);padding:var(--s-3) var(--s-4)}
.panduan-teks{margin:0;line-height:1.5}
.panduan-teks strong{color:var(--aksen)}
.panduan-aksi{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
button.tautan-kecil{background:none;border:0;color:var(--aksen);padding:0;font:inherit;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.bagikan code{background:var(--permukaan-2);padding:1px 5px;border-radius:4px;font-size:.9em}
/* Label ukuran huruf: nama terbaca di layar lebar, singkatan di layar sempit. */
.ukuran-huruf .pdk{display:none}
@media (max-width:1100px){
  .ukuran-huruf .pjg{display:none}
  .ukuran-huruf .pdk{display:inline}
}
.hasil-baca{background:var(--baca-bg);color:var(--baca-teks);border:1px solid var(--baca-garis);
  border-radius:var(--r-3);padding:var(--s-6);max-width:75ch;margin:0 auto;
  font-size:var(--baca-ukuran);line-height:var(--baris-baca);box-shadow:var(--bayang-1)}
.hasil-baca[data-ukuran="112"]{--baca-ukuran:1.21rem}
.hasil-baca[data-ukuran="125"]{--baca-ukuran:1.35rem}
.hasil-baca h1,.hasil-baca h2,.hasil-baca h3,.hasil-baca h4{color:var(--baca-teks)}
.hasil-baca h2,.hasil-baca h3{scroll-margin-top:calc(var(--kepala) + 74px)}
.hasil-baca h2{font-size:1.3em;margin:1.6em 0 .6em;padding-top:.2em}
.hasil-baca h3{font-size:1.12em;margin:1.4em 0 .5em}
.hasil-baca h4{font-size:1em;margin:1.2em 0 .4em}
.hasil-baca p{margin:0 0 1.05em}
.hasil-baca ul,.hasil-baca ol{margin:0 0 1.05em;padding-left:1.35em}
.hasil-baca li{margin-bottom:.45em}
.hasil-baca strong{font-weight:700}
.hasil-baca blockquote{margin:1em 0;padding:.6em 1em;border-left:3px solid var(--aksen);
  background:var(--permukaan-2);border-radius:0 var(--r-1) var(--r-1) 0}
.hasil-baca code{background:var(--permukaan-2);padding:1px 5px;border-radius:4px;font-size:.94em}
.hasil-baca pre{background:var(--permukaan-2);padding:var(--s-3);border-radius:var(--r-1);overflow-x:auto}
.hasil-baca table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1em 0}
.hasil-baca th,.hasil-baca td{border:1px solid var(--baca-garis);padding:8px 10px;text-align:left}
.hasil-baca th{background:var(--permukaan-2);font-weight:700}
.hasil-baca img{max-width:100%}
.hasil-baca [dir="rtl"],.hasil-baca .arab{font-family:var(--font-arab);direction:rtl;text-align:right;
  font-size:1.4em;line-height:2.1;margin:1em 0}
.hasil-baca hr{border:0;border-top:1px solid var(--baca-garis);margin:1.6em 0}

/* ---------- asisten ---------- */
.panel-agen{position:fixed;right:16px;bottom:16px;width:370px;max-width:calc(100vw - 32px);
  max-height:70vh;background:var(--panel-bg);backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--garis-kuat);border-radius:var(--r-3);
  display:flex;flex-direction:column;box-shadow:var(--bayang-2),var(--kilau);z-index:30}
.panel-agen[hidden]{display:none}
.panel-agen .kepala{display:flex;align-items:center;gap:var(--s-2);padding:10px 14px;
  border-bottom:1px solid var(--garis);font-weight:700}
.panel-agen .riwayat{overflow-y:auto;padding:var(--s-3);flex:1;min-height:120px}
.panel-agen .pesan{margin:6px 0;padding:9px 12px;border-radius:var(--r-2);max-width:92%;
  white-space:pre-wrap;font-size:.93rem;line-height:1.6}
.panel-agen .pesan.aku{background:var(--aksen-lembut);margin-left:auto;border:1px solid var(--aksen)}
.panel-agen .pesan.dia{background:var(--permukaan-2);border:1px solid var(--garis)}
/* Rujukan bagian: tombol kecil di dalam balasan, membuka teks bagiannya. */
.panel-agen .rujuk{display:inline;background:var(--aksen-lembut);color:var(--aksen);
  border:1px solid var(--aksen);border-radius:var(--r-pil);padding:1px 8px;margin:0 2px;
  font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
.panel-agen .rujuk:hover{background:var(--aksen);color:var(--teks-tombol)}
.kutip-sumber{background:var(--permukaan-2);border-left:3px solid var(--aksen);
  padding:var(--s-3);border-radius:var(--r-1);max-height:46vh;overflow:auto;
  white-space:pre-wrap;line-height:1.65}
.pratinjau-diag{background:var(--permukaan-2);border:1px solid var(--garis);
  border-radius:var(--r-1);padding:var(--s-3);max-height:34vh;overflow:auto;
  font-size:.74rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.panel-agen form{display:flex;gap:var(--s-2);padding:10px;border-top:1px solid var(--garis)}
.panel-agen input{flex:1;min-width:0}
.chip-baris{display:flex;gap:var(--s-2);flex-wrap:wrap;padding:0 var(--s-3) var(--s-2)}
.chip-baris button{background:var(--permukaan-2);color:var(--teks-2);border:1px solid var(--garis);
  border-radius:var(--r-pil);padding:7px 12px;min-height:36px;font-size:.85rem;font-weight:500}
.chip-baris button:hover{background:var(--permukaan-3);color:var(--teks)}
@media(max-width:760px){
  /* Di HP tombol terapung TERBUKTI menutupi kartu bahan keempat (terukur
     1.820 px² = 5 % kartu). Menggesernya ke atas hanya memindahkan masalah:
     kartu lain akan bergiliran tertutup saat halaman digulir. Jadi di layar
     sempit tombol mengambang DIMATIKAN dan pendamping dibuka dari kepala
     halaman — tidak ada elemen mengambang di atas isi. */
  body.ada-bilah #isi{padding-bottom:172px}
  /* Panel duduk di ATAS KEYBOARD, bukan di belakangnya. `vh` tidak mengecil
     saat papan ketik terbuka di peramban ponsel, sehingga kolom pesan dan
     tombol Kirim pernah tertutup papan ketik. --vv-tinggi/--vv-bawah diisi
     dari window.visualViewport (lihat aturPanelVv). */
  .panel-agen{left:12px;right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px) + var(--vv-bawah,0px));
    width:auto;max-height:min(70vh, calc(var(--vv-tinggi,100vh) - 20px))}
  .panel-agen .riwayat{min-height:0}
}
@media(min-width:1024px){
  /* align-content:start WAJIB: tanpa itu baris grid meregang mengisi tinggi
     layar dan halaman pendek (mis. Catatan Saya) terdorong ~200 px ke bawah. */
  body{display:grid;grid-template-columns:minmax(0,1fr) 390px;align-items:start;
    align-content:start}
  header.app{grid-column:1/-1}
  body>.wrap{grid-column:1;justify-self:center;width:100%}
  /* `inset` adalah singkatan top/right/bottom/left. Dulu ditulis SESUDAH `top`
     di blok yang sama, sehingga `top` dikembalikan ke auto dan sticky kehilangan
     jangkarnya: panel ikut tergulir dan hilang (terukur 1366×768: gulir 533 →
     panel top −475). Sekarang inset ditulis LEBIH DULU, baru top. Tanpa !important. */
  .panel-agen{position:sticky;inset:auto;
    top:calc(var(--kepala-nyata,62px) + 8px);
    grid-column:2;grid-row:2;margin:var(--s-4) var(--s-4) var(--s-4) 0;width:auto;
    max-height:calc(100vh - var(--kepala-nyata,62px) - 24px)}
  .panel-agen .riwayat{min-height:0}
  body:has(.panel-agen[hidden]),body.panel-tertutup{grid-template-columns:minmax(0,1fr)}
  body:has(.panel-agen[hidden]) .tombol-agen,body.panel-tertutup .tombol-agen{right:16px}
  /* Beranda: Asisten dibuka sebagai DRAWER di atas konten — bukan kolom ketiga
     yang memampatkan hero menjadi tiga kolom sempit (Direktif #9 §6). */
  body.rute-beranda{grid-template-columns:minmax(0,1fr)}
  body.rute-beranda .panel-agen{position:fixed;inset:auto;
    top:calc(var(--kepala-nyata,62px) + 12px);right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));left:auto;
    width:390px;max-height:none;margin:0;grid-column:auto;grid-row:auto;z-index:40;
    box-shadow:0 26px 64px -22px rgba(0,0,0,.62)}
}
.tombol-agen{position:fixed;right:16px;bottom:16px;z-index:25;border-radius:var(--r-pil);
  padding:11px 20px;box-shadow:var(--bayang-2),var(--kilau);font-weight:600;
  display:inline-flex;align-items:center;gap:8px;min-height:44px}
.lambang-agen{display:inline-flex;align-items:center;color:var(--toska);flex:0 0 auto}
.panel-agen .kepala .lambang-agen{color:var(--toska)}
.tombol-agen .lambang-agen{color:currentColor}
@media(min-width:1024px){.tombol-agen{right:414px;bottom:16px}}
/* Tombol pendamping di kepala halaman: hanya untuk layar sempit, tidak
   mengambang, jadi tidak mungkin menutupi kartu mana pun.
   BENTUKNYA PIL BERLABEL, bukan lingkaran ikon. Terukur pada build
   2026.11.04.3-web: di 390 px tombol ini hanya 44x44 tanpa satu pun teks
   "Teman Paham" yang terlihat — pengguna tidak menemukan pendampingnya karena
   yang tampak hanyalah ikon hiasan. Sekarang teksnya ikut tampil. */
.tombol-agen-kepala{display:none;align-items:center;justify-content:center;
  gap:5px;width:auto;min-width:44px;height:44px;min-height:44px;padding:0 11px;
  border-radius:var(--r-pil);background:var(--permukaan-2);
  border:1px solid var(--garis);color:var(--teks);cursor:pointer;flex:0 0 auto;
  font:inherit;font-size:.75rem;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.label-agen-kepala{line-height:1}
.tombol-agen-kepala .lambang-agen svg{width:16px;height:16px}
.tombol-agen-kepala:hover{background:var(--permukaan-3)}
.tombol-agen-kepala:focus-visible{outline:2px solid var(--aksen);outline-offset:2px}
.tombol-agen-kepala[hidden]{display:none !important}
/* Urutan penting: aturan ini HARUS sesudah definisi dasar di atas. Saat
   ditulis lebih awal, `display:inline-flex` milik .tombol-agen menang dan
   tombol mengambang tetap muncul di HP (terukur: menutupi gambar hero). */
@media(max-width:760px){
  .tombol-agen{display:none}
  .tombol-agen-kepala{display:inline-flex}
}
dialog{background:var(--permukaan-1);color:var(--teks);border:1px solid var(--garis);
  border-radius:var(--r-3);max-width:560px;width:92%;box-shadow:var(--bayang-2)}
dialog::backdrop{background:rgba(5,9,18,.66)}
.draft-pilih{display:grid;gap:var(--s-2);margin:var(--s-2) 0}
.draft-pilih label{display:flex;gap:var(--s-3);align-items:flex-start;font-weight:400;color:var(--teks);
  background:var(--permukaan-2);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-3);margin:0;cursor:pointer}
.draft-pilih input{margin-top:4px;min-height:auto;width:auto}
.draft-pilih .ket{color:var(--redup);font-size:.88rem;display:block}

/* ---------- catatan saya ---------- */
.cari-baris{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center;margin:var(--s-3) 0}
.cari-baris input{flex:1;min-width:220px}
.kartu-catatan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s-3);
  background:var(--permukaan-1);border:1px solid var(--garis);border-radius:var(--r-2);
  padding:var(--s-4);margin-bottom:var(--s-3);box-shadow:var(--bayang-1);
  transition:border-color var(--transisi)}
.kartu-catatan:hover{border-color:var(--garis-kuat)}
.kartu-catatan h3{margin:0 0 4px;font-size:1.05rem}
.kartu-catatan h3 a{color:var(--teks)}
.kartu-catatan h3 a:hover{color:var(--aksen);text-decoration:none}
.kartu-catatan .cuplik{color:var(--redup);font-size:.9rem;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kartu-catatan .aksi{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.kartu-catatan{grid-template-columns:1fr}.kartu-catatan .aksi{justify-content:flex-start}}
.kosong-kotak{text-align:center;padding:var(--s-7) var(--s-4);border:1px dashed var(--garis);
  border-radius:var(--r-3);background:var(--permukaan-1)}
.kosong-kotak p{color:var(--redup);margin-bottom:var(--s-4)}

@media(max-width:760px){
  :root{--kepala:101px}
  html{scroll-padding-top:calc(var(--kepala) + 11px)}
  header.app .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto auto;
    grid-template-areas:"merek agen tema" "nav nav nav";gap:2px 6px;padding:6px 12px}
  /* Pendamping duduk di BARIS PERTAMA, bukan baris ketiga. Sebelumnya tombol
     ini tanpa grid-area sehingga ditempatkan otomatis ke baris ke-3: ia tampak
     seperti ikon hiasan yang berdiri sendiri (sisa ~346 px kosong di kiri),
     dan tinggi kepala membengkak ke 151 px. */
  .tombol-agen-kepala{grid-area:agen;align-self:center}
  /* Di HP nama tetap sedikit lebih besar dari sebelumnya, slogan mengecil dan
     TIDAK memaksa baris baru: dua baris teks + satu baris navigasi. Tinggi
     kepala yang sebenarnya diukur aturKepala() dan dipakai offset sticky. */
  header.app .merek{grid-area:merek;font-size:.99rem;gap:6px;min-height:44px;
    padding:2px 8px 2px 4px;justify-self:start;width:fit-content;max-width:100%}
  header.app .merek .merek-ikon{width:17px;height:17px}
  header.app .merek .merek-rumah{width:11px;height:11px}
  .merek-nama{font-size:.99rem}
  .merek-slogan{font-size:.65rem}
  header.app nav{grid-area:nav;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:2px;
    scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
  header.app nav::-webkit-scrollbar{display:none}
  header.app nav a{padding:8px 10px;font-size:.86rem;white-space:nowrap;min-height:44px}
  /* Label panjang membuat "Catatan Saya" terpotong di tengah kata pada 390 px
     (nav hanya 247 px, isinya 364 px). Di layar sempit dipakai label pendek
     supaya KEEMPAT tujuan terlihat utuh tanpa gulir menyamping. */
  @media (max-width:430px){
    header.app nav a .pjg{display:none}
    header.app nav a .pdk{display:inline}
    header.app nav a{padding:8px 9px;font-size:.84rem}
  }
  /* 360 px: masih kurang 9 px — rapatkan sedikit lagi, jangan sampai terpotong. */
  @media (max-width:380px){
    header.app nav a{padding:8px 7px;font-size:.82rem}
  }
  .pilih-tema{grid-area:tema;margin-left:0;align-self:center}
  .pilih-tema label{display:none}
  .pilih-tema select{min-height:44px;font-size:.82rem;padding:5px 6px}
  .hasil-baca{padding:var(--s-4)}
  .hasil-baca h2,.hasil-baca h3{scroll-margin-top:calc(var(--kepala) + 16px)}
  /* DUA BARIS di layar sempit. Terukur di 390 px: dengan satu baris,
     .alat-kanan (363 px) menghabiskan seluruh 358 px wadah sehingga strip tab
     menyusut ke 0 px — tab "Rangkuman", "Tugas & Komitmen", dan "Langkah
     Penerapan" tidak bisa ditekan sama sekali (elementFromPoint di titik
     tengahnya bukan tombolnya). Jadi tab mendapat barisnya sendiri dan
     tindakan pindah ke bawahnya. Bilah ini TIDAK menempel di HP (sticky hanya
     ≥761 px), jadi tambahan 44 px hanya menggeser bacaan, bukan menutupinya. */
  .baca-alat{gap:var(--s-1);flex-wrap:wrap;row-gap:6px}
  .baca-alat .tab-hasil{flex:1 1 100%;order:1}
  .baca-alat .alat-kanan{order:2;flex:1 1 100%;margin-left:0;min-width:0;
    overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .baca-alat .alat-kanan::-webkit-scrollbar{display:none}
  /* Label tindakan TIDAK boleh membungkus: tanpa ini "Tampilkan sumber" dan
     "Daftar isi" pecah dua baris dan baris tindakan naik dari 44 ke 49 px
     (terukur 390 px). Karena itu barisnya diberi overflow-x di atas. */
  .baca-alat button{white-space:nowrap}
  .tab-hasil button{padding:0 10px}
  .alat-kanan .kecil{padding:0 8px}
  #isi{padding-bottom:92px}
}

/* Di bawah 400 px tiga kolom tidak cukup: merek (≈160 px) + pill pendamping
   (120 px) + pemilih tema (≈76 px) melebihi 296 px isi, sehingga nama merek
   TERPOTONG ("Catatan Mu…") dan tertimpa pill — terukur di 320 px pada build
   2026.11.04.4-web sebelum perbaikan ini. Pemilih tema dipindah ke baris
   kedua, berbagi baris dengan navigasi yang memang bisa digeser. Ditulis
   sebagai blok TERPISAH (bukan @media bersarang) supaya urutannya jelas:
   ia harus menang atas aturan 760 px di atasnya. */
@media(max-width:400px){
  header.app .wrap{grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"merek agen" "nav tema"}
  .pilih-tema{grid-area:tema;justify-self:end}
  /* 170 px untuk merek masih kurang 13 px bagi "Catatan Murojaah" + tagline
     (terukur: butuh 131/133 px, tersedia 118 px). Tiga penyesuaian kecil,
     semuanya terukur: ikon rumah dilepas (+17 px), tagline 0,62 rem, dan
     pill pendamping sedikit lebih rapat (+10 px untuk merek). Nama merek
     TIDAK dikecilkan dan TIDAK dipotong. */
  header.app .merek .merek-rumah{display:none}
  header.app .merek{padding-right:6px}
  /* Nama 0,96 rem HANYA di bawah 400 px: tanpa ini sisanya pas 131 <= 131 px
     — nol margin, dan satu perbedaan font sudah memotongnya lagi. */
  .merek-nama{font-size:.96rem}
  .merek-slogan{font-size:.62rem}
  .tombol-agen-kepala{padding:0 9px;font-size:.72rem}
}

/* ============================================================
   KOMPONEN SIBUK — satu untuk semua penantian.
   Alasan: dulu "Memeriksa audio…" hanya teks statis sementara dekode
   membekukan layar, dan tidak ada satu pun @keyframes di berkas ini.
   ============================================================ */
.sibuk{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:var(--s-2) 0;
  background:var(--permukaan-2);border:1px solid var(--garis-kuat);border-radius:var(--r-2);
  font-size:.92rem;color:var(--teks)}
.sibuk[data-jenis="gagal"]{background:var(--gagal-lembut);border-color:var(--gagal)}
.sibuk[data-jenis="selesai"]{background:var(--ok-lembut);border-color:var(--ok)}
.cakra{width:16px;height:16px;flex:0 0 auto;border:2px solid var(--garis-kuat);
  border-top-color:var(--aksen);border-radius:50%;animation:putar .9s linear infinite}
.sibuk[data-jenis="selesai"] .cakra{border-color:var(--ok);border-top-color:var(--ok);
  animation:none}
.sibuk[data-jenis="gagal"] .cakra{border-color:var(--gagal);border-top-color:var(--gagal);
  animation:none}
.sibuk .teks{display:flex;flex-direction:column;line-height:1.35;min-width:0;flex:1}
.sibuk .teks strong{font-weight:600;overflow-wrap:anywhere}
.sibuk .teks .kcil{margin:0}
.sibuk .bar{flex:0 0 90px;height:6px;border-radius:var(--r-pil);
  background:var(--permukaan-3);overflow:hidden}
.sibuk .bar i{display:block;height:100%;width:0;background:var(--aksen);
  transition:width var(--dur-2) var(--ease)}
.sibuk .ndua{margin-left:auto;flex:0 0 auto}
@keyframes putar{to{transform:rotate(360deg)}}

/* ---------- bilah tindakan yang menempel (halaman Buat Catatan) ---------- */
.bilah-buat{position:fixed;left:0;right:0;bottom:0;z-index:28;
  background:var(--panel-bg);backdrop-filter:blur(14px) saturate(140%);
  border-top:1px solid var(--garis-kuat);box-shadow:0 -10px 26px rgba(0,0,0,.22);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bilah-buat .dalam{max-width:var(--lebar);margin:0 auto;display:flex;gap:12px;
  align-items:center;flex-wrap:nowrap}
.bilah-buat .ket{flex:1;min-width:0;font-size:.86rem;color:var(--teks-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bilah-buat .ket b{color:var(--teks);font-weight:600}
.bilah-buat .ubah{flex:0 0 auto;font-size:.84rem;color:var(--aksen);background:none;
  border:0;padding:6px 2px;cursor:pointer;text-decoration:underline}
body.ada-bilah #isi{padding-bottom:118px}
/* Bilah menempel TIDAK boleh menutupi tombol Asisten yang mengambang. */
body.ada-bilah .tombol-agen{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
/* Saat bilah menempel ada, gulir otomatis menyisakan ruang untuk bilah —
   elemen terakhir tidak pernah berhenti TEPAT di bawah bilah. */
body.ada-bilah #isi button,body.ada-bilah #isi a,body.ada-bilah #isi input,
body.ada-bilah #isi textarea,body.ada-bilah #isi .bahan-item,
body.ada-bilah #isi .kartu-pilih{scroll-margin-bottom:110px}
/* Bilah menempel tidak boleh menutupi dialog atau panel yang sedang terbuka. */
body.panel-terbuka .bilah-buat,
body:has(dialog[open]) .bilah-buat{transform:translateY(130%);pointer-events:none}
.bilah-buat{transition:transform var(--dur-2) var(--ease)}
/* Di layar lebar panel Asisten punya KOLOM SENDIRI (bukan menutupi bacaan).
   Menyembunyikan bilah di sini berarti tombol utama hilang setiap kali pengguna
   membuka Asisten — jadi bilah tetap tampil, hanya berhenti di tepi kolom panel
   supaya kotak pesan + Kirim tetap terjangkau (§5). */
@media(min-width:1024px){
  body.panel-terbuka .bilah-buat{transform:none;pointer-events:auto;
    right:calc(var(--lebar-panel, 400px) + 16px)}
}
@media(max-width:760px){
  .bilah-buat{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  .bilah-buat .dalam{gap:8px}
  .bilah-buat .ket{font-size:.78rem}
  .bilah-buat .ubah{display:none}      /* di HP ruang terlalu sempit: pilihan ada di atas */
  body.ada-bilah #isi{padding-bottom:132px}
}

/* ============================================================
   BERANDA: panggung visual (bahan → pemahaman)
   Satu aset dominan: berkas WebP LOKAL di static/aset/ (1200×900),
   bukan CDN, bukan gambar dari URL luar. Sisanya CSS di berkas ini.
   ============================================================ */
.beranda-atas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  gap:32px;align-items:start;padding:var(--s-6) 0 var(--s-5)}
.beranda-kiri{grid-column:1/7;min-width:0}
.beranda-kanan{grid-column:7/13;min-width:0}
.beranda-atas h1{font-size:clamp(2rem,3.4vw,2.9rem);letter-spacing:-.02em;
  line-height:1.14;margin:0 0 var(--s-3)}
.beranda-atas .pimpin{font-size:1.06rem;color:var(--teks-2);max-width:52ch;margin:0}
.beranda-atas .beranda-aksi{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  margin:var(--s-5) 0 0}
.beranda-tanda{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--toska);font-weight:700;
  margin-bottom:14px}
.beranda-tanda::before{content:"";width:22px;height:2px;background:var(--toska);
  border-radius:2px}

/* Satu aset visual dominan: render 3D buku digital (berkas lokal, 1200×900).
   Tidak ada lagi buku dari div/SVG: satu objek, satu berkas, dua versi tema.
   Tepi kotak navy DIHAPUS — gambar duduk di atas cahaya lembut yang menyatu
   dengan latar halaman, di tema gelap maupun terang. */
.panggung{position:relative;margin:0;isolation:isolate;
  border:0;background:none;box-shadow:none;border-radius:var(--r-3)}
/* inset TIDAK boleh negatif: kotak pseudo yang lebih lebar dari induknya
   menambah lebar gulir halaman (terukur 403 px di layar 390 px). Blur sudah
   memberi pantulan cahaya tanpa menambah ruang gulir. */
.panggung::before{content:"";position:absolute;inset:0;z-index:-1;
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(126,94,255,.34),rgba(34,211,238,.16) 58%,transparent 78%);
  filter:blur(26px);pointer-events:none;
  /* Cahaya bernapas pelan. Hanya opasitas (compositor) — bukan bilah kemajuan,
     bukan angka, tidak menyamar sebagai proses. */
  animation:panggung-cahaya 14s var(--ease) infinite}
@keyframes panggung-cahaya{
  0%,100%{opacity:.78}
  50%{opacity:1}
}
@media(prefers-reduced-motion:reduce){
  .panggung::before{animation:none;opacity:1}
}
[data-tema="terang"] .panggung::before{
  background:radial-gradient(closest-side,rgba(126,94,255,.16),rgba(34,211,238,.10) 58%,transparent 78%);
  filter:blur(30px)}
.panggung .hero{display:block;width:100%;height:auto;aspect-ratio:4/3;
  object-fit:cover;border-radius:var(--r-3);
  /* Tepi gambar larut ke latar halaman (11 % tiap sisi, dua lapis mask yang
     diiris). Tanpa ini tema terang memperlihatkan kotak abu-abu bertepi —
     persis keluhan §8. Dengan mask, buku melayang di halaman. */
  -webkit-mask-image:linear-gradient(to right,transparent,#000 11%,#000 89%,transparent),
    linear-gradient(to bottom,transparent,#000 11%,#000 89%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 11%,#000 89%,transparent),
    linear-gradient(to bottom,transparent,#000 11%,#000 89%,transparent);
  -webkit-mask-composite:source-in;
  mask-composite:intersect;
  /* Bila berkas gagal dimuat, kotak ini tetap punya bentuk dan cahaya —
     tidak ada kotak hitam kosong di tengah halaman. */
  background:radial-gradient(60% 60% at 50% 42%,rgba(126,94,255,.22),transparent 70%)}
.panggung .hero-ket{margin:10px 2px 0;font-size:.76rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--redup);text-align:center}

.ubin-bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:16px;margin-top:var(--s-5)}
.ubin-bento .ubin{grid-column:span 3;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  background:var(--permukaan-1);border:1px solid var(--garis);
  border-radius:var(--r-2);padding:14px 16px;color:var(--teks);
  transition:border-color var(--dur-1) var(--ease),
    transform var(--dur-1) var(--ease)}
.ubin-bento .ubin strong{display:block;margin-top:4px;font-size:.98rem;line-height:1.35}
.ubin-bento .ubin .kcil{display:block;margin:2px 0 0}
.ubin-bento .ubin:hover{border-color:var(--toska);transform:translateY(-2px)}
.ubin-bento .ubin .n{font-size:.72rem;letter-spacing:.14em;color:var(--toska);
  font-weight:700}
.ubin-bento .ubin strong{display:block;margin-top:4px;font-size:.98rem}
.ubin-bento .ubin .kcil{margin:2px 0 0}
@media(max-width:1100px){
  .beranda-atas{grid-template-columns:1fr;gap:var(--s-5);padding-top:var(--s-5)}
  .beranda-kiri,.beranda-kanan{grid-column:1/-1}
  /* Di HP urutannya diatur ulang: judul → aksi → visual kompak → ubin.
     Tanpa ini panggung jatuh di bawah dua ubin dan tidak lagi terlihat
     sebagai "visual" halaman depan. */
  .beranda-atas{display:flex;flex-direction:column;gap:var(--s-4);
    align-items:stretch}   /* tanpa stretch, .beranda-kanan menyusut jadi 2 px */
  .beranda-kiri{display:contents}
  .beranda-atas .beranda-tanda{order:1}
  .beranda-atas h1{order:2}
  .beranda-atas .pimpin{order:3}
  .beranda-atas .beranda-aksi{order:4;margin-top:0}
  .beranda-kanan{order:5}
  .beranda-atas .ubin-bento{order:6}
  .beranda-kiri > p.kcil{order:7}
  /* Visual tidak lagi punya tinggi tetap: rasionya 4:3, jadi tidak ada ruang
     kosong menganga di layar sempit. */
  .panggung{min-height:0}
  .beranda-atas .beranda-aksi .tombol:first-child{order:-1}
}
@media(max-width:760px){
  /* HP: visual tetap terlihat, tetapi tidak boleh mendorong tindakan utama
     ke bawah lipatan. Tinggi dibatasi 300 px (arahan §8). */
  .panggung{min-height:0;max-height:none}
  .panggung .hero{max-height:300px;aspect-ratio:auto;object-fit:cover}
  .panggung .hero-ket{font-size:.7rem;margin-top:6px}
  .ubin-bento .ubin{grid-column:span 6}
}

/* ---------- kerangka memuat (shimmer) ---------- */
.kerangka{display:flex;flex-direction:column;gap:12px;padding:var(--s-5) 0}
.kerangka .baris{display:block;height:16px;border-radius:8px;
  background:linear-gradient(90deg,var(--permukaan-2) 25%,var(--permukaan-3) 37%,
    var(--permukaan-2) 63%);background-size:400% 100%;
  animation:kilau-muat 1.4s ease-in-out infinite}
.kerangka .w40{width:40%}.kerangka .w60{width:60%}.kerangka .w70{width:70%}
.kerangka .w80{width:80%}.kerangka .w85{width:85%}.kerangka .w90{width:90%}
@keyframes kilau-muat{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---------- hasil bacaan: penanda dalam teks ---------- */
.hasil-baca mark,.baca mark{background:var(--ingat-lembut);color:var(--teks);
  padding:0 2px;border-radius:3px}
.hasil-baca blockquote,.baca blockquote{margin:1.1em 0;padding:6px 0 6px 14px;
  border-left:3px solid var(--aksen);color:var(--teks-2);background:none}
.hasil-baca blockquote p:last-child{margin-bottom:0}
.hasil-baca em{font-style:italic}
.hasil-baca ol{margin:.8em 0;padding-left:1.4em}
.hasil-baca ol li{margin:.25em 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0ms !important;animation-iteration-count:1 !important;
    transition-duration:0ms !important;scroll-behavior:auto !important}
}

    border:0;border-radius:0;box-shadow:none;font-size:11.5pt !important;line-height:1.55}
  .hasil-baca h1,.hasil-baca h2,.hasil-baca h3,.hasil-baca h4{color:#000}
  .hasil-baca h1,.hasil-baca h2,.hasil-baca h3,.hasil-baca h4{break-after:avoid;page-break-after:avoid}

  /* Gambar sumber ikut tercetak — utuh, tidak terpotong, dengan keterangan.

  .hasil-baca figure.gambar-hasil{break-inside:avoid;page-break-inside:avoid;

}

<script>
"use strict";
/* ============================================================
   CATATAN MUROJAAH — klien local-first.
   Penyimpanan utama: IndexedDB perangkat ini. Server hanya
   melayani aset, contoh publik, dan endpoint AI tanpa simpan.
   ============================================================ */
/* 3: tambah toko "sesi" + "potongan". Sebelum versi ini, potongan rekaman
   hanya hidup di array memori (blokBlok) sampai Berhenti ditekan — jadi muat
   ulang halaman membuang SELURUH rekaman. Terbukti pada rapat 1 jam 40 menit
   (5 Nov 2026). Migrasi 2→3 hanya MENAMBAH toko: acara/versi/chat/draf tidak
   disentuh, sehingga catatan, draf, dan percakapan lama tetap utuh. */
const SKEMA = 3;
const NAMA_DB = "catatan-murojaah";
const OUTPUT_DEFS = {
  A:{nama:"Catatan Lengkap", tab:"Catatan Lengkap",
     ringkas:"Seluruh pembahasan ditulis kembali secara runtut dan nyaman dibaca."},
  B:{nama:"Rangkuman & Pelajaran Penting", tab:"Rangkuman",
     ringkas:"Pokok pembahasan dan pelajaran penting dari materi."},
  C:{nama:"Tugas & Komitmen", tab:"Tugas & Komitmen",
     ringkas:"Penugasan, komitmen, dan tindak lanjut dipisahkan dengan jelas."},
  D:{nama:"Langkah Penerapan", tab:"Langkah Penerapan",
     ringkas:"Pilihan langkah untuk menerapkan pelajaran sesuai kebutuhan."}
};
const JENIS_ACARA = ["Kelas","Kajian","Halaqah","Seminar","Workshop","Pelatihan","Meeting","Diskusi profesional"];

/* ---------- penyimpanan: IndexedDB ---------- */
let db = null;
function bukaDB(){
  return new Promise((selesai, gagal) => {
    if (!("indexedDB" in window)) return gagal(new Error("Penyimpanan peramban tidak tersedia di sini"));
    const req = indexedDB.open(NAMA_DB, SKEMA);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains("acara"))
        d.createObjectStore("acara", {keyPath:"id"});
      if (!d.objectStoreNames.contains("versi")){
        const s = d.createObjectStore("versi", {keyPath:"id"});
        s.createIndex("acara_id","acara_id");
      }
      if (!d.objectStoreNames.contains("chat")){
        const s = d.createObjectStore("chat", {keyPath:"id"});
        s.createIndex("acara_id","acara_id");
      }
      /* Draf bahan: rekaman yang sudah diunggah/direkam tetapi catatannya belum
         dibuat. Tanpa toko ini, memuat ulang halaman membuang rekaman yang
         belum diproses — padahal aplikasi menjanjikan sebaliknya. */
      if (!d.objectStoreNames.contains("draf"))
        d.createObjectStore("draf", {keyPath:"id"});
      /* ---- SKEMA 3: rekaman tahan muat ulang -----------------------------
         "sesi"    satu baris per sesi merekam (mulai, denyut, status, jeda).
         "potongan" satu baris per potongan 5 detik, ditulis SAAT MEREKAM.
         Tanpa dua toko ini, halaman yang termuat ulang membuang seluruh
         rekaman — sebab keluhan rapat 1 jam 40 menit yang hilang. */
      if (!d.objectStoreNames.contains("sesi"))
        d.createObjectStore("sesi", {keyPath:"id"});
      if (!d.objectStoreNames.contains("potongan")){
        const s = d.createObjectStore("potongan", {keyPath:"kunci"});
        s.createIndex("sesi", "sesi");
      }
    };
    req.onsuccess = () => selesai(req.result);
    req.onerror = () => gagal(req.error || new Error("gagal membuka penyimpanan peramban"));
    req.onblocked = () => gagal(new Error("penyimpanan terkunci oleh tab lain — tutup tab lain lalu muat ulang"));
  });
}
function transaksi(toko, mode){ return db.transaction(toko, mode).objectStore(toko); }
function dbSemua(toko){
  return new Promise((selesai,gagal)=>{
    const r = transaksi(toko,"readonly").getAll();
    r.onsuccess=()=>selesai(r.result||[]); r.onerror=()=>gagal(r.error);
  });
}
function dbAmbil(toko, kunci){
  return new Promise((selesai,gagal)=>{
    const r = transaksi(toko,"readonly").get(kunci);
    r.onsuccess=()=>selesai(r.result||null); r.onerror=()=>gagal(r.error);
  });
}
function dbSimpan(toko, nilai){
  return new Promise((selesai,gagal)=>{
    const tx = db.transaction(toko,"readwrite");
    tx.objectStore(toko).put(nilai);
    tx.oncomplete=()=>selesai(true);
    tx.onerror=()=>gagal(tx.error);
    tx.onabort=()=>gagal(tx.error||new Error("transaksi dibatalkan"));
  });
}
function dbHapus(toko, kunci){
  return new Promise((selesai,gagal)=>{
    const tx = db.transaction(toko,"readwrite");
    tx.objectStore(toko).delete(kunci);
    tx.oncomplete=()=>selesai(true);
    tx.onerror=()=>gagal(tx.error);
  });
}
function dbSemuaIndeks(toko, namaIndeks, nilai){
  return new Promise((selesai,gagal)=>{
    const r = transaksi(toko,"readonly").index(namaIndeks).getAll(nilai);
    r.onsuccess=()=>selesai(r.result||[]); r.onerror=()=>gagal(r.error);
  });
}

/* ---------- sesi rekaman: tulis satu potongan, satu transaksi ----------
   Potongan dan baris sesi ditulis BERSAMA dalam satu transaksi. Kalau
   keduanya terpisah, halaman yang mati di antara dua transaksi bisa
   menyisakan potongan tanpa denyut — dan "Tersimpan sampai" berbohong. */
function sesiSimpan(s){
  return new Promise((selesai,gagal)=>{
    const tx = db.transaction(["sesi"],"readwrite");
    tx.objectStore("sesi").put(s);
    tx.oncomplete=()=>selesai(true);
    tx.onerror=()=>gagal(tx.error);
    tx.onabort=()=>gagal(tx.error||new Error("transaksi sesi dibatalkan"));
  });
}
function sesiAmbil(id){ return dbAmbil("sesi", id); }
function sesiSemua(){ return dbSemua("sesi"); }
function potonganSesi(id){
  return dbSemuaIndeks("potongan","sesi",id).then(daftar=>
    daftar.sort((a,b)=> (a.bagian-b.bagian) || (a.urut-b.urut)));
}
function potonganSemua(){ return dbSemua("potongan"); }
function potonganHapusSesi(id){
  return new Promise((selesai,gagal)=>{
    const tx = db.transaction(["potongan"],"readwrite");
    const st = tx.objectStore("potongan");
    const r = st.index("sesi").openKeyCursor(IDBKeyRange.only(id));
    r.onsuccess = ()=>{
      const c = r.result;
      if (c){ st.delete(c.primaryKey); c.continue(); }
    };
    tx.oncomplete=()=>selesai(true);
    tx.onerror=()=>gagal(tx.error);
    tx.onabort=()=>gagal(tx.error||new Error("transaksi potongan dibatalkan"));
  });
}
/* Satu potongan = satu transaksi: potongan + denyut sesi. */
function potonganTulis(p, sesi){
  return new Promise((selesai,gagal)=>{
    let tx;
    try{
      tx = db.transaction(["potongan","sesi"],"readwrite");
    }catch(e){ return gagal(e); }
    tx.objectStore("potongan").put(p);
    tx.objectStore("sesi").put(sesi);
    tx.oncomplete=()=>selesai(true);
    tx.onerror=()=>gagal(tx.error);
    tx.onabort=()=>gagal(tx.error||new Error("transaksi potongan dibatalkan"));
  });
}

/* ---------- util ---------- */
const $ = (sel, akar=document)=>akar.querySelector(sel);
function esc(x){ return String(x??"").replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function idBaru(awalan){ return awalan + "-" + Date.now().toString(36) +
  "-" + Math.random().toString(36).slice(2,8); }
/* ---------- gambar sumber di dalam hasil (§7) ---------- */
/* Peta id penanda → gambar. Diisi siapkanGambarHasil() SEBELUM hasil digambar,
   dan URL objeknya dicabut saat halaman berganti supaya memori tidak menumpuk. */
let GAMBAR_HASIL = new Map();
let URL_GAMBAR_HASIL = [];
function hancurkanGambarHasil(){
  for (const u of URL_GAMBAR_HASIL){ try{ URL.revokeObjectURL(u); }catch(e){} }
  URL_GAMBAR_HASIL = [];
  GAMBAR_HASIL = new Map();
}
function siapkanGambarHasil(a){
  hancurkanGambarHasil();
  if (!a || !Array.isArray(a.gambar)) return;
  const sumber = new Map((a.sumber || []).map(s=>[s.id, s]));
  for (const g of a.gambar){
    const s = sumber.get(g.sumberId);
    let blob = null;
    if (s){
      if (s.jenis === "foto") blob = s.blobProses || s.blob;
      else if (s.jenis === "video" && Array.isArray(s.cuplikan)){
        const c = s.cuplikan.find(x=>x.waktu === g.waktu) || s.cuplikan[0];
        if (c) blob = c.blob;
      }
    }
    if (!blob) continue;
    const url = URL.createObjectURL(blob);
    URL_GAMBAR_HASIL.push(url);
    GAMBAR_HASIL.set(g.id, {url, ket:g.ket || "Gambar sumber",
      nama:(s && s.nama) || ""});
  }
}
function gambarHasilHtml(id){
  const g = GAMBAR_HASIL.get(id);
  if (!g) return '<p class="gambar-hilang">Gambar sumber ' + esc(id) +
    ' tidak tersedia di perangkat ini — mungkin catatan ini dipulihkan dari ' +
    'cadangan tanpa media. Teksnya tetap utuh.</p>';
  return '<figure class="gambar-hasil" data-gambar="' + esc(id) + '"><img src="' +
    g.url + '" alt="' + esc(g.ket) + '" loading="lazy"><figcaption>' + esc(g.ket) +
    ' · <a href="' + g.url + '" target="_blank" rel="noopener">Lihat sumber</a>' +
    '</figcaption></figure>';
}
/* "Sertakan gambar sumber" TIDAK boleh berakhir kosong hanya karena model lupa
   menulis penanda [[gambar:…]]. Terukur 4 Nov 2026: permintaan kedua pada
   catatan yang sama menghasilkan tulisan tanpa satu pun penanda, sehingga
   pengguna yang sudah mencentang pilihan itu tidak melihat gambar apa pun.
   Bila tidak ada satu gambar pun tertempel di tulisan, gambar ditampilkan
   sebagai LAMPIRAN — disebut apa adanya, bukan pura-pura menjelaskan paragraf. */
function lampiranGambar(a){
  const isi = [...GAMBAR_HASIL.keys()].map(id=>gambarHasilHtml(id));
  if (!isi.length) return null;
  const wadah = document.createElement("section");
  wadah.className = "lampiran-gambar";
  wadah.innerHTML = "<h3>Lampiran gambar sumber</h3>" +
    "<p class='kcil'>Tulisan ini tidak merujuk gambar di paragraf mana pun. " +
    "Gambar ditampilkan sebagai lampiran — bukan sebagai penjelas paragraf " +
    "tertentu. Tekan \"Lihat sumber\" untuk membuka ukuran penuh.</p>" +
    isi.join("");
  return wadah;
}
/* Model kadang meletakkan penanda gambar di AKHIR tulisan, bukan sesudah
   paragraf yang membahasnya. Menebak "paragraf yang cocok" tidak boleh.
   Aturan yang dipakai di sini PASTI: gambar dipindahkan ke paragraf yang
   benar-benar MERUJUK bagian sumber gambar itu ([[a3-b01]]). Bila tidak ada
   paragraf yang merujuknya, gambar dibiarkan di tempat model menaruhnya —
   lebih baik jujur daripada menempatkan gambar di paragraf yang salah. */
function tempatkanGambar(a, artikel){
  if (!artikel) return;
  const figs = [...artikel.querySelectorAll("figure.gambar-hasil")];
  if (!figs.length) return;
  const peta = new Map((a.gambar || []).map(g=>[g.id, g]));
  let bag = [];
  try{ bag = bagianSumber(a); }catch(e){ bag = []; }
  for (const fig of figs){
    const g = peta.get(fig.dataset.gambar);
    if (!g) continue;
    /* Jangkar rujukan memakai sumber TEKS dari gambar itu (bila ada); sumber
       media tidak punya bagian bernomor dan tidak bisa dirujuk. */
    const sidJangkar = g.sumberTeksId || g.sumberId;
    const b = bag.find(x=>x.sumber_id === sidJangkar);
    if (!b) continue;
    const awalan = String(b.id).split("-")[0];
    const kandidat = [...artikel.querySelectorAll("p, li")].find(el=>
      el.textContent.includes("[[" + awalan + "-"));
    if (!kandidat) continue;
    if (kandidat.nextElementSibling === fig) continue;
    kandidat.after(fig);
  }
}
function markdownKeHtml(md){
  // mini-renderer: judul, daftar, tebal/miring, sorot, kutipan, kode, tabel
  const baris = String(md||"").replace(/\r\n/g,"\n").split("\n");
  let html = "", diList = false, diTabel = false, diKutip = false, diOl = false, par = [];
  const tutupList = ()=>{ if(diList){html+="</ul>"; diList=false;} };
  const tutupOl = ()=>{ if(diOl){html+="</ol>"; diOl=false;} };
  const tutupKutip = ()=>{ if(diKutip){html+="</blockquote>"; diKutip=false;} };
  const tutupTabel = ()=>{ if(diTabel){html+="</tbody></table>"; diTabel=false;} };
  const semuaTutup = ()=>{ tutupPar(); tutupList(); tutupOl(); tutupKutip(); };
  /* Satu baris baru di dalam paragraf = SAMBARAN LUNAK, bukan paragraf baru.
     Teks yang dibungkus rapi (hasil rekaman atau tempelan) tadinya pecah jadi
     banyak paragraf pendek dan terlihat seperti kalimat terputus.

     AMAN: esc() dijalankan LEBIH DULU, jadi teks pengguna tidak pernah menjadi
     HTML. Yang ditambahkan hanya penanda yang kita buat sendiri. */
  const sebaris = s => {
    const kode = [];
    let t = esc(s).replace(/`([^`]+)`/g, (m, isi)=>{
      kode.push(isi); return "\u0000K" + (kode.length - 1) + "\u0000";
    });
    t = t.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>")
         .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
         .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
         .replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
         .replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
    t = t.replace(/\u0000K(\d+)\u0000/g, (m, i)=> "<code>" + kode[+i] + "</code>");
    return t;
  };
  const tutupPar = ()=>{
    if (par.length){ html += "<p>"+sebaris(par.join(" "))+"</p>"; par = []; }
  };
  for (const b of baris){
    const t = b.trim();
    if (/^\|.*\|$/.test(t)){
      const sel = t.slice(1,-1).split("|").map(s=>s.trim());
      if (/^[-: |]+$/.test(t)) continue;
      tutupPar(); tutupList(); tutupOl(); tutupKutip();
      if (!diTabel){ html+="<table><tbody>"; diTabel=true; }
      html += "<tr>"+sel.map(s=>"<td>"+sebaris(s)+"</td>").join("")+"</tr>";
      continue;
    }
    tutupTabel();
    if (!t){ tutupPar(); tutupList(); tutupOl(); tutupKutip(); continue; }
    /* Penanda gambar sumber: [[gambar:g1]] pada barisnya sendiri. Gambar
       diletakkan TEPAT di sini — dekat paragraf yang membahasnya — bukan
       dikumpulkan di akhir dokumen. */
    const gm = t.match(/^\[\[gambar:([A-Za-z0-9_-]+)\]\]$/);
    if (gm){
      semuaTutup();
      html += gambarHasilHtml(gm[1]);
      continue;
    }
    const jm = t.match(/^(#{1,3})\s+(.*)/);
    if (jm){ semuaTutup(); html += `<h${jm[1].length+1}>${sebaris(jm[2])}</h${jm[1].length+1}>`; continue; }
    /* Kutipan: "> " berurutan menjadi satu <blockquote>. */
    if (/^>\s?/.test(t)){
      tutupPar(); tutupList(); tutupOl();
      if (!diKutip){ html += "<blockquote>"; diKutip = true; }
      const isi = t.replace(/^>\s?/, "");
      if (isi) html += "<p>" + sebaris(isi) + "</p>";
      continue;
    }
    tutupKutip();
    /* Daftar berurut: "1. " (angka apa pun) — dulu jatuh menjadi paragraf. */
    const ol = t.match(/^(\d{1,3})[.)]\s+(.*)/);
    if (ol){
      tutupPar(); tutupList();
      if (!diOl){ html += "<ol>"; diOl = true; }
      html += "<li>" + sebaris(ol[2]) + "</li>";
      continue;
    }
    if (/^[-*]\s+/.test(t)){
      tutupPar(); tutupOl();
      if(!diList){html+="<ul>"; diList=true;}
      html += "<li>"+sebaris(t.slice(2))+"</li>";
      continue;
    }
    tutupList(); tutupOl();
    par.push(t);
  }
  semuaTutup(); tutupTabel();
  return html || "<p>(kosong)</p>";
}
function unduhBerkas(nama, isi, tipe="text/markdown"){

}

async function salinKePapan(teks){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(teks); return true;
    }
  }catch(e){ /* jatuh ke cara lama */ }
  try{
    const t = document.createElement("textarea");
    t.value = teks; t.setAttribute("readonly", "");
    t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy");
    t.remove(); return ok;
  }catch(e){ return false; }
}
