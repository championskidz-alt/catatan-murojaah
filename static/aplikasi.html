/* ---------- status AI ---------- */
let statusAI = {diketahui:false, aktif:false, sibuk:false, sisa:null, pesan:""};
async function cekAI(paksa){
  // Pemeriksaan status memakai kuota yang SAMA dengan pembuatan catatan
  // (15 permintaan / 10 menit / jaringan). Tanpa simpanan, membuka delapan
  // halaman menghabiskan jatah itu sebelum pengguna meminta satu hasil pun.
  // Simpanan 3 menit: cukup segar, dan Pengaturan selalu memaksa periksa baru.
  const kini = Date.now();
  if (!paksa){
    try{
      const c = JSON.parse(sessionStorage.getItem("catatan-status-ai") || "null");
      if (c && c.nilai && kini - c.kapan < 180000){
        statusAI = Object.assign({}, c.nilai);
        renderStatusAI();
        return;
      }
    }catch(e){ /* mode privat: periksa langsung */ }
  }
  try{
    const r = await fetch("/api/ai", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({tugas:"status"})});
    let j = {};
    try{ j = await r.json(); }catch(e){}
    // 429 = layanan ADA, hanya sedang dibatasi untuk jaringan ini. Menuliskannya
    // sebagai "belum siap" akan menyesatkan: pengguna mengira AI mati.
    statusAI = {diketahui:true, aktif:r.ok && !!j.aktif, sibuk:r.status === 429,
                pesan:j.status_pesan || "",
                sisa:(typeof j.sisa_harian === "number" ? j.sisa_harian : null)};
  }catch(e){
    statusAI = {diketahui:true, aktif:false, sibuk:false,
                pesan:"server tidak terjangkau", sisa:null};
  }
  try{
    sessionStorage.setItem("catatan-status-ai",
      JSON.stringify({kapan:kini, nilai:statusAI}));
  }catch(e){ /* mode privat: tidak apa-apa */ }
  renderStatusAI();
}
function renderStatusAI(){
  const el = $("#agen-status"); if (!el) return;
  if (statusAI.aktif)
    el.textContent = "Catatan disimpan di perangkat ini. Bahan yang diperlukan dikirim ke layanan AI saat membuat catatan atau bertanya kepada " + PENDAMPING.nama + ".";
  else if (statusAI.sibuk)
    el.textContent = "Layanan AI sedang dibatasi untuk jaringan ini karena terlalu banyak permintaan. Catatan tetap bisa disimpan dan dibaca; coba proses lagi beberapa menit kemudian.";
  else
    el.textContent = "Layanan AI sedang belum siap. Catatan tetap bisa disimpan, dibaca, dicetak, dan dicadangkan; pembuatan hasil A–D akan memberi pesan jujur.";
}

/* ---------- panggil AI ---------- */
async function panggilAIRaw(badan){
  const kepala = {"Content-Type":"application/json"};
  let r;
  try{
    r = await fetch("/api/ai", {method:"POST", headers:kepala, body:JSON.stringify(badan)});
  }catch(e){
    /* Jaringan putus ≠ batas pemakaian. Pesannya harus berbeda. */
    throw new Error("Tidak tersambung ke layanan AI. Periksa sambungan internet " +
      "lalu coba lagi — bahan Anda tetap tersimpan di perangkat ini.");
  }
  let j; try{ j = await r.json(); }catch(e){ throw new Error("jawaban server tidak bisa dibaca (HTTP "+r.status+")"); }
  if (!j.ok){
    let pesan = j.status_pesan || ("gagal (HTTP "+r.status+")");
    if (j.tunggu_detik) pesan += " Perkiraan: sekitar " +
      Math.max(1, Math.round(j.tunggu_detik/60)) + " menit lagi.";
    throw new Error(pesan);
  }
  return j;
}
async function panggilAI(badan){
  const j = await panggilAIRaw(badan);
  return j.jawaban || "";
}

/* ---------- model data acara ---------- */
function acaraBaru(meta){
  return {id:idBaru("acara"), judul:meta.judul||"Tanpa judul", jenis:meta.jenis||"Kelas",
    tanggal:meta.tanggal||"", pemateri:meta.pemateri||"",
    dibuat:new Date().toISOString(), diubah:new Date().toISOString(),
    sumber:[], pilihan:[], hasil:{}, koreksi:[], skema:SKEMA};
}
async function simpanAcara(a){
  a.diubah = new Date().toISOString();
  /* Keadaan proses TIDAK ikut tersimpan. Kunci berawalan "__" adalah penanda
     sesi berjalan (mis. "pertanyaan sedang dijawab"); menyimpannya membuat
     catatan terbawa dalam keadaan "sibuk" selamanya setelah dimuat ulang. */
  let bersih = a;
  if (Object.keys(a).some(k => k.startsWith("__"))){
    bersih = {};
    for (const k of Object.keys(a)) if (!k.startsWith("__")) bersih[k] = a[k];
  }
  try{ await dbSimpan("acara", bersih); }
  catch(e){
    dialogTampil("<h3>Penyimpanan penuh / gagal</h3><p>"+esc(e.message||e)+
      "</p><p class='kcil'>Catatan tidak tersimpan. Unduh cadangan sekarang agar pekerjaan tidak hilang, "+
      "lalu hapus catatan lama yang tidak diperlukan.</p>",
      [{label:"Tutup", ndua:true},
       {label:"Unduh cadangan sekarang", aksi:()=>eksporSemua(true, false)}]);
    throw e;
  }
  try{ localStorage.setItem("catatan-rev", String(Date.now())); }catch(e){}
}

let acaraAktif = null;
window.addEventListener("hashchange", ()=>{ window.scrollTo(0,0); rute(); });
/* Selama merekam, menutup tab berarti kehilangan sisa rekaman — kecuali yang
   sudah tertulis. Pesan ini menyebut ANGKA NYATA, bukan "data Anda akan hilang". */
window.addEventListener("beforeunload", (ev)=>{
  if (!sesiAktif) return;
  const pesan = "Rekaman sedang berjalan. Sampai " +
    jamPanjang(sesiAktif.tersimpanMs || 0) + " sudah tersimpan di perangkat ini.";
  ev.preventDefault();
  ev.returnValue = pesan;
  return pesan;
});
window.addEventListener("focus", ()=>{ /* multi-tab: segarkan daftar */ if (db && ["#/catatan"].includes(hashKini())) rute(); });
// Melebar → menyempit: panel yang tadinya berkolom sendiri berubah menjadi
// bottom sheet yang MENUTUPI bacaan. Tutup saat melewati batas 1024 px.
let lebarTerakhir = window.innerWidth;
window.addEventListener("resize", ()=>{
  const w = window.innerWidth;
  if (lebarTerakhir >= 1024 && w < 1024) tutupPanelBilaSempit();
  lebarTerakhir = w;
  aturKepala();
});
/* Tinggi kepala aplikasi diukur NYATA (bisa membungkus di layar sempit), lalu
   dipakai panel Asisten: panel selalu mulai di BAWAH kepala, jadi navigasi dan
   judul halaman tidak pernah tertutup.

   Sejak merek punya slogan (dua baris teks), tinggi kepala TIDAK LAGI 62/101 px
   yang ditulis mati di CSS. Karena itu --kepala ikut diisi dari hasil ukur:
   .baca-alat (sticky) dan scroll-margin judul memakai variabel yang sama, jadi
   tidak ada lagi judul yang tertutup bilah. ResizeObserver menjaga saat slogan
   membungkus atau orientasi berubah. */
function aturKepala(){
  const h = document.querySelector("header.app");
  if (!h) return;
  const t = Math.round(h.getBoundingClientRect().height);
  if (!t) return;
  const akar = document.documentElement.style;
  akar.setProperty("--kepala-nyata", t + "px");
  akar.setProperty("--kepala", t + "px");
}
window.addEventListener("load", aturKepala);
document.addEventListener("DOMContentLoaded", aturKepala);
window.addEventListener("resize", aturKepala);
if (window.ResizeObserver){
  const _kepalaAmati = new ResizeObserver(aturKepala);
  document.addEventListener("DOMContentLoaded", ()=>{
    const h = document.querySelector("header.app");
    if (h) _kepalaAmati.observe(h);
  });
}

function hashKini(){ return location.hash || "#/beranda"; }
async function rute(){
  if (!db){ return; }
  const h = hashKini();
  const isi = $("#isi");
  hancurkanPemutarHalaman();   // pemutar halaman lama dilepas; URL objek tidak menumpuk
  hancurkanGambarHasil();      // URL gambar hasil lama juga tidak boleh menumpuk
  agenAcara = null;
  // Panel yang sedang terbuka ikut berpindah halaman: isinya kembali ke mode
  // panduan dulu, lalu halAcara() mengisinya dengan catatan yang dibuka.
  if ($("#panel-agen") && !$("#panel-agen").hidden) siapkanAgen(null);
  // Di layar sempit panel adalah bottom sheet yang MENUTUPI formulir. Setelah
  // pindah halaman ia tidak boleh tertinggal terbuka; pengguna membukanya lagi
  // lewat tombol mengambang "Asisten" bila perlu.
  tutupPanelBilaSempit();
  const tAgen = $("#t-agen-terapung");
  if (tAgen) tAgen.onclick = ()=>bukaPanelAgen(agenAcara);
  /* Di layar sempit tombol mengambang dimatikan (ia menutupi kartu bahan);
     pintu masuknya pindah ke kepala halaman dengan perilaku yang sama. */
  const tAgenKepala = $("#t-agen-kepala");
  if (tAgenKepala) tAgenKepala.onclick = ()=>bukaPanelAgen(agenAcara);
  tandaiNav(h);
  if (h.startsWith("#/beranda")) await halBeranda(isi);
  else if (h.startsWith("#/buat")) await halBuat(isi);
  else if (h.startsWith("#/acara/")) await halAcara(isi, h.slice("#/acara/".length));
  else if (h.startsWith("#/salin/")) await halSalin(isi, h.slice("#/salin/".length));
  else if (h.startsWith("#/pengaturan")) await halPengaturan(isi);
  else if (h.startsWith("#/diagnosa")) await halDiagnosa(isi);
  else if (h.startsWith("#/catatan")) await halCatatan(isi);
  else await halBeranda(isi);
  /* Bilah menempel hanya ada di halaman Buat Catatan. */
  document.body.classList.toggle("ada-bilah", !!document.querySelector("#bilah-buat"));
  /* Beranda memakai Asisten sebagai DRAWER; halaman lain tetap kolom kanan. */
  document.body.classList.toggle("rute-beranda", h.startsWith("#/beranda") || h === "#/");
  terapkanTema();
  terapkanUkuran();
  aturKepala();
  gambarPanduan();          // panduan mengikuti halaman yang baru dibuka
}

async function halCatatan(isi){
  let daftar = [];
  let galatDB = "";
  try{ daftar = (await dbSemua("acara")).sort((a,b)=>(b.diubah||"").localeCompare(a.diubah||"")); }
  catch(e){ galatDB = e.message || String(e); }
  const q = (isi.dataset.cari || "").toLowerCase().trim();
  const cuplik = a => {
    const h = Object.values(a.hasil||{}).find(x=>x && x.teks);
    const t = h ? h.teks : ((a.sumber||[]).find(s=>s.teks)||{}).teks || "";
    const bersih = String(t).replace(/[#*_>`|]/g," ").replace(/\s+/g," ").trim();
    if (bersih.length <= 180) return bersih;
    return bersih.slice(0, 180).replace(/\s+\S*$/, "") + "…";
  };
  const status = a => {
    const k = Object.keys(a.hasil||{});
    if (!k.length) return {kelas:"tunggu", teks:"draf"};
    const ada = k.some(x=>a.hasil[x] && a.hasil[x].teks);
    return ada ? {kelas:"ok", teks:"siap"} : {kelas:"gagal", teks:"gagal"};
  };
  const tampil = q ? daftar.filter(a =>
    (a.judul+" "+a.jenis+" "+a.pemateri+" "+cuplik(a)).toLowerCase().includes(q)) : daftar;
  isi.innerHTML = `
  <h1>Catatan Saya</h1>
  <div id="panduan-slot" class="no-cetak"></div>
  <p class="kcil">Tersimpan di peramban perangkat ini. Bahan dikirim ke layanan AI hanya saat
  Anda menekan proses. Unduh cadangan agar dapat dipindahkan atau dipulihkan.</p>
  ${galatDB ? `<div class="catatan-status gagal"><strong>Penyimpanan peramban tidak bisa dibuka:</strong> ${esc(galatDB)}.
    Kemungkinan mode privat / penyimpanan penuh. Anda tetap bisa membuat catatan lalu segera mengunduh hasilnya.</div>` : ""}
  <div class="tindakan">
    <a class="tombol" href="/aplikasi#/buat">Buat Catatan</a>
    <button class="ndua" id="t-impor" type="button">Pulihkan dari cadangan</button>
    <button class="ndua" id="t-ekspor" type="button">Unduh cadangan</button>
    <button class="ndua" id="t-pengaturan" type="button">Pengaturan &amp; Cadangan</button>
  </div>
  <div class="cari-baris">
    <label for="cari" style="margin:0;position:absolute;left:-9999px">Cari catatan</label>
    <input type="text" id="cari" placeholder="Cari judul atau isi catatan…" value="${esc(isi.dataset.cari||"")}">
  </div>
  ${tampil.length ? tampil.map(a=>{
    const st = status(a);
    return `<article class="kartu-catatan" data-id="${a.id}">
      <div>
        <h3><a href="/aplikasi#/acara/${a.id}">${esc(a.judul)}</a></h3>
        <p class="meta" style="margin:0 0 6px">${esc(a.jenis)}${a.tanggal?" · "+esc(a.tanggal):""}${a.pemateri?" · "+esc(a.pemateri):""}</p>
        <p class="cuplik" style="margin:0">${esc(cuplik(a)) || "Belum ada isi."}</p>
      </div>
      <div class="aksi">
        <span class="lencana ${st.kelas}">${st.teks}</span>
        <a class="tombol ndua kecil" href="/aplikasi#/acara/${a.id}">Buka</a>
        <button class="kecil ndua aksi-unduh" data-id="${a.id}" type="button">Unduh</button>
        <button class="kecil ndua aksi-hapus" data-id="${a.id}" type="button">Hapus</button>
      </div>
    </article>`;
  }).join("") : `<div class="kosong-kotak">
      <p>${q ? "Tidak ada catatan yang cocok dengan pencarian." :
        "Belum ada catatan. Mulai dari bahan yang ingin Anda pelajari."}</p>
      ${q ? "" : `<a class="tombol" href="/aplikasi#/buat">Buat Catatan</a>`}
    </div>`}`;
  $("#cari").oninput = e => { isi.dataset.cari = e.target.value; halCatatan(isi); };
  $("#t-impor").onclick = imporDialog;
  $("#t-ekspor").onclick = ()=>eksporSemua(true, false);
  $("#t-pengaturan").onclick = ()=>{ location.hash = "#/pengaturan"; };
  isi.querySelectorAll(".aksi-unduh").forEach(b=>b.onclick=async()=>{
    const a = await dbAmbil("acara", b.dataset.id); if (a) eksporSatu(a, true);
  });
  isi.querySelectorAll(".aksi-hapus").forEach(b=>b.onclick=async()=>{
    const a = await dbAmbil("acara", b.dataset.id); if (!a) return;
    dialogTampil(`<h3>Hapus "${esc(a.judul)}"?</h3>
      <p>Yang terhapus dari perangkat ini: catatan, sumber (termasuk rekaman), semua hasil,
      semua versi, dan riwayat percakapan dengan asisten untuk catatan ini.</p>
      <p class="kcil">Tindakan ini tidak bisa dibatalkan. Pertimbangkan mengunduh cadangan dulu.</p>`,
      [{label:"Batal", ndua:true},
       {label:"Ya, hapus permanen", aksi:async()=>{
          for (const v of await dbSemuaIndeks("versi","acara_id",a.id)) await dbHapus("versi",v.id);
          for (const c of await dbSemuaIndeks("chat","acara_id",a.id)) await dbHapus("chat",c.id);
          await dbHapus("acara",a.id); rute();
       }}]);
  });
}

function ikonSumber(k){

    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+

}
const SUMBER_KARTU = [
  {k:"tulis", nama:"Tempel Tulisan", ket:"Tambahkan teks, transkrip, atau catatan."},
  {k:"rekaman", nama:"Pilih File", ket:"Tambahkan beberapa rekaman atau dokumen."},
  {k:"rekam", nama:"Rekam Suara", ket:"Rekam satu atau beberapa sesi."},
  {k:"foto", nama:"Foto / Slide", ket:"Foto slide, papan tulis, atau halaman buku."},
  {k:"video", nama:"Video", ket:"Ubah ucapan dalam video menjadi teks. Pilih gambar dari video jika ingin menyertakannya dalam catatan."},
  {k:"drive", nama:"Google Drive", ket:"Tambahkan satu atau beberapa tautan file."}
];
let sumberAktif = "tulis";
let pilihanHasil = new Set(["A"]);
/* "Lengkap" sendirian menyesatkan: bilah terlihat seperti formulir sudah
   lengkap padahal belum ada bahan (Direktif #9 §7.1). */
const LABEL_HASIL = {A:"Catatan Lengkap", B:"Rangkuman", C:"Tugas & Komitmen", D:"Langkah Penerapan"};

function perbaruiSumber(){
  /* Satu panel aktif pada satu waktu. Kartu adalah TINDAKAN: tidak ada tanda
     centang "berhasil" di kartu — tanda hanya ada di daftar bahan yang benar-benar
     masuk, supaya tidak ada keberhasilan palsu. */
  for (const s of SUMBER_KARTU){
    const b = document.querySelector('#kartu-sumber [data-sumber="'+s.k+'"]');
    const blok = document.getElementById("blok-" + s.k);
    const aktif = sumberAktif === s.k;
    if (b) b.setAttribute("aria-expanded", aktif ? "true" : "false");
    if (blok) blok.hidden = !aktif;
  }
}
function jumlahBahan(){
  const t = ($("#teks") && $("#teks").value.trim()) ? 1 : 0;
  return t + bahanTeks.length + audioDraf.length + bahanFoto.length + bahanVideo.length;
}
function hitungBahan(){
  const rekaman = audioDraf.length;
  const tr = bahanTeks.filter(b=>b.asalTr).length;
  const teks = bahanTeks.filter(b=>!b.asalTr).length;
  const foto = bahanFoto.length;
  const video = bahanVideo.length;
  /* Rekaman dan transkripnya SATU kelompok: bukan dua sumber teks. */
  return {rekaman, tr, teks, foto, video, total: rekaman + teks + foto + video};
}
/* Satu teks per kelompok. Transkrip tidak pernah dikirim dua kali: sebagai
   bahan tulisan DAN sebagai transkrip mentah. Revisi pengguna menang. */
function pilihTeksUntukAI(){
  const hasil = [];
  for (const b of bahanTeks){
    if (b.asalTr) continue;                       // dikirim lewat kelompoknya
    hasil.push({nama:b.nama, teks:b.teks, induk:b.induk || null});
  }
  const trPerInduk = new Map();
  for (const b of bahanTeks) if (b.asalTr) trPerInduk.set(b.asalTr, b);
  for (const x of audioDraf){
    const b = trPerInduk.get(x.kunci);
    if (b && (b.teks || "").trim())
      hasil.push({nama:b.nama, teks:b.teks, induk:x.kunci});
  }
  /* Teks hasil pembacaan foto ikut sebagai bahan tulisan. Teks ini boleh sudah
     diperbaiki pengguna — yang dikirim adalah versi yang terlihat di layar,
     bukan teks mentah model. */
  for (const f of bahanFoto){
    const t = (f.teks || "").trim();
    if (t) hasil.push({nama:f.nama + " (teks dari gambar)", teks:t, induk:null});
  }
  return hasil;
}
function perbaruiRingkas(){
  const el = $("#buat-ringkas");
  const n = hitungBahan();
  /* Selama rantai proses berjalan, bilah menempel membawa NAMA TAHAP — bukan
     ringkasan bahan. Bilah ini satu-satunya bagian halaman yang selalu
     terlihat, jadi di sinilah kemajuan harus muncul (Direktif #13 §4). */
  if (tahapAktif){
    if (el) el.textContent = tahapAktif;
    const tmb0 = $("#bilah-tambah"); if (tmb0) tmb0.hidden = true;
    perbaruiTombolBuat(); gambarStatusBahan();
    return;
  }
  const sisa = ($("#teks") && $("#teks").value.trim()) ? 1 : 0;
  const p = [...pilihanHasil].sort();
  const bagian = [];
  /* Bahan SELALU disebut lebih dulu — termasuk saat kosong. Dulu `if (n.total)`
     membuat bilah hanya menampilkan nama keluaran dan terbaca seperti formulir
     yang sudah lengkap. */
  if (n.total){
    /* §6: bilah menyebut JENIS bahan yang masuk, bukan hanya jumlahnya — supaya
       pengguna yang menambah bahan kedua tetap melihat bahan pertama beserta
       jenisnya. Bentuk lama "1 rekaman + transkripnya" dipertahankan apa adanya
       karena itu satu-satunya keadaan yang dulu disebut rinci. */
    const rincian = [];
    if (n.rekaman) rincian.push(n.rekaman +
      (n.tr ? " rekaman + transkripnya" : " rekaman"));
    if (n.teks) rincian.push(n.teks + " teks");
    if (n.foto) rincian.push(n.foto + " foto");
    if (n.video) rincian.push(n.video + " video");
    bagian.push(n.total + " bahan siap" +
      (rincian.length ? " — " + rincian.join(", ") : ""));
  }
  else bagian.push("Belum ada bahan");
  if (sisa) bagian.push("teks di kotak belum ditambahkan");
  if (p.length) bagian.push(p.map(k=>LABEL_HASIL[k] || k).join(" + "));
  if (el) el.textContent = bagian.join(" · ");
  const tmb = $("#bilah-tambah");
  if (tmb) tmb.hidden = !sisa;
  perbaruiTombolBuat();
  gambarStatusBahan();
  /* Kotak "Sertakan gambar sumber" hanya berguna bila ada gambar; jumlahnya
     disebut apa adanya supaya tidak ada janji kosong. */
  const ketG = $("#sertakan-gambar-ket");
  const cbG = $("#sertakan-gambar");
  if (ketG && cbG){
    const nG = bahanFoto.length + bahanVideo.reduce((s, v)=>s + (v.cuplikan || []).length, 0);
    cbG.disabled = !nG;
    if (!nG){
      cbG.checked = false;
      ketG.textContent = "Belum ada foto atau cuplikan video. Tambahkan lewat " +
        "\"Foto / Slide\" atau \"Video\" bila ingin gambar ikut ke dalam hasil.";
    } else {
      ketG.textContent = nG + " gambar tersedia; maksimum " + GAMBAR_HASIL_MAKS +
        " dikirim per hasil. Gambar diletakkan dekat paragraf yang menjelaskannya. " +
        "Bila tidak dicentang, hanya teks yang dikirim.";
    }
  }
  gambarPanduan();       // panduan mengikuti keadaan bahan/pilihan yang nyata
}
/* ---------- status bahan: dari pekerjaan NYATA, tanpa persen palsu (§8) ---------- */
/* Daftar hal yang benar-benar belum siap, bukan perkiraan. Dipakai dua kali:
   sebagai baris status di halaman, dan sebagai peringatan sebelum menyusun. */
function bahanBelumSiap(){
  const belum = [];
  const nFotoBaca = bahanFoto.filter(f=>f.status === "membaca").length;
  if (nFotoBaca) belum.push(nFotoBaca + " foto sedang dibaca");
  const nFotoGagal = bahanFoto.filter(f=>f.status === "gagal").length;
  if (nFotoGagal) belum.push(nFotoGagal + " foto gagal dibaca");
  const nFotoKosong = bahanFoto.filter(f=>f.status === "kosong").length;
  if (nFotoKosong) belum.push(nFotoKosong + " foto tanpa tulisan terbaca");
  const vid = bahanVideo.filter(v=>!v.suara).length;
  if (vid) belum.push(vid + " video belum diambil suaranya");
  const audioBelum = audioDraf.filter(a=>{
    /* "transkrip-mentah" SUDAH berupa teks (jalur pengenalan suara peramban):
       ia tidak perlu diubah lagi, jadi tidak boleh dihitung "belum siap". */
    if (a.jenis === "transkrip-mentah") return false;
    return !rekamAdaTulisan(a);
  }).length;
  if (audioBelum) belum.push(audioBelum + " rekaman belum diubah menjadi tulisan");
  return belum;
}
function gambarStatusBahan(){
  const el = $("#bahan-siap");
  if (!el) return;
  const n = hitungBahan();
  const belum = bahanBelumSiap();
  const bagian = [];
  if (n.total) bagian.push(n.total + " bahan masuk");
  if (n.foto) bagian.push(n.foto + " foto");
  if (n.video) bagian.push(n.video + " video");
  el.textContent = !n.total ? ""
    : belum.length ? bagian.join(" · ") + " — belum siap: " + belum.join(", ") + "."
    : bagian.join(" · ") + " — semua siap dipakai.";
  el.hidden = !n.total;
}
/* Tanpa tulisan, "Buat Catatan" akan berakhir di halaman kosong. Tombolnya
   berubah menjadi tindakan yang benar: menyimpan rekaman sebagai draf. */
let tahapAktif = "";
function tahap(teks){
  tahapAktif = teks || "";
  const el = $("#buat-ringkas");
  if (el && tahapAktif) el.textContent = tahapAktif;
  if (tahapAktif) umumkan(tahapAktif);
}
function perbaruiTombolBuat(){
  const b = $("#t-buat"); if (!b) return;
  const adaTeks = bahanTeks.length > 0
    || (($("#teks") && $("#teks").value.trim()) || "").length > 0;
  const adaAudio = audioDraf.length > 0;
  /* Rekaman yang BELUM dicoba diubah tidak boleh mengubah tombol utama menjadi
     "Simpan Rekaman sebagai Draf": menekannya sekarang berarti mengubah suara
     menjadi tulisan lalu menyusun catatan — satu rantai, satu ketukan
     (Direktif #13 §2). Label draf hanya jujur setelah transkripsi DICOBA dan
     gagal, karena saat itu memang tidak ada tulisan yang bisa dipakai. */
  const bisaDipakai = audioDraf.some(a=>a.jenis !== "transkrip-mentah" && a.blob
    && !(a.tr && a.tr.galat));
  if (!adaTeks && adaAudio && !bisaDipakai){
    b.textContent = "Simpan Rekaman sebagai Draf";
    b.setAttribute("title", "Belum ada tulisan yang bisa dipakai: rekaman tetap " +
      "disimpan sebagai draf dan bisa diubah menjadi tulisan kapan saja.");
  } else {
    b.textContent = "Buat Catatan";
    b.removeAttribute("title");
  }
}
function perbaruiKonteksD(){
  const adaD = pilihanHasil.has("D");
  const i = $("#konteks-d"), l = $("#lbl-konteks-d");
  if (i) i.hidden = !adaD;
  if (l) l.hidden = !adaD;
}

   Tanpa ini kartu "Catatan Lengkap" tampak belum dipilih padahal ikut terkirim. */
function perbaruiPilihan(){
  document.querySelectorAll("#pilih-hasil .kartu-pilih").forEach(b=>{
    b.setAttribute("aria-pressed", pilihanHasil.has(b.dataset.k) ? "true" : "false");

}

        rekamKeadaan = punyaTeks ? "tulisan-siap" : "tersimpan";
        /* Panel yang sesuai keadaan terakhir DIBUKA — bukan hanya disiapkan di
           balik panel lain. Kalau tidak, tombol "Buat Catatan" ada tetapi tidak
           terlihat, dan pengguna tetap harus menebak. */
        sumberAktif = "rekam";

  }
  $("#t-buat").onclick = ()=>{
    /* Bilah bawah harus menuju hasil yang sama dengan tombol di panel:
       kalau yang ada hanya sesi terputus, menekan "Buat Catatan" di bilah
       tidak boleh berakhir "belum ada bahan". */
    if (sesiTerputus && !audioDraf.length){ buatCatatanDariSesiTerputus(); return; }
    buatCatatan();

  const ubah = $("#bilah-ubah");
  if (ubah) ubah.onclick = ()=>{
    const t = $("#pilih-hasil");
    if (t) t.scrollIntoView({block:"start", behavior:"smooth"});

  /* Teks yang masih di kotak tidak diabaikan diam-diam: satu klik menjadikannya bahan. */
  const tmb = $("#bilah-tambah");
  if (tmb) tmb.onclick = ()=>{

    if (t2) t2.click();
  };
  /* Ubin beranda membawa niat: langsung ke kotak tulis atau ke pilihan hasil. */
  if (niatBuat === "tulis"){
    sumberAktif = "tulis"; perbaruiSumber();
    const ta = $("#teks"); if (ta){ ta.scrollIntoView({block:"center"}); ta.focus(); }
  } else if (niatBuat === "pilih"){
    const t = $("#pilih-hasil"); if (t) t.scrollIntoView({block:"start"});
  } else if (niatBuat === "rekam"){
    sumberAktif = "rekam"; perbaruiSumber();
    renderRekam();
    const blok = $("#blok-rekam");
    if (blok) blok.scrollIntoView({block:"center"});
  }
  niatBuat = "";
}
/* ---------- AUDIO: unggah / rekam / putar (tersimpan SEBELUM proses) ---------- */
const audioDraf = [];   // {jenis:'audio', nama, blob, ukuran, durasi}
const bahanTeks = [];   // {jenis:'teks', nama, teks} — teks yang sudah DITAMBAHKAN
/* Nomor urut BERSAMA untuk kedua jenis bahan. Dipakai daftar "Bahan Catatan"
   supaya urutan tampil = urutan penambahan, walau bahannya campuran teks dan
   audio (§G). Nilainya dipakai ulang saat memuat draf agar urutan bertahan. */
let urutBahan = 0;
function urutBaru(){ return ++urutBahan; }
function urutMaksimal(){
  const semua = [...bahanTeks, ...audioDraf];
  return semua.reduce((m, x) => Math.max(m, x.urut || 0), 0);
}
/* Daftar bahan dalam urutan yang BENAR-BENAR dipakai (nomor urut bersama).
   Sejak build 2026.11.04.4-web daftar ini juga memuat foto dan video: satu
   nomor urut untuk SEMUA jenis bahan, supaya "urutan bahan" tidak lagi hanya
   berlaku untuk teks dan audio. */
function semuaBahanUrut(){
  return [...bahanTeks, ...audioDraf, ...bahanFoto, ...bahanVideo]
    .sort((a, b) => (a.urut || 0) - (b.urut || 0));
}
function daftarUrut(){ return semuaBahanUrut(); }
/* Naik/Turun menukar NOMOR URUT, bukan memindah array — jadi tetap bekerja
   walau teks dan audio bercampur, dan bertahan setelah reload (§G). */
function geserUrut(x, arah){
  const d = daftarUrut();
  const i = d.indexOf(x);
  const j = i + arah;
  if (i < 0 || j < 0 || j >= d.length) return;
  const t = d[i].urut;
  d[i].urut = d[j].urut;
  d[j].urut = t;
  renderAudioDraf(); perbaruiRingkas(); simpanDrafBahan();
  umumkan("Urutan bahan diubah: " + (arah < 0 ? "naik" : "turun") + ".");
}

  /* Judul TIDAK lagi menjadi penghalang: bila kosong ia diisi otomatis dari

  if (rekamSiap)

  if (!pilihanHasil.size)

  return {teks:"Semua siap. Tekan Buat Catatan.",
